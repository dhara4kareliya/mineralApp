<!DOCTYPE html>
<html lang="en" dir="ltr" data-i18n-title="page_login_title">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CloudPlus — Sign in</title>
<script>
(function(){try{var t=localStorage.getItem('cloudplus_theme')||localStorage.getItem('biz1fs_theme')||localStorage.getItem('mineralbar_theme');if(t!=='dark'&&t!=='light'){t='light';}document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','light');}})();
(function(){try{var l=localStorage.getItem('cloudplus_lang')||localStorage.getItem('biz1fs_lang')||localStorage.getItem('mineralbar_lang');if(l!=='he'&&l!=='en')l='en';document.documentElement.lang=l==='he'?'he':'en';document.documentElement.dir=l==='he'?'rtl':'ltr';}catch(e){}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./assets/css/app.css?v=20260918b">
<script src="./assets/config-biz1.js?v=20260918b"></script>
<script>
(function () {
  var user = (window.Biz1Config && Biz1Config.user) || 'demo';
  user = String(user).trim().toLowerCase()
    .replace(/^https?:\/\//, '')
    .replace(/\.biz1\.co\.il.*$/i, '')
    .replace(/[^a-z0-9-]/g, '');
  if (user) {
    document.write('<script src="https://' + user + '.biz1.co.il/app/sdk/biz1-sdk.js"><\/script>');
  }
})();
</script>
<script src="./assets/js/app-biz1.v18b.js?v=20260918b"></script>
</head>
<body>
<div id="appRoot" dir="ltr" class="page-wrap">
  <div class="phone-outer">

    <!-- LOGIN -->
    <div class="phone-inner app-view login-screen" data-view="login">
      <div class="brand-hero">
        <div class="brand-blob brand-blob--tr"></div>
        <div class="brand-blob brand-blob--bl"></div>
        <div class="status-bar status-bar-on-hero">
          <span class="status-clock">--:--</span>
          <div class="status-bar-actions">
            <button type="button" class="lang-translator-btn lang-translator-btn--dark" data-lang-toggle>🌐 EN</button>
          </div>
        </div>
        <div class="brand-icon">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#9cc3ec" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s6.5 6.8 6.5 11.5a6.5 6.5 0 0 1-13 0C5.5 9.8 12 3 12 3z"/></svg>
        </div>
        <div class="brand-title" data-i18n="brand">CloudPlus</div>
        <div class="brand-sub" data-i18n="login_subtitle">Login to the management system</div>
      </div>

      <div class="dc-scroll login-scroll">
        <form id="loginForm" class="login-card" autocomplete="off">
          <div class="login-title" data-i18n="account_login">Login to the account</div>
          <div class="login-domain">cloudplus.biz1.co.il · Biz1 SDK</div>

          <div id="errorBox" class="error-box hidden">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c0392b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;margin-top:1px;"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
            <div id="errorText" class="error-text"></div>
          </div>

          <div id="usernameWrap" class="field">
            <label for="username" class="field-label">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9aa3b0" stroke-width="1.9"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.5 3-5.5 7-5.5s7 2 7 5.5"/></svg>
              <span data-i18n="login_identifier_label">Username / Email / Phone / ID</span> <span class="req">*</span>
            </label>
            <input id="username" class="ds-input input" type="text" name="biz1fs-user" autocomplete="off" autocapitalize="off" spellcheck="false" value="" data-i18n-placeholder="login_identifier_placeholder" placeholder="username, email, phone or ID" required data-align-lang="auto">
          </div>

          <div id="passwordWrap" class="field field--tight">
            <label for="password" class="field-label">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9aa3b0" stroke-width="1.9"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
              <span data-i18n="password_label">password</span> <span class="req">*</span>
            </label>
            <div class="pass-wrap">
              <input id="password" class="ds-input input input--pass" type="password" name="biz1fs-pass" autocomplete="new-password" value="" data-i18n-placeholder="password_placeholder" placeholder="Enter a password" required data-align-lang="auto">
              <button type="button" id="togglePassword" class="pass-toggle" data-i18n-aria="toggle_password" aria-label="Show or hide password">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>

          <div id="otpWrap" class="field field--tight hidden">
            <label for="otp" class="field-label">
              <span data-i18n="otp_label">verification code (OTP)</span> <span class="req">*</span>
            </label>
            <input id="otp" class="ds-input input input--otp" type="text" inputmode="numeric" autocomplete="one-time-code" data-i18n-placeholder="otp_placeholder" placeholder="Enter a code">
            <div class="otp-resend">
              <button type="button" id="resendOtpBtn" class="btn-ghost" style="padding:8px 14px;font-size:12.5px;">
                <span id="resendOtpText" data-i18n="resend_otp">Resend OTP</span>
              </button>
            </div>
          </div>

          <div class="login-row">
            <label class="remember">
              <input id="remember" type="checkbox">
              <span data-i18n="remember_me">remember me</span>
            </label>
            <span class="biz1-tag">Biz1</span>
          </div>

          <button type="submit" id="loginBtn" class="btn btn-primary btn-login">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="m10 17 5-5-5-5"/><path d="M15 12H3"/></svg>
            <span id="loginBtnText" data-i18n="login_btn">connect</span>
          </button>
        </form>

        <aside class="demo-users" id="demo-users" dir="ltr" data-i18n-aria="demo_credentials" aria-label="Demo Credentials">
          <div class="demo-users-title" data-i18n="demo_credentials">Demo Credentials</div>
          <div class="demo-users-list">
            <div class="demo-user-row">
              <span class="demo-user-creds" dir="ltr">yuval@cloudplus.co.il</span>
              <button
                type="button"
                class="demo-user-btn"
                data-user="yuval@cloudplus.co.il"
                data-pass=""
                data-i18n="login_as_demo_user"
              >Login As Demo User</button>
            </div>
          </div>
        </aside>

        <div class="footer-note" data-i18n="footer_crm">CloudPlus · Tickets</div>
      </div>
    </div>

  </div>
</div>
</body>
</html>
