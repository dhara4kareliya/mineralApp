<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Biz1 Showcase — Login</title>
<script src="assets/js/theme-boot.js"></script>
<link rel="stylesheet" href="assets/css/login.css?v=chat-42">
<script src="assets/config.js"></script>
<script src="assets/js/biz1-sdk.js"></script>
<script src="assets/js/lang.js?v=chat-42"></script>
<script src="assets/js/biz1-app.js?v=chat-42"></script>
</head>
<body>
<div class="app-shell" id="appShell">
  <div class="app-frame">
    <div id="screenLogin" class="screen">
      <div class="status-bar status-bar--dark">
        <span id="clockLogin">9:41</span>
        <div class="status-bar-right">
          <button type="button" class="theme-toggle" id="themeToggle" data-i18n-title="dark_mode" title="Theme">
            <svg class="icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/></svg>
          </button>
          <div class="lang-switch" role="group" aria-label="Language">
            <a href="?lang=he" class="lang-btn" data-lang="he">עב</a>
            <a href="?lang=en" class="lang-btn" data-lang="en">EN</a>
          </div>
        </div>
      </div>

      <div class="brand-hero">
        <div class="brand-blob brand-blob--tr"></div>
        <div class="brand-blob brand-blob--bl"></div>
        <div class="brand-icon">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#9cc3ec" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s6.5 6.8 6.5 11.5a6.5 6.5 0 0 1-13 0C5.5 9.8 12 3 12 3z"/></svg>
        </div>
        <div class="brand-title" id="brandTitle" data-i18n="brandName">Biz1 Showcase</div>
        <div class="brand-sub" data-i18n="login_subtitle">Login to Chat System</div>
      </div>

      <div class="dc-scroll login-scroll">
        <form id="loginForm" class="login-card" autocomplete="off" action="#" method="post">
          <div class="login-title" data-i18n="form_title">Account login</div>
          <div class="login-hint" id="loginHint">biz1.co.il · Biz1 SDK</div>

          <div id="errorBox" class="error-box hidden">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c0392b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none; margin-top:1px;"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
            <div id="errorText" class="error-text"></div>
          </div>

          <div id="usernameWrap" class="field">
            <label for="username" class="field-label">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9aa3b0" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.5 3-5.5 7-5.5s7 2 7 5.5"/></svg>
              <span data-i18n="email">Email</span> <span class="req">*</span>
            </label>
            <input id="username" class="ds-input input input--ltr" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" value="" data-i18n-placeholder="placeholder_email" placeholder="email / username / phone / id" required>
          </div>

          <div id="passwordWrap" class="field field--tight">
            <label for="password" class="field-label">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9aa3b0" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
              <span data-i18n="password">Password</span> <span class="req">*</span>
            </label>
            <div class="pass-wrap">
              <input id="password" class="ds-input input input--pass" type="password" autocomplete="new-password" value="" data-i18n-placeholder="placeholder_password" placeholder="Password" required>
              <button type="button" id="togglePassword" class="pass-toggle" aria-label="Toggle password">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>

          <div id="otpWrap" class="field field--tight hidden">
            <label for="otp" class="field-label">
              <span data-i18n="otp">OTP</span> <span class="req">*</span>
            </label>
            <input id="otp" class="ds-input input input--otp" type="text" inputmode="numeric" autocomplete="one-time-code" data-i18n-placeholder="otp_placeholder" placeholder="OTP">
            <button type="button" id="resendOtpBtn" class="resend-otp" data-i18n="resendOtp">Resend code</button>
          </div>

          <div class="login-row">
            <label class="remember">
              <input id="remember" type="checkbox">
              <span data-i18n="remember_me">Remember me</span>
            </label>
            <span class="biz1-tag" data-i18n="biz1_tag">Biz1</span>
          </div>

          <button type="button" id="loginBtn" class="btn btn-login">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="m10 17 5-5-5-5"/><path d="M15 12H3"/></svg>
            <span id="loginBtnText" data-i18n="login_btn">Log In</span>
          </button>
        </form>

        <div class="demo-users" id="demo-users" aria-label="Demo Credentials">
          <div class="demo-users-title" data-i18n="demo_credentials">Demo Credentials</div>
          <div class="demo-users-list">
            <div class="demo-user-row">
              <span class="demo-user-creds">dhara@yopmail.com / pass0364</span>
              <button
                type="button"
                class="demo-user-btn"
                data-user="dhara@yopmail.com"
                data-pass="pass0364"
                data-i18n="login_as_demo_user"
              >Login As Demo User</button>
            </div>
          </div>
        </div>
        <p class="login-footer">Biz1 Showcase · <span data-i18n="appName">Biz1 Showcase</span></p>
      </div>
    </div>
  </div>
</div>

<script src="assets/js/login-page.js?v=chat-42"></script>
</body>
</html>
