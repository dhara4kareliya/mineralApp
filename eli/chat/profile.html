<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" name="viewport"/>
<title>תצוגת Biz1 — פרופיל</title>
<script src="assets/js/theme-boot.js"></script>
<link rel="stylesheet" href="assets/css/showcase.css?v=chat-12"/>
<script src="assets/config.js"></script>
<script src="assets/js/biz1-sdk.js"></script>
<script src="assets/js/lang.js?v=chat-23"></script>
<script src="assets/js/biz1-app.js?v=chat-23"></script>
</head>
<body>
<div class="app-shell">
  <div class="app-frame">
    <div class="screen" id="screenProfile">

      <div class="profile-header">
        <div class="profile-title" data-i18n="profile">פרופיל</div>
        <button type="button" class="icon-circle" id="profileBackBtn" aria-label="Back">
          <svg fill="none" height="20" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="20"><path d="M9 18l6-6-6-6"></path></svg>
        </button>
      </div>

      <div class="dc-scroll profile-body">
        <div class="profile-card">
          <div class="profile-av" id="userAvatar">U</div>
          <h2 id="userName" class="profile-name" data-i18n="loading">טוען...</h2>
          <p id="userEmail" class="profile-email" data-i18n="loading_data">טוען נתונים...</p>
          <div id="userRole" class="profile-role">...</div>
        </div>

        <div class="profile-options">
          <div class="profile-row">
            <div class="profile-row-label">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
              <span data-i18n="dark_mode">מצב לילה</span>
            </div>
            <button type="button" id="themeToggleBtn" class="theme-switch" aria-label="Toggle theme">
              <div id="themeToggleCircle" class="theme-switch-knob"></div>
            </button>
          </div>

          <div class="profile-row">
            <div class="profile-row-label">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1 4-10z"></path></svg>
              <span data-i18n="language">שפה</span>
            </div>
            <a href="?lang=en" id="langToggleLink" class="lang-pill">EN</a>
          </div>

          <div class="profile-row profile-row--danger">
            <div class="profile-row-label">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
              <span data-i18n="logout">התנתק</span>
            </div>
            <button type="button" id="logoutBtn" class="logout-btn" data-i18n="exit">יציאה</button>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="assets/js/profile-page.js?v=chat-42"></script>
</body>
</html>
