<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="nav.entries">Entries — Customer Portal</title>
  <link rel="stylesheet" href="../css/styles.css?v=20260918" />
  <script>
(function () {
      var lang = localStorage.getItem('cp_lang') === 'he' ? 'he' : 'en';
      document.documentElement.setAttribute('lang', lang);
      document.documentElement.setAttribute('dir', lang === 'he' ? 'rtl' : 'ltr');
      document.documentElement.setAttribute('data-theme', localStorage.getItem('cp_theme') || 'light');
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="page-body" hidden>
    <div class="toolbar" style="justify-content: space-between;">
      <div class="search-box" style="max-width: 220px; flex: 0 1 220px;">
        <span class="search-icon">⌕</span>
        <input class="form-control" id="search" data-i18n-placeholder="entries.search" placeholder="Search..." style="color: var(--text-muted);" />
      </div>
      <div id="tabs-container">
         <div class="spinner"></div>
      </div>
    </div>
    <div class="card">
      <div id="list"><div class="spinner"></div></div>
    </div>
    <div class="pagination" id="pager" hidden>
      <span id="pager-label"></span>
      <div class="flex gap-1">
          <button type="button" class="btn btn-sm btn-secondary" id="prev" data-i18n="previous">Previous</button>
          <button type="button" class="btn btn-sm btn-secondary" id="next" data-i18n="next">Next</button>
      </div>
    </div>
  </div>
  <div id="project-modal" class="proj-modal-overlay" hidden></div>

  <script src="../js/config.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/realtime.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/entries.js"></script>
</body>
</html>
