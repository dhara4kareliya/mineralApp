<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="nav.orders">orders — Customer Portal</title>
  <link rel="stylesheet" href="../css/styles.css?v=202609171030" />
  <script>
(function () {
      var lang = localStorage.getItem('cp_lang') === 'he' ? 'he' : 'en';
      document.documentElement.setAttribute('lang', lang);
      document.documentElement.setAttribute('dir', lang === 'he' ? 'rtl' : 'ltr');
      document.documentElement.setAttribute('data-theme', localStorage.getItem('cp_theme') || 'light');
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="page-body" hidden>
    <div class="toolbar">
      <div class="search-box">
        <span class="search-icon">⌕</span>
        <input class="form-control" id="search" data-i18n-placeholder="orders.search" placeholder="Search orders…" />
      </div>
    </div>
    <div class="card">
      <div id="list"><div class="spinner"></div></div>
    </div>
  </div>
  <div id="project-modal" class="proj-modal-overlay" hidden></div>

  <script src="../js/config.js?v=202609171030"></script>
  <script src="../js/theme.js?v=202609171030"></script>
  <script src="../js/i18n.js?v=202609171030"></script>
  <script src="../js/toast.js?v=202609171030"></script>
  <script src="../js/auth.js?v=202609171030"></script>
  <script src="../js/api.js?v=202609171030"></script>
  <script src="../js/realtime.js?v=202609171030"></script>
  <script src="../js/ui.js?v=202609171030"></script>
  <script src="../js/layout.js?v=202609171030"></script>
  <script src="../js/orders.js"></script>
</body>
</html>
