<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="nav.rooms">Rooms — Customer Portal</title>
  <link rel="stylesheet" href="../css/styles.css?v=202608271000" />
  <script src="../js/boot.js"></script>
</head>
<body>
  <div id="app"></div>
  <div id="page-body" hidden>
    <div class="toolbar">
      <div class="search-box">
        <span class="search-icon">⌕</span>
        <input class="form-control" id="search" data-i18n-placeholder="rooms.search" placeholder="Search rooms…" />
      </div>
      <a class="btn btn-secondary" href="bookings.html" data-i18n="rooms.myBookings">My bookings</a>
    </div>
    <div id="list"><div class="spinner"></div></div>

    <!-- Book modal-ish panel -->
    <div class="card mt-2" id="book-panel" hidden style="max-width:560px">
      <div class="card-title mb-2" data-i18n="rooms.bookRoom">Book room</div>
      <div id="book-alert" hidden></div>
      <form id="book-form">
        <input type="hidden" id="room_id" />
        <div class="form-group">
          <label class="form-label" data-i18n="rooms.selected">Selected</label>
          <div id="room-label" style="font-weight:700"></div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="start_date" data-i18n="rooms.startDate">Start date *</label>
            <input class="form-control" type="date" id="start_date" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="end_date" data-i18n="rooms.endDate">End date *</label>
            <input class="form-control" type="date" id="end_date" required />
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="invoice_note" data-i18n="rooms.notes">Notes</label>
          <input class="form-control" id="invoice_note" data-i18n-placeholder="rooms.notesPh" placeholder="Optional notes" />
        </div>
        <div class="flex gap-1">
          <button type="submit" class="btn btn-primary" data-i18n="rooms.confirm">Confirm booking</button>
          <button type="button" class="btn btn-ghost" id="btn-cancel-book" data-i18n="cancel">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/config.js?v=202608271000"></script>
  <script src="../js/theme.js?v=202608271000"></script>
  <script src="../js/i18n.js?v=202608271000"></script>
  <script src="../js/toast.js?v=202608271000"></script>
  <script src="../js/auth.js?v=202608271000"></script>
  <script src="../js/api.js?v=202608271000"></script>
  <script src="../js/realtime.js?v=202608271000"></script>
  <script src="../js/ui.js?v=202608271000"></script>
  <script src="../js/layout.js?v=202608271000"></script>
  <script src="../js/pages/rooms-page.js"></script>
</body>
</html>
