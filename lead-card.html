<!DOCTYPE html>

<html>
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<script>document.write('<script src="./asset-version.js?_='+Date.now()+'"><\/script>');</script>
<script>
mbScripts([
  './support.js',
  './biz1-sdk.js',
  './biz1-app.js',
  './page-boot.js',
  './live-sync.js',
  './customer-live.js',
  './i18n-translations.js',
  './common-header-footer.js'
]);
mbCss('./common.css');
</script>
</head>
<body data-role="sales" data-active-tab="leads">
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; direction: rtl; font-family: 'Heebo', sans-serif; -webkit-font-smoothing: antialiased; }
  button, a, textarea { font-family: 'Heebo', sans-serif; }
  .dc-scroll::-webkit-scrollbar { width: 0; }
  .gv-act { transition: background .12s; }
  .gv-act:active { background:#e9edf3 !important; }
  .lead-folder-select {
    width: 100%;
    padding: 9px 12px;
    border-radius: 8px;
    font-size: 13.5px;
    font-weight: 700;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
    background-color: #fff;
    background-repeat: no-repeat;
    background-size: 14px 14px;
  }
</style>
</helmet>
<div style="min-height:100vh; background:#e6e8ec; display:flex; align-items:flex-start; justify-content:center; padding:26px 16px;">
<div style="width:392px; max-width:100%; background:#0f1828; border-radius:34px; padding:9px; box-shadow:0 24px 60px rgba(15,24,40,.34);">
<div data-screen-label="Lead Card" style="background:#eef0f3; border-radius:26px; overflow:hidden; position:relative; height:812px; display:flex; flex-direction:column;">
<div style="background:#fff; padding:9px 16px 14px; flex:none; box-shadow:0 1px 0 #edeff2;">
<div style="display:flex; justify-content:center; padding:3px 0 9px;">
<div style="width:42px; height:5px; border-radius:99px; background:#dadfe6;"></div>
</div>
<div style="display:flex; align-items:center; justify-content:space-between;">
<button type="button" onclick="{{ goBack }}" aria-label="Back" style="width:38px; height:38px; border-radius:50%; border:none; background:#f1f3f6; color:#5a6473; cursor:pointer; display:flex; align-items:center; justify-content:center;">
<svg fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="18"><path d="m15 18-6-6 6-6"></path></svg>
</button>
<div style="font-size:18px; font-weight:800; color:#1f2a3a;">Lead Card</div>
<div style="width:38px; height:38px; flex:none;"></div>
</div>
</div>
<div class="dc-scroll" style="flex:1; overflow-y:auto; padding:14px 16px 20px;">
<div data-kind="lead" id="mb-live-customer"></div>
</div>

<!-- Update status sheet (Customer Folders UI) -->
<div id="mb-lead-status-sheet" style="display:none; position:absolute; inset:0; z-index:50;">
<div id="mb-lead-status-overlay" style="position:absolute; inset:0; background:#1f2a3a; opacity:0.32;"></div>
<div class="dc-scroll" style="position:absolute; bottom:0; left:0; right:0; background:#eef0f3; border-radius:24px 24px 0 0; overflow-y:auto; max-height:88%; box-shadow:0 -8px 30px rgba(15,24,40,.18); padding:18px 16px 24px;">
<div style="width:42px; height:5px; border-radius:99px; background:#dadfe6; margin:0 auto 14px;"></div>
<div id="mb-lead-status-title" style="font-size:11.5px; font-weight:700; color:#8a96a3; letter-spacing:0.5px; text-transform:uppercase; margin-bottom:8px;">CUSTOMER FOLDERS</div>
<div id="mb-lead-folders-container"></div>
<button type="button" id="mb-lead-status-close" style="width:100%; margin-top:12px; padding:13px; border:1.5px solid #dde2ea; border-radius:12px; background:#fff; color:#5a6473; font-size:14px; font-weight:700; cursor:pointer;">Close</button>
</div>
</div>
<div id="mb-lead-status-toast" style="display:none; position:absolute; left:50%; bottom:100px; transform:translateX(-50%); width:calc(100% - 48px); max-width:300px; padding:12px 14px; border-radius:12px; background:#16223a; color:#fff; font-size:13px; font-weight:700; text-align:center; z-index:99999; box-shadow:0 8px 24px rgba(15,24,40,.28); pointer-events:none;"></div>
</div>
</div>
</div>
</x-dc>
<script data-dc-script="" data-props='{"$preview": {"width": 424, "height": 880}}' type="text/x-dc">
class Component extends DCLogic {
  goBack(e) {
    if (e && e.preventDefault) e.preventDefault();
    if (window.mbGoCustomerCardBack) {
      window.mbGoCustomerCardBack(e);
      return;
    }
    window.location.href = 'leads-list.html';
  }

  renderVals() {
    return {
      goBack: (e) => this.goBack(e)
    };
  }
}
</script>
</body>
</html>
