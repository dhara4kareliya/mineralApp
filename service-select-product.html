<!DOCTYPE html>

<html>
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<script src="./support.js"></script>
<script src="https://mineral.bull36.com/app/sdk/biz1-sdk.js"></script>
<script src="./biz1-app.js"></script>
<script src="./page-boot.js"></script>
<link rel="stylesheet" href="./common.css"/>
<script src="./i18n-translations.js?v=hefull1"></script>
<script src="./common-header-footer.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; direction: rtl; font-family: 'Heebo', sans-serif; -webkit-font-smoothing: antialiased; }
  button, a, input, textarea { font-family: 'Heebo', sans-serif; }
  .dc-scroll::-webkit-scrollbar { width: 0; }
  .gv-in { width:100%; border:1.5px solid #e4e8ee; border-radius:12px; padding:11px 40px 11px 13px; font-size:14px; font-weight:600; color:#1f2a3a; background:#fff; outline:none; }
  .gv-in::placeholder { color:#b6bdc8; font-weight:600; }
  .gv-in:focus { border-color:#1d60a2; }
  .chip { white-space:nowrap; border:1.5px solid #e4e8ee; background:#fff; color:#5a6473; font-size:12.5px; font-weight:700; padding:7px 15px; border-radius:99px; cursor:pointer; }
  .chip-on { background:#dbe7f8; border-color:#bcd2ee; color:#1d60a2; }
</style>
</helmet>
<div style="min-height:100vh; background:#e6e8ec; display:flex; align-items:flex-start; justify-content:center; padding:26px 16px;">
<div style="width:392px; max-width:100%; background:#0f1828; border-radius:34px; padding:9px; box-shadow:0 24px 60px rgba(15,24,40,.34);">
<div style="background:#eef0f3; border-radius:26px; overflow:hidden; position:relative; height:812px;">
<!-- faded parent (quote screen) peeking above the sheet -->
<div style="position:absolute; inset:0; background:#eef0f3;">
<div style="background:#fff; border-radius:0 0 22px 22px; padding:9px 18px 18px;">
<div style="display:flex; justify-content:center; padding:3px 0 12px;">
<div style="width:42px; height:5px; border-radius:99px; background:#dadfe6;"></div>
</div>
<div style="font-size:17px; font-weight:700; color:#b3bbc6; text-align:left;">Price offer - {{ name }}</div>
<div style="margin-top:14px; height:46px; border-radius:13px; background:#f3f5f8; box-shadow:0 1px 3px rgba(0,0,0,.04);"></div>
</div>
</div>
<!-- bottom sheet -->
<div style="position:absolute; left:0; right:0; bottom:0; top:60px; background:#fff; border-radius:26px 26px 0 0; box-shadow:0 -10px 34px rgba(15,24,40,.14); display:flex; flex-direction:column; overflow:hidden;">
<!-- sheet header -->
<div style="flex:none; padding:8px 18px 12px;">
<div style="display:flex; justify-content:center; padding:3px 0 12px;">
<div style="width:42px; height:5px; border-radius:99px; background:#dadfe6;"></div>
</div>
<div style="display:flex; align-items:center; justify-content:space-between;">
<div style="font-size:19px; font-weight:800; color:#1f2a3a;">Add a product</div>
<a href="{{ backUrl }}" style="width:38px; height:38px; border-radius:50%; background:#f1f3f6; color:#5a6473; display:flex; align-items:center; justify-content:center; text-decoration:none;">
<svg fill="none" height="17" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewbox="0 0 24 24" width="17"><path d="M18 6 6 18M6 6l12 12"></path></svg>
</a>
</div>
</div>
<!-- search -->
<div style="flex:none; padding:0 18px 12px; position:relative;">
<input class="gv-in mb-search" oninput="{{ onSearchInput }}" placeholder="Search for a product..." type="text" style="text-align:start;"/>
<svg fill="none" height="18" stroke="#aeb6c2" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" style="position:absolute; inset-inline-end:30px; top:50%; transform:translateY(-50%); pointer-events:none;" viewbox="0 0 24 24" width="18"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg>
</div>
<!-- category chips -->
<div ref="{{ chipsRef }}" class="dc-scroll" style="flex:none; display:flex; gap:8px; overflow-x:auto; padding:0 18px 14px;">
<sc-for as="c" list="{{ categories }}">
  <span onclick="{{ c.pick }}" class="chip" style="background:{{ c.bg }}; border-color:{{ c.border }}; color:{{ c.color }};">{{ c.name }}</span>
</sc-for>
</div>
<div class="dc-scroll" style="flex:1; overflow-y:auto; padding:0 18px;">
<sc-for as="p" list="{{ filteredProducts }}">
<div onclick="{{ p.toggleSelect }}" style="display:flex; flex-direction:row-reverse; align-items:center; gap:13px; padding:15px 0; border-bottom:1px solid #f0f2f5; text-decoration:none; cursor:{{ p.alreadyAdded ? 'default' : 'pointer' }}; opacity:{{ p.alreadyAdded ? 0.55 : 1 }};">
<div style="text-align:left; flex:none; min-width:62px;">
<div style="font-size:14.5px; font-weight:800; color:#2e8a63;">{{ p.price }}</div>
</div>
<div style="flex:1; text-align:left;">
<div style="font-size:15.5px; font-weight:800; color:#1f2a3a;">{{ p.name }}</div>
<div style="display:flex; align-items:center; gap:7px; margin-top:3px;">
<span style="font-size:12.5px; color:#9aa3b0;">{{ p.sub }}</span>
</div>
<span style="display:inline-block; margin-top:7px; background:#eef0f3; color:#7b8595; font-size:11px; font-weight:700; padding:3px 9px; border-radius:99px;">In stock: {{ p.stock }}</span>
</div>
<div style="width:46px; height:46px; border-radius:13px; background:#e8f1fc; color:#2f6aa6; display:flex; align-items:center; justify-content:center; flex:none;">
<svg fill="none" height="22" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewbox="0 0 24 24" width="22"><path d="M12 3c3 4 6 7 6 10a6 6 0 0 1-12 0c0-3 3-6 6-10z"></path></svg>
</div>
<sc-if value="{{ p.alreadyAdded }}">
<div style="width:22px; height:22px; border-radius:50%; background:#aeb6c2; display:flex; align-items:center; justify-content:center; flex:none;">
<svg fill="none" height="11" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" viewbox="0 0 24 24" width="11"><path d="M20 6 9 17l-5-5"></path></svg>
</div>
</sc-if>
<sc-if value="{{ p.notAlreadyAdded }}">
  <sc-if value="{{ p.selected }}">
  <div style="width:22px; height:22px; border-radius:50%; background:#1d60a2; display:flex; align-items:center; justify-content:center; flex:none;">
  <span style="width:8px; height:8px; border-radius:50%; background:#fff;"></span>
  </div>
  </sc-if>
  <sc-if value="{{ p.notSelected }}">
  <div style="width:22px; height:22px; border-radius:50%; border:1.8px solid #d8dde4; flex:none;"></div>
  </sc-if>
</sc-if>
</div>
</sc-for>
</div>
<!-- pinned CTA -->
<div style="flex:none; padding:13px 18px 20px; border-top:1px solid #f0f2f5;">
<a href="{{ addByPriceUrl }}" style="display:flex; align-items:center; justify-content:center; gap:9px; width:100%; padding:15px; border-radius:14px; background:#1d60a2; color:#fff; font-size:15.5px; font-weight:800; text-decoration:none; box-shadow:0 6px 16px rgba(29,96,162,.28);">
<svg fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.6" viewbox="0 0 24 24" width="18"><path d="M20 6 9 17l-5-5"></path></svg>
            Add by price
          </a>
</div>
</div>
</div>
</div>
</div>
</x-dc>
<script data-dc-script="" data-props='{"$preview": {"width": 424, "height": 880}}' type="text/x-dc">
class Component extends DCLogic {
  chipsRef = React.createRef();
  state = {
    name: 'Moshe Cohen',
    searchQuery: '',
    selectedCategory: 'all',
    selectedProductIds: [],
    products: [],
    categories: []
  };

  componentDidMount() {
    this.initData();
    window.addEventListener('mineralbar:ready', () => this.initData());
    this.setupDragScroll();
  }

  setupDragScroll() {
    setTimeout(() => {
      const el = this.chipsRef.current;
      if (!el) return;
      let isDown = false;
      let startX;
      let scrollLeft;
      
      el.addEventListener('mousedown', (e) => {
        isDown = true;
        startX = e.pageX - el.offsetLeft;
        scrollLeft = el.scrollLeft;
        el.style.cursor = 'grabbing';
      });
      el.addEventListener('mouseleave', () => {
        isDown = false;
        el.style.cursor = 'grab';
      });
      el.addEventListener('mouseup', () => {
        isDown = false;
        el.style.cursor = 'grab';
      });
      el.addEventListener('mousemove', (e) => {
        if (!isDown) return;
        e.preventDefault();
        const x = e.pageX - el.offsetLeft;
        const walk = (x - startX) * 1.5;
        el.scrollLeft = scrollLeft - walk;
      });
      el.style.cursor = 'grab';
    }, 100);
  }

  async initData() {
    try {
      var q = new URLSearchParams(window.location.search);
      var name = q.get('name') || 'Moshe Cohen';
      
      var defaultCategories = [
        { id: 'all', name: 'everything' },
        { id: 'filter', name: 'main filter' },
        { id: 'bar', name: 'water bar' },
        { id: 'center', name: 'Water center' },
        { id: 'other', name: 'other' }
      ];

      var productsList = [];
      var resolvedCategories = [];

      if (window.MineralBarApp && typeof MineralBarApp.getClient === 'function') {
        try {
          var client = MineralBarApp.getClient();
          var res = await client.request('Products.List', { limit: 25 });
          var data = res && (res.data || res.output || res);
          if (Array.isArray(data) && data.length > 0) {
            // Extract unique category IDs
            var catIds = [];
            data.forEach(function(item) {
              if (item.cat_id && catIds.indexOf(String(item.cat_id)) === -1) {
                catIds.push(String(item.cat_id));
              }
            });

            // Fetch category names in parallel
            var categoryNamesMap = {};
            await Promise.all(catIds.map(async function(catId) {
              try {
                var catRes = await client.request('Categories.Get', { category_id: catId });
                var catData = catRes && (catRes.data || catRes.output || catRes);
                if (catData) {
                  var catName = catData.category || catData.category_name || catData.title || '';
                  if (catName) {
                    categoryNamesMap[catId] = catName;
                  }
                }
              } catch (catErr) {
                console.warn('[MineralBar] failed to fetch category name for id', catId, catErr);
              }
            }));

            // Construct category chips list
            resolvedCategories.push({ id: 'all', name: 'everything' });
            for (var key in categoryNamesMap) {
              resolvedCategories.push({
                id: categoryNamesMap[key],
                name: categoryNamesMap[key]
              });
            }
            resolvedCategories.push({ id: 'other', name: 'other' });

            productsList = data.map(function(item) {
              var priceVal = Math.round(Number(item.price || item.cost || 89));
              var desc = item.discription || item.desc || '';
              var pName = item.product_name || item.name || '';
              
              var itemCatId = item.cat_id ? String(item.cat_id) : '';
              var category = 'other';
              if (itemCatId && categoryNamesMap[itemCatId]) {
                category = categoryNamesMap[itemCatId];
              }

              var stock = item.stock !== undefined ? Number(item.stock) : 10;

              return {
                id: String(item.id),
                name: pName,
                sub: desc,
                price: priceVal + (priceVal < 200 ? ' NIS/month' : '₪'),
                stock: stock,
                category: category
              };
            });
          }
        } catch (err) {
          console.warn('[MineralBar] failed to fetch products list', err);
        }
      }

      if (resolvedCategories.length === 0) {
        resolvedCategories = defaultCategories;
      }

      this.setState({
        name: name,
        categories: resolvedCategories,
        products: productsList
      });
    } catch (e) {
      console.error(e);
    }
  }

  onSearch(val) {
    this.setState({ searchQuery: val || '' });
  }

  onCategorySelect(catId) {
    this.setState({ selectedCategory: catId });
  }

  onProductToggle(productId) {
    var selected = this.state.selectedProductIds || [];
    var idx = selected.indexOf(productId);
    if (idx === -1) {
      selected = [...selected, productId];
    } else {
      selected = selected.filter(id => id !== productId);
    }
    this.setState({ selectedProductIds: selected });
  }

  renderVals() {
    var s = this.state;
    
    // Filter categories to set active chip style
    var categoriesWithActive = s.categories.map(c => {
      var active = s.selectedCategory === c.id;
      return {
        ...c,
        active: active,
        bg: active ? '#dbe7f8' : '#fff',
        border: active ? '#bcd2ee' : '#e4e8ee',
        color: active ? '#1d60a2' : '#5a6473',
        pick: () => this.onCategorySelect(c.id)
      };
    });

    // Filter products list based on category and search query
    var filtered = s.products.filter(p => {
      // Category filter
      if (s.selectedCategory !== 'all' && p.category !== s.selectedCategory) {
        return false;
      }
      // Search query filter
      if (s.searchQuery) {
        var query = s.searchQuery.toLowerCase();
        var nameMatch = p.name.toLowerCase().indexOf(query) !== -1;
        var subMatch = p.sub.toLowerCase().indexOf(query) !== -1;
        return nameMatch || subMatch;
      }
      return true;
    });

    // Map products to include selection state and click handlers
    var backParams = new URLSearchParams(window.location.search);
    var currentIdsStr = backParams.get('product_ids') || '';
    var existingIds = currentIdsStr ? currentIdsStr.split(',') : [];

    var filteredWithSelection = filtered.map(p => {
      var isSel = (s.selectedProductIds || []).indexOf(p.id) !== -1;
      var isAlreadyAdded = existingIds.indexOf(p.id) !== -1;
      return {
        ...p,
        selected: isSel,
        notSelected: !isSel,
        alreadyAdded: isAlreadyAdded,
        notAlreadyAdded: !isAlreadyAdded,
        toggleSelect: isAlreadyAdded ? null : () => this.onProductToggle(p.id)
      };
    });

    var fromPage = backParams.get('from') || 'order';
    var backPage = fromPage === 'quote' ? 'service-quote-form.html' : 'service-order-form.html';
    
    // Clean up temporary tracking param
    backParams.delete('from');

    var backUrl = backPage + '?' + backParams.toString();

    // Construct Add by price URL
    var idList = currentIdsStr ? currentIdsStr.split(',') : [];
    
    var newSelected = s.selectedProductIds || [];
    newSelected.forEach(id => {
      idList.push(id);
    });

    var addByParams = new URLSearchParams(backParams.toString());
    addByParams.set('product_ids', idList.join(','));
    var addByPriceUrl = backPage + '?' + addByParams.toString();

    return {
      name: s.name,
      categories: categoriesWithActive,
      filteredProducts: filteredWithSelection,
      backUrl: backUrl,
      addByPriceUrl: addByPriceUrl,
      chipsRef: this.chipsRef,
      onSearchInput: (e) => this.onSearch(e.target.value)
    };
  }
}
</script>
</body>
</html>
