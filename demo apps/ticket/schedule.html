<!DOCTYPE html>
<html lang="en" dir="ltr" data-i18n-title="my_schedule">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biz1 Showcase — Schedule</title>
<script src="assets/js/theme-boot.js"></script>
<link rel="stylesheet" href="assets/css/app.css?v=ticket-11">
<script src="assets/config.js?v=ticket-11"></script>
<script src="assets/js/app.js?v=ticket-20"></script>

    <script>
      (function(){try{var t=localStorage.getItem('biz1_fin_theme');if(t!=='dark'&&t!=='light'){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','light');}})();
    </script>
</head>
<body data-page="schedule">
<div id="appRoot" dir="ltr" class="page-wrap">
  <div class="phone-outer">

    <!-- SCHEDULE -->
    <div class="phone-inner app-view" data-view="schedule">
      <div class="lang-bar">
        <div class="lang-bar-left">
          <span style="font-size:11px;font-weight:600;color:rgba(255,255,255,.55);" data-i18n="lang_label">Language</span>
          <div class="lang-switch">
            <button type="button" data-set-lang="en">EN</button>
            <button type="button" data-set-lang="he">עב</button>
          </div>
        </div>
        <div class="lang-bar-right">
          <button type="button" class="btn-profile" data-profile-open data-i18n-title="profile" title="Profile" aria-label="Profile">
            <span class="btn-profile-avatar" data-profile-initials>?</span>
          </button>
          <button type="button" class="theme-toggle" data-theme-toggle data-i18n-title="toggle_theme" title="Light / Dark mode">
            <svg class="icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/></svg>
          </button>
          <div data-live-chip class="live-chip live-off">
            <span class="dot"></span>
            <span data-live-label data-i18n="live_socket_off">Socket Off</span>
          </div>
        </div>
      </div>
      <div class="schedule-top">
        <div class="schedule-heading">
          <div style="min-width:0;flex:1;">
            <div style="font-size:13px;color:var(--text-muted);font-weight:600;" data-i18n="schedule_sub">Daily route & assigned tickets</div>
            <div class="schedule-title" data-i18n="my_schedule">My Schedules</div>
          </div>
        </div>
        <div id="scheduleSearchBar" class="schedule-search-bar">
          <input id="scheduleSearchInput" class="ds-input schedule-search-input" type="search" data-i18n-placeholder="search_tickets" placeholder="Search tickets by client, address, or #">
        </div>
        <div class="schedule-stats">
          <div class="card schedule-stat-card">
            <div id="countTotal" style="font-size:21px;font-weight:800;color:#1d60a2;line-height:1;">0</div>
            <div style="font-size:11.5px;color:#8a93a3;margin-top:4px;font-weight:600;" data-i18n="visits">Visits</div>
          </div>
          <div class="card schedule-stat-card">
            <div id="countDone" style="font-size:21px;font-weight:800;color:#2e8a63;line-height:1;">0</div>
            <div style="font-size:11.5px;color:#8a93a3;margin-top:4px;font-weight:600;" data-i18n="completed">Done</div>
          </div>
          <div class="card schedule-stat-card">
            <div id="countOpen" style="font-size:21px;font-weight:800;color:#bd8324;line-height:1;">0</div>
            <div style="font-size:11.5px;color:#8a93a3;margin-top:4px;font-weight:600;" data-i18n="waiting">Open</div>
          </div>
        </div>
        <div class="schedule-actions-row">
          <button type="button" id="startRouteBtn" class="btn-primary btn-green schedule-route-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M3 11 12 3l9 8"/><path d="M5 9.5V20h14V9.5"/></svg>
            <span data-i18n="start_route">Start Route</span>
          </button>
          <div class="schedule-filter-groups">
            <label class="schedule-filter-item">
              <span class="schedule-filter-label" data-i18n="filter_period_label">Period</span>
              <select id="schedulePeriodFilters" class="schedule-filter-select" aria-label="Schedule period">
                <option value="all" data-i18n="filter_period_all">All</option>
                <option value="weekly" data-i18n="filter_weekly">Weekly</option>
                <option value="daily" data-i18n="filter_daily">Daily</option>
              </select>
            </label>
            <label class="schedule-filter-item">
              <span class="schedule-filter-label" data-i18n="filter_status_label">Status</span>
              <select id="scheduleFilters" class="schedule-filter-select" aria-label="Ticket status">
                <option value="all" data-i18n="filter_all">All</option>
                <option value="opened" data-i18n="filter_open">Open</option>
                <option value="assigned" data-i18n="filter_assigned">Assigned</option>
                <option value="closed" data-i18n="filter_closed">Closed</option>
              </select>
            </label>
          </div>
        </div>
      </div>
      <div id="schedTicketList" class="dc-scroll schedule-ticket-list"></div>
      <div id="schedEmptyState" class="hidden schedule-empty">
        <div class="card" style="color:#8a93a3;font-weight:700;font-size:14px;" data-i18n="data_not_found">Data not found</div>
      </div>
      <div id="schedLoadingState" class="hidden schedule-empty">
        <div class="card" style="color:#8a93a3;font-weight:700;font-size:14px;" data-i18n="loading">Loading…</div>
      </div>
    </div>

    <!-- PROFILE -->
    <div id="profileOverlay" class="profile-overlay hidden" aria-hidden="true">
      <button type="button" class="profile-backdrop" data-profile-close aria-label="Close"></button>
      <div class="profile-sheet" role="dialog" aria-labelledby="profileTitle">
        <div class="profile-sheet-top">
          <div id="profileTitle" class="profile-sheet-title" data-i18n="profile">Profile</div>
          <button type="button" class="profile-close" data-profile-close aria-label="Close">×</button>
        </div>
        <div class="profile-avatar-lg" data-profile-initials>?</div>
        <div id="profileName" class="profile-name">—</div>
        <div class="profile-rows">
          <div class="profile-row">
            <div class="profile-row-label" data-i18n="email_label">Email / Username</div>
            <div id="profileEmail" class="profile-row-value">—</div>
          </div>
          <div class="profile-row">
            <div class="profile-row-label" data-i18n="profile_role">Role</div>
            <div id="profileRole" class="profile-row-value">—</div>
          </div>
        </div>
        <button type="button" id="logoutBtn" class="btn-primary profile-logout-btn" data-i18n="logout">Log out</button>
      </div>
    </div>

  </div>
</div>
</body>
</html>
