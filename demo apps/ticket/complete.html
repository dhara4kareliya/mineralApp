<!DOCTYPE html>
<html lang="en" dir="ltr" data-i18n-title="go_complete">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biz1 Showcase — Complete</title>
<script src="assets/js/theme-boot.js"></script>
<link rel="stylesheet" href="assets/css/app.css?v=ticket-3">
<script src="assets/config.js?v=ticket-3"></script>
<script src="assets/js/app.js?v=ticket-3"></script>
</head>
<body data-page="complete">
<div id="appRoot" dir="ltr" class="page-wrap">
  <div class="phone-outer">

    <!-- COMPLETE / SIGN-OFF -->
    <div class="phone-inner app-view" data-view="complete" style="position:relative;">
      <div class="ticket-header">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;">
          <div class="lang-bar-left">
            <span style="font-size:11px;font-weight:600;color:rgba(255,255,255,.55);" data-i18n="lang_label">Language</span>
            <div class="lang-switch">
              <button type="button" data-set-lang="en">EN</button>
              <button type="button" data-set-lang="he">עב</button>
            </div>
          </div>
          <div class="lang-bar-right">
            <button type="button" class="btn-profile" data-profile-open data-i18n-title="profile" title="Profile" aria-label="Profile">
              <span class="btn-profile-avatar" data-profile-initials>?</span>
            </button>
            <button type="button" class="theme-toggle" data-theme-toggle data-i18n-title="toggle_theme" title="Light / Dark mode">
              <svg class="icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
              <svg class="icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/></svg>
            </button>
            <div data-live-chip class="live-chip live-off">
              <span class="dot"></span>
              <span data-live-label data-i18n="live_socket_off">Socket Off</span>
            </div>
          </div>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <a href="schedule.html" id="completeBackBtn" style="width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;justify-content:center;text-decoration:none;">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
          </a>
          <div style="text-align:center;">
            <div class="ticket-header-title"><span data-i18n="go_complete">Complete & Sign-Off</span> #<span id="completeTicketNum">—</span></div>
          </div>
          <div style="width:34px;"></div>
        </div>
      </div>
      <div id="completeBody" class="dc-scroll ticket-body">
        <div id="completeMissing" class="hidden card" style="color:#8a93a3;font-weight:700;" data-i18n="data_not_found">Data not found</div>
        <div id="completeContent" class="hidden complete-layout">
          <div class="card" style="margin-bottom:12px;">
            <div style="font-size:13px;font-weight:700;color:#7b8595;margin-bottom:7px;" data-i18n="work_summary">Work summary</div>
            <textarea id="ticketSummary" class="ds-input input" data-i18n-placeholder="work_summary_ph" placeholder="Describe work performed…" rows="4" style="width:100%;padding:13px;border-radius:13px;resize:none;"></textarea>
          </div>
          <div class="card" style="margin-bottom:12px;">
            <div class="ticket-section-title" data-i18n="spare_parts">Spare parts</div>
            <div class="complete-product-row">
              <select id="completeProductSelect" class="ds-input input" style="flex:1;padding:12px;font-weight:600;">
                <option value="">—</option>
              </select>
              <input id="completeProductQty" class="ds-input input" type="number" min="1" value="1" style="width:72px;padding:12px;font-weight:700;text-align:center;">
              <button type="button" id="ticketSpareBtn" class="btn-ghost" style="white-space:nowrap;" data-i18n="add_part">Add</button>
            </div>
            <div id="ticketSparesList" class="complete-spares-list"></div>
          </div>
          <div class="card" style="margin-bottom:12px;">
            <div class="ticket-section-title" data-i18n="photos">Photos</div>
            <div class="photo-slots">
              <label id="ticketBeforePhotoLabel" class="photo-slot">
                <span data-i18n="before_photo">Before photo</span>
                <input id="ticketBeforePhotoInput" type="file" accept="image/*">
                <img id="ticketBeforePhotoPreview" class="hidden" alt="Before">
              </label>
              <label id="ticketAfterPhotoLabel" class="photo-slot">
                <span data-i18n="after_photo">After photo</span>
                <input id="ticketAfterPhotoInput" type="file" accept="image/*">
                <img id="ticketAfterPhotoPreview" class="hidden" alt="After">
              </label>
            </div>
          </div>
          <div id="ticketSignatureCard" class="card" style="margin-bottom:12px;">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
              <div style="font-size:14px;font-weight:800;color:#16223a;" data-i18n="digital_signature">Digital Signature</div>
              <button type="button" id="clearSig" class="btn-ghost" style="padding:6px 10px;font-size:12px;" data-i18n="clear_sig">Clear</button>
            </div>
            <div class="sig-canvas-wrap" style="margin-bottom:6px;background:#fff;">
              <canvas id="sigCanvas" width="700" height="320"></canvas>
              <img id="ticketSignaturePreview" alt="Signature" class="hidden" style="width:100%;height:160px;object-fit:contain;display:block;background:#fff;">
            </div>
            <div style="font-size:11.5px;color:#9aa3b0;font-weight:600;text-align:center;" data-i18n="tap_sign">Sign here</div>
          </div>
          <div id="completeFormError" class="hidden" style="margin-bottom:12px;color:#c0392b;font-size:13px;font-weight:700;text-align:center;"></div>
          <button type="button" id="completeSubmitBtn" class="btn-primary btn-green ticket-action-btn ticket-action-btn--complete" style="width:100%;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 15l2 2 4-4"/></svg>
            <span data-i18n="complete_send">Complete Ticket &amp; Sign Off</span>
          </button>
        </div>
      </div>
      <div id="successOverlay" class="success-overlay hidden">
        <div class="success-sheet">
          <div style="width:64px;height:64px;border-radius:50%;background:#e6f4ec;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#2e8a63" stroke-width="2.4"><path d="M20 6 9 17l-5-5"/></svg>
          </div>
          <div style="font-size:20px;font-weight:800;color:#16223a;" data-i18n="success_title">Ticket completed</div>
          <div style="font-size:13.5px;color:#5a6473;font-weight:600;margin-top:8px;line-height:1.45;" data-i18n="success_body">Work signed off and saved to the ticket.</div>
          <a id="waSuccess" class="btn-ghost" style="display:flex;margin-top:18px;justify-content:center;text-decoration:none;background:#eafaf0;border-color:#c8ecd6;color:#25b35e;" target="_blank" rel="noopener" data-i18n="open_whatsapp">Open WhatsApp</a>
          <a href="schedule.html" id="successBackSchedule" class="btn-primary" style="margin-top:10px;text-decoration:none;display:block;text-align:center;" data-i18n="back_schedule">Back to schedule</a>
        </div>
      </div>
    </div>

    <!-- PROFILE -->
    <div id="profileOverlay" class="profile-overlay hidden" aria-hidden="true">
      <button type="button" class="profile-backdrop" data-profile-close aria-label="Close"></button>
      <div class="profile-sheet" role="dialog" aria-labelledby="profileTitle">
        <div class="profile-sheet-top">
          <div id="profileTitle" class="profile-sheet-title" data-i18n="profile">Profile</div>
          <button type="button" class="profile-close" data-profile-close aria-label="Close">×</button>
        </div>
        <div class="profile-avatar-lg" data-profile-initials>?</div>
        <div id="profileName" class="profile-name">—</div>
        <div class="profile-rows">
          <div class="profile-row">
            <div class="profile-row-label" data-i18n="email_label">Email / Username</div>
            <div id="profileEmail" class="profile-row-value">—</div>
          </div>
          <div class="profile-row">
            <div class="profile-row-label" data-i18n="profile_role">Role</div>
            <div id="profileRole" class="profile-row-value">—</div>
          </div>
        </div>
        <button type="button" id="logoutBtn" class="btn-primary profile-logout-btn" data-i18n="logout">Log out</button>
      </div>
    </div>

  </div>
</div>
</body>
</html>
