<!DOCTYPE html>
<html lang="en" dir="ltr" data-i18n-title="ticket_title">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biz1 Showcase — Ticket</title>
<script src="assets/js/theme-boot.js"></script>
<link rel="stylesheet" href="assets/css/app.css?v=ticket-15">
<script src="assets/config.js?v=ticket-15"></script>
<script src="assets/js/app.js?v=ticket-15"></script>

    <script>
      (function(){try{var t=localStorage.getItem('biz1_fin_theme');if(t!=='dark'&&t!=='light'){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','light');}})();
    </script>
</head>
<body data-page="ticket">
<div id="appRoot" dir="ltr" class="page-wrap">
  <div class="phone-outer">

    <!-- TICKET -->
    <div class="phone-inner app-view" data-view="ticket" style="position:relative;">
      <div class="ticket-header">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;">
          <div class="lang-bar-left">
            <span style="font-size:11px;font-weight:600;color:rgba(255,255,255,.55);" data-i18n="lang_label">Language</span>
            <div class="lang-switch">
              <button type="button" data-set-lang="en">EN</button>
              <button type="button" data-set-lang="he">עב</button>
            </div>
          </div>
          <div class="lang-bar-right">
            <button type="button" class="btn-profile" data-profile-open data-i18n-title="profile" title="Profile" aria-label="Profile">
              <span class="btn-profile-avatar" data-profile-initials>?</span>
            </button>
            <button type="button" class="theme-toggle" data-theme-toggle data-i18n-title="toggle_theme" title="Light / Dark mode">
              <svg class="icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
              <svg class="icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/></svg>
            </button>
            <div data-live-chip class="live-chip live-off">
              <span class="dot"></span>
              <span data-live-label data-i18n="live_socket_off">Socket Off</span>
            </div>
          </div>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <a href="schedule.html" id="ticketBackBtn" style="width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;justify-content:center;text-decoration:none;">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
          </a>
          <div style="text-align:center;">
            <div class="ticket-header-title"><span data-i18n="ticket_title">Service Ticket</span> #<span id="ticketNum">—</span></div>
          </div>
          <div style="width:34px;"></div>
        </div>
      </div>
      <div id="ticketBody" class="dc-scroll ticket-body">
        <div id="ticketMissing" class="hidden card" style="color:#8a93a3;font-weight:700;" data-i18n="data_not_found">Data not found</div>
        <div id="ticketContent" class="hidden ticket-layout">
          <div class="card ticket-panel ticket-panel--client">
            <div class="ticket-client-heading">
              <span class="ticket-client-kicker" data-i18n="client">Client</span>
              <span class="ticket-client-dot"></span>
            </div>
            <div id="ticketClientLine" class="ticket-value ticket-client-name"></div>
            <div class="ticket-client-grid">
              <div class="ticket-client-field">
                <div class="ticket-label" data-i18n="address">Address</div>
                <div id="ticketAddressLine" class="ticket-value--sm"></div>
              </div>
              <div class="ticket-client-field">
                <div class="ticket-label" data-i18n="status">Status</div>
                <select id="ticketStatusSelect" class="ds-input input ticket-status-select">
                  <option value="opened">Opened</option>
                  <option value="assigned">Assigned</option>
                  <option value="closed">Closed</option>
                </select>
              </div>
            </div>
          </div>
          <div class="ticket-panel ticket-panel--work">
            <div class="card" style="margin-bottom:12px;">
              <div class="ticket-section-title" data-i18n="history">Service history</div>
              <div id="ticketHistory"></div>
            </div>
            <div class="card" style="margin-bottom:12px;">
              <div class="ticket-section-title" data-i18n="checklist">Checklist</div>
              <div id="ticketChecklist"></div>
            </div>
            <div id="ticketCompletedWork" class="card hidden" style="margin-bottom:12px;">
              <div class="ticket-section-title" data-i18n="completed_work">Completed work</div>
              <div class="completed-field">
                <div class="ticket-label" data-i18n="work_summary">Work summary</div>
                <div id="ticketCompletedSummary" class="completed-summary"></div>
              </div>
              <div id="ticketCompletedPartsWrap" class="completed-field hidden">
                <div class="ticket-label" data-i18n="spare_parts">Spare parts</div>
                <div id="ticketCompletedParts" class="completed-parts"></div>
              </div>
              <div id="ticketCompletedPhotosWrap" class="completed-field hidden">
                <div class="ticket-label" data-i18n="photos">Photos</div>
                <div class="completed-media-grid">
                  <figure id="ticketCompletedBeforeWrap" class="completed-media hidden">
                    <img id="ticketCompletedBefore" alt="Before">
                    <figcaption data-i18n="before_photo">Before photo</figcaption>
                  </figure>
                  <figure id="ticketCompletedAfterWrap" class="completed-media hidden">
                    <img id="ticketCompletedAfter" alt="After">
                    <figcaption data-i18n="after_photo">After photo</figcaption>
                  </figure>
                </div>
              </div>
              <div id="ticketCompletedSignatureWrap" class="completed-field hidden">
                <div class="ticket-label" data-i18n="digital_signature">Digital Signature</div>
                <img id="ticketCompletedSignature" class="completed-signature" alt="Signature">
              </div>
            </div>
            <div id="ticketFormError" class="hidden" style="margin-bottom:12px;color:#c0392b;font-size:13px;font-weight:700;text-align:center;"></div>
          </div>
          <div class="ticket-actions ticket-actions--bar">
            <button type="button" id="ticketNavMaps" class="btn-ghost ticket-action-btn" data-i18n="navigate">Navigate</button>
            <a id="ticketWaBtn" class="btn-ghost ticket-action-btn ticket-action-btn--wa" href="#" role="button" rel="noopener">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
              <span data-i18n="wa_on_way_btn">I'm on my way</span>
            </a>
            <button type="button" id="ticketCompleteBtn" class="btn-primary btn-green ticket-action-btn ticket-action-btn--complete">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 15l2 2 4-4"/></svg>
              <span data-i18n="go_complete">Complete & Sign-Off</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- PROFILE -->
    <div id="profileOverlay" class="profile-overlay hidden" aria-hidden="true">
      <button type="button" class="profile-backdrop" data-profile-close aria-label="Close"></button>
      <div class="profile-sheet" role="dialog" aria-labelledby="profileTitle">
        <div class="profile-sheet-top">
          <div id="profileTitle" class="profile-sheet-title" data-i18n="profile">Profile</div>
          <button type="button" class="profile-close" data-profile-close aria-label="Close">×</button>
        </div>
        <div class="profile-avatar-lg" data-profile-initials>?</div>
        <div id="profileName" class="profile-name">—</div>
        <div class="profile-rows">
          <div class="profile-row">
            <div class="profile-row-label" data-i18n="email_label">Email / Username</div>
            <div id="profileEmail" class="profile-row-value">—</div>
          </div>
          <div class="profile-row">
            <div class="profile-row-label" data-i18n="profile_role">Role</div>
            <div id="profileRole" class="profile-row-value">—</div>
          </div>
        </div>
        <button type="button" id="logoutBtn" class="btn-primary profile-logout-btn" data-i18n="logout">Log out</button>
      </div>
    </div>

  </div>
</div>
</body>
</html>
