<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="tickets.newTitle">New ticket — Customer Portal</title>
  <link rel="stylesheet" href="../css/styles.css?v=202609041410" />
  <script src="../js/boot.js"></script>
  <style>
    .ticket-create-card {
      width: 100%;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.75rem;
    }
    .ticket-form-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(300px, 1fr);
      gap: 2rem;
      align-items: start;
    }
    .ticket-panel-title {
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .ticket-panel-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .ticket-side-panel {
      background: var(--bg-muted);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .ticket-side-panel .form-group {
      margin-bottom: 0;
    }
    .star-rating-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      min-height: 42px;
    }
    .ticket-form-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 0.75rem;
      margin-top: 2rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
    }
    @media (max-width: 920px) {
      .ticket-form-grid {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }
      .ticket-create-card {
        padding: 1.25rem;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="page-body" hidden>
    <div class="flex-between mb-2">
      <a class="btn btn-ghost btn-sm" href="tickets.html">← <span data-i18n="back">Back</span></a>
    </div>

    <div class="ticket-create-card">
      <div class="card-header" style="margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border);">
        <div>
          <div class="card-title" style="font-size: 1.25rem; font-weight: 800;" data-i18n="tickets.create">Create ticket</div>
          <div class="card-meta mt-1">Submit your request or question. Our support team will assist you promptly.</div>
        </div>
      </div>

      <div id="form-alert" hidden></div>

      <form id="form">
        <div class="ticket-form-grid">
          <!-- Left Column: Primary Content -->
          <div class="ticket-main-col">
            <div class="ticket-panel-title">Issue Details</div>

            <div class="form-group">
              <label class="form-label" for="topic" data-i18n="tickets.subjectReq">Subject *</label>
              <input class="form-control" id="topic" required maxlength="200" data-i18n-placeholder="tickets.subjectPh" placeholder="What do you need help with?" />
            </div>

            <div class="form-group">
              <label class="form-label" for="messages" data-i18n="tickets.messageReq">Message *</label>
              <textarea class="form-control" id="messages" required style="min-height: 220px;" data-i18n-placeholder="tickets.messagePh" placeholder="Describe the issue in detail…"></textarea>
            </div>
          </div>

          <!-- Right Column: Attributes & Contact Info -->
          <div class="ticket-side-panel">
            <div class="ticket-panel-title" style="margin-bottom: 0.25rem;">Classification</div>

            <div class="form-group">
              <label class="form-label" for="ticket_department" data-i18n="tickets.department">Department</label>
              <select class="form-control" id="ticket_department">
                <option value="" data-i18n="tickets.select">— Select —</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" data-i18n="tickets.urgency">Urgency</label>
              <div class="star-rating" id="rating-wrap">
                <input type="hidden" id="rating" name="rating" value="1" />
                <div class="star-rating-row">
                  <div class="star-rating-stars" id="rating-stars" role="radiogroup" data-i18n-aria="tickets.urgencyRating" aria-label="Urgency rating">
                    <button type="button" class="star-btn" data-value="1" aria-label="1 star — Low">★</button>
                    <button type="button" class="star-btn" data-value="2" aria-label="2 stars">★</button>
                    <button type="button" class="star-btn" data-value="3" aria-label="3 stars — Normal">★</button>
                    <button type="button" class="star-btn" data-value="4" aria-label="4 stars">★</button>
                    <button type="button" class="star-btn" data-value="5" aria-label="5 stars — Critical">★</button>
                  </div>
                  <span class="star-rating-label" id="rating-label" style="font-weight: 700; color: var(--accent);">Low</span>
                </div>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="product_id" data-i18n="tickets.relatedProduct">Related product</label>
              <select class="form-control" id="product_id">
                <option value="" data-i18n="tickets.optionalDash">— Optional —</option>
              </select>
            </div>

            <div class="ticket-panel-title" style="margin-top: 0.5rem; margin-bottom: 0.25rem;">Contact Info</div>

            <div class="form-group">
              <label class="form-label" for="customername" data-i18n="tickets.name">Name</label>
              <input class="form-control" id="customername" placeholder="Your name" />
            </div>

            <div class="form-group">
              <label class="form-label" for="email" data-i18n="tickets.email">Email</label>
              <input class="form-control" id="email" type="email" placeholder="your@email.com" />
            </div>
          </div>
        </div>

        <div class="ticket-form-actions">
          <a class="btn btn-ghost" href="tickets.html" data-i18n="cancel">Cancel</a>
          <button type="submit" class="btn btn-primary" id="btn-submit" style="min-width: 160px;" data-i18n="tickets.submit">Submit ticket</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/config.js?v=202609041410"></script>
  <script src="../js/theme.js?v=202609041410"></script>
  <script src="../js/i18n.js?v=202609041410"></script>
  <script src="../js/toast.js?v=202609041410"></script>
  <script src="../js/auth.js?v=202609041410"></script>
  <script src="../js/api.js?v=202609041410"></script>
  <script src="../js/realtime.js?v=202609041410"></script>
  <script src="../js/ui.js?v=202609041410"></script>
  <script src="../js/layout.js?v=202609041410"></script>
  <script src="../js/pages/ticket-new-page.js"></script>
</body>
</html>
