<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="pdf.document">Document — Customer Portal</title>
  <link rel="stylesheet" href="../css/styles.css?v=202609041410" />
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; background: var(--bg); }
    .pdf-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.75rem 1rem;
      background: var(--bg-elevated);
      border-bottom: 1px solid var(--border);
    }
    .pdf-toolbar h1 {
      font-size: 1rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .pdf-frame-wrap { flex: 1; min-height: 0; background: #525659; }
    .pdf-frame-wrap embed,
    .pdf-frame-wrap iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    .pdf-status {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 2rem;
      color: var(--text-secondary);
    }
  </style>
  <script src="../js/boot.js"></script>
</head>
<body>
  <div class="pdf-toolbar">
    <h1 id="doc-title" data-i18n="pdf.document">Document</h1>
    <div class="flex gap-1">
      <button type="button" class="btn btn-ghost lang-toggle" data-lang-toggle>עברית</button>
      <button type="button" class="btn btn-sm btn-secondary" id="pdf-close-btn" data-i18n="pdf.close">Close</button>
    </div>
  </div>
  <div class="pdf-frame-wrap" id="viewer">
    <div class="pdf-status"><div class="spinner"></div><p style="margin-top:1rem" data-i18n="pdf.loading">Loading document…</p></div>
  </div>

  <script src="../js/config.js?v=202609041410"></script>
  <script src="../js/theme.js?v=202609041410"></script>
  <script src="../js/i18n.js?v=202609041410"></script>
  <script src="../js/auth.js?v=202609041410"></script>
  <script src="../js/ui.js?v=202609041410"></script>
  <script src="../js/pages/pdf-view-page.js"></script>
</body>
</html>
