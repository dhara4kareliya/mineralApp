<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="nav.appointments">Appointments — Customer Portal</title>
  <link rel="stylesheet" href="../css/styles.css?v=202609181045" />
  <script src="../js/boot.js"></script>
</head>
<body>
  <div id="app"></div>
  <div id="page-body" hidden>
    <div class="appt-layout">
      <aside class="appt-sidebar">
        <button type="button" class="appt-new-btn" id="appt-new-btn" data-i18n="appt.new">NEW APPOINTMENT</button>
        <button type="button" class="appt-detail-btn" id="appt-view-detail-btn" data-i18n="appt.viewDetail">View Appointment Detail</button>

        <div class="appt-panel">
          <div id="appt-mini-cal"></div>
        </div>

        <div class="appt-panel">
          <div id="appt-doctors"></div>
        </div>
      </aside>

      <section class="appt-main">
        <div class="appt-toolbar">
          <div class="appt-toolbar-left">
            <button type="button" class="appt-icon-btn" id="appt-prev" data-i18n-aria="appt.prev" aria-label="Previous">‹</button>
            <div class="appt-view-tabs" role="tablist">
              <button type="button" class="appt-view-tab active" data-view="week" data-i18n="appt.weekly">WEEKLY</button>
              <button type="button" class="appt-view-tab" data-view="day" data-i18n="appt.daily">DAILY</button>
              <button type="button" class="appt-view-tab" data-view="month" data-i18n="appt.monthly">MONTHLY</button>
            </div>
            <button type="button" class="appt-icon-btn" id="appt-next" data-i18n-aria="appt.next" aria-label="Next">›</button>
            <button type="button" class="btn btn-sm btn-ghost" id="appt-today" data-i18n="appt.today">Today</button>
          </div>
          <div class="appt-toolbar-right">
            <label class="appt-branch-wrap">
              <span class="visually-hidden" data-i18n="appt.branch">Branch</span>
              <select class="form-control appt-branch-select" id="appt-branch" data-i18n-aria="appt.selectBranch" aria-label="Select branch">
                <option value="all" data-i18n="appt.allBranches">All branches</option>
              </select>
            </label>
            <span class="appt-range-label" id="appt-range-label"></span>
          </div>
        </div>

        <div class="appt-type-bar">
          <button type="button" class="appt-all-btn" id="appt-filter-all" data-i18n="appt.all">All</button>
          <div class="appt-filters" id="appt-filters"></div>
        </div>

        <div class="appt-week-wrap">
          <div id="appt-week"><div class="loading-block"><div class="spinner"></div><span data-i18n="appt.loading">Loading schedule…</span></div></div>
        </div>
      </section>
    </div>
  </div>

  <div id="appt-modal" hidden></div>
  <div id="appt-coupon-modal" hidden></div>

  <script src="../js/config.js?v=202609171900"></script>
  <script src="../js/theme.js?v=202609171900"></script>
  <script src="../js/i18n.js?v=202609181045"></script>
  <script src="../js/toast.js?v=202609171900"></script>
  <script src="../js/auth.js?v=202609171900"></script>
  <script src="../js/api.js?v=202609181030"></script>
  <script src="../js/realtime.js?v=202609171900"></script>
  <script src="../js/ui.js?v=202609171900"></script>
  <script src="../js/layout.js?v=202609171900"></script>
  <script src="../js/appointments.js?v=202609181045"></script>
  <script src="../js/pages/appointments-page.js"></script>
</body>
</html>
