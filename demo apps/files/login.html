<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>Sign in — Files Data</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="auth-page" data-i18n-title="loginTitle">
  <div class="boot-loader" aria-hidden="true"><div class="spinner"></div></div>

  <div class="auth-shell">
    <div class="auth-toolbar">
      <label class="lang-select-wrap">
        <span class="sr-only" data-i18n="language">Language</span>
        <select class="lang-select" data-lang-select aria-label="Language">
          <option value="en">English</option>
          <option value="he">עברית</option>
        </select>
      </label>
      <button type="button" class="theme-fab" data-theme-toggle data-i18n-aria="toggleTheme" aria-label="Toggle theme">
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>

    <div class="auth-card card">
      <div class="auth-brand">
        <div class="auth-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/>
          </svg>
        </div>
        <h1 data-i18n="brandTitle">Files Data</h1>
        <p data-i18n="signInDesc">Sign in to browse, upload, and manage your document repository.</p>
      </div>

      <form id="loginForm" class="auth-form" novalidate>
        <div id="loginNote" class="alert alert--error hidden" role="alert"></div>

        <label class="field">
          <span data-i18n="emailLabel">Email / Username / Phone / ID</span>
          <input name="username" id="username" autocomplete="username" data-i18n-placeholder="emailPlaceholder" placeholder="you@company.com" required />
        </label>

        <label class="field">
          <span data-i18n="password">Password</span>
          <div class="input-with-action">
            <input name="password" id="password" type="password" autocomplete="current-password" placeholder="••••••••" required />
            <button type="button" class="ghost-btn" id="togglePassword" data-i18n="show">Show</button>
          </div>
        </label>

        <div id="otpField" class="hidden">
          <label class="field">
            <span data-i18n="otpLabel">Verification code (OTP)</span>
            <input name="otp" id="otp" class="otp-input" autocomplete="one-time-code" inputmode="numeric" data-i18n-placeholder="otpPlaceholder" placeholder="6-digit code" />
          </label>
        </div>

        <button type="submit" class="btn btn--primary btn--block" id="loginBtn">
          <span class="btn-label" data-i18n="signIn">Sign in</span>
          <span class="spinner spinner--btn" aria-hidden="true"></span>
        </button>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/realtime.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
