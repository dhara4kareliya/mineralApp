<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Biz1 Showcase - Tasks</title>
    <script src="assets/js/theme-boot.js"></script>
    <link rel="stylesheet" href="assets/css/style.css?v=mission-11">
    <script src="assets/js/lang.js?v=mission-3"></script>
    <script src="assets/js/config.js?v=mission-2"></script>
    <script src="assets/js/biz1-sdk.js?v=mission-2"></script>
    <script src="assets/js/biz1-app.js?v=mission-5"></script>
    <script src="assets/js/page-boot.js?v=mission-6"></script>
    <script src="assets/js/tasks-live.js?v=mission-4"></script>
    <script src="assets/js/components.js?v=mission-3"></script>
</head>

<body>
    <div class="app-container">
        <div class="mobile-frame">
            <div class="screen-content">

                <div id="app-header"></div>

                <!-- Task Detail Overlay (Hidden by default) -->
                <div id="task-detail-panel" style="display:none; position:absolute; inset:0; background:var(--bg-screen); z-index:50; flex-direction:column;">
                    <div style="padding:14px 16px; border-bottom:1px solid var(--border-panel); display:flex; justify-content:space-between; align-items:center;">
                        <h2 style="margin:0; font-size:16px; font-weight:800; color:var(--text-title);" data-i18n="task_details">Task Details</h2>
                        <button id="close-task-panel" style="background:none; border:none; cursor:pointer; color:var(--text-sub);">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
                    </div>
                    <div id="task-detail-content" class="dc-scroll" style="flex:1; overflow-y:auto; padding:16px;">
                        <!-- Content dynamically injected here -->
                    </div>
                </div>

                <!-- Task Filter Overlay (Hidden by default) -->
                <div id="task-filter-panel" style="display:none; position:absolute; inset:0; background:rgba(0,0,0,0.5); z-index:60; flex-direction:column; justify-content:flex-end;">
                    <div style="background:var(--bg-screen); border-radius:24px 24px 0 0; padding:16px; padding-bottom:32px;">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                            <h2 style="margin:0; font-size:18px; font-weight:800; color:var(--text-title);" data-i18n="filter_status">Filter by status</h2>
                            <button id="close-filter-panel" style="background:none; border:none; cursor:pointer; color:var(--text-sub);">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
                        </div>
                        <div id="task-filter-options" style="display:flex; flex-direction:column; gap:8px;">
                            <!-- Filter options injected here -->
                        </div>
                    </div>
                </div>

                <div class="dc-scroll page-body">
                    <!-- header: title · filter pill -->
                    <div class="mission-filter-header">
                        <div style="font-size:21px; font-weight:800; color:var(--text-title);" data-i18n="tasks">Tasks</div>
                        <div class="mission-filter-area">
                            <button id="task-filter-btn" style="display:inline-flex; align-items:center; gap:7px; padding:9px 14px; border-radius:99px; border:1.5px solid var(--border-panel); background:var(--bg-form); cursor:pointer; white-space:nowrap; flex:none; color:var(--text-sub);">
              <svg fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="16"><path d="M3 5h18M6 12h12M10 19h4"></path></svg>
              <span style="font-size:13px; font-weight:700; white-space:nowrap;" data-i18n="filter_status">Filter by status</span>
            </button>
                        </div>
                    </div>

                    <!-- Filter Pills Bar (Image 2 specs) -->
                    <div id="mb-task-filter-chips" class="dc-scroll mission-filter-chips">
                        <button class="mb-filter-chip" data-type="show_all_together_tasks" style="padding:7px 15px; border-radius:99px; font-size:13px; font-weight:700; border:none; background:var(--color-primary); color:#fff; cursor:pointer; white-space:nowrap;" data-i18n="filter_all">הכל</button>
                        <button class="mb-filter-chip" data-type="today_tasks" style="padding:7px 15px; border-radius:99px; font-size:13px; font-weight:700; border:1px solid var(--border-panel); background:var(--bg-panel); color:var(--text-sub); cursor:pointer; white-space:nowrap;"
                            data-i18n="filter_today">היום</button>
                        <button class="mb-filter-chip" data-type="priority_tasks" style="padding:7px 15px; border-radius:99px; font-size:13px; font-weight:700; border:1px solid var(--border-panel); background:var(--bg-panel); color:var(--text-sub); cursor:pointer; white-space:nowrap;"
                            data-i18n="filter_priority">עדיפות</button>
                        <button class="mb-filter-chip" data-type="upcoming_tasks" style="padding:7px 15px; border-radius:99px; font-size:13px; font-weight:700; border:1px solid var(--border-panel); background:var(--bg-panel); color:var(--text-sub); cursor:pointer; white-space:nowrap;"
                            data-i18n="filter_upcoming">קרובות</button>
                        <button class="mb-filter-chip" data-type="done_tasks" style="padding:7px 15px; border-radius:99px; font-size:13px; font-weight:700; border:1px solid var(--border-panel); background:var(--bg-panel); color:var(--text-sub); cursor:pointer; white-space:nowrap;"
                            data-i18n="filter_done">בוצעו</button>
                    </div>

                    <!-- add task -->
                    <a href="new_task.html" style="width:100%; padding:15px; border:none; border-radius:14px; background:var(--color-primary); color:#fff; font-size:16px; font-weight:800; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:9px; box-shadow:0 6px 16px rgba(29,96,162,.26); margin-bottom:16px; text-decoration:none;">
                        <svg fill="none" height="18" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" viewbox="0 0 24 24" width="18"><path d="M5 12h14M12 5v14"></path></svg>
                        <span data-i18n="add_task">הוסף משימה</span>
                    </a>

                    <!-- QUICK MISSION BOX -->
                    <div id="mb-quick-mission-box" style="background:var(--bg-panel); border:1.5px solid var(--border-panel); border-radius:16px; padding:14px; margin-bottom:18px; box-shadow:0 2px 8px rgba(0,0,0,0.04);">
                        <div style="display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:12px;">
                            <span style="font-size:12px; font-weight:800; color:var(--text-sub); letter-spacing:0.5px; flex:none;" data-i18n="quick_label">מהיר</span>
                            <input id="mb-quick-detail" type="text" placeholder="הקלד כאן את פרטי המשימה" data-i18n-placeholder="quick_mission_placeholder" style="flex:1; min-width:180px; padding:8px 12px; border-radius:10px; border:1px solid var(--border-panel); background:var(--bg-form); color:var(--text-title); font-size:13px; font-family:inherit; outline:none;"
                            />
                        </div>
                        <div style="display:flex; flex-wrap:wrap; align-items:center; gap:10px;">
                            <div style="display:inline-flex; align-items:center; gap:8px; padding:6px 10px; border-radius:10px; border:1px solid var(--border-panel); background:var(--bg-form); flex:1; min-width:200px;">
                                <span style="font-size:12px; font-weight:700; color:var(--text-sub); flex:none;" data-i18n="customer">לקוח</span>
                                <select id="mb-quick-customer" class="quick-mission-select">
                <option value="" data-i18n="choose_customer">בחר לקוח</option>
              </select>
                            </div>
                            <div style="display:inline-flex; align-items:center; gap:8px; padding:6px 10px; border-radius:10px; border:1px solid var(--border-panel); background:var(--bg-form); flex:1; min-width:180px;">
                                <span style="font-size:12px; font-weight:700; color:var(--text-sub); flex:none;" data-i18n="team_label">צוות</span>
                                <select id="mb-quick-team" class="quick-mission-select"></select>
                            </div>
                            <button id="mb-quick-submit" type="button" style="padding:9px 18px; border-radius:10px; border:none; background:#2563eb; color:#fff; font-size:13.5px; font-weight:800; cursor:pointer; box-shadow:0 4px 12px rgba(37,99,235,0.3); flex:none;" data-i18n="quick_mission_btn">משימה מהירה</button>
                        </div>
                        <div id="mb-quick-msg" style="display:none; font-size:12px; font-weight:700; margin-top:8px;"></div>
                    </div>

                    <div id="mb-missions-total" style="font-size:12.5px; font-weight:700; color:var(--text-sub); margin:0 2px 10px;" data-i18n="loading_tasks">טוען משימות…</div>

                    <div id="mb-live-tasks">
                        <!-- Groups and tasks injected here -->
                    </div>
                </div>

                <div id="app-footer">
                    <div class="app-footer-nav">
                        <a href="sales_home.html" class="nav-item" data-id="home">
                            <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 3l9 8"></path><path d="M5 9.5V20h14V9.5"></path></svg>
                            <span style="font-weight:700;" data-i18n="home">Home</span>
                        </a>
                        <a href="kanban.html" class="nav-item" data-id="kanban">
                            <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line><line x1="15" y1="3" x2="15" y2="21"></line></svg>
                            <span data-i18n="kanban">Kanban</span>
                        </a>
                        <a href="tasks.html" class="nav-item" data-id="tasks">
                            <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2.5"></rect><path d="m8 11 2.5 2.5L15 9M8 17h6"></path></svg>
                            <span data-i18n="tasks">Tasks</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
