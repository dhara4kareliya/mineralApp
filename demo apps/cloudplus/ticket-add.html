<!DOCTYPE html>
<html lang="en" dir="ltr" data-page="ticket-add" data-i18n-title="page_ticket_add_title">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CloudPlus — New ticket</title>
<script>
(function(){try{var t=localStorage.getItem('cloudplus_theme')||localStorage.getItem('biz1fs_theme')||localStorage.getItem('mineralbar_theme');if(t!=='dark'&&t!=='light'){t='light';}document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','light');}})();
(function(){try{var l=localStorage.getItem('cloudplus_lang')||localStorage.getItem('biz1fs_lang')||localStorage.getItem('mineralbar_lang');if(l!=='he'&&l!=='en')l='en';document.documentElement.lang=l==='he'?'he':'en';document.documentElement.dir=l==='he'?'rtl':'ltr';}catch(e){}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./assets/css/app.css?v=20260917a">
<link rel="stylesheet" href="./assets/css/ticket-pages.css?v=20260917a">
<script src="./assets/config.js?v=20260917a"></script>
<script>
(function () {
  var user = (window.Biz1Config && Biz1Config.user) || 'demo';
  user = String(user).trim().toLowerCase()
    .replace(/^https?:\/\//, '')
    .replace(/\.biz1\.co\.il.*$/i, '')
    .replace(/[^a-z0-9-]/g, '');
  if (user) {
    document.write('<script src="https://' + user + '.biz1.co.il/app/sdk/biz1-sdk.js"><\/script>');
  }
})();
</script>
<script src="./assets/js/app.js?v=20260917a"></script>
<script src="./assets/js/page-boot.js?v=20260917a"></script>
<script src="./assets/js/ticket-add.js?v=20260917a"></script>
</head>
<body>
<div id="appRoot" dir="ltr" class="page-wrap">
  <div class="phone-outer">
    <div class="phone-inner" style="position:relative;">
      <div class="status-bar status-bar-dark">
        <span class="status-clock">--:--</span>
        <div class="status-bar-actions">
          <button type="button" class="lang-translator-btn lang-translator-btn--dark" data-lang-toggle>🌐 EN</button>
          <button type="button" class="status-icon-btn status-icon-btn--dark" data-theme-toggle data-i18n-title="toggle_theme" title="Light / Dark mode">
            <svg class="icon-sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/></svg>
          </button>
          <button type="button" class="status-icon-btn status-icon-btn--dark btn-profile" data-profile-open data-i18n-title="profile" title="Profile" aria-label="Profile">
            <span class="btn-profile-avatar" data-profile-initials>?</span>
          </button>
        </div>
      </div>

      <div class="ticket-header">
        <div class="ticket-header-row">
          <a href="tickets.html" id="taBackBtn" class="ticket-header-round">
            <svg class="page-back-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
          </a>
          <div class="ticket-header-mid">
            <div class="ticket-header-title" data-i18n="add_ticket_title">Add Ticket</div>
            <div class="ticket-header-sub" data-i18n="add_ticket_sub">New service call</div>
          </div>
          <div class="ticket-header-round ticket-header-round--spacer"></div>
        </div>
      </div>

      <div id="taBody" class="dc-scroll ticket-body soc-page-bg ta-form-page">

        <section class="ta-form-card">
          <div class="ta-form-card-title" data-i18n="section_customer">CUSTOMER</div>

          <div class="ta-cust-search">
            <input id="taCustomerSearch" class="ds-input input ta-field" type="search" data-i18n-placeholder="search_customers" placeholder="Search by name, phone or address">
          </div>
          <div id="taCustomerList" class="ta-cust-list"></div>
          <div id="taSelected" class="ta-selected hidden">
            <div id="taCustInitials" class="td-avatar">?</div>
            <div style="flex:1;min-width:0;">
              <div id="taCustName" class="td-customer-name">—</div>
              <div id="taCustMeta" class="td-customer-addr">—</div>
            </div>
            <button type="button" id="taClearCust" class="btn-ghost" style="padding:6px 10px;font-size:12px;" data-i18n="clear_selection">Clear</button>
          </div>

          <div class="ta-grid-2">
            <div class="ta-field-wrap">
              <label class="wd-label" data-i18n="customer_name">Customer Name</label>
              <input id="taCustNameInput" class="ds-input input ta-field" data-i18n-placeholder="customer_name_ph" placeholder="Type a customer name">
            </div>
            <div class="ta-field-wrap">
              <label class="wd-label" data-i18n="ticket_name">Ticket Name</label>
              <input id="taTicketName" class="ds-input input ta-field" data-i18n-placeholder="ticket_name_ph" placeholder="Ticket Name">
            </div>
            <div class="ta-field-wrap">
              <label class="wd-label" data-i18n="customer_email">Customer email</label>
              <input id="taEmail" class="ds-input input ta-field" type="email">
            </div>
            <div class="ta-field-wrap">
              <label class="wd-label" data-i18n="phone_label">Phone</label>
              <input id="taPhone" class="ds-input input ta-field" type="tel">
            </div>
            <div class="ta-field-wrap">
              <label class="wd-label" data-i18n="delivery_address">Address</label>
              <input id="taAddress" class="ds-input input ta-field">
            </div>
            <div class="ta-field-wrap">
              <label class="wd-label" data-i18n="city">City</label>
              <input id="taCity" class="ds-input input ta-field">
            </div>
            <div class="ta-field-wrap ta-field-wrap--full">
              <label class="wd-label" data-i18n="mobile_label">Mobile</label>
              <input id="taMobile" class="ds-input input ta-field" type="tel">
            </div>
          </div>
        </section>

        <section class="ta-form-card">
          <div class="ta-form-card-title" data-i18n="section_ticket">TICKET</div>

          <div class="ta-field-wrap">
            <label class="wd-label"><span data-i18n="topic_label">Topic</span> <span class="req">*</span></label>
            <input id="taTopic" class="ds-input input ta-field" data-i18n-placeholder="topic_ph" placeholder="Enter topic…">
          </div>

          <div class="ta-field-wrap">
            <label class="wd-label" data-i18n="urgency">URGENCY</label>
            <div id="taUrgency" class="ta-stars" role="radiogroup" aria-label="Urgency"></div>
          </div>

          <div class="ta-grid-2">
            <div class="ta-field-wrap">
              <label class="wd-label" data-i18n="due_date">Due date</label>
              <input id="taDueDate" class="ds-input input ta-field" type="date">
            </div>
            <div class="ta-field-wrap">
              <label class="wd-label" data-i18n="from_time">From</label>
              <input id="taFromTime" class="ds-input input ta-field" type="time">
            </div>
            <div class="ta-field-wrap">
              <label class="wd-label" data-i18n="to_time">To</label>
              <input id="taToTime" class="ds-input input ta-field" type="time">
            </div>
            <div class="ta-field-wrap">
              <label class="wd-label" data-i18n="team_member">Team member</label>
              <div class="ta-add-box">
                <div id="taTechChip" class="ta-chip hidden"></div>
                <button type="button" id="taTechAdd" class="ta-add-pill">+ <span data-i18n="add_btn">Add</span></button>
                <select id="taTech" class="ds-input input ta-field ta-add-select hidden">
                  <option value="" data-i18n="select_technician">Select Technician</option>
                </select>
              </div>
            </div>
            <div class="ta-field-wrap">
              <label class="wd-label" data-i18n="product_label">Product</label>
              <div class="ta-add-box">
                <div id="taProductChip" class="ta-chip hidden"></div>
                <button type="button" id="taProductAdd" class="ta-add-pill">+ <span data-i18n="add_btn">Add</span></button>
                <select id="taProduct" class="ds-input input ta-field ta-add-select hidden">
                  <option value="" data-i18n="select_product">Select product…</option>
                </select>
              </div>
            </div>
            <div class="ta-field-wrap ta-field-wrap--full">
              <label class="wd-label"><span data-i18n="choose_department">CHOOSE DEPARTMENT</span> <span class="req">*</span></label>
              <select id="taDepartment" class="ds-input input ta-field">
                <option value="" data-i18n="choose_option">Choose</option>
              </select>
            </div>
          </div>
        </section>

        <section class="ta-form-card">
          <div class="ta-form-card-title"><span data-i18n="section_problem">PROBLEM</span> <span class="req">*</span></div>
          <textarea id="taProblem" class="ds-input input ta-field ta-problem" rows="5" data-i18n-placeholder="problem_note_ph" placeholder="Enter Note. You can paste an image."></textarea>

          <div class="ta-field-wrap" style="margin-top:12px;">
            <label class="wd-label" data-i18n="files_image">Files (image)</label>
            <label id="taPhotoZone" class="soc-photo-zone ta-file-zone">
              <input id="taPhotoInput" type="file" accept="image/*">
              <div data-i18n="files_image_hint">Drop or choose an image - accept image/* - one file</div>
              <div id="taPhotoName" class="hidden" style="font-size:12.5px;font-weight:700;"></div>
            </label>
          </div>
        </section>
      </div>

      <div class="ticket-page-actions ta-form-actions">
        <div id="taError" class="hidden field-error" style="background:#fbeeed;border:1.5px solid #f1c9c4;border-radius:12px;padding:11px 13px;margin-bottom:10px;"></div>
        <div id="taSuccess" class="hidden" style="background:#eafaf0;border:1px solid #cdeeda;border-radius:12px;padding:11px 13px;margin-bottom:10px;color:#1f7a45;font-size:13px;font-weight:700;"></div>
        <div class="ta-action-row">
          <button type="button" id="taReset" class="ta-btn-secondary" data-i18n="reset">Reset</button>
          <button type="button" id="taCancel" class="ta-btn-secondary" data-i18n="cancel">Cancel</button>
          <button type="button" id="taSubmit" class="ta-btn-primary" data-i18n="submit">Submit</button>
        </div>
      </div>
    </div>

    <div id="profileOverlay" class="profile-overlay hidden" aria-hidden="true">
      <button type="button" class="profile-backdrop" data-profile-close aria-label="Close"></button>
      <div class="profile-sheet" role="dialog" aria-labelledby="profileTitle">
        <div class="profile-sheet-top">
          <div id="profileTitle" class="profile-sheet-title" data-i18n="profile">Profile</div>
          <button type="button" class="profile-close" data-profile-close aria-label="Close">×</button>
        </div>
        <div class="profile-identity">
          <div class="profile-avatar-lg" data-profile-initials>?</div>
          <div id="profileName" class="profile-name">—</div>
        </div>
        <div class="profile-rows">
          <div class="profile-row">
            <div class="profile-row-label" data-i18n="email_label">Email / Username</div>
            <div id="profileEmail" class="profile-row-value">—</div>
          </div>
          <div class="profile-row">
            <div class="profile-row-label" data-i18n="profile_role">Role</div>
            <div id="profileRole" class="profile-row-value">—</div>
          </div>
        </div>
        <button type="button" id="logoutBtn" class="btn-primary profile-logout-btn" data-i18n="logout">Log out</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
