<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biz1 Showcase</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Heebo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="assets/js/lang.js?v=live-chip-1"></script>
<script src="assets/js/support.js"></script>
<script src="assets/js/config.js"></script>
<script>
(function () {
  var user = (window.Biz1Config && Biz1Config.user) || 'demo';
  user = String(user).trim().toLowerCase()
    .replace(/^https?:\/\//, '')
    .replace(/\.bull36\.com.*$/i, '')
    .replace(/[^a-z0-9-]/g, '');
  document.write('<script src="https://' + user + '.bull36.com/app/sdk/biz1-sdk.js"><\/script>');
})();
</script>
<script src="assets/js/biz1-app.js?v=live-chip-1"></script>
<script src="assets/js/page-boot.js?v=live-chip-1"></script>
<script src="assets/js/home-live.js?v=dedupe-api-1"></script>
<script src="assets/js/components.js?v=sticky-hf-1"></script>

<script>
  (function() {
    var theme = localStorage.getItem('biz1demo_theme') || localStorage.getItem('mineral_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<link rel="stylesheet" href="assets/css/style.css?v=live-chip-1">
</head>
<body>
<div class="app-container">
  <div class="mobile-frame">
    <div class="screen-content">

      <div id="app-header"></div>

      <div id="mb-live-home" class="dc-scroll page-body">
        <!-- ===== stat cards ===== -->
        <div class="home-stats-grid">
          <div class="align-dynamic stat-card">
            <div style="font-size:13.5px; font-weight:600; color:var(--text-sub);" data-i18n="total_tasks"></div>
            <div id="mb-stat-closed" style="font-size:42px; font-weight:800; color:#2e8a63; line-height:1.15; margin:2px 0;">…</div>
            <div id="mb-stat-closed-sub" style="font-size:13px; font-weight:600; color:var(--text-sub);" data-i18n="tasks"></div>
          </div>
          <div class="align-dynamic stat-card">
            <div style="font-size:13.5px; font-weight:600; color:var(--text-sub);" data-i18n="open_tasks"></div>
            <div id="mb-stat-followup" style="font-size:42px; font-weight:800; color:#bd8324; line-height:1.15; margin:2px 0;">…</div>
            <div id="mb-stat-followup-sub" style="font-size:13px; font-weight:600; color:var(--text-sub);" data-i18n="followup"></div>
          </div>
        </div>

        <!-- ===== sales pipeline ===== -->
        <div style="margin-bottom:28px;">
          <h2 style="font-size:18px; font-weight:800; color:var(--text-title); margin:0 0 16px; letter-spacing:-0.2px;" data-i18n="my_sales_pipeline"></h2>
          <div class="dc-scroll drag-horizontal" style="display:flex; gap:8px; overflow-x:auto; padding-bottom:8px; scroll-snap-type:x proximity; -webkit-overflow-scrolling:touch;">
            <div style="display:inline-flex; align-items:center; gap:7px; padding:8px 13px; border-radius:99px; background:#fdf1dd; color:#bd8324; flex:none; user-select:none;">
              <svg fill="none" height="15" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewBox="0 0 24 24" width="15"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
              <span style="font-size:13.5px; font-weight:700;" data-i18n="שיחת פולואפ"></span> <span id="mb-pipe-follow" style="font-size:12.5px; font-weight:800; background:#f0ddb3; color:#bd8324; border-radius:99px; padding:1px 8px;">0</span>
            </div>
            <div style="display:inline-flex; align-items:center; gap:7px; padding:8px 13px; border-radius:99px; background:#eef0fb; color:#50439d; flex:none; user-select:none;">
              <svg fill="none" height="15" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewBox="0 0 24 24" width="15"><line x1="22" x2="11" y1="2" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
              <span style="font-size:13.5px; font-weight:700;" data-i18n="שליחת הצעה"></span> <span id="mb-pipe-offer" style="font-size:12.5px; font-weight:800; background:#e6e1f9; color:#7857e4; border-radius:99px; padding:1px 8px;">0</span>
            </div>
            <div style="display:inline-flex; align-items:center; gap:7px; padding:8px 13px; border-radius:99px; background:#eaf2fb; color:#1d60a2; flex:none; user-select:none;">
              <svg fill="none" height="15" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewBox="0 0 24 24" width="15"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
              <span style="font-size:13.5px; font-weight:700;" data-i18n="שליחת תמונות"></span> <span id="mb-pipe-pics" style="font-size:12.5px; font-weight:800; background:#cfe0f2; color:var(--color-primary); border-radius:99px; padding:1px 8px;">0</span>
            </div>
          </div>
        </div>

        <!-- ===== tasks for today ===== -->
        <div style="display:flex;align-items:center;justify-content:space-between;margin:0 2px 6px;">
          <div style="font-size:17px; font-weight:800; color:var(--text-title);" data-i18n="tasks_for_today"></div>
          <a href="tasks.html" style="font-size:12.5px;font-weight:800;color:var(--color-primary);text-decoration:none;" data-i18n="all"></a>
        </div>
        <div id="mb-live-home-missions"></div>
      </div>

      <div id="app-footer"></div>
    </div>
  </div>
</div>

</body>
</html>
