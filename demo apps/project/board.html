<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biz1 Showcase — Board</title>
<script src="assets/js/theme-boot.js"></script>
<link rel="stylesheet" href="assets/css/app.css?v=project-8">
<script src="assets/config.js?v=project-7"></script>
<script src="assets/js/app.js?v=project-7"></script>
</head>
<body data-page="board">
<div id="appRoot" dir="ltr" class="page-wrap is-board">
  <div class="phone-outer is-board">
<!-- BOARD -->
    <div class="phone-inner app-view board-screen" data-view="board">
      <div class="lang-bar">
        <div class="lang-bar-left">
          <button type="button" id="btnBoardBack" class="btn-ghost toolbar-btn board-back-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
            <span data-i18n="back">Back</span>
          </button>
        </div>
        <div class="lang-bar-right">
          <div data-live-chip class="live-chip live-off" title="Live updates">
            <span class="dot"></span>
            <span data-live-label data-i18n="live_socket_off">Offline</span>
          </div>
          <button type="button" class="btn-profile" data-profile-open data-i18n-title="profile" title="Profile" aria-label="Profile">
            <span class="btn-profile-avatar" data-profile-initials>?</span>
          </button>
          <button type="button" class="theme-toggle" data-theme-toggle data-i18n-title="toggle_theme" title="Light / Dark mode">
            <svg class="icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/></svg>
          </button>
        </div>
      </div>
      <div class="board-top">
        <div class="board-title-wrap">
          <div id="boardProjectName" class="board-project-name">—</div>
          <div class="board-header-meta">
            <div id="boardClient" class="board-client"></div>
            <div id="boardTeam" class="board-team"></div>
          </div>
        </div>
        <div class="board-top-mid">
          <div class="search-wrap board-search-wrap">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
            <input id="boardSearch" class="ds-input search-input" type="search" data-i18n-placeholder="search_missions" placeholder="Search missions">
          </div>
        </div>
        <div class="board-chart" id="boardChart">
          <svg id="boardDonut" class="board-donut" viewBox="0 0 100 100" aria-hidden="true"></svg>
          <div class="board-chart-side">
            <ul id="boardChartLegend" class="board-chart-legend"></ul>
            <div class="board-chart-pager">
              <button type="button" class="board-chart-nav" data-chart-page="-1" aria-label="Previous">▲</button>
              <span id="boardChartPage">1/1</span>
              <button type="button" class="board-chart-nav board-chart-nav--next" data-chart-page="1" aria-label="Next">▼</button>
            </div>
          </div>
        </div>
        <button type="button" id="btnBoardRefresh" class="btn-ghost toolbar-btn" data-i18n="refresh">Refresh</button>
      </div>
      <div id="boardLoading" class="card empty-card hidden">
        <div class="empty-text" data-i18n="loading">Loading…</div>
      </div>
      <div id="boardError" class="card empty-card hidden">
        <div id="boardErrorText" class="empty-text empty-text--error"></div>
      </div>
      <div id="boardColumns" class="board-columns dc-scroll"></div>
    </div>

    <!-- PROFILE -->
    <div id="profileOverlay" class="profile-overlay hidden" aria-hidden="true">
      <button type="button" class="profile-backdrop" data-profile-close aria-label="Close"></button>
      <div class="profile-sheet" role="dialog" aria-labelledby="profileTitle">
        <div class="profile-sheet-top">
          <div id="profileTitle" class="profile-sheet-title" data-i18n="profile">Profile</div>
          <button type="button" class="profile-close" data-profile-close aria-label="Close">×</button>
        </div>
        <div class="profile-avatar-lg" data-profile-initials>?</div>
        <div id="profileName" class="profile-name">—</div>
        <div class="profile-rows">
          <div class="profile-row">
            <div class="profile-row-label" data-i18n="email_label">Email / Username</div>
            <div id="profileEmail" class="profile-row-value">—</div>
          </div>
          <div class="profile-row">
            <div class="profile-row-label" data-i18n="profile_role">Role</div>
            <div id="profileRole" class="profile-row-value">—</div>
          </div>
        </div>
        <button type="button" id="logoutBtn" class="btn-primary profile-logout-btn" data-i18n="logout">Log out</button>
      </div>
    </div>

    <!-- GENERIC MODAL -->
    <div id="modalOverlay" class="modal-overlay hidden" aria-hidden="true">
      <button type="button" class="modal-backdrop" data-modal-close aria-label="Close"></button>
      <div class="modal-sheet" role="dialog" aria-modal="true">
        <div class="modal-top">
          <div id="modalTitle" class="modal-title"></div>
          <button type="button" class="profile-close" data-modal-close aria-label="Close">×</button>
        </div>
        <div id="modalBody" class="modal-body"></div>
        <div id="modalFooter" class="modal-footer"></div>
      </div>
    </div>

  
  </div>
</div>
<div id="toast" class="toast hidden" role="status"></div>
</body>
</html>
