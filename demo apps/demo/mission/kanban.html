<style>
  .kanban-board {
    display: flex;
    flex: 1 1 auto;
    min-height: 0;
    align-items: stretch;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x proximity;
    gap: 16px;
    padding: 18px 16px;
  }
  .kanban-column {
    flex: 0 0 280px;
    background: var(--bg-card); /* White inner background */
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    max-height: 100%;
    min-height: 0;
    scroll-snap-align: start;
    border: 1px solid var(--border-panel); /* Default border */
  }

  /* Mobile Stacked View */
  @media (max-width: 600px) {
    .kanban-board {
      flex-direction: column;
      overflow-y: auto;
      overflow-x: hidden;
      scroll-snap-type: none;
    }
    .kanban-column {
      flex: 0 0 auto;
      width: 100%;
    }
  }
  
  /* Status Colors */
  .kanban-column[data-status="to_do"] { 
    border-color: #e5e7eb; 
    background-color: #f9fafb;
  }
  .kanban-column[data-status="to_do"] .kanban-column-header { color: #6b7280; }
  
  .kanban-column[data-status="in_progress"] { 
    border-color: #bfdbfe; 
    background-color: #eff6ff;
  }
  .kanban-column[data-status="in_progress"] .kanban-column-header { color: #3b82f6; }
  
  .kanban-column[data-status="pending_review"] { 
    border-color: #fde68a; 
    background-color: #fffbeb;
  }
  .kanban-column[data-status="pending_review"] .kanban-column-header { color: #f59e0b; }
  
  .kanban-column[data-status="completed"] { 
    border-color: #a7f3d0; 
    background-color: #ecfdf5;
  }
  .kanban-column[data-status="completed"] .kanban-column-header { color: #10b981; }

  /* Pulse Animation */
  @keyframes pulse-green {
    0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6); }
    100% { box-shadow: 0 0 0 20px rgba(16, 185, 129, 0); }
  }
  .pulse-animation {
    animation: pulse-green 0.6s ease-out 2;
  }
  .kanban-column-header {
    padding: 14px 16px;
    font-weight: 800;
    font-size: 13.5px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    flex: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .kanban-column-count {
    background: var(--bg-panel);
    color: var(--text-sub);
    border-radius: 99px;
    padding: 2px 8px;
    font-size: 12px;
    font-weight: 600;
  }
  .kanban-column-body {
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 100px;
  }
  .kanban-card {
    background: var(--bg-panel);
    border-radius: 14px;
    padding: 12px;
    box-shadow: var(--box-shadow-card);
    cursor: grab;
    display: flex;
    flex-direction: column;
    gap: 8px;
    border: 1px solid var(--border-panel);
    width: 100%;
    max-width: 100%;
    box-sizing: border-box;
  }
  .kanban-card:active {
    cursor: grabbing;
  }
  .kanban-card.is-dragging {
    opacity: 0.5;
    border-color: var(--color-primary);
  }
  .kanban-column-body.drag-over {
    background: var(--bg-accent);
  }
  .badge {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 4px;
    align-self: flex-start;
  }
  .badge-low { background: #eef0f3; color: #7b8595; }
  .badge-medium { background: #cfe0f2; color: #1d60a2; }
  .badge-high { background: #fdf1dd; color: #bd8324; }
  .badge-critical { background: #fee2e2; color: #d0432f; }

<div class="app-container">

      <div id="app-header"></div>

      <!-- Task Detail Overlay (Hidden by default) -->
      <div id="task-detail-panel" style="display:none; position:absolute; inset:0; background:var(--bg-screen); z-index:50; flex-direction:column;">
        <div style="padding:14px 16px; border-bottom:1px solid var(--border-panel); display:flex; justify-content:space-between; align-items:center;">
          <h2 style="margin:0; font-size:16px; font-weight:800; color:var(--text-title);" data-i18n="task_details">Task Details</h2>
          <button id="close-task-panel" style="background:none; border:none; cursor:pointer; color:var(--text-sub);">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>
        <div id="task-detail-content" class="dc-scroll" style="flex:1; overflow-y:auto; padding:16px;">
          <!-- Content dynamically injected here -->
        </div>
      </div>

      <!-- Main Kanban Area -->
      <div id="kanban-board" class="kanban-board dc-scroll drag-horizontal">
        
        <div class="kanban-column" data-status="to_do">
          <div class="kanban-column-header">
            <span>● <span data-i18n="col_todo">To Do</span></span>
            <span class="kanban-column-count" id="count-to_do">0</span>
          </div>
          <div class="kanban-column-body dc-scroll" id="col-to_do"></div>
        </div>

        <div class="kanban-column" data-status="in_progress">
          <div class="kanban-column-header">
            <span>● <span data-i18n="col_in_progress">In Progress</span></span>
            <span class="kanban-column-count" id="count-in_progress">0</span>
          </div>
          <div class="kanban-column-body dc-scroll" id="col-in_progress"></div>
        </div>

        <div class="kanban-column" data-status="pending_review">
          <div class="kanban-column-header">
            <span>● <span data-i18n="col_pending">Pending Review</span></span>
            <span class="kanban-column-count" id="count-pending_review">0</span>
          </div>
          <div class="kanban-column-body dc-scroll" id="col-pending_review"></div>
        </div>

        <div class="kanban-column" data-status="completed">
          <div class="kanban-column-header">
            <span>● <span data-i18n="col_completed">Completed</span></span>
            <span class="kanban-column-count" id="count-completed">0</span>
          </div>
          <div class="kanban-column-body dc-scroll" id="col-completed"></div>
        </div>

      </div>

      <div id="app-footer"></div>
    </div>
  </div>
</div>

<script>
  // Pan to scroll logic for Kanban Board
  (function() {
    var board = document.getElementById('kanban-board');
    if (!board) return;
    
    var isDown = false;
    var startX;
    var scrollLeft;

    board.addEventListener('mousedown', function(e) {
      // Don't pan if we are dragging a card
      if (e.target.closest('.kanban-card')) return;
      isDown = true;
      board.style.cursor = 'grabbing';
      startX = e.pageX - board.offsetLeft;
      scrollLeft = board.scrollLeft;
    });

    board.addEventListener('mouseleave', function() {
      isDown = false;
      board.style.cursor = '';
    });

    board.addEventListener('mouseup', function() {
      isDown = false;
      board.style.cursor = '';
    });

    board.addEventListener('mousemove', function(e) {
      if (!isDown) return;
      e.preventDefault();
      var x = e.pageX - board.offsetLeft;
      var walk = (x - startX) * 1.5; // Scroll speed multiplier
      // If RTL, we might need to invert the walk, but since browser handles RTL scroll left natively, let's see.
      // Usually, in RTL, scrollLeft goes negative or is handled differently depending on the browser.
      // Easiest is to just apply subtraction and the browser resolves it.
      var dir = document.documentElement.getAttribute('dir') === 'rtl' ? -1 : 1;
      board.scrollLeft = scrollLeft - (walk * dir);
    });
  })();
</script>
