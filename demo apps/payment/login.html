<title>טופס תשלום — התחברות</title>
<script>
(function () {
  try {
    var theme = localStorage.getItem('biz1demo_theme') || localStorage.getItem('mineral_theme');
    if (theme !== 'dark' && theme !== 'light') {
      theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', theme);
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'light');
  }
})();
</script>

<script>
(function () {
  function normalizeTenant(raw) {
    return String(raw == null ? '' : raw).trim().toLowerCase()
      .replace(/^https?:\/\//, '')
      .replace(/\.bull36\.com.*$/i, '')
      .replace(/[^a-z0-9-]/g, '');
  }
  var saved = '';
  try { saved = normalizeTenant(localStorage.getItem('biz1demo_tenant') || ''); } catch (e) {}
  var user = saved || normalizeTenant((window.Biz1Config && Biz1Config.user) || 'demo');
  document.write('<script src="https://' + user + '.bull36.com/app/sdk/biz1-sdk.js"><\/script>');
})();
</script>
<script src="assets/js/lang.js?v=pay-53"></script>
<script src="assets/js/biz1-app.js?v=pay-38"></script>
<link rel="stylesheet" href="assets/css/login.css?v=pay-41">
</head>
<body>
<div class="app-shell" id="appShell">
  <div class="app-frame">
    <div id="screenLogin" class="screen">
      <div class="status-bar status-bar--dark">
        <span id="clockLogin">9:41</span>
        <div class="status-bar-right">
          <button type="button" class="theme-toggle" id="themeToggle" data-i18n-title="dark_mode" title="Theme">
            <svg class="icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/></svg>
          </button>
          <div class="lang-switch" role="group" aria-label="Language">
            <button type="button" class="lang-btn" data-lang="he" id="loginLangHe">עב</button>
            <button type="button" class="lang-btn" data-lang="en" id="loginLangEn">EN</button>
          </div>
        </div>
      </div>

      <div class="brand-hero">
        <div class="brand-blob brand-blob--tr"></div>
        <div class="brand-blob brand-blob--bl"></div>
        <div class="brand-icon">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#9cc3ec" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2.5"/><path d="M2 10h20"/><path d="M6 15h4"/></svg>
        </div>
        <div class="brand-title" id="brandTitle" data-i18n="brandName">טופס תשלום</div>
        <div class="brand-sub" data-i18n="login_subtitle">התחברות למערכת הגבייה</div>
      </div>

      <div class="dc-scroll login-scroll">
        <form id="loginForm" class="login-card" autocomplete="off">
          <div class="login-title" data-i18n="form_title">כניסה לחשבון</div>

          <div id="errorBox" class="error-box hidden">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c0392b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none; margin-top:1px;"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
            <div id="errorText" class="error-text"></div>
          </div>
          <div id="usernameWrap" class="field">
            <label for="username" class="field-label">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9aa3b0" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.5 3-5.5 7-5.5s7 2 7 5.5"/></svg>
              <span data-i18n="email_username">אימייל / שם משתמש / טלפון / מזהה</span> <span class="req">*</span>
            </label>
            <input id="username" class="ds-input input input--ltr" type="text" name="payform-user" autocomplete="off" autocapitalize="off" spellcheck="false" value="" data-i18n-placeholder="placeholder_email" placeholder="אימייל, שם משתמש, טלפון או מזהה" required>
          </div>

          <div id="passwordWrap" class="field field--tight">
            <label for="password" class="field-label">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9aa3b0" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
              <span data-i18n="password">סיסמה</span> <span class="req">*</span>
            </label>
            <div class="pass-wrap">
              <input id="password" class="ds-input input input--pass" type="password" name="payform-pass" autocomplete="new-password" value="" data-i18n-placeholder="placeholder_password" placeholder="הזן סיסמה" required>
              <button type="button" id="togglePassword" class="pass-toggle" aria-label="Toggle password">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>

          <div id="otpWrap" class="field field--tight hidden">
            <label for="otp" class="field-label">
              <span data-i18n="otp">קוד אימות (OTP)</span> <span class="req">*</span>
            </label>
            <input id="otp" class="ds-input input input--otp" type="text" inputmode="numeric" autocomplete="one-time-code" data-i18n-placeholder="otp_placeholder" placeholder="הזן קוד">
            <button type="button" id="resendOtpBtn" class="resend-otp" data-i18n="resendOtp">שלח קוד שוב</button>
          </div>

          <div class="login-row">
            <label class="remember">
              <input id="remember" type="checkbox">
              <span data-i18n="remember_me">זכור אותי</span>
            </label>
            <span class="biz1-tag">Biz1</span>
          </div>

          <button type="submit" id="loginBtn" class="btn btn-login">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="m10 17 5-5-5-5"/><path d="M15 12H3"/></svg>
            <span id="loginBtnText" data-i18n="login_btn">התחבר</span>
          </button>
        </form>

        <div class="demo-users" id="demo-users">
          <div class="demo-users-title" data-i18n="demo_credentials">פרטי הדגמה</div>
          <div class="demo-users-list">
            <div class="demo-user-row">
              <span class="demo-user-creds">dhara@yopmail.com / pass0364</span>
              <button
                type="button"
                class="demo-user-btn"
                data-user="dhara@yopmail.com"
                data-pass="pass0364"
                data-i18n="login_as_demo_user"
              >התחבר כמשתמש הדגמה</button>
            </div>
          </div>
        </div>
        <p class="login-footer">Biz1 Showcase · <span data-i18n="brandName">טופס תשלום</span></p>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  var App = window.Biz1App || window.MineralBarApp;
  var cfg = window.Biz1Config || {};

  function applyBrandAndHint() {
    var lang = (typeof getLanguage === 'function' ? getLanguage() : 'he');
    var brand = (window.getBrandName && window.getBrandName(lang)) ||
      (cfg.brand && (lang === 'en' ? cfg.brand.en : cfg.brand.he)) ||
      (lang === 'en' ? 'Payment Form' : 'טופס תשלום');
    var brandEl = document.getElementById('brandTitle');
    if (brandEl) brandEl.textContent = brand;
    document.querySelectorAll('.lang-btn').forEach(function (btn) {
      btn.classList.toggle('is-active', btn.getAttribute('data-lang') === lang);
    });
  }

  if (typeof initLanguage === 'function') initLanguage();
  applyBrandAndHint();

  document.querySelectorAll('.lang-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var next = btn.getAttribute('data-lang');
      if (window.setLanguage) window.setLanguage(next);
      else if (window.initLanguage) {
        localStorage.setItem('lang', next);
        window.initLanguage();
      }
    });
  });

  function tickClock() {
    var el = document.getElementById('clockLogin');
    if (!el) return;
    var d = new Date();
    el.textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  tickClock();
  setInterval(tickClock, 30000);

  document.getElementById('themeToggle').addEventListener('click', function () {
    var current = document.documentElement.getAttribute('data-theme');
    var next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('biz1demo_theme', next);
  });

  var form = document.getElementById('loginForm');
  var usernameEl = document.getElementById('username');
  var passwordEl = document.getElementById('password');
  var otpEl = document.getElementById('otp');
  var otpWrap = document.getElementById('otpWrap');
  var errorBox = document.getElementById('errorBox');
  var errorText = document.getElementById('errorText');
  var loginBtn = document.getElementById('loginBtn');
  var loginBtnText = document.getElementById('loginBtnText');
  var resendOtpBtn = document.getElementById('resendOtpBtn');
  var rememberEl = document.getElementById('remember');
  var waitingOtp = false;
  var requestInFlight = false;
  var cooldownUntil = 0;
  var cooldownTimer = null;
  var resendCooldownUntil = 0;
  var resendCooldownTimer = null;

  function showError(msg) {
    errorText.textContent = msg || window.t('failLogin');
    errorBox.classList.remove('hidden');
  }
  function clearError() {
    errorBox.classList.add('hidden');
    errorText.textContent = '';
  }

  function enterOtpMode(message) {
    waitingOtp = true;
    document.getElementById('usernameWrap').classList.add('hidden');
    document.getElementById('passwordWrap').classList.add('hidden');
    otpWrap.classList.remove('hidden');
    loginBtnText.textContent = window.t('verifyAndConnect');
    showError(message || window.t('reqOtp'));
    startResendCooldown(20);
    otpEl.focus();
  }

  function setRequestBusy(busy, source) {
    requestInFlight = busy;
    var rateLimited = Date.now() < cooldownUntil;
    loginBtn.disabled = busy || rateLimited;
    resendOtpBtn.disabled = busy || rateLimited || Date.now() < resendCooldownUntil;
    if (source === 'resend') {
      if (busy) resendOtpBtn.textContent = window.t('resendingOtp');
      else if (Date.now() >= resendCooldownUntil) resendOtpBtn.textContent = window.t('resendOtp');
    }
  }

  function startResendCooldown(seconds) {
    resendCooldownUntil = Date.now() + (seconds * 1000);
    if (resendCooldownTimer) clearInterval(resendCooldownTimer);

    function renderResendCooldown() {
      var remaining = Math.max(0, Math.ceil((resendCooldownUntil - Date.now()) / 1000));
      if (!remaining) {
        clearInterval(resendCooldownTimer);
        resendCooldownTimer = null;
        resendCooldownUntil = 0;
        resendOtpBtn.textContent = window.t('resendOtp');
        resendOtpBtn.disabled = requestInFlight || Date.now() < cooldownUntil;
        return;
      }
      resendOtpBtn.textContent = window.t('resendOtpIn') + ' ' + remaining + 's';
      resendOtpBtn.disabled = true;
    }

    renderResendCooldown();
    resendCooldownTimer = setInterval(renderResendCooldown, 1000);
  }

  function getRetrySeconds(err) {
    var raw = (err && err.raw) || {};
    var value = raw.retry_after || raw.retryAfter || raw.wait_seconds || raw.waitSeconds;
    var seconds = Number(value);
    if (Number.isFinite(seconds) && seconds > 0) return Math.min(Math.ceil(seconds), 3600);

    var message = String((raw && raw.message) || (err && err.message) || '');
    var minuteMatch = message.match(/wait\s+(\d+)\s+minutes?/i);
    if (minuteMatch) return Math.min(Number(minuteMatch[1]) * 60, 3600);
    var secondMatch = message.match(/wait\s+(\d+)\s+seconds?/i);
    if (secondMatch) return Math.min(Number(secondMatch[1]), 3600);
    if (/wait\s+(?:one|a)\s+minute/i.test(message)) return 60;
    if ((err && Number(err.status) === 429) || /too many login attempts/i.test(message)) return 60;
    return 0;
  }

  function startLoginCooldown(seconds, message) {
    cooldownUntil = Date.now() + (seconds * 1000);
    if (cooldownTimer) clearInterval(cooldownTimer);

    function renderCooldown() {
      var remaining = Math.max(0, Math.ceil((cooldownUntil - Date.now()) / 1000));
      if (!remaining) {
        clearInterval(cooldownTimer);
        cooldownTimer = null;
        cooldownUntil = 0;
        setRequestBusy(false, 'login');
        loginBtnText.textContent = waitingOtp ? window.t('verifyAndConnect') : window.t('connect');
        clearError();
        return;
      }

      var minutes = Math.floor(remaining / 60);
      var secs = String(remaining % 60).padStart(2, '0');
      var countdown = String(minutes).padStart(2, '0') + ':' + secs;
      loginBtn.disabled = true;
      resendOtpBtn.disabled = true;
      loginBtnText.textContent = window.t('tryAgainIn') + ' ' + countdown;
      showError(message + ' ' + window.t('tryAgainIn') + ': ' + countdown);
    }

    renderCooldown();
    cooldownTimer = setInterval(renderCooldown, 1000);
  }

  function handleLoginError(err) {
    var msg = (err && err.message) || window.t('failLogin');
    if (err && err.raw && err.raw.message) msg = err.raw.message;
    var retrySeconds = getRetrySeconds(err);
    if (retrySeconds) {
      startLoginCooldown(retrySeconds, window.t('tooManyAttempts'));
      return true;
    }
    showError(msg);
    return false;
  }

  function isOtpValidationError(err) {
    var raw = (err && err.raw) || {};
    var status = Number((err && err.status) || raw.status || 0);
    var message = String(raw.message || (err && err.message) || '').toLowerCase();
    if (status === 400 || status === 401) return true;
    return /(otp|one.?time|verification|אימות).*(invalid|wrong|incorrect|expired|mismatch|failed|שגוי|פג)/i.test(message)
      || /(invalid|wrong|incorrect|expired|mismatch|failed|שגוי|פג).*(otp|code|אימות|קוד)/i.test(message);
  }

  var demoFilled = false;

  function clearLoginFields() {
    if (demoFilled) return;
    if (usernameEl) usernameEl.value = '';
    if (passwordEl) passwordEl.value = '';
    if (otpEl) otpEl.value = '';
  }

  function prefillRemembered() {
    try {
      if (localStorage.getItem('biz1demo_remember') === '1' || localStorage.getItem('mineralbar_remember') === '1') {
        rememberEl.checked = true;
      }
    } catch (e) { /* ignore */ }
  }

  async function tryAutoEnter() {
    try {
      var client = App.getClient();
      // Only auto-enter when session looks complete; never bounce first-time users to home
      if (client.getToken() && App.getRole()) {
        location.replace(App.homeForRole(App.getRole()));
        return true;
      }
      if (App.canAutoRefresh && App.canAutoRefresh()) {
        setRequestBusy(true, 'login');
        loginBtnText.textContent = window.t('reconnecting');
        var refreshed = await App.refreshSession();
        if (refreshed && refreshed.ok) {
          location.replace(refreshed.dest || App.homeForRole(refreshed.role));
          return true;
        }
        setRequestBusy(false, 'login');
      }
    } catch (e) {
      console.warn('[PaymentForm] login auto-refresh failed', e);
      setRequestBusy(false, 'login');
      try {
        if (App.clearSession) App.clearSession({ keepEmail: true });
      } catch (eClear) { /* ignore */ }
      if (e && e.otpRequired) {
        enterOtpMode(window.t('reqOtp'));
        return false;
      }
      if (handleLoginError(e)) return false;
      loginBtnText.textContent = window.t('connect');
    }
    return false;
  }

  prefillRemembered();
  clearLoginFields();
  window.addEventListener('pageshow', function () {
    demoFilled = false;
    clearLoginFields();
  });
  setTimeout(clearLoginFields, 50);
  setTimeout(clearLoginFields, 250);
  tryAutoEnter();

  document.querySelectorAll('.demo-user-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      demoFilled = true;
      if (usernameEl) usernameEl.value = btn.getAttribute('data-user') || '';
      if (passwordEl) passwordEl.value = btn.getAttribute('data-pass') || '';
      if (passwordEl) passwordEl.focus();
    });
  });

  document.getElementById('togglePassword').addEventListener('click', function () {
    passwordEl.type = passwordEl.type === 'password' ? 'text' : 'password';
  });

  function buildLoginRequest(otpValue) {
    var raw = usernameEl.value.trim();
    var detected = (App && App.detectLoginIdentifier)
      ? App.detectLoginIdentifier(raw)
      : { field: 'username', value: raw };
    var args = {
      password: passwordEl.value,
      otp: otpValue || '',
      remember: !!(rememberEl && rememberEl.checked)
    };
    args[detected.field || 'username'] = detected.value || raw;
    return args;
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    if (requestInFlight || Date.now() < cooldownUntil) return;
    clearError();

    var username = usernameEl.value.trim();
    var password = passwordEl.value;
    var otp = otpEl.value.trim();

    if (!username || !password) {
      showError(window.t('errEmpty'));
      return;
    }

    if (waitingOtp && !otp) {
      showError(window.t('errOtp'));
      return;
    }

    setRequestBusy(true, 'login');
    loginBtnText.textContent = waitingOtp ? window.t('validating') : window.t('connecting');

    try {
      var result = await App.login(buildLoginRequest(otp));

      if (result.otpRequired) {
        if (waitingOtp && otp) {
          showError(window.t('invalidOtp'));
          otpEl.select();
          return;
        }
        enterOtpMode(window.t('reqOtp'));
        return;
      }

      if (result.ok) {
        location.href = result.dest;
        return;
      }

      showError(window.t('failLogin'));
    } catch (err) {
      if (waitingOtp && otp && !getRetrySeconds(err) && isOtpValidationError(err)) {
        showError(window.t('invalidOtp'));
        otpEl.select();
      } else {
        handleLoginError(err);
      }
    } finally {
      setRequestBusy(false, 'login');
      if (Date.now() >= cooldownUntil) {
        if (!waitingOtp) loginBtnText.textContent = window.t('connect');
        else loginBtnText.textContent = window.t('verifyAndConnect');
      }
    }
  });

  resendOtpBtn.addEventListener('click', async function () {
    if (requestInFlight || Date.now() < cooldownUntil || Date.now() < resendCooldownUntil || !waitingOtp) return;
    clearError();

    var username = usernameEl.value.trim();
    var password = passwordEl.value;
    if (!username || !password) {
      showError(window.t('errEmpty'));
      return;
    }

    setRequestBusy(true, 'resend');
    try {
      var result = await App.login(buildLoginRequest(''));

      if (result.otpRequired) {
        otpEl.value = '';
        enterOtpMode(window.t('otpResent'));
        return;
      }
      if (result.ok) {
        location.href = result.dest;
        return;
      }
      showError(window.t('failLogin'));
    } catch (err) {
      handleLoginError(err);
    } finally {
      setRequestBusy(false, 'resend');
    }
  });
})();
</script>
</body>
