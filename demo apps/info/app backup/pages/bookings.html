<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="nav.bookings">My bookings — Customer Portal</title>
  <link rel="stylesheet" href="../css/styles.css?v=202608151306" />
  <script>
    (function () {
      var lang = localStorage.getItem('cp_lang') === 'he' ? 'he' : 'en';
      document.documentElement.setAttribute('lang', lang);
      document.documentElement.setAttribute('dir', lang === 'he' ? 'rtl' : 'ltr');
      document.documentElement.setAttribute('data-theme', localStorage.getItem('cp_theme') || 'light');
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="page-body" hidden>
    <div class="toolbar">
      <a class="btn btn-primary" href="rooms.html" data-i18n="bookings.bookRoom">Book a room</a>
    </div>
    <div class="card">
      <div id="list"><div class="spinner"></div></div>
    </div>
  </div>

  <script src="../js/config.js?v=202608151306"></script>
  <script src="../js/theme.js?v=202608151306"></script>
  <script src="../js/i18n.js?v=202608151306"></script>
  <script src="../js/toast.js?v=202608151306"></script>
  <script src="../js/auth.js?v=202608151306"></script>
  <script src="../js/api.js?v=202608151306"></script>
  <script src="../js/realtime.js?v=202608151306"></script>
  <script src="../js/ui.js?v=202608151306"></script>
  <script src="../js/layout.js?v=202608151306"></script>
  <script>
    Layout.render({ active: 'bookings', titleKey: 'nav.bookings' });

    (async function load() {
      const el = document.getElementById('list');
      try {
        const data = await API.roomsBookings({ limit: 25 });
        const rows = data.data || [];
        if (!rows.length) {
          Layout.empty(el, I18n.t('bookings.none'), I18n.t('bookings.noneHint'));
          return;
        }
        el.innerHTML = `<div class="table-wrap"><table>
          <thead><tr><th>${I18n.t('bookings.id')}</th><th>${I18n.t('bookings.room')}</th><th>${I18n.t('bookings.start')}</th><th>${I18n.t('bookings.total')}</th></tr></thead>
          <tbody>
            ${rows
              .map(
                (r) => `<tr>
                <td><strong>#${r.id}</strong></td>
                <td>#${r.room_id}</td>
                <td>${UI.formatDate(r.start_date)}</td>
                <td>${UI.formatMoney(r.total_price)}</td>
              </tr>`
              )
              .join('')}
          </tbody>
        </table></div>`;
      } catch (err) {
        Layout.error(el, err.message);
      }
    })();
  </script>
</body>
</html>
