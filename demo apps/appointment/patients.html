<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light" data-page="patients">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClinicPulse — Patients</title>
  <script src="/js/boot.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="page-app booting">
  <div id="boot-screen" class="boot-screen" aria-live="polite">
    <div class="boot-card">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 40 40" fill="none"><rect width="40" height="40" rx="12" fill="currentColor" opacity="0.12"/><path d="M12 20h16M20 12v16" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><circle cx="20" cy="20" r="11" stroke="currentColor" stroke-width="2"/></svg>
      </div>
      <div class="boot-spinner" aria-hidden="true"></div>
      <p data-i18n="loading">Loading…</p>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div id="app-shell" class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark sm" aria-hidden="true">
          <svg viewBox="0 0 40 40" fill="none"><rect width="40" height="40" rx="12" fill="currentColor" opacity="0.12"/><path d="M12 20h16M20 12v16" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><circle cx="20" cy="20" r="11" stroke="currentColor" stroke-width="2"/></svg>
        </div>
        <div>
          <div class="brand-name" data-i18n="brand">ClinicPulse</div>
          <div class="brand-sub" id="org-name">—</div>
        </div>
      </div>

      <nav class="sidebar-nav" aria-label="Main">
        <a class="nav-item" href="/coupons.html" data-view="coupons">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"/><path d="M4 6v12c0 1.1.9 2 2 2h14v-4"/><path d="M18 12a2 2 0 0 0 0 4h4v-4h-4z"/></svg>
          <span data-i18n="nav_coupons">Coupons</span>
        </a>
        <a class="nav-item" href="/doctors.html" data-view="doctors">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
          <span data-i18n="nav_doctors">Doctor Analytics</span>
        </a>
        <a class="nav-item active" href="/patients.html" data-view="customers">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span data-i18n="nav_customers">Patients</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="live-indicator" id="socket-status">
          <span class="live-dot"></span>
          <span data-i18n="realtime_offline">Realtime offline</span>
        </div>
        <div class="user-chip">
          <div class="user-avatar" id="user-avatar">U</div>
          <div class="user-meta">
            <div class="user-name" id="user-name">—</div>
            <div class="user-email" id="user-email">—</div>
          </div>
        </div>
        <button type="button" class="btn btn-ghost btn-block" id="logout-btn" data-i18n="logout">Sign Out</button>
      </div>
    </aside>

    <div class="main-area">
      <header class="topbar">
        <button type="button" class="icon-btn mobile-only" id="menu-btn" aria-label="Menu">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <div class="topbar-title">
          <h2 id="view-title" data-i18n="nav_customers">Patients</h2>
          <p id="view-subtitle" data-i18n="customers_subtitle">Patient directory & appointment allocation</p>
        </div>
        <div class="topbar-actions">
          <button type="button" class="icon-btn" id="theme-btn" data-i18n-title="toggle_theme" title="Toggle theme">
            <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
            <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3a7 7 0 0 0 11.5 11.5z"/></svg>
          </button>
          <button type="button" class="lang-btn" id="lang-btn" aria-label="Language">EN</button>
        </div>
      </header>

      <main class="content">
        <section id="view-customers" class="view active">
          <div class="filters-bar card">
            <div class="filters-grid">
              <label class="field">
                <span data-i18n="customer_name">Name</span>
                <input type="text" id="cust-name" />
              </label>
              <label class="field">
                <span data-i18n="mobile">Mobile</span>
                <input type="text" id="cust-mobile" />
              </label>
              <label class="field">
                <span data-i18n="email">Email</span>
                <input type="text" id="cust-email" />
              </label>
              <label class="field">
                <span data-i18n="created_from">Created From</span>
                <input type="date" id="cust-from" />
              </label>
              <label class="field">
                <span data-i18n="created_to">Created To</span>
                <input type="date" id="cust-to" />
              </label>
            </div>
            <div class="filters-actions">
              <button type="button" class="btn btn-primary" id="cust-search-btn" data-i18n="apply_filters">Apply Filters</button>
              <button type="button" class="btn btn-secondary" id="cust-reset-btn" data-i18n="reset">Reset</button>
              <button type="button" class="btn btn-secondary" id="cust-columns-btn" data-i18n="columns">Columns</button>
              <button type="button" class="btn btn-secondary" id="cust-export-btn" data-i18n="export_csv">Export CSV</button>
            </div>
          </div>

          <div id="column-picker" class="column-picker card hidden">
            <h4 data-i18n="visible_columns">Visible Columns</h4>
            <div class="column-checks" id="column-checks"></div>
          </div>

          <div class="stats-row">
            <div class="stat-card card">
              <div class="stat-label" data-i18n="total_patients">Total Patients</div>
              <div class="stat-value" id="stat-cust-total">—</div>
            </div>
            <div class="stat-card card">
              <div class="stat-label" data-i18n="page_rows">This Page</div>
              <div class="stat-value" id="stat-cust-page">—</div>
            </div>
          </div>

          <div class="card table-card">
            <div class="table-wrap">
              <table class="data-table" id="customer-table">
                <thead id="customer-thead"></thead>
                <tbody id="customer-tbody">
                  <tr class="empty-row"><td colspan="8" data-i18n="loading">Loading…</td></tr>
                </tbody>
              </table>
            </div>
            <div class="pager" id="customer-pager">
              <button type="button" class="btn btn-secondary btn-sm" id="cust-prev" disabled data-i18n="prev">Previous</button>
              <span class="pager-info" id="cust-page-info">1</span>
              <button type="button" class="btn btn-secondary btn-sm" id="cust-next" disabled data-i18n="next">Next</button>
            </div>
          </div>
        </section>
      </main>
    </div>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>
  </div>

  <script src="/js/i18n.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
