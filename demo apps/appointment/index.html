<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light" data-page="login">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Clinical Management & Healthcare Analytics Platform" />
  <title>ClinicPulse — Sign In</title>
  <script src="js/boot.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="page-login">
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <section id="login-screen" class="login-screen">
    <div class="login-bg" aria-hidden="true"></div>
    <div class="login-card">
      <div class="login-brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="40" height="40" rx="12" fill="currentColor" opacity="0.12"/>
            <path d="M12 20h16M20 12v16" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
            <circle cx="20" cy="20" r="11" stroke="currentColor" stroke-width="2"/>
          </svg>
        </div>
        <h1 class="brand-name" data-i18n="brand">ClinicPulse</h1>
        <p class="brand-tagline" data-i18n="login_tagline">Clinical Management & Healthcare Analytics</p>
      </div>

      <div class="login-toolbar">
        <button type="button" class="icon-btn" id="login-theme-btn" data-i18n-title="toggle_theme" title="Toggle theme">
          <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3a7 7 0 0 0 11.5 11.5z"/></svg>
        </button>
        <button type="button" class="lang-btn" id="login-lang-btn" aria-label="Language">EN</button>
      </div>

      <form id="login-form" class="login-form" autocomplete="on">
        <div id="login-step-credentials">
          <label class="field">
            <span data-i18n="username">Username / Email</span>
            <input type="text" id="login-username" name="username" autocomplete="username" required />
          </label>
          <label class="field">
            <span data-i18n="password">Password</span>
            <input type="password" id="login-password" name="password" autocomplete="current-password" required />
          </label>
        </div>

        <div id="login-step-otp" class="hidden">
          <p class="otp-hint" id="otp-message" data-i18n="otp_hint">Enter the OTP sent to your email.</p>
          <label class="field">
            <span data-i18n="otp_code">OTP Code</span>
            <input type="text" id="login-otp" name="otp" inputmode="numeric" maxlength="8" autocomplete="one-time-code" />
          </label>
        </div>

        <p id="login-error" class="form-error hidden" role="alert"></p>

        <button type="submit" class="btn btn-primary btn-block" id="login-submit">
          <span class="btn-label" data-i18n="sign_in">Sign In</span>
          <span class="btn-spinner hidden" aria-hidden="true"></span>
        </button>
        <button type="button" class="btn btn-ghost btn-block hidden" id="login-back-btn" data-i18n="back">Back</button>
      </form>
    </div>
  </section>

  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
