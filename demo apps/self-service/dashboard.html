<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biz1 — Customer Portal</title>
<script src="assets/theme-boot.js"></script>
<link rel="stylesheet" href="assets/style.css?v=ss-30">
<script src="assets/config.js?v=ss-30"></script>
<script src="assets/biz1-sdk.js?v=ss-30"></script>
<script src="assets/biz1-app.js?v=ss-30"></script>
</head>
<body data-page="dashboard">
<div class="page-wrap" id="appShell">
  <div class="app-frame">

    <div id="screenDash" class="screen">

      <!-- ── UNIFIED HEADER ── -->
      <header class="topbar">
        <div class="brand">
          <div class="logo" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 7.5 12 4l7 3.5v9L12 20l-7-3.5z"/>
              <pat h d="m5 7.5 7 4 7-4M12 11.5V20"/>
            </svg>
          </div>
          <div>Biz1 <small>Customer Portal</small></div>
        </div>

        <div class="top-actions">
          <span id="liveSocketChip" class="live-socket-chip live-off" role="status" aria-live="polite" title="Connection status">
            <span class="live-dot" aria-hidden="true"></span>
            <span data-live-label>Offline</span>
          </span>

          <div class="lang-switch" role="group" aria-label="Language">
            <button type="button" class="lang-btn" data-lang="en">EN</button>
            <button type="button" class="lang-btn" data-lang="he">עב</button>
          </div>

          <button type="button" id="btnLogout" class="btn-logout-top" data-i18n="logout">Log out</button>

          <button type="button" class="icon-button theme-toggle" data-theme-toggle aria-label="Toggle theme" title="Light / Dark">
            <svg class="icon-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <circle cx="12" cy="12" r="4"/>
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
            </svg>
            <svg class="icon-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/>
            </svg>
          </button>

          <button type="button" id="btnRefreshDash" class="icon-button" title="Refresh" aria-label="Refresh">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12a9 9 0 1 1-2.6-6.3"/>
              <path d="M21 3v6h-6"/>
            </svg>
          </button>
        </div>
      </header>

      <!-- ── SCROLLABLE CONTENT ── -->
      <div class="dc-scroll dash-scroll">

        <!-- ── HERO ── -->
        <div class="dash-hero">
          <div class="dash-hello" data-i18n="hello">Hello</div>
          <div id="custName" class="dash-name">—</div>
          <div id="custMeta" class="dash-meta"></div>
        </div>

        <!-- Service Status -->
        <div style="padding: 16px 14px 8px;">
          <div id="statusCard" class="status-panel card" style="justify-content: space-between;">
            <div style="display:flex;align-items:center;gap:12px;">
              <div class="status-dot"></div>
              <div>
                <div id="statusLabel" class="status-label" data-i18n="statusLoading">Loading…</div>
                <div id="statusSub" class="status-sub"></div>
              </div>
            </div>
            <button type="button" id="btnCreate" style="
              display:inline-flex;align-items:center;gap:6px;
              background:linear-gradient(135deg,var(--brand),var(--accent));
              color:#fff;border:none;border-radius:10px;
              padding:8px 16px;font-family:'Outfit',sans-serif;
              font-size:12px;font-weight:700;cursor:pointer;
              box-shadow:0 4px 14px rgba(37,99,235,0.35);
              transition:transform 0.2s ease,box-shadow 0.2s ease;
              flex-shrink:0;
            "
            onmouseover="this.style.transform='translateY(-1px)';this.style.boxShadow='0 6px 18px rgba(37,99,235,0.45)'"
            onmouseout="this.style.transform='translateY(0)';this.style.boxShadow='0 4px 14px rgba(37,99,235,0.35)'">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                <path d="M12 5v14M5 12h14"/>
              </svg>
              <span data-i18n="createBtn">Create</span>
            </button>
          </div>
        </div>

        <!-- ── TWO COLUMN LAYOUT ── -->
        <div class="dash-two-col">

        <!-- ── PENDING SECTION ── -->
        <div class="dash-section" style="background:var(--glass-bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--glass-border);border-radius:20px;padding:16px;">
          <div class="dash-section-head">
            <div class="dash-section-title">
              <div class="dash-section-icon pending-icon">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                </svg>
              </div>
              <span data-i18n="actionsTitle">Pending actions</span>
              <div id="pendingBadge" class="dash-badge pending-badge" style="display:none;">0</div>
            </div>
            <div class="dash-filter-wrap">
              <select id="pendingFilterSelect" class="dash-filter-select" aria-label="Filter pending actions">
                <option value="all" data-i18n="filterAll">All</option>
                <option value="invoice" data-i18n="filterInvoice">Invoice</option>
                <option value="sign" data-i18n="filterSign">Sign</option>
              </select>
              <svg class="dash-filter-arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
            </div>
          </div>

          <!-- Pending list -->
          <div id="actionsList" class="actions-list">
            <div class="loading-msg" data-i18n="loadingDash">Loading documents…</div>
          </div>
          <div id="pendingPager" class="list-pager hidden" aria-label="Pending pagination"></div>
        </div>

        <!-- ── COMPLETED SECTION ── -->
        <div class="dash-section" style="background:var(--glass-bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--glass-border);border-radius:20px;padding:16px;">
          <div class="dash-section-head">
            <div class="dash-section-title">
              <div class="dash-section-icon done-icon">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 22c5.52 0 10-4.48 10-10S17.52 2 12 2 2 6.48 2 12s4.48 10 10 10z"/><path d="m9 12 2 2 4-4"/>
                </svg>
              </div>
              <span data-i18n="doneTitle">Completed</span>
            </div>
            <div class="dash-filter-wrap">
              <select id="doneFilterSelect" class="dash-filter-select" aria-label="Filter completed items">
                <option value="all" data-i18n="filterAll">All</option>
                <option value="invoice" data-i18n="filterInvoice">Invoice</option>
                <option value="sign" data-i18n="filterSign">Sign</option>
              </select>
              <svg class="dash-filter-arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
            </div>
          </div>

          <!-- Completed list -->
          <div id="doneList" class="actions-list done-list" style="gap:6px;"></div>
          <div id="donePager" class="list-pager hidden" aria-label="Completed pagination"></div>
        </div>

        </div><!-- /dash-two-col -->

        <!-- Error box -->
        <div id="dashError" class="error-box hidden" style="margin: 0 14px 16px;">
          <div id="dashErrorText" class="error-text"></div>
          <button type="button" id="btnRetryDash" class="btn-ghost" data-i18n="retry">Retry</button>
        </div>

      </div><!-- /dc-scroll -->
    </div><!-- /screenDash -->

  </div>
</div>

<!-- Create Document Modal — fields follow Documents.Add help -->
<div id="modalCreate" class="modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:9999;align-items:center;justify-content:center;opacity:0;transition:opacity 0.3s ease;">
  <div class="modal-content glass-card" style="width:92%;max-width:520px;max-height:90vh;overflow:auto;padding:24px;border-radius:24px;position:relative;transform:translateY(20px);transition:transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);background:var(--bg-card-solid);">
    <button type="button" id="btnCloseCreate" aria-label="Close" style="position:absolute;right:20px;top:20px;background:none;border:none;color:var(--text-muted);font-size:24px;line-height:1;cursor:pointer;padding:4px;transition:color 0.2s;">&times;</button>
    <div style="font-size:20px;font-weight:700;margin-bottom:6px;color:var(--text);">Create Document</div>
    <div style="font-size:13px;color:var(--text-muted);margin-bottom:20px;">Documents.Add — choose type and fill the fields for that document.</div>

    <div style="margin-bottom:14px;">
      <label for="createDocType" style="display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text);">Document type</label>
      <select id="createDocType" style="width:100%;box-sizing:border-box;background:var(--bg-page);border:1px solid var(--glass-border);color:var(--text);border-radius:12px;padding:12px 14px;font-family:'Outfit',sans-serif;font-size:14px;outline:none;cursor:pointer;">
        <option value="invoice">Invoice</option>
        <option value="credit_invoice">Credit invoice</option>
        <option value="proforma_invoice">Proforma invoice</option>
        <option value="receipt">Receipt</option>
        <option value="receipt_partly_paid">Receipt partly paid</option>
        <option value="receipt_tax_invoice">Receipt tax invoice</option>
        <option value="gi_ir">GI / IR</option>
        <option value="order_proposals">Order proposals</option>
        <option value="purchase_orders">Purchase orders</option>
        <option value="delivery_invoice">Delivery invoice</option>
        <option value="organization_receipt">Organization receipt</option>
      </select>
    </div>

    <div id="createItemFields">
      <div style="margin-bottom:14px;">
        <label for="createItemName" style="display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text);">Item name</label>
        <input type="text" id="createItemName" placeholder="e.g. Consulting Services" style="width:100%;box-sizing:border-box;background:var(--bg-page);border:1px solid var(--glass-border);color:var(--text);border-radius:12px;padding:12px 14px;font-family:'Outfit',sans-serif;font-size:14px;outline:none;">
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;">
        <div>
          <label for="createItemQty" style="display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text);">Quantity</label>
          <input type="number" id="createItemQty" value="1" min="1" style="width:100%;box-sizing:border-box;background:var(--bg-page);border:1px solid var(--glass-border);color:var(--text);border-radius:12px;padding:12px 14px;font-family:'Outfit',sans-serif;font-size:14px;outline:none;">
        </div>
        <div>
          <label for="createItemPrice" style="display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text);">Price (₪)</label>
          <input type="number" id="createItemPrice" placeholder="0.00" min="0" step="0.01" style="width:100%;box-sizing:border-box;background:var(--bg-page);border:1px solid var(--glass-border);color:var(--text);border-radius:12px;padding:12px 14px;font-family:'Outfit',sans-serif;font-size:14px;outline:none;">
        </div>
      </div>
    </div>

    <div id="createProposalFields" class="hidden" style="margin-bottom:14px;">
      <label for="createProposalTitle" style="display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text);">Proposal title</label>
      <input type="text" id="createProposalTitle" placeholder="Website project" style="width:100%;box-sizing:border-box;background:var(--bg-page);border:1px solid var(--glass-border);color:var(--text);border-radius:12px;padding:12px 14px;font-family:'Outfit',sans-serif;font-size:14px;outline:none;">
    </div>

    <div id="createDeliveryFields" class="hidden" style="margin-bottom:14px;">
      <label for="createDeliveryType" style="display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text);">Delivery type</label>
      <select id="createDeliveryType" style="width:100%;box-sizing:border-box;background:var(--bg-page);border:1px solid var(--glass-border);color:var(--text);border-radius:12px;padding:12px 14px;font-family:'Outfit',sans-serif;font-size:14px;outline:none;cursor:pointer;">
        <option value="delivery">Delivery</option>
        <option value="return">Return</option>
      </select>
    </div>

    <div id="createRelatedFields" class="hidden" style="margin-bottom:14px;">
      <label for="createRelatedDocId" style="display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text);">Related document ID</label>
      <input type="text" id="createRelatedDocId" placeholder="Existing document id to credit/link" style="width:100%;box-sizing:border-box;background:var(--bg-page);border:1px solid var(--glass-border);color:var(--text);border-radius:12px;padding:12px 14px;font-family:'Outfit',sans-serif;font-size:14px;outline:none;">
    </div>

    <div id="createPayDocFields" class="hidden" style="margin-bottom:14px;">
      <label for="createDocumentToPay" style="display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text);">Document to pay</label>
      <input type="text" id="createDocumentToPay" placeholder="Invoice/order id to mark paid" style="width:100%;box-sizing:border-box;background:var(--bg-page);border:1px solid var(--glass-border);color:var(--text);border-radius:12px;padding:12px 14px;font-family:'Outfit',sans-serif;font-size:14px;outline:none;">
    </div>

    <div id="createReceiptFields" class="hidden">
      <div style="margin-bottom:14px;">
        <label for="createPaymentMethod" style="display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text);">Payment method</label>
        <select id="createPaymentMethod" style="width:100%;box-sizing:border-box;background:var(--bg-page);border:1px solid var(--glass-border);color:var(--text);border-radius:12px;padding:12px 14px;font-family:'Outfit',sans-serif;font-size:14px;outline:none;cursor:pointer;">
          <option value="cash">Cash</option>
          <option value="cc">Credit card</option>
          <option value="check">Check</option>
          <option value="transference">Transfer</option>
          <option value="masav">Masav</option>
          <option value="bit">Bit</option>
          <option value="payby_credit">Pay by credit</option>
          <option value="others">Other</option>
        </select>
      </div>
      <div id="createOtherPayOpt" class="hidden" style="margin-bottom:14px;">
        <label for="createOtherPaymentOption" style="display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text);">Other payment option</label>
        <input type="text" id="createOtherPaymentOption" placeholder="Required when payment_method=others" style="width:100%;box-sizing:border-box;background:var(--bg-page);border:1px solid var(--glass-border);color:var(--text);border-radius:12px;padding:12px 14px;font-family:'Outfit',sans-serif;font-size:14px;outline:none;">
      </div>
      <div style="margin-bottom:14px;">
        <label for="createReceiptAmount" style="display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text);">Amount</label>
        <input type="number" id="createReceiptAmount" placeholder="0.00" min="0" step="0.01" style="width:100%;box-sizing:border-box;background:var(--bg-page);border:1px solid var(--glass-border);color:var(--text);border-radius:12px;padding:12px 14px;font-family:'Outfit',sans-serif;font-size:14px;outline:none;">
      </div>
    </div>

    <div style="margin-bottom:14px;">
      <label for="createNote" style="display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text);">Note</label>
      <textarea id="createNote" rows="2" placeholder="Optional document note" style="width:100%;box-sizing:border-box;background:var(--bg-page);border:1px solid var(--glass-border);color:var(--text);border-radius:12px;padding:12px 14px;font-family:'Outfit',sans-serif;font-size:14px;outline:none;resize:vertical;"></textarea>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;">
      <div>
        <label for="createDocLang" style="display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text);">Language</label>
        <select id="createDocLang" style="width:100%;box-sizing:border-box;background:var(--bg-page);border:1px solid var(--glass-border);color:var(--text);border-radius:12px;padding:12px 14px;font-family:'Outfit',sans-serif;font-size:14px;outline:none;cursor:pointer;">
          <option value="he">Hebrew</option>
          <option value="en">English</option>
        </select>
      </div>
      <!-- <div style="display:flex;align-items:flex-end;padding-bottom:10px;">
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--text);cursor:pointer;">
          <input type="checkbox" id="createSaveDraft" style="width:16px;height:16px;">
          Save as draft
        </label>
      </div> -->
    </div>

    <div id="createError" class="error-box hidden" style="margin-bottom:16px;"></div>

    <button type="button" id="btnSubmitCreate" style="width:100%;background:linear-gradient(135deg,var(--brand),var(--accent));color:#fff;border:none;border-radius:12px;padding:14px;font-family:'Outfit',sans-serif;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(37,99,235,0.35);display:flex;align-items:center;justify-content:center;gap:8px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Create Document
    </button>
  </div>
</div>

<script src="assets/app.js?v=ss-30"></script>
</body>
</html>
