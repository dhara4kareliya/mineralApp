<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Customer Portal</title>
  <script src="js/config.js?v=202608151306"></script>
  <script src="js/auth.js?v=202608151306"></script>
  <script>
    // Default light theme before paint
    document.documentElement.setAttribute('data-theme', localStorage.getItem('cp_theme') || 'light');
    var lang = localStorage.getItem('cp_lang') === 'he' ? 'he' : 'en';
    document.documentElement.setAttribute('lang', lang);
    document.documentElement.setAttribute('dir', lang === 'he' ? 'rtl' : 'ltr');
    if (Auth.isLoggedIn()) {
      location.replace('pages/dashboard.html');
    } else {
      location.replace('pages/login.html');
    }
  </script>
</head>
<body>
  <p style="font-family:sans-serif;padding:2rem;text-align:center" data-i18n="redirecting">Redirecting…</p>
  <script src="js/i18n.js?v=202608151306"></script>
  <script>I18n.init();</script>
</body>
</html>
