<!DOCTYPE html>
<html lang="en" dir="ltr" data-i18n-title="page_login_title">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biz1 Showcase</title>
<script>
(function(){try{var t=localStorage.getItem('biz1fs_theme');if(t!=='dark'&&t!=='light'){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','light');}})();
(function(){try{var l=localStorage.getItem('biz1fs_lang');if(l!=='he'&&l!=='en')l='en';document.documentElement.lang=l==='he'?'he':'en';document.documentElement.dir=l==='he'?'rtl':'ltr';}catch(e){}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./assets/css/app.css?v=20260730">
<script src="./assets/config.js?v=20260730"></script>
<script>
(function () {
  var user = (window.Biz1Config && Biz1Config.user) || 'demo';
  user = String(user).trim().toLowerCase()
    .replace(/^https?:\/\//, '')
    .replace(/\.bull36\.com.*$/i, '')
    .replace(/[^a-z0-9-]/g, '');
  if (user) {
    document.write('<script src="https://' + user + '.bull36.com/app/sdk/biz1-sdk.js"><\/script>');
  }
})();
</script>
<script src="./assets/js/app.js?v=20260811"></script>
</head>
<body>
<div id="appRoot" dir="ltr" class="page-wrap">
  <div class="phone-outer">

    <!-- LOGIN -->
    <div class="phone-inner app-view login-screen" data-view="login">
      <div class="lang-bar login-status-bar">
        <div class="lang-bar-left">
          <span style="font-size:11px;font-weight:600;color:rgba(255,255,255,.55);" data-i18n="lang_label">Language</span>
          <div class="lang-switch">
            <button type="button" data-set-lang="en">EN</button>
            <button type="button" data-set-lang="he">עב</button>
          </div>
        </div>
        <div class="lang-bar-right">
          <button type="button" class="theme-toggle" data-theme-toggle data-i18n-title="toggle_theme" title="Light / Dark mode">
            <svg class="icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/></svg>
          </button>
        </div>
      </div>

      <div class="brand-hero">
        <div class="brand-blob brand-blob--tr"></div>
        <div class="brand-blob brand-blob--bl"></div>
        <div class="brand-icon">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#9cc3ec" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/></svg>
        </div>
        <div class="brand-title" data-i18n="brand">Biz1 Showcase</div>
        <div class="brand-sub" data-i18n="login_subtitle">Calendar · Loyalty · Front desk</div>
      </div>

      <div class="dc-scroll login-scroll">
        <form id="loginForm" class="login-card">
          <div class="login-title" data-i18n="account_login">Sign in to your account</div>
          <div id="errorBox" class="error-box hidden">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c0392b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;margin-top:1px;"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
            <div id="errorText" class="error-text"></div>
          </div>

          <div id="usernameWrap" class="field">
            <label for="username" class="field-label">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9aa3b0" stroke-width="1.9"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.5 3-5.5 7-5.5s7 2 7 5.5"/></svg>
              <span data-i18n="email_label">Email / Username / Phone / ID</span> <span class="req">*</span>
            </label>
            <input id="username" class="ds-input input" type="text" autocomplete="username" data-i18n-placeholder="email_placeholder" placeholder="email, username, phone or ID" required>
          </div>

          <div id="passwordWrap" class="field field--tight">
            <label for="password" class="field-label">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9aa3b0" stroke-width="1.9"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
              <span data-i18n="password_label">Password</span> <span class="req">*</span>
            </label>
            <div class="pass-wrap">
              <input id="password" class="ds-input input input--pass" type="password" autocomplete="current-password" data-i18n-placeholder="password_placeholder" placeholder="Enter password" required>
              <button type="button" id="togglePassword" class="pass-toggle" data-i18n-aria="toggle_password" aria-label="Show or hide password">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>

          <div id="otpWrap" class="field field--tight hidden">
            <label for="otp" class="field-label">
              <span data-i18n="otp_label">Verification code (OTP)</span> <span class="req">*</span>
            </label>
            <input id="otp" class="ds-input input input--otp" type="text" inputmode="numeric" autocomplete="one-time-code" data-i18n-placeholder="otp_placeholder" placeholder="Enter verification code">
            <div class="otp-resend">
              <button type="button" id="resendOtpBtn" class="btn-ghost" style="padding:8px 14px;font-size:12.5px;">
                <span id="resendOtpText" data-i18n="resend_otp">Resend OTP</span>
              </button>
            </div>
          </div>

          <div id="loginOptions" class="login-row">
            <label class="remember">
              <input id="remember" type="checkbox">
              <span data-i18n="remember_me">Remember me</span>
            </label>
            <span class="biz1-tag">Biz1</span>
          </div>

          <button type="submit" id="loginBtn" class="btn btn-primary btn-login">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="m10 17 5-5-5-5"/><path d="M15 12H3"/></svg>
            <span id="loginBtnText" data-i18n="login_btn">Sign in</span>
          </button>
        </form>

        <div class="footer-note" data-i18n="footer_crm">Biz1 Showcase</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
