<!DOCTYPE html>

<html>
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<script>document.write('<script src="./asset-version.js?_='+Date.now()+'"><\/script>');</script>
<script>
mbScripts([
  './support.js',
  './biz1-sdk.js',
  './biz1-app.js',
  './page-boot.js',
  './live-sync.js',
  './i18n-translations.js',
  './common-header-footer.js'
]);
mbCss('./common.css');
</script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; direction: rtl; font-family: 'Heebo', sans-serif; -webkit-font-smoothing: antialiased; }
  button, a { font-family: 'Heebo', sans-serif; }
  .dc-scroll::-webkit-scrollbar { width: 0; }
</style>
</helmet>
<div style="min-height:100vh; background:#e6e8ec; display:flex; align-items:flex-start; justify-content:center; padding:26px 16px;">
<div style="width:392px; max-width:100%; background:#0f1828; border-radius:34px; padding:9px; box-shadow:0 24px 60px rgba(15,24,40,.34);">
<div data-screen-label="Signature alert" style="background:#eef0f3; border-radius:26px; overflow:hidden; position:relative; height:812px; display:flex; flex-direction:column;">

<!-- navy hero -->
<div style="background:radial-gradient(120% 90% at 50% 26%, #163a66 0%, #102a4d 42%, #0c2042 100%); padding:8px 18px 30px; flex:none; color:#fff; position:relative;">
<!-- header: back button only (depth screen, no nav bar) -->
<div style="display:flex; align-items:center; justify-content:flex-start; min-height:38px;">
<a aria-label="חזרה" href="{{ backUrl }}" style="width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.08); text-decoration:none;">
<svg fill="none" height="22" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewbox="0 0 24 24" width="22"><path d="M19 12H5"></path><path d="m12 19-7-7 7-7"></path></svg>
</a>
</div>
<div style="text-align:center; padding:6px 4px 0;">
<div style="width:108px; height:108px; border-radius:50%; background:radial-gradient(circle at 50% 38%, #25b07a 0%, #189163 60%, #137a53 100%); margin:0 auto 26px; display:flex; align-items:center; justify-content:center; box-shadow:0 0 0 1px rgba(37,176,122,.35), 0 14px 38px rgba(20,140,90,.45), 0 0 60px rgba(37,176,122,.4);">
<svg fill="none" height="50" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.1" viewbox="0 0 24 24" width="50"><path d="M3 13c2.5 0 2.5-4 5-4s2.5 4 5 4 2.5-4 5-4"></path><path d="M4 18h16"></path></svg>
</div>
<div style="font-size:28px; font-weight:800; line-height:1.12;">{{ name }} signed! 🎉</div>
<div style="font-size:15px; color:rgba(255,255,255,.82); margin-top:14px; line-height:1.6;">
            Quote #{{ quoteNum }} approved<br/>
            Now we continue with the collection
          </div>
</div>
</div>
<div class="dc-scroll" style="flex:1; overflow-y:auto; padding:20px 16px 18px;">
<!-- customer card -->
<div style="background:#f4f6f8; border:1px solid #e7eaee; border-right:4px solid #1f9d6b; border-radius:18px; padding:18px 18px 16px; margin-bottom:18px;">
<div style="font-size:18px; font-weight:800; color:#1f2a3a; text-align:left;">{{ name }}</div>
<div style="font-size:14px; color:#7b8595; font-weight:600; margin-top:6px; text-align:left;">{{ phone }} · {{ city }} · Signed {{ signedTime }}</div>

<sc-for as="item" list="{{ products }}">
<div style="display:flex; align-items:center; gap:8px; margin-top:9px; justify-content:flex-start;">
<sc-if value="{{ item.isDroplet }}">
<svg fill="none" height="17" stroke="#1f9d6b" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" style="flex:none;" viewbox="0 0 24 24" width="17"><path d="M12 2.5C9 7 5.5 10.2 5.5 14a6.5 6.5 0 0 0 13 0c0-3.8-3.5-7-6.5-11.5z"></path></svg>
</sc-if>
<sc-if value="{{ item.isShield }}">
<svg fill="none" height="17" stroke="#1f9d6b" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" style="flex:none;" viewbox="0 0 24 24" width="17"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
</sc-if>
<sc-if value="{{ item.isGeneric }}">
<svg fill="none" height="17" stroke="#1f9d6b" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" style="flex:none;" viewbox="0 0 24 24" width="17"><circle cx="12" cy="12" r="10"></circle><path d="m9 12 2 2 4-4"></path></svg>
</sc-if>
<span style="font-size:14.5px; font-weight:700; color:#1f2a3a;">{{ item.name }}</span>
</div>
</sc-for>

<div style="font-size:22px; font-weight:800; color:#1f9d6b; margin-top:15px; text-align:left;">{{ totalPayable }}</div>
</div>
<!-- primary action: continue to billing -->
<a href="{{ orderFormUrl }}" style="display:flex; align-items:center; gap:12px; background:#1d60a2; border:none; border-radius:16px; padding:16px 16px; margin-bottom:12px; text-decoration:none; box-shadow:0 8px 20px rgba(29,96,162,.26);">
<svg fill="none" height="22" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9" style="flex:none;" viewbox="0 0 24 24" width="22"><rect height="4" rx="1" width="8" x="8" y="2"></rect><path d="M9 4H6a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-3"></path><path d="M9 12h6M9 16h4"></path></svg>
<span style="flex:1; text-align:center;">
<span style="display:block; font-size:16.5px; font-weight:800; color:#fff;">Open an order form and charge it</span>
<span style="display:block; font-size:12.5px; font-weight:600; color:rgba(255,255,255,.82); margin-top:2px;">Continues to bill the customer</span>
</span>
<svg fill="none" height="20" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" style="flex:none;" viewbox="0 0 24 24" width="20"><path d="m9 18 6-6-6-6"></path></svg>
</a>
<!-- secondary action: customer card -->
<a href="{{ customerCardUrl }}" style="display:flex; align-items:center; gap:12px; background:#fff; border:1px solid #e2e6ea; border-radius:16px; padding:16px 16px; text-decoration:none;">
<svg fill="none" height="22" stroke="#7b8595" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" style="flex:none;" viewbox="0 0 24 24" width="22"><circle cx="12" cy="8" r="3.4"></circle><path d="M5.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"></path></svg>
<span style="flex:1; text-align:center;">
<span style="display:block; font-size:16.5px; font-weight:800; color:#1f2a3a;">Go to customer card</span>
<span style="display:block; font-size:12.5px; font-weight:600; color:#9aa3b0; margin-top:2px;">View the full details</span>
</span>
<svg fill="none" height="20" stroke="#9aa3b0" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" style="flex:none;" viewbox="0 0 24 24" width="20"><path d="m9 18 6-6-6-6"></path></svg>
</a>
</div>
</div>
</div>
</div>
</x-dc>
<script data-dc-script="" data-props='{"$preview": {"width": 424, "height": 880}}' type="text/x-dc">
class Component extends DCLogic {
  state = {
    name: '',
    phone: '',
    city: '',
    signedTime: '',
    quoteNum: '',
    documentId: '',
    totalPayable: '',
    backUrl: '',
    orderFormUrl: '',
    customerCardUrl: 'service-customer-card.html',
    collectionUrl: '',
    products: []
  };

  componentDidMount() {
    if (window.LiveSync && typeof LiveSync.bind === 'function') {
      LiveSync.bind(() => { var soft = { silent: true }; if (typeof this.initData === 'function') this.initData(soft); else if (typeof this.load === 'function') this.load(soft); }, { retries: true, keys: /ticket|mission|task|customer|lead|product|socket\.nudge/i, delay: 500 });
    }

    this.initData();
    window.addEventListener('mineralbar:ready', () => this.initData({ silent: true }));
    if (window.MineralBarApp && MineralBarApp.bindLiveReload) {
      MineralBarApp.bindLiveReload(() => this.initData({ silent: true }), { keys: /product|customer|ticket|socket\.nudge/i, delay: 600 });
    }
  }

  getCustomerId() {
    var p = new URLSearchParams(window.location.search);
    var id = p.get('customer_id') || p.get('cust_id') || p.get('contactus_id') ||
      p.get('lead_id') || p.get('id') || '';
    if (!id && window.location.hash) {
      var h = new URLSearchParams(String(window.location.hash || '').replace(/^#/, ''));
      id = h.get('customer_id') || h.get('cust_id') || h.get('id') || '';
    }
    if (!id) {
      var m = String(window.location.href || '').match(/[?&#](?:customer_id|cust_id|contactus_id|lead_id)=([^&#]+)/i);
      if (m && m[1]) {
        try { id = decodeURIComponent(m[1]); } catch (e) { id = m[1]; }
      }
    }
    if (!id) {
      try { id = sessionStorage.getItem('mb_customer_id') || localStorage.getItem('mb_customer_id') || ''; } catch (e2) { /* ignore */ }
    }
    if (id === '0' || id === 'null' || id === 'undefined') id = '';
    return String(id || '').trim();
  }

  async autoUpdateProposalApproved(customerId) {
    if (!customerId || !window.MineralBarApp) return;
    if (this._statusUpdated || this._isUpdatingStatus) return;
    var sessionKey = 'mb_proposal_approved_updated:' + customerId;
    try {
      if (sessionStorage.getItem(sessionKey)) {
        this._statusUpdated = true;
        return;
      }
    } catch (e) { /* ignore */ }

    this._isUpdatingStatus = true;
    try {
      var client = (typeof MineralBarApp.getClient === 'function') ? MineralBarApp.getClient() : null;
      if (!client || typeof client.request !== 'function') return;

      // Check current customer status first to avoid redundant status write
      try {
        if (typeof MineralBarApp.getCustomer === 'function') {
          var custRes = await MineralBarApp.getCustomer(customerId);
          var c = (custRes && (custRes.customer || custRes.data)) || {};
          if (c.data && typeof c.data === 'object') c = c.data;
          var curStatus = String(c.status || c.status_id || c.sub_list_data || '');
          if (curStatus === '10194') {
            this._statusUpdated = true;
            try { sessionStorage.setItem(sessionKey, '1'); } catch (e) {}
            return;
          }
        }
      } catch (eCheck) { /* continue */ }

      var hasInvoice = false;
      try {
        var docsRes = await client.request('Documents.List', { customer_id: customerId, cust_id: customerId, limit: 10 });
        var docs = Array.isArray(docsRes) ? docsRes : ((docsRes && (docsRes.data || docsRes.output || docsRes.rows || docsRes)) || []);
        if (Array.isArray(docs)) {
          hasInvoice = docs.some(function(d) {
            var docType = String(d.type || d.document_type || d.doc_type || d.type_name || '').toLowerCase();
            var docName = String(d.name || d.title || d.document_name || '').toLowerCase();
            return /invoice|חשבונית/i.test(docType) || /invoice|חשבונית/i.test(docName);
          });
        }
      } catch (eDocs) { /* continue */ }

      var colFolder = null;
      if (!hasInvoice && typeof MineralBarApp.getFolders === 'function') {
        try {
          var fRes = await MineralBarApp.getFolders();
          var fList = (fRes && (fRes.data || fRes.folders || fRes)) || [];
          if (Array.isArray(fList)) {
            for (var i = 0; i < fList.length; i++) {
              var fName = String(fList[i].name || fList[i].folder_name || fList[i].title || '').toLowerCase();
              if (/collect|גבי/i.test(fName)) {
                colFolder = fList[i].id || fList[i].folder_id;
                break;
              }
            }
          }
        } catch (eF) { /* ignore */ }
      }

      if (typeof MineralBarApp.updateCustomerStatus === 'function') {
        await MineralBarApp.updateCustomerStatus(customerId, '10194', 'הצעה אושרה', colFolder);
      } else {
        var editPayload = {
          customer_id: customerId,
          id: customerId,
          cust_id: customerId,
          status: '10194',
          status_id: '10194',
          sub_list_data: '10194',
          sub_list_data_name: 'הצעה אושרה'
        };
        if (colFolder) {
          editPayload.folder_id = colFolder;
        }
        await client.request('Customer.Edit', editPayload);
      }
      this._statusUpdated = true;
      try { sessionStorage.setItem(sessionKey, '1'); } catch (e) {}
    } catch (err) {
      console.warn('[signature-alert] autoUpdateProposalApproved error', err);
    } finally {
      this._isUpdatingStatus = false;
    }
  }

  async initData(soft) {
    if (this._initDataRunning) return;
    this._initDataRunning = true;
    try {
      var isSoft = !!(soft && (soft.silent || soft.soft));
      var q = new URLSearchParams(window.location.search);
      var customerId = this.getCustomerId();
      if (customerId && !isSoft && !this._statusUpdated) {
        this.autoUpdateProposalApproved(customerId);
      }
      var name = q.get('name') || '';
      var phone = q.get('phone') || '';
      var address = q.get('address') || '';
      var tz = q.get('tz') || '';
      var documentId = q.get('document_id') || q.get('doc_id') || '';
      var quoteNum = q.get('quote_num') || q.get('quoteNum') || (documentId ? ('QT-' + documentId) : 'QT-0041');
      var productIdsStr = q.get('product_ids') || '';
      if (!productIdsStr) {
        if (window.MineralBarApp && typeof MineralBarApp.getSelectedProductIds === 'function') {
          productIdsStr = MineralBarApp.getSelectedProductIds(customerId) || '';
        } else {
          try {
            productIdsStr = sessionStorage.getItem('mb_selected_product_ids') || localStorage.getItem('mb_selected_product_ids') || '';
          } catch (eIds) { productIdsStr = ''; }
        }
      }
      var discount = Number(q.get('discount') || 0);

      var passedAmount = Number(q.get('amount') || q.get('total') || q.get('final_amount') || 0);
      if (!passedAmount) {
        try {
          var stAmt = (customerId ? sessionStorage.getItem('mb_quote_amount:' + customerId) : null) ||
            sessionStorage.getItem('mb_quote_amount') ||
            sessionStorage.getItem('mb_collection_amount');
          if (stAmt) passedAmount = Number(stAmt) || 0;
        } catch (eA) { /* ignore */ }
      }

      var quoteTotals = null;
      try {
        var tRaw = (customerId ? sessionStorage.getItem('mb_quote_totals:' + customerId) : null) ||
          sessionStorage.getItem('mb_quote_totals');
        if (tRaw) quoteTotals = JSON.parse(tRaw);
      } catch (eT) { quoteTotals = null; }

      var productsFromParam = [];
      try {
        var rawP = q.get('products_json');
        if (rawP) productsFromParam = JSON.parse(rawP);
      } catch (ePr) { productsFromParam = []; }
      if (!productsFromParam || !productsFromParam.length) {
        try {
          var storedP = (customerId ? sessionStorage.getItem('mb_quote_products:' + customerId) : null) ||
            sessionStorage.getItem('mb_quote_products');
          if (storedP) productsFromParam = JSON.parse(storedP);
        } catch (eSp) { productsFromParam = []; }
      }

      // If document ID is present, try reading items and amount from the quote document
      if (documentId && window.MineralBarApp && typeof MineralBarApp.getClient === 'function') {
        try {
          var clientDoc = MineralBarApp.getClient();
          var docPayload = { document_id: documentId, doc_id: documentId, id: documentId, customer_id: customerId };
          var docRes = null;
          try { docRes = await clientDoc.request('Documents.View', docPayload); }
          catch (eDv) { docRes = await clientDoc.request('Documents.Get', docPayload); }
          var docData = (docRes && (docRes.data || docRes.output || docRes)) || {};
          if (docData.final_amount && !passedAmount) {
            passedAmount = Number(docData.final_amount) || 0;
          }
          var docItems = docData.items || (docData.data && docData.data.items) || [];
          if (Array.isArray(docItems) && docItems.length && !productsFromParam.length) {
            productsFromParam = docItems.map(function(it, idx) {
              var pVal = Number(it.item_price || it.price || 0);
              var pDisc = Number(it.item_discount || it.discount || 0);
              return {
                id: String(it.iteeeem_id || it.item_id || it.product_id || it.id || ('doc-' + idx)),
                name: it.item_name || it.name || 'מוצר',
                priceNum: pVal,
                discountAmt: pDisc
              };
            });
          }
        } catch (eDoc) { /* ignore */ }
      }

      // Current formatted time for "Signed at"
      var now = new Date();
      var month = String(now.getMonth() + 1).padStart(2, '0');
      var day = String(now.getDate()).padStart(2, '0');
      var year = String(now.getFullYear()).slice(-2);
      var hours = now.getHours();
      var minutes = String(now.getMinutes()).padStart(2, '0');
      var ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12;
      hours = hours ? hours : 12;
      var formattedTime = month + '/' + day + '/' + year + ', ' + hours + ':' + minutes + ' ' + ampm;

      var stateUpdate = {
        signedTime: formattedTime,
        quoteNum: quoteNum,
        documentId: documentId
      };

      if (name) stateUpdate.name = name;
      if (phone) stateUpdate.phone = phone;
      if (address) {
        stateUpdate.city = address.split(',').pop().trim();
      }

      var params = new URLSearchParams(q.toString());
      if (customerId) {
        params.set('customer_id', customerId);
        params.set('cust_id', customerId);
      }
      if (documentId) params.set('document_id', documentId);
      if (productIdsStr) params.set('product_ids', productIdsStr);
      if (quoteNum) params.set('quote_num', quoteNum);
      if (passedAmount > 0) {
        params.set('amount', String(passedAmount));
        params.set('total', String(passedAmount));
      }
      var paramsStr = params.toString();

      stateUpdate.backUrl = 'final-quote.html' + (paramsStr ? ('?' + paramsStr) : '');
      stateUpdate.orderFormUrl = 'service-order-form.html' + (paramsStr ? ('?' + paramsStr) : '');
      stateUpdate.customerCardUrl = 'service-customer-card.html' + (customerId ? ('?customer_id=' + encodeURIComponent(customerId) + '&back=' + encodeURIComponent(stateUpdate.backUrl || 'final-quote.html')) : '');
      stateUpdate.collectionUrl = 'collection-payment.html' + (paramsStr ? ('?' + paramsStr) : '');

      this.setState(stateUpdate);

      // Load products list if needed
      var productsList = [];
      var needCatalog = (!productsFromParam || !productsFromParam.length) && (!this.state.products || !this.state.products.length || !isSoft);
      if (needCatalog && window.MineralBarApp && typeof MineralBarApp.getClient === 'function') {
        try {
          var client = MineralBarApp.getClient();
          var res = await client.request('Products.List', { limit: 200 });
          var data = res && (res.data || res.output || res);
          if (Array.isArray(data) && data.length > 0) {
            productsList = data.map(function(item) {
              var isDroplet = /filter|سائل|סנן|מים/i.test(item.product_name || item.name || '');
              var isShield = /insurance|coverage|ביטוח|אחריות/i.test(item.product_name || item.name || '');
              var rawPrice = item.product_price != null ? item.product_price
                : (item.main_price != null ? item.main_price
                  : (item.sale_price != null ? item.sale_price
                    : (item.price != null ? item.price
                      : (item.cost != null ? item.cost
                        : (item.item_price != null ? item.item_price : null)))));
              var priceVal = Math.round(Number(rawPrice));
              if (!isFinite(priceVal) || priceVal < 0) priceVal = 0;
              var discountVal = Number(item.discount_price || item.discount || 0);
              var isPercent = Number(item.is_price_percent || 0) === 1;
              var discountAmt = isPercent ? Math.round(priceVal * (discountVal / 100)) : Math.round(discountVal);

              return {
                id: String(item.id || item.product_id || '').trim(),
                name: item.product_name || item.name || 'מוצר',
                priceNum: priceVal,
                discountAmt: discountAmt,
                isDroplet: isDroplet || (!isShield),
                isShield: isShield,
                isGeneric: !isDroplet && !isShield
              };
            });
          }
        } catch (err) {
          console.warn('[MineralBar] failed to fetch products list', err);
        }
      }

      var finalProducts = [];
      if (productsFromParam && productsFromParam.length > 0) {
        finalProducts = productsFromParam.map(function(p) {
          var isDroplet = /filter|سائل|סנן|מים/i.test(p.name || '');
          var isShield = /insurance|coverage|ביטוח|אחריות/i.test(p.name || '');
          var pVal = Number(p.priceNum != null ? p.priceNum : (p.price != null ? String(p.price).replace(/[^\d.]/g, '') : 0)) || 0;
          var dVal = Number(p.discountAmt != null ? p.discountAmt : (p.discountVal || 0)) || 0;
          return {
            id: String(p.id || '').trim(),
            name: p.name || 'מוצר',
            priceNum: pVal,
            discountAmt: dVal,
            isDroplet: p.isDroplet != null ? !!p.isDroplet : (isDroplet || !isShield),
            isShield: p.isShield != null ? !!p.isShield : isShield,
            isGeneric: p.isGeneric != null ? !!p.isGeneric : (!isDroplet && !isShield)
          };
        });
      } else if (productIdsStr) {
        var ids = String(productIdsStr).split(',').map(function (id) { return String(id || '').trim(); }).filter(Boolean);
        ids.forEach(function(productId) {
          var found = productsList.find(function(p) { return String(p.id).trim() === productId; });
          if (found) {
            finalProducts.push(JSON.parse(JSON.stringify(found)));
          }
        });
      }

      var subTotal = finalProducts.reduce((sum, p) => sum + (p.priceNum || 0), 0);
      var discountAmt = finalProducts.reduce((sum, p) => sum + (p.discountAmt || 0), 0);
      var beforeVat = Math.max(0, subTotal - discountAmt - (Number(discount) || 0));
      var vatAmt = Math.round(beforeVat * 0.18);
      var totalPayableVal = beforeVat + vatAmt;

      if (totalPayableVal === 0 && passedAmount > 0) {
        totalPayableVal = passedAmount;
        beforeVat = quoteTotals && quoteTotals.beforeVat ? quoteTotals.beforeVat : Math.round(passedAmount / 1.18);
        vatAmt = quoteTotals && quoteTotals.vatAmt ? quoteTotals.vatAmt : (passedAmount - beforeVat);
      }
      if (finalProducts.length === 0 && totalPayableVal > 0) {
        finalProducts = [{
          id: (productIdsStr ? productIdsStr.split(',')[0] : 'quote-1'),
          name: 'הצעה מאושרת #' + quoteNum,
          priceNum: beforeVat,
          discountAmt: discountAmt || 0,
          isDroplet: true,
          isShield: false,
          isGeneric: false
        }];
      }
      var totalPayable = totalPayableVal + ' ₪';

      try {
        sessionStorage.setItem('mb_collection_amount', String(totalPayableVal));
        localStorage.setItem('mb_collection_amount', String(totalPayableVal));
      } catch (eAmt) { /* ignore */ }

      var orderParams = new URLSearchParams(q.toString());
      if (customerId) {
        orderParams.set('customer_id', customerId);
        orderParams.set('cust_id', customerId);
      }
      if (documentId) orderParams.set('document_id', documentId);
      if (productIdsStr) orderParams.set('product_ids', productIdsStr);
      if (quoteNum) orderParams.set('quote_num', quoteNum);
      if (totalPayableVal > 0) {
        orderParams.set('amount', String(totalPayableVal));
        orderParams.set('total', String(totalPayableVal));
      }
      if (beforeVat > 0) orderParams.set('before_vat', String(beforeVat));
      if (vatAmt > 0) orderParams.set('vat', String(vatAmt));
      if (discountAmt > 0 || discount > 0) orderParams.set('discount', String(discountAmt || discount));
      if (finalProducts && finalProducts.length) {
        try {
          orderParams.set('products_json', JSON.stringify(finalProducts));
        } catch (ePj) { /* ignore */ }
      }
      var orderParamsStr = orderParams.toString();
      var orderFormUrl = 'service-order-form.html' + (orderParamsStr ? ('?' + orderParamsStr) : '');

      this.setState({
        products: finalProducts,
        totalPayable: totalPayable,
        orderFormUrl: orderFormUrl
      });

      // Load customer from API if id is available and not already loaded
      var needCustomer = (!this.state.name || !isSoft);
      if (needCustomer && customerId && window.MineralBarApp && typeof MineralBarApp.getCustomer === 'function') {
        try {
          var res2 = await MineralBarApp.getCustomer(customerId);
          var c = res2 && res2.customer;
          if (c) {
            if (c.data && typeof c.data === 'object' && (c.data.name || c.data.customer_id)) {
              c = c.data;
            }
            var fullAddress = c.address || '';
            var cityVal = c.city || c.city_name || 'Tel Aviv';
            this.setState({
              name: c.name || this.state.name || name || ('#' + customerId),
              phone: c.phone || c.mobile || this.state.phone || phone,
              city: cityVal
            });
          }
        } catch (err) {
          console.warn('[MineralBar] failed to fetch customer details', err);
        }
      }
    } catch (e) {
      console.error(e);
    } finally {
      this._initDataRunning = false;
    }
  }

  renderVals() {
    var s = this.state;
    return {
      name: s.name,
      phone: s.phone,
      city: s.city,
      signedTime: s.signedTime,
      quoteNum: s.quoteNum,
      totalPayable: s.totalPayable,
      backUrl: s.backUrl,
      orderFormUrl: s.orderFormUrl,
      customerCardUrl: s.customerCardUrl,
      collectionUrl: s.collectionUrl || s.orderFormUrl,
      products: s.products || []
    };
  }
}
</script>
</body>
</html>
