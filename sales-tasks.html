  <style>
    .tasks-filter-hbar {
      display: flex !important;
      flex-wrap: nowrap !important;
      gap: 8px;
      padding-bottom: 10px;
      margin-bottom: 14px;
      overflow-x: auto !important;
      overflow-y: hidden !important;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x;
      scrollbar-width: none;
      -ms-overflow-style: none;
      width: 100% !important;
      max-width: 100% !important;
      min-width: 0 !important;
      box-sizing: border-box;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
    }
    .tasks-filter-hbar::-webkit-scrollbar {
      width: 0 !important;
      height: 0 !important;
      display: none !important;
    }
    .tasks-filter-hbar > button,
    .tasks-filter-hbar .mb-filter-chip {
      flex: 0 0 auto !important;
      white-space: nowrap !important;
    }
  </style>
</head>
<body data-role="sales" data-active-tab="tasks">
  <div class="app-viewport">
    <div class="phone-container">
      <div class="screen-card">
        
       

        <!-- Task Detail Overlay (Hidden by default) -->
        <div id="task-detail-panel" style="display:none; position:absolute; inset:0; background:var(--bg-screen); z-index:50; flex-direction:column;">
          <div style="padding:14px 16px; border-bottom:1px solid var(--border-panel); display:flex; justify-content:space-between; align-items:center;">
            <h2 style="margin:0; font-size:16px; font-weight:800; color:var(--text-title);">Task Details</h2>
            <button id="close-task-panel" style="background:none; border:none; cursor:pointer; color:var(--text-sub);">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
          </div>
          <div id="task-detail-content" class="dc-scroll" style="flex:1; overflow-y:auto; padding:16px;">
            <!-- Content dynamically injected here -->
          </div>
        </div>

        <!-- Task Filter Overlay (Hidden by default) -->

          <div style="background:var(--bg-screen); border-radius:24px 24px 0 0; padding:16px; padding-bottom:32px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
              <h2 style="margin:0; font-size:18px; font-weight:800; color:var(--text-title);">Filter by status</h2>
              <button id="close-filter-panel" style="background:none; border:none; cursor:pointer; color:var(--text-sub);">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
              </button>
            </div>
            <div id="task-filter-options" style="display:flex; flex-direction:column; gap:8px;">
              
            </div>
          </div>
        </div> -->

        <!-- Scrollable Main Content -->
        <div class="dc-scroll" style="flex:1; overflow-y:auto; padding:2px 16px 18px;">
          
          <!-- Header Title & Filter Button -->
          <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">

            <div style="font-size:21px; font-weight:800; color:var(--text-title);">Tasks</div>
          </div>

          <!-- Filter Chips Bar -->
          <div id="mb-task-filter-chips" class="tasks-filter-hbar" style="display:flex; flex-wrap:nowrap; gap:8px; padding-bottom:10px; margin-bottom:14px; overflow-x:auto; overflow-y:hidden; width:100%; max-width:100%; min-width:0; box-sizing:border-box; cursor:grab; -webkit-overflow-scrolling:touch; touch-action:pan-x;">
            <button type="button" class="mb-filter-chip" data-type="show_all_together_tasks" style="flex:0 0 auto; padding:7px 15px; border-radius:99px; font-size:13px; font-weight:700; border:none; background:var(--color-primary); color:#fff; cursor:pointer; white-space:nowrap;">All</button>
            <button type="button" class="mb-filter-chip" data-type="today_tasks" style="flex:0 0 auto; padding:7px 15px; border-radius:99px; font-size:13px; font-weight:700; border:1px solid var(--border-panel); background:var(--bg-panel); color:var(--text-sub); cursor:pointer; white-space:nowrap;">Today</button>
            <button type="button" class="mb-filter-chip" data-type="priority_tasks" style="flex:0 0 auto; padding:7px 15px; border-radius:99px; font-size:13px; font-weight:700; border:1px solid var(--border-panel); background:var(--bg-panel); color:var(--text-sub); cursor:pointer; white-space:nowrap;">Priority</button>
            <button type="button" class="mb-filter-chip" data-type="upcoming_tasks" style="flex:0 0 auto; padding:7px 15px; border-radius:99px; font-size:13px; font-weight:700; border:1px solid var(--border-panel); background:var(--bg-panel); color:var(--text-sub); cursor:pointer; white-space:nowrap;">Upcoming</button>
            <button type="button" class="mb-filter-chip" data-type="done_tasks" style="flex:0 0 auto; padding:7px 15px; border-radius:99px; font-size:13px; font-weight:700; border:1px solid var(--border-panel); background:var(--bg-panel); color:var(--text-sub); cursor:pointer; white-space:nowrap;">Done</button>
            <button type="button" class="mb-filter-chip" data-type="private_tasks" style="flex:0 0 auto; padding:7px 15px; border-radius:99px; font-size:13px; font-weight:700; border:1px solid var(--border-panel); background:var(--bg-panel); color:var(--text-sub); cursor:pointer; white-space:nowrap;">Private</button>
          </div>
          
          <!-- Add a task CTA Button -->
          <a href="service-create-task.html?from=tasks" style="width:100%; padding:15px; border:none; border-radius:14px; background:var(--color-primary); color:#fff; font-size:16px; font-weight:800; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:9px; box-shadow:0 6px 16px rgba(29,96,162,.26); margin-bottom:16px; text-decoration:none;">
            <svg fill="none" height="18" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" viewBox="0 0 24 24" width="18"><path d="M5 12h14M12 5v14"></path></svg>
            <span>Add a task</span>
          </a>

          <!-- QUICK MISSION BOX -->
          <div id="mb-quick-mission-box" style="background:var(--bg-panel); border:1.5px solid var(--border-panel); border-radius:16px; padding:14px; margin-bottom:18px; box-shadow:0 2px 8px rgba(0,0,0,0.04);">
            <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">
              <span style="font-size:12px; font-weight:800; color:var(--text-sub); letter-spacing:0.5px; flex:none;">QUICK</span>
              <input id="mb-quick-detail" type="text" placeholder="Type Here Mission Detail" style="flex:1; min-width:0; padding:8px 12px; border-radius:10px; border:1px solid var(--border-panel); background:var(--bg-form); color:var(--text-title); font-size:13px; font-family:inherit; outline:none;" />
            </div>
            <div style="display:flex; align-items:center; gap:8px; padding:6px 10px; border-radius:10px; border:1px solid var(--border-panel); background:var(--bg-form); margin-bottom:10px;">
              <span style="font-size:12px; font-weight:700; color:var(--text-sub); flex:none;">Customer Name</span>
              <select id="mb-quick-customer" style="flex:1; min-width:0; border:none; background:transparent; font-size:12px; font-weight:700; color:var(--text-title); outline:none; cursor:pointer; width:100%;">
                <option value="">Choose Customer</option>
              </select>
            </div>
            <div style="display:flex; flex-wrap:nowrap; align-items:center; gap:10px;">
              <div style="display:inline-flex; align-items:center; gap:6px; padding:6px 10px; border-radius:10px; border:1px solid var(--border-panel); background:var(--bg-form); flex:1; min-width:0;">
                <span style="font-size:12px; font-weight:700; color:var(--text-sub); flex:none; white-space:nowrap;">Team Member</span>
                <select id="mb-quick-team" style="flex:1; min-width:0; border:none; background:transparent; font-size:12px; font-weight:700; color:var(--text-title); outline:none; cursor:pointer;"></select>
              </div>
              <button id="mb-quick-submit" type="button" style="flex:none; white-space:nowrap; padding:9px 14px; border-radius:10px; border:none; background:#2563eb; color:#fff; font-size:13px; font-weight:800; cursor:pointer; box-shadow:0 4px 12px rgba(37,99,235,0.3);">Quick mission</button>
            </div>
            <div id="mb-quick-msg" style="display:none; font-size:12px; font-weight:700; margin-top:8px;"></div>
          </div>
          
          <div id="mb-missions-total" style="font-size:12.5px; font-weight:700; color:var(--text-sub); margin:0 2px 10px;">טוען…</div>

          <div id="mb-live-tasks"></div>

        </div>

      </div>
    </div>
  </div>

  <script>
    // Ensure common header and footer load properly
    window.addEventListener('load', function() {
      if (typeof ensureCommonHeader === 'function') ensureCommonHeader();
      if (typeof ensureCommonFooter === 'function') ensureCommonFooter();
    });

    // Drag / swipe scroll for filter chips
    document.addEventListener('DOMContentLoaded', function () {
      var el = document.getElementById('mb-task-filter-chips');
      if (!el || el.getAttribute('data-drag-bound') === '1') return;
      el.setAttribute('data-drag-bound', '1');

      var isDown = false;
      var didDrag = false;
      var startX = 0;
      var scrollLeft = 0;

      function getX(e) {
        return e.touches && e.touches.length ? e.touches[0].pageX : e.pageX;
      }

      function onStart(e) {
        isDown = true;
        didDrag = false;
        startX = getX(e);
        scrollLeft = el.scrollLeft;
        el.style.cursor = 'grabbing';
      }

      function onMove(e) {
        if (!isDown) return;
        var x = getX(e);
        var walk = (x - startX) * 1.6;
        if (Math.abs(walk) > 4) didDrag = true;
        el.scrollLeft = scrollLeft - walk;
        if (didDrag && e.cancelable) e.preventDefault();
      }

      function onEnd() {
        isDown = false;
        el.style.cursor = 'grab';
      }

      el.addEventListener('mousedown', onStart);
      el.addEventListener('mousemove', onMove);
      el.addEventListener('mouseup', onEnd);
      el.addEventListener('mouseleave', onEnd);
      el.addEventListener('touchstart', onStart, { passive: true });
      el.addEventListener('touchmove', onMove, { passive: false });
      el.addEventListener('touchend', onEnd);
      el.addEventListener('touchcancel', onEnd);
      el.addEventListener('wheel', function (e) {
        if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
          el.scrollLeft += e.deltaY;
          e.preventDefault();
        }
      }, { passive: false });

      el.addEventListener('click', function (e) {
        if (didDrag) {
          e.preventDefault();
          e.stopPropagation();
          didDrag = false;
        }
      }, true);

      el.style.cursor = 'grab';
      el.style.minWidth = '0';
      el.style.maxWidth = '100%';
      el.style.overflowX = 'auto';
    });
  </script>
</body>
