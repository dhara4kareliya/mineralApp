<script data-dc-script="" data-props='{"$preview": {"width": 424, "height": 880}}' type="text/x-dc">
class Component extends DCLogic {
  state = {
    sheetOpen: false,
    sheetCustomerLabel: '…'
  };

  componentDidMount() {
    var self = this;
    this.syncCustomerFromCache();
    window.addEventListener('mineralbar:customer', function (ev) {
      var d = (ev && ev.detail) || {};
      self.applyCustomer(d.id, d.name, d.kind);
    });
  }

  syncCustomerFromCache() {
    var cached = window.__mbCurrentCustomer || null;
    if (cached && (cached.id || cached.name)) {
      this.applyCustomer(cached.id, cached.name, cached.kind);
      return;
    }
    var id = '';
    try {
      var p = new URLSearchParams(location.search || '');
      id = p.get('customer_id') || p.get('cust_id') || p.get('id') || '';
      if (!id) id = sessionStorage.getItem('mb_customer_id') || localStorage.getItem('mb_customer_id') || '';
    } catch (e) { /* ignore */ }
    if (id) this.applyCustomer(id, '', 'customer');
  }

  applyCustomer(id, name, kind) {
    id = String(id || '').trim();
    name = String(name || '').trim();
    var isEn = typeof getCurrentLanguage === 'function' && getCurrentLanguage() === 'en';
    var kindLabel = (kind === 'lead')
      ? (isEn ? 'Lead' : 'ליד')
      : (isEn ? 'Customer' : 'לקוח');
    var label;
    if (name && id) label = name + ' · ' + kindLabel + ' #' + id;
    else if (name) label = name;
    else if (id) label = kindLabel + ' #' + id;
    else label = '…';
    this.setState({ sheetCustomerLabel: label });
  }

  openSheet() {
    this.syncCustomerFromCache();
    this.setState({ sheetOpen: true });
  }
  closeSheet() { this.setState({ sheetOpen: false }); }

  renderVals() {
    return {
      sheetOpen: this.state.sheetOpen,
      sheetCustomerLabel: this.state.sheetCustomerLabel || '…',
      openSheet: () => this.openSheet(),
      closeSheet: () => this.closeSheet()
    };
  }
}
</script>
