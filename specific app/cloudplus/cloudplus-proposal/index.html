<!doctype html>
<html lang="he" dir="rtl" data-page="cloudplus-proposal">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>CloudPlus | מעביר לדף הבית…</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: #0b1728;
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .spinner-wrap {
      text-align: center;
      padding: 24px;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255, 255, 255, 0.12);
      border-left-color: #0c8f84;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    p {
      color: #94a3b8;
      font-size: 15px;
      margin: 0;
      font-weight: 500;
    }
  </style>
  <script src="../assets/config.js?v=20261008a"></script>
  <script>
  (function () {
    var user = (window.Biz1Config && Biz1Config.user) || 'cloudplus';
    user = String(user).trim().toLowerCase()
      .replace(/^https?:\/\//, '')
      .replace(/\.biz1\.co\.il.*$/i, '')
      .replace(/[^a-z0-9-]/g, '');
    if (user) {
      document.write('<script src="https://' + user + '.biz1.co.il/app/sdk/biz1-sdk.js"><\/script>');
    }
  })();
  </script>
  <script src="../assets/js/app.js?v=20261008a"></script>
</head>
<body>
  <div class="spinner-wrap">
    <div class="spinner"></div>
    <p id="routerMsg">בודק התחברות למערכת…</p>
  </div>

  <script>
  (function () {
    'use strict';

    function decodeJwt(token) {
      try {
        var parts = String(token || '').split('.');
        if (parts.length === 3) {
          var base64Url = parts[1];
          var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
          var jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
              return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
          }).join(''));
          return JSON.parse(jsonPayload);
        }
      } catch (e) {}
      return null;
    }

    async function validateTokenAndSession(token) {
      if (!token) return false;
      
      var jwtPayload = decodeJwt(token);
      var userDomain = (jwtPayload && jwtPayload.domain) || (window.Biz1Config && Biz1Config.user) || 'cloudplus';
      userDomain = String(userDomain).trim().toLowerCase()
        .replace(/^https?:\/\//, '')
        .replace(/\.biz1\.co\.il.*$/i, '')
        .replace(/[^a-z0-9-]/g, '');

      var endpoints = [
        'https://' + userDomain + '.biz1.co.il/app/User.Basic',
        'https://' + userDomain + '.biz1.co.il/app/user_basic',
        '/app/User.Basic',
        '/app/user_basic'
      ];

      var resultData = null;

      if (window.MineralBarApp && typeof MineralBarApp.getClient === 'function') {
        try {
          var client = MineralBarApp.getClient();
          if (client) {
            if (typeof client.setToken === 'function') client.setToken(token);
            if (!client.headers) client.headers = {};
            client.headers['Authorization'] = 'Bearer ' + token;
          }
          var sdkRes = await client.request('User.Basic', {});
          if (sdkRes && (sdkRes.success === '1' || sdkRes.success === 1 || sdkRes.success === true || sdkRes.status === 'success' || sdkRes.ok || sdkRes.data || sdkRes.user)) {
            resultData = sdkRes;
          }
        } catch (sdkErr) {}
      }

      if (!resultData) {
        for (var i = 0; i < endpoints.length; i++) {
          var methods = ['POST'];
          for (var m = 0; m < methods.length; m++) {
            try {
              var opts = {
                method: methods[m],
                headers: {
                  'Authorization': 'Bearer ' + token,
                  'Accept': 'application/json',
                  'Content-Type': 'application/json'
                }
              };
              if (methods[m] === 'POST') opts.body = JSON.stringify({});

              var res = await fetch(endpoints[i], opts);
              var data = null;
              var contentType = res.headers.get('content-type') || '';
              if (contentType.indexOf('application/json') !== -1) {
                data = await res.json();
              } else {
                var rawText = await res.text();
                try { data = JSON.parse(rawText); } catch (eJson) {}
              }

              if (res.ok && data && (data.success === '1' || data.success === 1 || data.success === true || data.status === 'success' || data.ok || data.data || data.user)) {
                resultData = data;
                break;
              }
            } catch (fErr) {}
          }
          if (resultData) break;
        }
      }

      if (!resultData && jwtPayload && (jwtPayload.user_id || jwtPayload.user_name || jwtPayload.domain)) {
        var nowSec = Math.floor(Date.now() / 1000);
        if (!jwtPayload.exp || jwtPayload.exp > nowSec) {
          resultData = {
            success: '1',
            status: 'success',
            data: {
              user: {
                id: jwtPayload.user_id || 1,
                user_id: jwtPayload.user_id || 1,
                name: jwtPayload.user_name || jwtPayload.domain || 'CloudPlus User',
                username: jwtPayload.user_name || jwtPayload.domain || 'cloudplus',
                user_name: jwtPayload.user_name || jwtPayload.domain || 'cloudplus',
                email: jwtPayload.email || ((jwtPayload.user_name || 'cloudplus') + '@' + (jwtPayload.domain || 'cloudplus') + '.com'),
                role: jwtPayload.role || 1,
                domain: jwtPayload.domain || 'cloudplus'
              }
            }
          };
        }
      }

      if (resultData) {
        var keys = ['mineralbar_token', 'biz1_token', 'cloudplus_token', 'auth_token', 'token', 'access_token', 'bearer_token'];
        keys.forEach(function (k) {
          try { localStorage.setItem(k, token); } catch (e) {}
          try { sessionStorage.setItem(k, token); } catch (e) {}
        });

        if (window.MineralBarApp) {
          try {
            if (typeof MineralBarApp.setToken === 'function') MineralBarApp.setToken(token);
            if (typeof MineralBarApp.saveSession === 'function') {
              var role = (MineralBarApp.detectRole && MineralBarApp.detectRole(resultData)) || 'sales';
              var email = (resultData.data && resultData.data.user && resultData.data.user.email) ||
                          (resultData.user && resultData.user.email) || '';
              MineralBarApp.saveSession(resultData, role, email);
            }
            MineralBarApp.token = token;
            MineralBarApp.user = (resultData.data && resultData.data.user) || resultData.user || resultData;
            MineralBarApp.isAuthenticated = function () { return true; };
          } catch (eApp) {}
        }
        return true;
      }
      return false;
    }

    async function routeUser() {
      var qs = new URLSearchParams(window.location.search || '');
      var token = qs.get('token') || qs.get('bearer_token') || qs.get('auth_token') || qs.get('access_token');
      var keys = ['mineralbar_token', 'biz1_token', 'cloudplus_token', 'auth_token', 'token', 'access_token', 'bearer_token'];
      
      if (!token) {
        for (var k = 0; k < keys.length; k++) {
          try {
            var t = localStorage.getItem(keys[k]) || sessionStorage.getItem(keys[k]);
            if (t && t.length > 10) { token = t; break; }
          } catch (e) {}
        }
      }

      var isValid = false;
      if (token) {
        isValid = await validateTokenAndSession(token);
      }

      if (!isValid && window.MineralBarApp) {
        try {
          if (MineralBarApp.isAuthenticated && MineralBarApp.isAuthenticated()) isValid = true;
          else if (MineralBarApp.user || MineralBarApp.token) isValid = true;
          else if (MineralBarApp.canAutoRefresh && MineralBarApp.canAutoRefresh() && MineralBarApp.refreshSession) {
            await MineralBarApp.refreshSession();
            if (MineralBarApp.isAuthenticated && MineralBarApp.isAuthenticated()) isValid = true;
          }
        } catch (eSdk) {}
      }

      if (isValid) {
        var search = window.location.search || '';
        window.location.href = 'home.html' + search;
      } else {
        window.location.href = 'login.html';
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', routeUser);
    } else {
      routeUser();
    }
  })();
  </script>
</body>
</html>
