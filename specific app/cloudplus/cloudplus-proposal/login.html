<!doctype html>
<html lang="he" dir="rtl" data-theme="dark" data-page="cloudplus-login">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title id="pageTitle">CloudPlus | התחברות למערכת</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0b1728 0%, #15273e 50%, #0c1a2d 100%);
      --card-bg: rgba(23, 37, 59, 0.85);
      --card-border: rgba(255, 255, 255, 0.12);
      --card-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --label-color: #cbd5e1;
      --input-bg: rgba(15, 23, 42, 0.6);
      --input-border: rgba(255, 255, 255, 0.18);
      --input-text: #ffffff;
      --input-ph: #64748b;
      --accent: #0c8f84;
      --accent-hover: #0d9488;
      --topbar-btn-bg: rgba(255, 255, 255, 0.08);
      --topbar-btn-border: rgba(255, 255, 255, 0.15);
      --topbar-btn-text: #e2e8f0;
    }

    [data-theme="light"] {
      --bg-gradient: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 50%, #cbd5e1 100%);
      --card-bg: #ffffff;
      --card-border: #cbd5e1;
      --card-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --label-color: #334155;
      --input-bg: #f8fafc;
      --input-border: #cbd5e1;
      --input-text: #0f172a;
      --input-ph: #94a3b8;
      --accent: #0c8f84;
      --accent-hover: #0f9f93;
      --topbar-btn-bg: #ffffff;
      --topbar-btn-border: #cbd5e1;
      --topbar-btn-text: #334155;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: background 0.3s ease, color 0.3s ease;
      position: relative;
    }

    .top-controls {
      position: absolute;
      top: 20px;
      inset-inline-end: 20px;
      display: flex;
      gap: 10px;
      z-index: 10;
    }

    .ctrl-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background: var(--topbar-btn-bg);
      border: 1px solid var(--topbar-btn-border);
      color: var(--topbar-btn-text);
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }

    .ctrl-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-1px);
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }

    .login-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 40px 36px;
      box-shadow: var(--card-shadow);
      transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .login-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #0c8f84, #14b8a6);
      color: white;
      border-radius: 14px;
      font-weight: 800;
      font-size: 24px;
      margin-bottom: 14px;
      box-shadow: 0 4px 14px rgba(12, 143, 132, 0.4);
    }

    .login-header h1 {
      margin: 0 0 6px 0;
      font-size: 26px;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }

    .login-header p {
      margin: 0;
      font-size: 14px;
      color: var(--text-muted);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 700;
      color: var(--label-color);
    }

    .form-control {
      width: 100%;
      padding: 13px 16px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 10px;
      color: var(--input-text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .form-control:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(12, 143, 132, 0.25);
    }

    .form-control::placeholder {
      color: var(--input-ph);
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #0c8f84 0%, #0d9488 100%);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(12, 143, 132, 0.35);
      margin-top: 8px;
    }

    .btn-login:hover {
      background: linear-gradient(135deg, #0f9f93 0%, #11a396 100%);
      box-shadow: 0 6px 18px rgba(12, 143, 132, 0.45);
      transform: translateY(-1px);
    }

    .btn-login:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    .alert-error {
      background: #fee2e2;
      border: 1px solid #fca5a5;
      color: #991b1b;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 20px;
      display: none;
      word-break: break-word;
    }

    .alert-notice {
      background: #e0f2fe;
      border: 1px solid #7dd3fc;
      color: #0369a1;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 20px;
      display: none;
      word-break: break-word;
    }

    .alert-error.visible, .alert-notice.visible {
      display: block;
    }

    .otp-container {
      display: none;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- Top Controls: Language & Theme Switchers -->
  <div class="top-controls">
    <button id="langToggleBtn" class="ctrl-btn" onclick="toggleLanguage()" title="Switch Language">
      <span>🌐</span> <span id="langBtnText">English</span>
    </button>
    <button id="themeToggleBtn" class="ctrl-btn" onclick="toggleTheme()" title="Switch Theme">
      <span id="themeIcon">☀️</span> <span id="themeBtnText">בהיר</span>
    </button>
  </div>

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="brand-badge">C+</div>
        <h1>CloudPlus</h1>
        <p id="subheadingText">התחברות למערכת הצעות מחיר</p>
      </div>

      <div id="errorAlert" class="alert-error" role="alert"></div>
      <div id="noticeAlert" class="alert-notice" role="status"></div>

      <!-- Username & Password Form -->
      <form id="loginForm" onsubmit="handleLoginSubmit(event)">
        <div class="form-group">
          <label for="usernameInput" id="usernameLabel">שם משתמש / דוא"ל</label>
          <input type="text" id="usernameInput" class="form-control" placeholder="user@company.com" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="passwordInput" id="passwordLabel">סיסמה</label>
          <input type="password" id="passwordInput" class="form-control" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <!-- Dynamic 2FA OTP Field -->
        <div id="otpContainer" class="form-group otp-container">
          <label for="otpInput" id="otpLabel">קוד אימות (OTP)</label>
          <input type="text" id="otpInput" class="form-control" placeholder="123456" maxlength="6" autocomplete="one-time-code">
        </div>

        <button type="submit" id="submitBtn" class="btn-login">התחברות</button>
      </form>

    </div>
  </div>

  <script src="../assets/config.js?v=20261008a"></script>
  <script>
  (function () {
    'use strict';

    var dict = {
      he: {
        pageTitle: 'CloudPlus | התחברות למערכת',
        subheading: 'התחברות למערכת הצעות מחיר',
        usernameLabel: 'שם משתמש / דוא"ל',
        usernamePh: 'user@company.com',
        passwordLabel: 'סיסמה',
        passwordPh: '••••••••',
        otpLabel: 'קוד אימות שנשלח אלייך (OTP)',
        submitBtn: 'התחברות',
        langBtn: 'English',
        themeLight: 'בהיר',
        themeDark: 'כהה',
        errEmpty: 'נא להזין שם משתמש וסיסמה',
        validatingToken: 'מאמת טוקן...',
        signingIn: 'מתחבר למערכת...'
      },
      en: {
        pageTitle: 'CloudPlus | System Login',
        subheading: 'Proposal System Login',
        usernameLabel: 'Username / Email',
        usernamePh: 'user@company.com',
        passwordLabel: 'Password',
        passwordPh: '••••••••',
        otpLabel: 'OTP Code sent to your email',
        submitBtn: 'Sign In',
        langBtn: 'עברית',
        themeLight: 'Light',
        themeDark: 'Dark',
        errEmpty: 'Please enter username and password',
        validatingToken: 'Validating token...',
        signingIn: 'Signing in...'
      }
    };

    function readStoredLang() {
      try {
        return localStorage.getItem('cloudplus-proposal-lang')
          || localStorage.getItem('cloudplus_lang')
          || sessionStorage.getItem('cloudplus-proposal-lang')
          || 'he';
      } catch (e) {
        return 'he';
      }
    }

    function readStoredTheme() {
      try {
        return localStorage.getItem('cloudplus_theme') || 'dark';
      } catch (e) {
        return 'dark';
      }
    }

    var currentLang = readStoredLang();
    if (currentLang !== 'he' && currentLang !== 'en') currentLang = 'he';

    var currentTheme = readStoredTheme();
    if (currentTheme !== 'dark' && currentTheme !== 'light') currentTheme = 'dark';

    function applyLang(lang) {
      currentLang = lang;
      var dir = lang === 'he' ? 'rtl' : 'ltr';
      document.documentElement.lang = lang;
      document.documentElement.dir = dir;
      document.body.dir = dir;

      try { localStorage.setItem('cloudplus-proposal-lang', lang); } catch (e1) {}
      try { localStorage.setItem('cloudplus_lang', lang); } catch (e2) {}
      try { sessionStorage.setItem('cloudplus-proposal-lang', lang); } catch (e3) {}

      var textPack = dict[lang] || dict.he;
      document.getElementById('pageTitle').textContent = textPack.pageTitle;
      document.getElementById('subheadingText').textContent = textPack.subheading;
      document.getElementById('usernameLabel').textContent = textPack.usernameLabel;
      document.getElementById('usernameInput').placeholder = textPack.usernamePh;
      document.getElementById('passwordLabel').textContent = textPack.passwordLabel;
      document.getElementById('passwordInput').placeholder = textPack.passwordPh;
      document.getElementById('otpLabel').textContent = textPack.otpLabel;
      document.getElementById('submitBtn').textContent = textPack.submitBtn;
      document.getElementById('langBtnText').textContent = textPack.langBtn;
      
      applyTheme(currentTheme);
    }

    function applyTheme(theme) {
      currentTheme = theme;
      document.documentElement.setAttribute('data-theme', theme);
      try { localStorage.setItem('cloudplus_theme', theme); } catch (e) {}

      var textPack = dict[currentLang] || dict.he;
      var iconEl = document.getElementById('themeIcon');
      var btnTextEl = document.getElementById('themeBtnText');
      if (theme === 'light') {
        iconEl.textContent = '🌙';
        btnTextEl.textContent = textPack.themeDark;
      } else {
        iconEl.textContent = '☀️';
        btnTextEl.textContent = textPack.themeLight;
      }
    }

    window.toggleLanguage = function () {
      var nextLang = currentLang === 'he' ? 'en' : 'he';
      applyLang(nextLang);
    };

    window.toggleTheme = function () {
      var nextTheme = currentTheme === 'dark' ? 'light' : 'dark';
      applyTheme(nextTheme);
    };

    function showError(msg) {
      var errAlert = document.getElementById('errorAlert');
      var noticeAlert = document.getElementById('noticeAlert');
      noticeAlert.classList.remove('visible');
      errAlert.textContent = msg || 'שגיאה';
      errAlert.classList.add('visible');
    }

    function showNotice(msg) {
      var errAlert = document.getElementById('errorAlert');
      var noticeAlert = document.getElementById('noticeAlert');
      errAlert.classList.remove('visible');
      noticeAlert.textContent = msg;
      noticeAlert.classList.add('visible');
    }

    function showLoading(isLoading, msg) {
      var btn = document.getElementById('submitBtn');
      if (isLoading) {
        btn.disabled = true;
        btn.textContent = msg || (dict[currentLang] || dict.he).signingIn;
      } else {
        btn.disabled = false;
        btn.textContent = (dict[currentLang] || dict.he).submitBtn;
      }
    }

    var qs = new URLSearchParams(window.location.search || '');
    var initialToken = qs.get('token') || qs.get('bearer_token') || qs.get('auth_token') || qs.get('access_token') || '';
    var initialCust = qs.get('customer') || qs.get('customer_id') || qs.get('cust_id') || '';

    var userDomain = (window.Biz1Config && Biz1Config.user) || 'cloudplus';
    userDomain = String(userDomain).trim().toLowerCase()
      .replace(/^https?:\/\//, '')
      .replace(/\.biz1\.co\.il.*$/i, '')
      .replace(/[^a-z0-9-]/g, '');

    function getApiBaseUrl() {
      return 'https://' + userDomain + '.biz1.co.il';
    }

    function saveTokenAndSession(token, userBasicData) {
      var keys = ['mineralbar_token', 'biz1_token', 'cloudplus_token', 'auth_token', 'token', 'access_token', 'bearer_token'];
      keys.forEach(function (k) {
        try { localStorage.setItem(k, token); } catch (e) {}
        try { sessionStorage.setItem(k, token); } catch (e) {}
      });
      if (userBasicData) {
        try {
          var userObj = (userBasicData.data && userBasicData.data.user) || userBasicData.user || userBasicData;
          if (userObj.email) {
            localStorage.setItem('cloudplus_user_email', userObj.email);
            sessionStorage.setItem('cloudplus_user_email', userObj.email);
          }
        } catch (e) {}
      }
    }

    function decodeJwt(token) {
      try {
        var parts = String(token || '').split('.');
        if (parts.length === 3) {
          var base64Url = parts[1];
          var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
          var jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
              return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
          }).join(''));
          return JSON.parse(jsonPayload);
        }
      } catch (e) {}
      return null;
    }

    async function validateTokenAndLogin(token, customerId) {
      showLoading(true, (dict[currentLang] || dict.he).validatingToken);
      var jwtPayload = decodeJwt(token);

      var endpoints = [
        getApiBaseUrl() + '/app/User.Basic',
        getApiBaseUrl() + '/app/user_basic',
        '/app/User.Basic',
        '/app/user_basic'
      ];

      var resultData = null;
      var errorMessage = '';

      for (var i = 0; i < endpoints.length; i++) {
        var methods = ['POST'];
        for (var m = 0; m < methods.length; m++) {
          try {
            var options = {
              method: methods[m],
              headers: {
                'Authorization': 'Bearer ' + token,
                'Accept': 'application/json',
                'Content-Type': 'application/json'
              }
            };
            if (methods[m] === 'POST') {
              options.body = JSON.stringify({});
            }

            var res = await fetch(endpoints[i], options);
            var data = null;
            var contentType = res.headers.get('content-type') || '';
            if (contentType.indexOf('application/json') !== -1) {
              data = await res.json();
            } else {
              var rawText = await res.text();
              try { data = JSON.parse(rawText); } catch (eJson) {}
            }

            if (res.ok && data && (data.success === '1' || data.success === 1 || data.success === true || data.status === 'success' || data.ok || data.data || data.user)) {
              resultData = data;
              errorMessage = '';
              break;
            } else if (data && (data.message || data.error || data.msg)) {
              errorMessage = data.message || data.error || data.msg;
            }
          } catch (fetchErr) {}
        }
        if (resultData) break;
      }

      if (!resultData && jwtPayload && (jwtPayload.user_id || jwtPayload.user_name || jwtPayload.domain)) {
        var nowSec = Math.floor(Date.now() / 1000);
        if (!jwtPayload.exp || jwtPayload.exp > nowSec) {
          resultData = {
            success: '1',
            status: 'success',
            data: {
              user: {
                id: jwtPayload.user_id || 1,
                user_id: jwtPayload.user_id || 1,
                name: jwtPayload.user_name || jwtPayload.domain || 'CloudPlus User',
                username: jwtPayload.user_name || jwtPayload.domain || 'cloudplus',
                user_name: jwtPayload.user_name || jwtPayload.domain || 'cloudplus',
                email: jwtPayload.email || ((jwtPayload.user_name || 'cloudplus') + '@' + (jwtPayload.domain || 'cloudplus') + '.com'),
                role: jwtPayload.role || 1,
                domain: jwtPayload.domain || 'cloudplus'
              }
            }
          };
        }
      }

      if (resultData) {
        saveTokenAndSession(token, resultData);
        var targetUrl = 'home.html';
        if (customerId) targetUrl += '?customer=' + encodeURIComponent(customerId);
        window.location.href = targetUrl;
      } else {
        showLoading(false);
        if (initialToken) {
          showError(errorMessage || (currentLang === 'he' ? 'טוקן לא תקין' : 'Invalid token'));
        }
      }
    }

    if (initialToken) {
      validateTokenAndLogin(initialToken, initialCust);
    } else {
      var keys = ['mineralbar_token', 'biz1_token', 'cloudplus_token', 'auth_token', 'token', 'access_token', 'bearer_token'];
      var storedToken = null;
      for (var k = 0; k < keys.length; k++) {
        try {
          var t = localStorage.getItem(keys[k]) || sessionStorage.getItem(keys[k]);
          if (t && t.length > 10) { storedToken = t; break; }
        } catch (e) {}
      }
      if (storedToken) {
        validateTokenAndLogin(storedToken, initialCust);
      }
    }

    window.handleLoginSubmit = async function (e) {
      e.preventDefault();
      var username = document.getElementById('usernameInput').value.trim();
      var password = document.getElementById('passwordInput').value.trim();
      var otpInput = document.getElementById('otpInput');
      var otp = otpInput ? otpInput.value.trim() : '';

      if (!username || !password) {
        var textPack = dict[currentLang] || dict.he;
        showError(textPack.errEmpty);
        return;
      }

      showLoading(true, (dict[currentLang] || dict.he).signingIn);

      var loginEndpoints = [
        getApiBaseUrl() + '/app/Login',
        '/app/Login'
      ];

      var loginResData = null;
      var loginErrorMsg = '';

      for (var i = 0; i < loginEndpoints.length; i++) {
        try {
          var formData = new URLSearchParams();
          formData.append('username', username);
          formData.append('password', password);
          if (otp) formData.append('otp', otp);

          var res = await fetch(loginEndpoints[i], {
            method: 'POST',
            headers: {
              'Content-Type': 'application/x-www-form-urlencoded',
              'Accept': 'application/json'
            },
            body: formData.toString()
          });

          var data = null;
          var contentType = res.headers.get('content-type') || '';
          if (contentType.indexOf('application/json') !== -1) {
            data = await res.json();
          } else {
            var rawText = await res.text();
            try { data = JSON.parse(rawText); } catch (eParse) {}
          }

          if (data) {
            loginResData = data;
            break;
          } else if (!res.ok) {
            loginErrorMsg = 'HTTP ' + res.status + ': ' + (res.statusText || 'Login request failed');
          }
        } catch (err) {
          if (i === loginEndpoints.length - 1 && !loginErrorMsg) {
            loginErrorMsg = err.message || 'Network error connecting to login API';
          }
        }
      }

      if (!loginResData) {
        showLoading(false);
        showError(loginErrorMsg || (currentLang === 'he' ? 'התחברות נכשלה' : 'Login failed'));
        return;
      }

      // Check 2FA OTP Requirement (success === "3" or otp_required)
      if (loginResData.otp_required || loginResData.success === '3' || loginResData.success === 3) {
        showLoading(false);
        var otpContainer = document.getElementById('otpContainer');
        if (otpContainer) {
          otpContainer.style.display = 'block';
          if (otpInput) otpInput.focus();
        }
        showNotice(loginResData.message || (currentLang === 'he' ? 'קוד אימות (OTP) נשלח לדוא"ל שלך' : 'OTP code sent to your email'));
        return;
      }

      // Check Login Success (success === "1" or token present)
      if ((loginResData.success === '1' || loginResData.success === 1 || loginResData.success === true) && loginResData.token) {
        var token = loginResData.token;
        saveTokenAndSession(token, null);
        
        // Fetch User.Basic for session data and navigate into app
        validateTokenAndLogin(token, initialCust);
      } else {
        showLoading(false);
        var msg = loginResData.message || (currentLang === 'he' ? 'שם משתמש או סיסמה שגויים' : 'Invalid username or password');
        showError(msg);
      }
    };

    applyLang(currentLang);
    applyTheme(currentTheme);
  })();
  </script>
</body>
</html>
