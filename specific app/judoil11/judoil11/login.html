<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>טופס תשלום — התחברות</title>
<script src="assets/js/theme-boot.js?v=pay-59"></script>
<script src="assets/config.js?v=pay-59"></script>
<script src="assets/js/biz1-sdk.js?v=pay-59"></script>
<script src="assets/js/lang.js?v=pay-59"></script>
<script src="assets/js/biz1-app.js?v=pay-59"></script>
<link rel="stylesheet" href="assets/css/login.css?v=pay-59">
</head>
<body>
<div class="app-shell" id="appShell">
  <div class="app-frame">
    <div id="screenLogin" class="screen">
      <div class="status-bar status-bar--dark">
        <span id="clockLogin">9:41</span>
        <div class="status-bar-right">
          <button type="button" class="theme-toggle" id="themeToggle" data-i18n-title="dark_mode" title="Theme">
            <svg class="icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/></svg>
          </button>
          <div class="lang-switch" role="group" aria-label="Language">
            <button type="button" class="lang-btn" data-lang="he" id="loginLangHe">עב</button>
            <button type="button" class="lang-btn" data-lang="en" id="loginLangEn">EN</button>
          </div>
        </div>
      </div>

      <div class="brand-hero">
        <div class="brand-blob brand-blob--tr"></div>
        <div class="brand-blob brand-blob--bl"></div>
        <div class="brand-icon">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#9cc3ec" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2.5"/><path d="M2 10h20"/><path d="M6 15h4"/></svg>
        </div>
        <div class="brand-title" id="brandTitle" data-i18n="brandName">טופס תשלום</div>
        <div class="brand-sub" data-i18n="login_subtitle">התחברות למערכת הגבייה</div>
      </div>

      <div class="dc-scroll login-scroll">
        <!-- div (not form): CSP form-action 'none' blocks any native form submit -->
        <div id="loginForm" class="login-card" role="form" autocomplete="off">
          <div class="login-title" data-i18n="form_title">כניסה לחשבון</div>

          <div id="errorBox" class="error-box hidden">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c0392b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none; margin-top:1px;"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
            <div id="errorText" class="error-text"></div>
          </div>
          <div id="usernameWrap" class="field">
            <label for="username" class="field-label">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9aa3b0" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.5 3-5.5 7-5.5s7 2 7 5.5"/></svg>
              <span data-i18n="email_username">אימייל / שם משתמש / טלפון / מזהה</span> <span class="req">*</span>
            </label>
            <input id="username" class="ds-input input input--ltr" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" value="" data-i18n-placeholder="placeholder_email" placeholder="אימייל, שם משתמש, טלפון או מזהה">
          </div>

          <div id="passwordWrap" class="field field--tight">
            <label for="password" class="field-label">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9aa3b0" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
              <span data-i18n="password">סיסמה</span> <span class="req">*</span>
            </label>
            <div class="pass-wrap">
              <input id="password" class="ds-input input input--pass" type="password" autocomplete="current-password" value="" data-i18n-placeholder="placeholder_password" placeholder="הזן סיסמה">
              <button type="button" id="togglePassword" class="pass-toggle" aria-label="Toggle password">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>

          <div id="otpWrap" class="field field--tight hidden">
            <label for="otp" class="field-label">
              <span data-i18n="otp">קוד אימות (OTP)</span> <span class="req">*</span>
            </label>
            <input id="otp" class="ds-input input input--otp" type="text" inputmode="numeric" autocomplete="one-time-code" data-i18n-placeholder="otp_placeholder" placeholder="הזן קוד">
            <button type="button" id="resendOtpBtn" class="resend-otp" data-i18n="resendOtp">שלח קוד שוב</button>
          </div>

          <div class="login-row">
            <label class="remember">
              <input id="remember" type="checkbox">
              <span data-i18n="remember_me">זכור אותי</span>
            </label>
            <span class="biz1-tag">Biz1</span>
          </div>

          <button type="button" id="loginBtn" class="btn btn-login">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="m10 17 5-5-5-5"/><path d="M15 12H3"/></svg>
            <span id="loginBtnText" data-i18n="login_btn">התחבר</span>
          </button>
        </div>

        <p class="login-footer">Biz1 Showcase · <span data-i18n="brandName">טופס תשלום</span></p>
      </div>
    </div>
  </div>
</div>

<script src="assets/js/login-page.js?v=pay-59"></script>
</body>
</html>
