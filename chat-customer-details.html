<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>Customer Details</title>
<script>document.write('<script src="./asset-version.js?_='+Date.now()+'"><\/script>');</script>
<script>
mbScripts([
  './support.js',
  './biz1-sdk.js',
  './biz1-app.js',
  './page-boot.js',
  './live-sync.js',
  './chat-customer-details-live.js',
  './i18n-translations.js',
  './common-header-footer.js'
]);
mbCss('./common.css');
</script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; font-family: 'Heebo', sans-serif; -webkit-font-smoothing: antialiased; background:#e6e8ec; }
  button, input, select, textarea { font-family: 'Heebo', sans-serif; }
  .dc-scroll::-webkit-scrollbar { width: 0; height: 0; }

  .custom-select {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid #dde2ea;
    border-radius: 11px;
    font-size: 14.5px;
    color: #1f2a3a;
    background: #fff;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
    background-repeat: no-repeat;
  }

  .section-title {
    font-size: 11.5px;
    font-weight: 700;
    color: #8a96a3;
    margin-top: 18px;
    margin-bottom: 8px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .detail-row {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1.5px solid #f1f3f6;
  }
  .detail-row:last-child { border-bottom: none; }
  .detail-label { font-size: 13px; font-weight: 600; color: #8a96a3; }
  .detail-value { font-size: 13.5px; font-weight: 700; color: #1f2a3a; }
</style>
</head>
<body id="page-body">
<div style="min-height:100vh; display:flex; align-items:flex-start; justify-content:center; padding:26px 16px;">
  <div style="width:392px; max-width:100%; background:#0f1828; border-radius:34px; padding:9px; box-shadow:0 24px 60px rgba(15,24,40,.34);">
    <div style="background:#eef0f3; border-radius:26px; overflow:hidden; position:relative; height:812px; display:flex; flex-direction:column;">

      <!-- white header -->
      <div style="background:#fff; padding:9px 16px 14px; flex:none; box-shadow:0 1px 0 #edeff2; display:flex; flex-direction:column; align-items:center;">
        <div style="width:42px; height:5px; border-radius:99px; background:#dadfe6; margin-bottom:9px;"></div>
        <div style="width:100%; display:flex; align-items:center; justify-content:space-between;">
          <div style="width:38px;"></div>
          <div id="ui-title-header" style="font-size:18px; font-weight:800; color:#1f2a3a;">Customer Card</div>
          <button type="button" onclick="(function(e){if(window.mbGoCustomerCardBack){window.mbGoCustomerCardBack(e);}else if(history.length>1){history.back();}else{location.href='customers.html';}})(event)" aria-label="Back" style="width:38px; height:38px; border-radius:50%; border:none; background:#f1f3f6; color:#5a6473; cursor:pointer; display:flex; align-items:center; justify-content:center;">
            <svg fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewBox="0 0 24 24" width="18"><path d="m9 18 6-6-6-6"></path></svg>
          </button>
        </div>
      </div>

      <!-- body content -->
      <div class="dc-scroll" style="flex:1; overflow-y:auto; padding:16px 14px 20px; display:flex; flex-direction:column;">

        <!-- Loading overlay/indicator -->
        <div id="details-loading" class="mb-inline-loader" style="display:flex; flex-direction:column; align-items:center; justify-content:center;">
          <div class="mb-page-loader__spin" aria-hidden="true"></div>
          <div id="ui-loading-text" class="mb-page-loader__label">Loading data...</div>
        </div>

        <!-- Details block (shown after load) -->
        <div id="details-content" style="display:none; flex-direction:column;">
          <!-- Customer identity card -->
          <div id="cust-identity-container" style="display:flex; align-items:center; gap:12px; margin-bottom:15px;">
            <div id="cust-avatar" style="width:54px; height:54px; border-radius:50%; background:#dbe7f8; color:#2f6aa6; font-weight:800; font-size:17px; display:flex; align-items:center; justify-content:center; flex:none;">?</div>
            <div id="cust-info-box" style="flex:1;">
              <div id="cust-name" style="font-size:20px; font-weight:800; color:#1f2a3a;">-</div>
              <div id="cust-subtitle" style="font-size:12.5px; color:#9aa3b0; margin-top:3px;">-</div>
            </div>
          </div>

          <!-- Channels section -->
          <div class="section-title" data-i18n="channels_title">CHANNELS</div>
          <div style="display:flex; gap:6px; overflow-x:auto; padding-bottom:8px; margin-bottom:12px;" class="dc-scroll">
            <span style="padding:6px 12px; border-radius:99px; background:#25b35e; color:#fff; font-size:12px; font-weight:700; cursor:pointer;">WA</span>
            <span
                style="padding:6px 12px; border-radius:99px; background:#FF0000; color:#fff; font-size:12px; font-weight:600;">Email</span>
              <span
                style="padding:6px 12px; border-radius:99px; background:#E40078; color:#fff; font-size:12px; font-weight:600;">Quick</span>
            <span style="padding:6px 12px; border-radius:99px; background:#2c272e; color:#fff; font-size:12px; font-weight:600;">Biz1</span>
            <span style="padding:6px 12px; border-radius:99px; background:#5950a8; color:#fff; font-size:12px; font-weight:600;">Notes</span>
          </div>

          <!-- Customer folders block  -->
          <div class="section-title" data-i18n="customer_folders_title">CUSTOMER FOLDERS</div>
          <div id="customer-folders-container">
          </div>

          <!-- Details listing -->
          <div class="section-title" data-i18n="details_title">DETAILS</div>
          <div style="background:#fff; border-radius:16px; padding:6px 14px; box-shadow:0 1px 3px rgba(0,0,0,.05); margin-bottom:12px;">
            <div class="detail-row">
              <span class="detail-label" data-i18n="details_open_missions_label">Open missions</span>
              <span class="detail-value" id="details-open-missions">-</span>
            </div>
          </div>

          <!-- Notes section -->
          <div class="section-title" data-i18n="notes_title">NOTES</div>
          <div style="background:#fff; border-radius:16px; padding:14px; box-shadow:0 1px 3px rgba(0,0,0,.05); margin-bottom:8px;">
            <div id="notes-display-box" style="font-size:14px; color:#1f2a3a; min-height:40px; word-break:break-word;">
              -
            </div>
          </div>

        </div>

      </div>

    </div>
  </div>
</div>

<!-- Toast notification utility -->
<div id="custom-toast" style="display:none; position:absolute; left:50%; bottom:100px; transform:translateX(-50%); width:calc(100% - 48px); max-width:300px; padding:12px 14px; border-radius:12px; background:#16223a; color:#fff; font-size:13px; font-weight:700; text-align:center; z-index:99999; box-shadow:0 8px 24px rgba(15,24,40,.28); pointer-events:none;"></div>

</body>
</html>
