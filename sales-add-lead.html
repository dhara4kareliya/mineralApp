<sc-if hint-placeholder-val="{{ false }}" value="{{ s.iPhone }}"><svg fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9" viewbox="0 0 24 24" width="18"><path d="M5 4h3l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v3a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"></path><path d="M15 3h6m0 0v6m0-6-7 7"></path></svg></sc-if>

<sc-if hint-placeholder-val="{{ false }}" value="{{ s.iDoc }}"><svg fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9" viewbox="0 0 24 24" width="18"><path d="M6 2.5h8L19 7v14.5H6z"></path><path d="M14 2.5V7h5M9 12h6M9 16h6"></path></svg></sc-if>

<!-- Status and affiliation -->

<select class="ds-input" value="{{ salespersonId }}" onchange="{{ onSalesperson }}" style="width:100%; padding:13px 40px 13px 13px; border:1.5px solid #dde2ea; border-radius:11px; font-size:14.5px; color:#1f2a3a; background:#fff;">

<svg fill="none" height="15" stroke="#9aa3b0" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9" viewbox="0 0 24 24" width="15"><path d="M6 2.5h8L19 7v14.5H6z"></path><path d="M14 2.5V7h5M9 12h6M9 16h4"></path></svg>
            A preliminary note <span style="color:#9aa3b0; font-weight:500;">(optional)</span>
</label>
<textarea class="ds-input" oninput="{{ onComments }}" value="{{ comments }}" placeholder="{{ commentsPlaceholder }}" style="width:100%; min-height:92px; padding:13px; border:1.5px solid #dde2ea; border-radius:13px; font-size:14px; color:#1f2a3a; text-align:start; resize:none; background:#fff; line-height:1.6;"></textarea>

<span style="font-size:16px;">Submitting...</span>
</sc-if>

<svg fill="none" height="17" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="17"><path d="M5 12h14M12 5v14"></path></svg>

<script data-dc-script="" data-props='{"$preview": {"width": 424, "height": 880}}' type="text/x-dc">
class Component extends DCLogic {
  state = {
    name: '', phone: '', email: '',
    city: '', street: '', building: '', floor: '', apartment: '', entrance: '', area: '',
    source: 'site', status: '', statusesData: [],
    comments: '', salespersonId: '', teamMembers: [],
    submitting: false, error: ''
  };

  inputValue(e) {
    if (e && e.target) return e.target.value;
    if (e && typeof e.value === 'string') return e.value;
    if (e && e.detail && typeof e.detail.value === 'string') return e.detail.value;
    return typeof e === 'string' ? e : '';
  }
  onName(e) { this.setState({ name: this.inputValue(e) }); }
  onPhone(e) { this.setState({ phone: this.inputValue(e) }); }
  onEmail(e) { this.setState({ email: this.inputValue(e) }); }
  onCity(e) { this.setState({ city: this.inputValue(e) }); }
  onStreet(e) { this.setState({ street: this.inputValue(e) }); }
  onBuilding(e) { this.setState({ building: this.inputValue(e) }); }
  onFloor(e) { this.setState({ floor: this.inputValue(e) }); }
  onApartment(e) { this.setState({ apartment: this.inputValue(e) }); }
  onEntrance(e) { this.setState({ entrance: this.inputValue(e) }); }
  onArea(e) { this.setState({ area: this.inputValue(e) }); }
  onComments(e) { this.setState({ comments: this.inputValue(e) }); }
  onSalesperson(e) { this.setState({ salespersonId: this.inputValue(e) }); }

  isEn() {
    return typeof window.getCurrentLanguage === 'function' && window.getCurrentLanguage() === 'en';
  }

  t(en, he) {
    if (typeof window.mbT === 'function') return window.mbT(en, he);
    return this.isEn() ? en : he;
  }

  memberId(m) {
    return String((m && (m.id || m.user_id || m.member_id || m.team_member_id)) || '').trim();
  }

  loggedInMember(team) {
    var meEmail = '';
    try {
      meEmail = ((window.MineralBarApp && MineralBarApp.getEmail && MineralBarApp.getEmail()) || '').toLowerCase();
    } catch (e) { meEmail = ''; }
    var meUser = {};
    try {
      meUser = (window.MineralBarApp && MineralBarApp.getUser && MineralBarApp.getUser()) || {};
    } catch (e2) { meUser = {}; }
    var meUserId = String(meUser.id || meUser.user_id || meUser.member_id || '').trim();
    return (team || []).find(function (m) {
      var email = String(m.email || '').toLowerCase();
      var id = String(m.id || m.user_id || m.member_id || m.team_member_id || '').trim();
      return (meEmail && email === meEmail) || (meUserId && id === meUserId);
    }) || (team && team[0]) || null;
  }
  goBack() {
    if (typeof window.mbGoEntryBack === 'function') {
      window.mbGoEntryBack(null, { fallback: 'leads-list.html', selfRe: /sales-add-lead/i });
      return;
    }
    window.history.back();
  }

  componentDidMount() {
    if (window.LiveSync && typeof LiveSync.bind === 'function') {
      LiveSync.bind(() => { var soft = { silent: true }; if (typeof this.initData === 'function') this.initData(soft); else if (typeof this.load === 'function') this.load(soft); }, { retries: true, keys: /ticket|mission|task|customer|lead|product|socket\.nudge/i, delay: 350 });
    }

    this.loadStatuses();
    this.loadTeamMembers();
    window.addEventListener('mineralbar:ready', () => {
      this.loadStatuses();
      this.loadTeamMembers();
    });
    if (window.MineralBarApp && MineralBarApp.bindLiveReload) {
      MineralBarApp.bindLiveReload(() => this.loadStatuses(), { keys: /status|lead|customer|socket\.nudge/i, delay: 400 });
    }
    window.addEventListener('mineralbar:language-changed', () => {
      this.loadStatuses();
      this.loadTeamMembers();
    });
  }

  SOURCES = [
    { id: 'fb', labelHe: 'פייסבוק', labelEn: 'Facebook', icon: 'iFb' },
    { id: 'ig', labelHe: 'אינסטגרם', labelEn: 'Instagram', icon: 'iIg' },
    { id: 'site', labelHe: 'אתר', labelEn: 'Website', icon: 'iGlobe' },
    { id: 'ref', labelHe: 'הפניה', labelEn: 'Referral', icon: 'iRef' },
    { id: 'call', labelHe: 'שיחה נכנסת', labelEn: 'Incoming call', icon: 'iPhone' },
    { id: 'other', labelHe: 'אחר', labelEn: 'Other', icon: 'iDoc' },
  ];

  leadsFolderId() {
    try {
      if (window.MineralBarApp && MineralBarApp.FOLDERS && MineralBarApp.FOLDERS.LEADS != null) {
        return Number(MineralBarApp.FOLDERS.LEADS) || 1;
      }
    } catch (e) { /* ignore */ }
    return 1;
  }

  loadTeamMembers() {
    var team = [];
    try {
      if (window.MineralBarApp && typeof MineralBarApp.getTeamMembers === 'function') {
        team = MineralBarApp.getTeamMembers() || [];
      }
    } catch (e) { team = []; }
    var me = this.loggedInMember(team);
    var current = String(this.state.salespersonId || '').trim();
    var stillValid = current && team.some((m) => this.memberId(m) === current);
    var nextId = stillValid ? current : (me ? this.memberId(me) : '');
    this.setState({ teamMembers: team, salespersonId: nextId });
  }

  statusRowLabel(row, isEn) {
    if (!row) return '';
    return String(
      isEn
        ? (row.name_en || row.name_for || row.name_he || row.name || row.label || '')
        : (row.name_he || row.name_for || row.name_en || row.name || row.label || '')
    ).trim();
  }

  async loadStatuses() {
    try {
      const client = window.MineralBarApp && window.MineralBarApp.getClient
        ? window.MineralBarApp.getClient()
        : null;
      if (!client || !client.getToken || !client.getToken()) return;
      const res = await client.request('CustomerStatuses.List', {
        limit: 100,
        length: 100,
        start: 0
      });
      var rows = (res && (res.data || res.output || res.rows || res.list)) || [];
      if (!Array.isArray(rows)) rows = [];
      const isEn = this.isEn();
      const statusesData = rows.map(function (row) {
        var id = String(row.status_id || row.id || row.data_id || '').trim();
        var label = this.statusRowLabel(row, isEn);
        var order = Number(row.status_order != null ? row.status_order : 9999);
        return { id: id, label: label, order: isFinite(order) ? order : 9999 };
      }.bind(this)).filter(function (row) { return row.id && row.label; });
      statusesData.sort(function (a, b) { return a.order - b.order; });
      var current = String(this.state.status || '');
      var selectedExists = statusesData.some(function (row) { return row.id === current; });
      var opening = statusesData.find(function (row) {
        return /new|חדש/i.test(row.label);
      });
      this.setState({
        statusesData: statusesData,
        status: selectedExists ? current : ((opening && opening.id) || (statusesData[0] ? statusesData[0].id : ''))
      });
    } catch (e) {
      console.error('[sales-add-lead] CustomerStatuses.List failed', e);
      this.setState({ statusesData: [] });
    }
  }

  renderVals() {
    const isEn = this.isEn();
    const sources = this.SOURCES.map(s => {
      const on = s.id === this.state.source;
      return {
        label: isEn ? s.labelEn : s.labelHe,
        pick: () => this.setState({ source: s.id }),
        iFb: s.icon === 'iFb', iIg: s.icon === 'iIg', iGlobe: s.icon === 'iGlobe',
        iRef: s.icon === 'iRef', iPhone: s.icon === 'iPhone', iDoc: s.icon === 'iDoc',
        bg: on ? '#eaf2fb' : '#fff',
        border: on ? '#aecbe9' : '#e4e8ee',
        iconColor: on ? '#1d60a2' : '#9aa3b0',
        textColor: on ? '#194f84' : '#5a6473',
      };
    });

    const statuses = (this.state.statusesData || []).map(st => {
      const on = String(st.id) === String(this.state.status);
      return {
        label: st.label,
        pick: () => this.setState({ status: st.id }),
        bg: on ? '#1d60a2' : 'transparent',
        color: on ? '#fff' : '#5a6473',
        shadow: on ? '0 2px 6px rgba(29,96,162,.3)' : 'none',
      };
    });

    const me = this.loggedInMember(this.state.teamMembers);
    const meId = this.memberId(me);
    const salespeople = (this.state.teamMembers || []).map((m) => {
      var id = this.memberId(m);
      if (!id) return null;
      var label = m.name || m.full_name || m.email || ('#' + id);
      if (meId && id === meId) label += isEn ? ' (me)' : ' (אני)';
      var selectedId = String(this.state.salespersonId || '');
      return { id: id, label: label, selected: id === selectedId };
    }).filter(Boolean);

    var salespersonPlaceholder = salespeople.length
      ? this.t('Select', 'בחר')
      : this.t('Loading team members...', 'טוען אנשי צוות...');

    return {
      name: this.state.name || '',
      phone: this.state.phone || '',
      email: this.state.email || '',
      city: this.state.city || '',
      street: this.state.street || '',
      building: this.state.building || '',
      floor: this.state.floor || '',
      apartment: this.state.apartment || '',
      entrance: this.state.entrance || '',
      area: this.state.area || '',
      comments: String(this.state.comments == null ? '' : this.state.comments),
      commentsPlaceholder: isEn
        ? 'For example: "Interested in a primary filter, also talking about a water softener"'
        : 'לדוגמה: "מעוניין במסנן ראשי, גם מדברים על מרכך מים"',
      submitting: !!this.state.submitting,
      error: this.state.error || '',
      sources, statuses, salespeople,
      salespersonId: this.state.salespersonId || '',
      salespersonPlaceholder: salespersonPlaceholder,
      onName: (e) => this.onName(e),
      onPhone: (e) => this.onPhone(e),
      onEmail: (e) => this.onEmail(e),
      onCity: (e) => this.onCity(e),
      onStreet: (e) => this.onStreet(e),
      onBuilding: (e) => this.onBuilding(e),
      onFloor: (e) => this.onFloor(e),
      onApartment: (e) => this.onApartment(e),
      onEntrance: (e) => this.onEntrance(e),
      onArea: (e) => this.onArea(e),
      onComments: (e) => this.onComments(e),
      onSalesperson: (e) => this.onSalesperson(e),
      goBack: () => this.goBack(),
      submit: () => this.submit()
    };
  }

  composedAddress(isEn) {
    var street = String(this.state.street || '').trim();
    var building = String(this.state.building || '').trim();
    var floor = String(this.state.floor || '').trim();
    var apartment = String(this.state.apartment || '').trim();
    var entrance = String(this.state.entrance || '').trim();
    var area = String(this.state.area || '').trim();
    var city = String(this.state.city || '').trim();
    var parts = [];
    var streetLine = [street, building].filter(Boolean).join(' ');
    if (streetLine) parts.push(streetLine);
    if (entrance) parts.push((isEn ? 'Entrance ' : 'כניסה ') + entrance);
    if (floor) parts.push((isEn ? 'Floor ' : 'קומה ') + floor);
    if (apartment) parts.push((isEn ? 'Apt ' : 'דירה ') + apartment);
    if (area) parts.push(area);
    if (city && parts.indexOf(city) === -1) parts.push(city);
    return parts.join(', ');
  }

  phoneDigits(v) {
    return String(v == null ? '' : v).replace(/\D/g, '');
  }

  isAlreadyExistsError(err) {
    var msg = '';
    if (err && err.message) msg += ' ' + err.message;
    if (err && err.raw && err.raw.message) msg += ' ' + err.raw.message;
    msg += ' ' + String(err || '');
    return /already exists|already exist|כבר קיים|קיים במערכת|duplicate/i.test(msg);
  }

  existingIdFromError(err) {
    var raw = (err && err.raw) || {};
    var out = raw.output || raw.data || {};
    return String(
      raw.customer_id || raw.cust_id || raw.exist_id || raw.existing_id || raw.insert_id || raw.id ||
      out.customer_id || out.cust_id || out.id || ''
    ).trim();
  }

  rowMatchesPhone(row, digits) {
    if (!digits) return false;
    var cands = [row.phone, row.mobile, row.cellphone, row.tel, row.second_phone];
    for (var i = 0; i < cands.length; i++) {
      var d = this.phoneDigits(cands[i]);
      if (d && (d === digits || d.slice(-9) === digits.slice(-9))) return true;
    }
    return false;
  }

  async findExistingByPhone(phone) {
    var digits = this.phoneDigits(phone);
    if (!digits || !window.MineralBarApp || typeof MineralBarApp.listCustomers !== 'function') return null;
    var folders = [this.leadsFolderId()];
    try {
      if (MineralBarApp.FOLDERS && MineralBarApp.FOLDERS.CUSTOMERS != null) {
        folders.push(Number(MineralBarApp.FOLDERS.CUSTOMERS) || 2);
      }
    } catch (e) { folders.push(2); }
    var leadsFolder = this.leadsFolderId();
    for (var i = 0; i < folders.length; i++) {
      var folderId = folders[i];
      try {
        var res = await MineralBarApp.listCustomers({
          folder_id: folderId,
          length: 50,
          start: 0,
          draw: 1,
          search: { value: phone },
          value: phone
        });
        var rows = (res && (res.rows || res.data)) || [];
        var hit = null;
        for (var r = 0; r < rows.length; r++) {
          if (this.rowMatchesPhone(rows[r], digits)) { hit = rows[r]; break; }
        }
        if (!hit && rows.length === 1) hit = rows[0];
        if (hit) {
          var id = String(hit.customer_id || hit.cust_id || hit.id || '').trim();
          if (!id) continue;
          var isLead = Number(folderId) === Number(leadsFolder);
          return { id: id, name: hit.name || hit.customer_name || '', isLead: isLead };
        }
      } catch (e2) { /* try next folder */ }
    }
    return null;
  }

  openExistingRecord(found, isEn) {
    var name = found.name ? (' — ' + found.name) : '';
    if (found.isLead) {
      alert(isEn
        ? ('A lead with this phone already exists' + name + '. Opening it.')
        : ('ליד עם מספר טלפון זה כבר קיים' + name + '. פותחים אותו.'));
      window.location.href = 'lead-card.html?customer_id=' + encodeURIComponent(found.id) +
        '&cust_id=' + encodeURIComponent(found.id) + '&id=' + encodeURIComponent(found.id);
    } else {
      alert(isEn
        ? ('A customer with this phone already exists' + name + '. Opening the record.')
        : ('לקוח עם מספר טלפון זה כבר קיים' + name + '. פותחים את הכרטיס.'));
      window.location.href = 'service-customer-card.html?customer_id=' + encodeURIComponent(found.id) +
        '&cust_id=' + encodeURIComponent(found.id) + '&id=' + encodeURIComponent(found.id);
    }
  }
  async submit() {
    if (this.state.submitting) return;
    var isEn = this.isEn();
    if (!this.state.name || !this.state.phone) {
      alert(isEn
        ? 'Please fill the required fields (name and phone)'
        : 'נא למלא את השדות החובה (שם וטלפון)');
      return;
    }
    var salespersonId = String(this.state.salespersonId || '').trim();
    if (!salespersonId) {
      salespersonId = this.memberId(this.loggedInMember(this.state.teamMembers));
    }
    if (!salespersonId) {
      alert(this.t('Please select a responsible salesperson.', 'יש לבחור איש מכירות אחראי.'));
      return;
    }
    this.setState({ submitting: true, error: '' });
    try {
      var folderId = this.leadsFolderId();
      var statusId = String(this.state.status || '').trim();
      var city = String(this.state.city || '').trim();
      var address = this.composedAddress(isEn);

      var payload = {
        name: this.state.name,
        phone: this.state.phone,
        email: this.state.email || '',
        address: address,
        city: city,
        source: this.state.source || '',
        note: this.state.comments || '',
        folder_id: folderId,
        user_id: /^\d+$/.test(salespersonId) ? Number(salespersonId) : salespersonId,
        customer_manager: salespersonId,
        team_member_id: salespersonId
      };
      if (statusId) {
        payload.status_id = /^\d+$/.test(statusId) ? Number(statusId) : statusId;
      }

      const res = await MineralBarApp.createCustomer(payload);
      if (res && res.ok) {
        window.location.href = 'leads-list.html?refresh=' + Date.now();
      } else {
        var failMsg = (res && res.raw && res.raw.message) || (isEn ? 'Failed to add lead' : 'הוספת ליד נכשלה');
        var failErr = { message: failMsg, raw: res && res.raw };
        if (this.isAlreadyExistsError(failErr) || this.isAlreadyExistsError(res && res.raw)) {
          var existing = await this.findExistingByPhone(this.state.phone);
          if (!existing && this.existingIdFromError(failErr)) {
            existing = { id: this.existingIdFromError(failErr), name: '', isLead: true };
          }
          if (existing) {
            this.openExistingRecord(existing, isEn);
            return;
          }
        }
        this.setState({ error: failMsg });
        alert((isEn ? 'Error: ' : 'שגיאה: ') + failMsg);
      }
    } catch (e) {
      if (this.isAlreadyExistsError(e)) {
        try {
          var found = await this.findExistingByPhone(this.state.phone);
          if (!found && this.existingIdFromError(e)) {
            found = { id: this.existingIdFromError(e), name: '', isLead: true };
          }
          if (found) {
            this.openExistingRecord(found, isEn);
            return;
          }
        } catch (e2) { /* ignore lookup failure */ }
      }
      const err = String(e.message || e);
      this.setState({ error: err });
      alert((isEn ? 'Error: ' : 'שגיאה: ') + err);
    } finally {
      this.setState({ submitting: false });
    }
  }
}
</script>
