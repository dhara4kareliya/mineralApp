<x-dc>
<helmet>

<div style="width:392px; max-width:100%; background:#0f1828; border-radius:34px; padding:9px; box-shadow:0 24px 60px rgba(15,24,40,.34);">
<div style="background:#eef0f3; border-radius:26px; overflow:hidden; position:relative; height:812px; display:flex; flex-direction:column;">

<span style="width:22px; height:5px; border-radius:99px; background:#3c8be0;"></span>

</div>
</div>

</div>
<div style="flex:1;">
<div style="font-size:14.5px; font-weight:800; color:#1f2a3a;">new customer</div>
<div style="font-size:12px; color:#8a93a3; margin-top:1px;">Opening a call to a client who is not in the system</div>

<!-- new-customer quick form -->
<sc-if hint-placeholder-val="{{ false }}" value="{{ newOpen }}">

<div style="flex:1;">

</div>
<div style="flex:1;">
<label style="display:block; font-size:12px; color:#7b8595; font-weight:600; margin-bottom:6px;">floor</label>

<svg fill="none" height="12" stroke="#b6bdc8" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="12"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.2.4 2.4.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.3 1z"></path></svg>
                  {{ c.phone }}
                </span>
<span style="display:inline-flex; align-items:center; gap:4px; font-size:12px; color:#7b8595;">
<svg fill="none" height="12" stroke="#b6bdc8" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="12"><path d="M12 21s-7-5.6-7-11a7 7 0 0 1 14 0c0 5.4-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>

</div>
<svg fill="none" height="18" stroke="#1d60a2" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" viewbox="0 0 24 24" width="18"><path d="M20 6 9 17l-5-5"></path></svg>

<button disabled="{{ nextDisabled }}" onclick="{{ goNext }}" style="width:100%; padding:15px; border:none; border-radius:14px; background:{{ nextBg }}; color:{{ nextColor }}; font-size:16px; font-weight:800; cursor:{{ nextCursor }}; display:flex; align-items:center; justify-content:center; gap:9px; box-shadow:{{ nextShadow }};">
          {{ nextLabel }}
          <svg fill="none" height="17" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" viewbox="0 0 24 24" width="17"><path d="m14 6-6 6 6 6"></path></svg>

<script data-dc-script="" data-props='{"$preview": {"width": 424, "height": 880}}' type="text/x-dc">
class Component extends DCLogic {
  state = {
    query: '',
    selectedId: null,
    newOpen: false,
    nName: '', nPhone: '', nCity: '',
    nStreet: '', nHouse: '', nFloor: '', nApt: '', nEntrance: '',
  };

  AVATARS = [
    { bg: '#e6f0fb', color: '#1d60a2' },
    { bg: '#e9f4ec', color: '#2e8a63' },
    { bg: '#f3eefb', color: '#6a4fa0' },
    { bg: '#fdf1dd', color: '#bd8324' },
    { bg: '#fbeeed', color: '#c0392b' },
  ];

  CUSTOMERS = [];

  componentDidMount() {
    this.loadCustomers();
    window.addEventListener('mineralbar:ready', () => this.loadCustomers());
    if (window.MineralBarApp && MineralBarApp.bindLiveReload) {
      MineralBarApp.bindLiveReload(() => this.loadCustomers(), { keys: /customer|lead|crm|socket\.nudge/i, delay: 350 });
    }
    window.addEventListener('mineralbar:page-refresh', (ev) => this.onRealtimeRefresh(ev));
    window.addEventListener('mineralbar:realtime', (ev) => this.onRealtimeRefresh(ev));
    window.addEventListener('mineralbar:leads', (ev) => this.onRealtimeRefresh(ev));
  }

  onRealtimeRefresh(ev) {
    var detail = (ev && ev.detail) || {};
    var key = String(detail.key || '').toLowerCase();
    var group = String(detail.group || '').toLowerCase();
    var relevant =
      !key ||
      /customer|lead|crm/.test(key) ||
      group === 'leads' ||
      group === 'other' ||
      group === 'unknown';
    if (!relevant) return;
    clearTimeout(this._rtCustTimer);
    this._rtCustTimer = setTimeout(() => this.loadCustomers(), 350);
  }

  async loadCustomers() {
    try {
      if (!window.MineralBarApp) return;
      const res = await window.MineralBarApp.listCustomers({ length: 100 });
      if (res && res.data) {
        this.CUSTOMERS = res.data.map((c, i) => {
          var phone = String(c.mobile || c.phone || c.cellular || '').trim();
          var city = String(c.city || c.address || '').trim();
          var name = String(c.company || c.name || '').trim();
          return {
            id: String(c.customer_id || c.id || ''),
            name: name || '--',
            phone: phone || '--',
            email: c.email || c.e_mail || '',
            city: city || '--',
            address: c.address || '',
            open: 0 // Optional: Could be matched with tickets if needed
          };
        });
        this.forceUpdate();
      }
    } catch (e) {
      console.error('Failed to load customers', e);
    }
  }

  initials(name) {
    const parts = (name || '').trim().split(/\s+/);
    if (parts.length === 1) return parts[0].slice(0, 2);
    return parts[0][0] + parts[1][0];
  }

  onSearch(e) { this.setState({ query: e.target.value }); }
  clearSearch() { this.setState({ query: '' }); }
  toggleNew() { this.setState(s => ({ newOpen: !s.newOpen, selectedId: s.newOpen ? s.selectedId : null })); }
  pick(id) { this.setState({ selectedId: id == null ? null : String(id), newOpen: false }); }

  filtered() {
    const q = this.state.query.trim().toLowerCase();
    if (!q) return this.CUSTOMERS;
    return this.CUSTOMERS.filter(c =>
      c.name.toLowerCase().includes(q) ||
      c.phone.replace(/[-\s]/g, '').includes(q.replace(/[-\s]/g, '')) ||
      c.city.toLowerCase().includes(q)
    );
  }

  proceed(name) {
    try { localStorage.setItem('mineral_new_call_customer', JSON.stringify(name)); } catch (e) {}
    window.location.href = 'service-open-call.html';
  }

  fullAddress() {
    const s = this.state;
    const street = [s.nStreet.trim(), s.nHouse.trim()].filter(Boolean).join(' ');
    const extra = [];
    if (s.nEntrance.trim()) extra.push('כניסה ' + s.nEntrance.trim());
    if (s.nFloor.trim()) extra.push('קומה ' + s.nFloor.trim());
    if (s.nApt.trim()) extra.push('דירה ' + s.nApt.trim());
    return [street, extra.join(', '), s.nCity.trim()].filter(Boolean).join(', ');
  }

  saveNew() {
    const s = this.state;
    if (!s.nName.trim() || !s.nPhone.trim() || !s.nCity.trim() || !s.nStreet.trim()) return;
    this.proceed({
      name: s.nName.trim(), phone: s.nPhone.trim(), city: s.nCity.trim(),
      address: this.fullAddress(), isNew: true, customer_id: '', id: '',
    });
  }

  goNext() {
    const c = this.CUSTOMERS.find(x => String(x.id) === String(this.state.selectedId));
    if (!c) return;
    this.proceed({
      name: c.name,
      phone: c.phone,
      email: c.email,
      city: c.city,
      address: c.address,
      isNew: false,
      customer_id: c.id,
      id: c.id,
    });
  }

  renderVals() {
    const st = this.state;
    const list = this.filtered();
    const sel = this.CUSTOMERS.find(c => String(c.id) === String(st.selectedId));

    const results = list.map((c, i) => {
      const on = String(c.id) === String(st.selectedId);
      const av = this.AVATARS[i % this.AVATARS.length];
      return {
        name: c.name, phone: c.phone, city: c.city, product: c.product,
        initials: this.initials(c.name),
        pick: () => this.pick(c.id),
        selected: on,
        openCount: c.open > 0, openLabel: c.open + (c.open === 1 ? ' קריאה פתוחה' : ' קריאות פתוחות'),
        bg: on ? '#f3f8fe' : '#fff',
        border: on ? '#1d60a2' : '#eceff3',
        avatarBg: on ? '#1d60a2' : av.bg, avatarColor: on ? '#fff' : av.color,
        radioBorder: on ? '#1d60a2' : '#cfd6df', radioBg: on ? '#1d60a2' : '#fff',
      };
    });

    const newReady = st.nName.trim() && st.nPhone.trim() && st.nCity.trim() && st.nStreet.trim();
    const hasSel = !!sel;

    return {
      query: st.query,
      hasQuery: st.query.length > 0,
      searchPadEnd: st.query.length > 0 ? '40px' : '14px',
      onSearch: (e) => this.onSearch(e),
      clearSearch: () => this.clearSearch(),

      newOpen: st.newOpen,
      toggleNew: () => this.toggleNew(),
      newCardBg: st.newOpen ? '#f3f8fe' : '#fff',
      newCardBorder: st.newOpen ? '#1d60a2' : '#cdddef',
      newCardBorderStyle: st.newOpen ? 'solid' : 'dashed',
      newIconBg: st.newOpen ? '#1d60a2' : '#3c8be0',
      newChevronRot: st.newOpen ? '180deg' : '0deg',

      nName: st.nName, nPhone: st.nPhone, nCity: st.nCity,
      nStreet: st.nStreet, nHouse: st.nHouse, nFloor: st.nFloor, nApt: st.nApt, nEntrance: st.nEntrance,
      onNName: (e) => this.setState({ nName: e.target.value }),
      onNPhone: (e) => this.setState({ nPhone: e.target.value }),
      onNCity: (e) => this.setState({ nCity: e.target.value }),
      onNStreet: (e) => this.setState({ nStreet: e.target.value }),
      onNHouse: (e) => this.setState({ nHouse: e.target.value }),
      onNFloor: (e) => this.setState({ nFloor: e.target.value }),
      onNApt: (e) => this.setState({ nApt: e.target.value }),
      onNEntrance: (e) => this.setState({ nEntrance: e.target.value }),
      saveNew: () => this.saveNew(),
      newDisabled: !newReady,
      saveBg: newReady ? '#1d60a2' : '#b9c4d2',
      saveCursor: newReady ? 'pointer' : 'not-allowed',

      listLabel: st.query.trim() ? 'Search results' : 'Recent customers',
      resultCount: list.length,
      results,
      isEmpty: list.length === 0,

      hasSelection: hasSel,
      selName: sel ? sel.name : '',
      selInitials: sel ? this.initials(sel.name) : '',
      goNext: () => this.goNext(),
      nextDisabled: !hasSel,
      nextLabel: hasSel ? 'Continue to ticket details' : 'Select customer to continue',
      nextBg: hasSel ? '#1d60a2' : '#e3e7ed',
      nextColor: hasSel ? '#fff' : '#9aa3b0',
      nextCursor: hasSel ? 'pointer' : 'not-allowed',
      nextShadow: hasSel ? '0 6px 16px rgba(29,96,162,.28)' : 'none',
    };
  }
}
</script>
</body>
</html>
