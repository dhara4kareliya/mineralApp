<!DOCTYPE html>

<html>
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<script>document.write('<script src="./asset-version.js?_='+Date.now()+'"><\/script>');</script>
<script>
mbScripts([
  './support.js',
  './biz1-sdk.js',
  './biz1-app.js',
  './page-boot.js',
  './live-sync.js',
  './i18n-translations.js',
  './common-header-footer.js'
]);
mbCss('./common.css');

<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; direction: rtl; font-family: 'Heebo', sans-serif; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font-family: 'Heebo', sans-serif; }
  .dc-scroll::-webkit-scrollbar { width: 0; }
  .ds-input::placeholder { color: #aeb6c2; }
  .ssc-truncate {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }
  .ssc-name-row {
    display: flex;
    align-items: center;
    gap: 7px;
    min-width: 0;
  }
  .ssc-name {
    flex: 1;
    min-width: 0;
    font-size: 15px;
    font-weight: 800;
    color: #1f2a3a;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .ssc-meta-row {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-top: 3px;
    min-width: 0;
    overflow: hidden;
  }
  .ssc-meta-item {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    color: #7b8595;
    min-width: 0;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex-shrink: 1;
  }
  .ssc-product {
    font-size: 11.5px;
    color: #9aa3b0;
    margin-top: 3px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .ssc-footer-name {
    font-size: 13px;
    font-weight: 800;
    color: #194f84;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
</style>
</helmet>
<div style="min-height:100vh; background:#e6e8ec; display:flex; align-items:flex-start; justify-content:center; padding:26px 16px;">
<div style="width:392px; max-width:100%; background:#0f1828; border-radius:34px; padding:9px; box-shadow:0 24px 60px rgba(15,24,40,.34);">
<div style="background:#eef0f3; border-radius:26px; overflow:hidden; position:relative; height:812px; display:flex; flex-direction:column;">
<!-- navy header -->
<div style="background:#16223a; padding:13px 16px 16px; flex:none;">
<div style="display:flex; align-items:center; gap:11px;">
<a href="{{ closeUrl }}" onclick="{{ onClose }}" style="width:34px; height:34px; border-radius:50%; border:none; background:rgba(255,255,255,.12); color:#fff; font-size:15px; cursor:pointer; flex:none; display:flex; align-items:center; justify-content:center; text-decoration:none;">✕</a>
<div style="flex:1;">
<div style="font-size:16px; font-weight:800; color:#fff;">New service call</div>
<div style="font-size:11.5px; color:#9fb0c8; margin-top:2px;">Step 1 of 2 · Customer association</div>
</div>
<div style="display:flex; gap:5px; align-items:center; flex:none;">
<span style="width:22px; height:5px; border-radius:99px; background:#3c8be0;"></span>
<span style="width:22px; height:5px; border-radius:99px; background:rgba(255,255,255,.18);"></span>
</div>
</div>
<!-- search bar -->
<div style="position:relative; margin-top:14px;">
<svg fill="none" height="18" stroke="#8a93a3" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" style="position:absolute; inset-inline-start:13px; top:50%; transform:translateY(-50%); pointer-events:none; z-index:1;" viewbox="0 0 24 24" width="18"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
<input class="ds-input mb-search" oninput="{{ onSearch }}" placeholder="Customer search by name, phone or address" style="width:100%; box-sizing:border-box; padding-block:13px; padding-inline-start:42px; padding-inline-end:{{ searchPadEnd }}; border:none; border-radius:13px; font-size:14.5px; color:#1f2a3a; text-align:start; background:#fff; outline:none;" value="{{ query }}"/>
<sc-if hint-placeholder-val="{{ false }}" value="{{ hasQuery }}">
<button type="button" onclick="{{ clearSearch }}" aria-label="Clear search" style="position:absolute; inset-inline-end:9px; top:50%; transform:translateY(-50%); width:24px; height:24px; border-radius:50%; border:none; background:#eef0f3; color:#8a93a3; font-size:13px; cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:2;">✕</button>

</div>
</div>
<div class="dc-scroll" style="flex:1; overflow-y:auto; padding:16px 16px 16px;">
<!-- add-new-customer card -->
<button type="button" onclick="{{ toggleNew }}" style="width:100%; display:flex; align-items:center; gap:12px; background:{{ newCardBg }}; border:1.6px {{ newCardBorderStyle }} {{ newCardBorder }}; border-radius:15px; padding:13px 14px; cursor:pointer; text-align:start; margin-bottom:16px;">
<svg fill="none" height="20" stroke="#1d60a2" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" style="flex:none; transform:rotate({{ newChevronRot }}); transition:transform .2s;" viewbox="0 0 24 24" width="20"><path d="m6 9 6 6 6-6"></path></svg>

</div>
<div style="width:42px; height:42px; border-radius:12px; background:{{ newIconBg }}; color:#fff; flex:none; display:flex; align-items:center; justify-content:center;">

<div style="margin-bottom:11px;">

<input class="ds-input" oninput="{{ onNPhone }}" placeholder="050-0000000" style="width:100%; padding:11px 13px; border:1.5px solid #dde2ea; border-radius:11px; font-size:14px; color:#1f2a3a; text-align:start; background:#fff;" value="{{ nPhone }}"/>

</div>
<div style="flex:1;">
<label style="display:block; font-size:12px; color:#7b8595; font-weight:600; margin-bottom:6px;">City <span style="color:#c0392b;">*</span></label>
<input class="ds-input" oninput="{{ onNCity }}" placeholder="City" style="width:100%; padding:11px 13px; border:1.5px solid #dde2ea; border-radius:11px; font-size:14px; color:#1f2a3a; text-align:start; background:#fff;" value="{{ nCity }}"/>

</div>
<div style="display:flex; gap:9px; margin-bottom:13px;">

<div style="flex:1;">

                  {{ c.phone }}
                </span>
<span class="ssc-meta-item">
<svg fill="none" height="12" stroke="#b6bdc8" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="12" style="flex:none;"><path d="M12 21s-7-5.6-7-11a7 7 0 0 1 14 0c0 5.4-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
                  {{ c.city }}

<sc-if hint-placeholder-val="{{ false }}" value="{{ hasSelection }}">
<div style="display:flex; align-items:center; gap:9px; background:#eaf2fb; border-radius:12px; padding:9px 12px; margin-bottom:11px;">
<div style="width:32px; height:32px; border-radius:50%; background:#2f6aa6; color:#fff; font-weight:800; font-size:12px; flex:none; display:flex; align-items:center; justify-content:center;">{{ selInitials }}</div>
<div style="flex:1; min-width:0;">

</div>
<svg fill="none" height="18" stroke="#1d60a2" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" viewbox="0 0 24 24" width="18"><path d="M20 6 9 17l-5-5"></path></svg>

          {{ nextLabel }}
          <svg fill="none" height="17" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" viewbox="0 0 24 24" width="17"><path d="m14 6-6 6 6 6"></path></svg>

</div>
</div>
</x-dc>
<script data-dc-script="" data-props='{"$preview": {"width": 424, "height": 880}}' type="text/x-dc">
class Component extends DCLogic {
  state = {
    query: '',
    selectedId: null,
    newOpen: false,
    savingNew: false,
    saveError: '',
    nName: '', nPhone: '', nCity: '',
    nStreet: '', nHouse: '', nFloor: '', nApt: '', nEntrance: '',
    langTick: 0,
  };

  isEn() {
    return typeof getCurrentLanguage === 'function' && getCurrentLanguage() === 'en';
  }

  t(en, he) {
    return this.isEn() ? en : he;
  }

  AVATARS = [
    { bg: '#e6f0fb', color: '#1d60a2' },
    { bg: '#e9f4ec', color: '#2e8a63' },
    { bg: '#f3eefb', color: '#6a4fa0' },
    { bg: '#fdf1dd', color: '#bd8324' },
    { bg: '#fbeeed', color: '#c0392b' },
  ];

  CUSTOMERS = [];

  componentDidMount() {
    if (window.LiveSync && typeof LiveSync.bind === 'function') {
      LiveSync.bind(() => { var soft = { silent: true }; if (typeof this.initData === 'function') this.initData(soft); else if (typeof this.load === 'function') this.load(soft); }, { retries: true, keys: /ticket|mission|task|customer|lead|product|socket\.nudge/i, delay: 350 });
    }

    var self = this;
    document.addEventListener('click', function (e) {
      if (e.target && e.target.closest && e.target.closest('.lang-translator-btn, #btn-lang-toggle')) {
        setTimeout(function () { self.setState({ langTick: Date.now() }); }, 80);
      }
    });
    window.addEventListener('mineralbar:language-changed', function () {
      self.setState({ langTick: Date.now() });
    });

    this.loadCustomers();
    window.addEventListener('mineralbar:ready', () => this.loadCustomers());
    if (window.MineralBarApp && MineralBarApp.bindLiveReload) {
      MineralBarApp.bindLiveReload(() => this.loadCustomers(), { keys: /customer|lead|crm|socket\.nudge/i, delay: 350 });
    }
    window.addEventListener('mineralbar:page-refresh', (ev) => this.onRealtimeRefresh(ev));
    window.addEventListener('mineralbar:realtime', (ev) => this.onRealtimeRefresh(ev));
    window.addEventListener('mineralbar:leads', (ev) => this.onRealtimeRefresh(ev));
  }

  onRealtimeRefresh(ev) {
    var detail = (ev && ev.detail) || {};
    var key = String(detail.key || '').toLowerCase();
    var group = String(detail.group || '').toLowerCase();
    var relevant =
      !key ||
      /customer|lead|crm/.test(key) ||
      group === 'leads' ||
      group === 'other' ||
      group === 'unknown';
    if (!relevant) return;
    clearTimeout(this._rtCustTimer);
    this._rtCustTimer = setTimeout(() => this.loadCustomers(), 350);
  }

  async loadCustomers() {
    try {
      if (!window.MineralBarApp) return;
      const res = await window.MineralBarApp.listCustomers({ length: 100 });
      if (res && res.data) {
        this.CUSTOMERS = res.data.map((c, i) => {
          var phone = String(c.mobile || c.phone || c.cellular || '').trim();
          // Never fall back to address — that put "Rothschild Blvd 45" into City/Area
          var city = String(c.city || c.city_name || '').trim();
          var name = String(c.company || c.name || '').trim();
          return {
            id: String(c.customer_id || c.id || ''),
            name: name || '--',
            phone: phone || '--',
            email: c.email || c.e_mail || '',
            city: city || '',
            address: c.address || '',
            open: 0 // Optional: Could be matched with tickets if needed
          };
        });
        this.forceUpdate();
      }
    } catch (e) {
      console.error('Failed to load customers', e);
    }
  }

  initials(name) {
    const parts = (name || '').trim().split(/\s+/);
    if (parts.length === 1) return parts[0].slice(0, 2);
    return parts[0][0] + parts[1][0];
  }

  onSearch(e) { this.setState({ query: e.target.value }); }
  clearSearch() { this.setState({ query: '' }); }
  toggleNew() {
    this.setState(s => ({
      newOpen: !s.newOpen,
      selectedId: s.newOpen ? s.selectedId : null,
      saveError: ''
    }));
  }
  pick(id) { this.setState({ selectedId: id == null ? null : String(id), newOpen: false }); }

  filtered() {
    const q = this.state.query.trim().toLowerCase();
    if (!q) return this.CUSTOMERS;
    return this.CUSTOMERS.filter(c =>
      c.name.toLowerCase().includes(q) ||
      c.phone.replace(/[-\s]/g, '').includes(q.replace(/[-\s]/g, '')) ||
      c.city.toLowerCase().includes(q)
    );
  }

  proceed(name) {
    try { localStorage.setItem('mineral_new_call_customer', JSON.stringify(name)); } catch (e) {}
    window.location.href = 'service-open-call.html';
  }

  fullAddress() {
    const s = this.state;
    const street = [s.nStreet.trim(), s.nHouse.trim()].filter(Boolean).join(' ');
    const extra = [];
    if (s.nEntrance.trim()) extra.push('כניסה ' + s.nEntrance.trim());
    if (s.nFloor.trim()) extra.push('קומה ' + s.nFloor.trim());
    if (s.nApt.trim()) extra.push('דירה ' + s.nApt.trim());
    return [street, extra.join(', '), s.nCity.trim()].filter(Boolean).join(', ');
  }

  async saveNew() {
    const s = this.state;
    if (!s.nName.trim() || !s.nPhone.trim() || !s.nCity.trim() || !s.nStreet.trim() || s.savingNew) return;

    this.setState({ savingNew: true, saveError: '' });
    var customerPayload = {
      name: s.nName.trim(),
      phone: s.nPhone.trim(),
      city: s.nCity.trim(),
      address: this.fullAddress(),
      folder_id: (window.MineralBarApp && MineralBarApp.FOLDERS && MineralBarApp.FOLDERS.CUSTOMERS) || 2
    };

    var newId = '';
    try {
      if (window.MineralBarApp && typeof MineralBarApp.createCustomer === 'function') {
        var res = await MineralBarApp.createCustomer(customerPayload);
        newId = String((res && res.id) || (res && res.raw && (res.raw.insert_id || res.raw.customer_id)) || '').trim();
      }
    } catch (e) {
      console.warn('[service-select-customer] createCustomer failed, continuing as new client', e);
    }

    this.proceed({
      name: s.nName.trim(),
      phone: s.nPhone.trim(),
      city: s.nCity.trim(),
      area: '',
      street: s.nStreet.trim(),
      building: s.nHouse.trim(),
      house: s.nHouse.trim(),
      entrance: s.nEntrance.trim(),
      floor: s.nFloor.trim(),
      apartment: s.nApt.trim(),
      address: this.fullAddress(),
      isNew: !newId,
      customer_id: newId,
      id: newId,
    });
  }

  goNext() {
    const c = this.CUSTOMERS.find(x => String(x.id) === String(this.state.selectedId));
    if (!c) return;
    this.proceed({
      name: c.name,
      phone: c.phone,
      email: c.email,
      // Do not copy free-text address into city/area
      city: '',
      area: '',
      street: '',
      building: '',
      floor: '',
      apartment: '',
      entrance: '',
      address: '',
      isNew: false,
      customer_id: c.id,
      id: c.id,
    });
  }

  renderVals() {
    const st = this.state;
    void st.langTick;
    const list = this.filtered();
    const sel = this.CUSTOMERS.find(c => String(c.id) === String(st.selectedId));

    const results = list.map((c, i) => {
      const on = String(c.id) === String(st.selectedId);
      const av = this.AVATARS[i % this.AVATARS.length];
      return {
        name: c.name, phone: c.phone, city: c.city, product: c.product,
        initials: this.initials(c.name),
        pick: () => this.pick(c.id),
        selected: on,
        openCount: c.open > 0, openLabel: c.open + (c.open === 1 ? ' קריאה פתוחה' : ' קריאות פתוחות'),
        bg: on ? '#f3f8fe' : '#fff',
        border: on ? '#1d60a2' : '#eceff3',
        avatarBg: on ? '#1d60a2' : av.bg, avatarColor: on ? '#fff' : av.color,
        radioBorder: on ? '#1d60a2' : '#cfd6df', radioBg: on ? '#1d60a2' : '#fff',
      };
    });

    const newReady = st.nName.trim() && st.nPhone.trim() && st.nCity.trim() && st.nStreet.trim() && !st.savingNew;
    const hasSel = !!sel;

    return {
      query: st.query,
      hasQuery: st.query.length > 0,
      searchPadEnd: st.query.length > 0 ? '40px' : '14px',
      onSearch: (e) => this.onSearch(e),
      clearSearch: () => this.clearSearch(),
      closeUrl: (typeof window.mbResolveEntryBack === 'function'
        ? window.mbResolveEntryBack({ fallback: 'service-all-calls.html', selfRe: /service-select-customer/i })
        : 'service-all-calls.html') || 'service-all-calls.html',
      onClose: (e) => {
        if (typeof window.mbGoEntryBack === 'function') {
          window.mbGoEntryBack(e, { fallback: 'service-all-calls.html', selfRe: /service-select-customer/i, allowHistory: false });
          return;
        }
        window.location.href = 'service-all-calls.html';
      },

      newOpen: st.newOpen,
      toggleNew: () => this.toggleNew(),
      newCardBg: st.newOpen ? '#f3f8fe' : '#fff',
      newCardBorder: st.newOpen ? '#1d60a2' : '#cdddef',
      newCardBorderStyle: st.newOpen ? 'solid' : 'dashed',
      newIconBg: st.newOpen ? '#1d60a2' : '#3c8be0',
      newChevronRot: st.newOpen ? '180deg' : '0deg',

      nName: st.nName, nPhone: st.nPhone, nCity: st.nCity,
      nStreet: st.nStreet, nHouse: st.nHouse, nFloor: st.nFloor, nApt: st.nApt, nEntrance: st.nEntrance,
      onNName: (e) => this.setState({ nName: e.target.value, saveError: '' }),
      onNPhone: (e) => this.setState({ nPhone: e.target.value, saveError: '' }),
      onNCity: (e) => this.setState({ nCity: e.target.value, saveError: '' }),
      onNStreet: (e) => this.setState({ nStreet: e.target.value, saveError: '' }),
      onNHouse: (e) => this.setState({ nHouse: e.target.value, saveError: '' }),
      onNFloor: (e) => this.setState({ nFloor: e.target.value, saveError: '' }),
      onNApt: (e) => this.setState({ nApt: e.target.value, saveError: '' }),
      onNEntrance: (e) => this.setState({ nEntrance: e.target.value, saveError: '' }),
      saveNew: () => this.saveNew(),
      saveError: st.saveError || '',
      newDisabled: !newReady,
      saveBg: newReady ? '#1d60a2' : '#b9c4d2',
      saveCursor: newReady ? 'pointer' : 'not-allowed',
      saveLabel: st.savingNew
        ? this.t('Saving…', 'שומר…')
        : this.t('Save and continue', 'שמירה והמשך'),

      listLabel: st.query.trim()
        ? (this.t('Search results', 'תוצאות חיפוש') + ' (' + list.length + ')')
        : (this.t('Customers', 'לקוחות') + ' ' + list.length),
      listSubLabel: st.query.trim() ? '' : this.t('Recent customers', 'לקוחות אחרונים'),
      resultCount: list.length,
      results,
      isEmpty: list.length === 0,

      hasSelection: hasSel,
      selName: sel ? sel.name : '',
      selInitials: sel ? this.initials(sel.name) : '',
      goNext: () => this.goNext(),
      nextDisabled: !hasSel,
      nextLabel: hasSel
        ? this.t('Continue to ticket details', 'המשך לפרטי הטיקט')
        : this.t('Select a customer to continue', 'בחר לקוח להמשך'),
      nextBg: hasSel ? '#1d60a2' : '#e3e7ed',
      nextColor: hasSel ? '#fff' : '#9aa3b0',
      nextCursor: hasSel ? 'pointer' : 'not-allowed',
      nextShadow: hasSel ? '0 6px 16px rgba(29,96,162,.28)' : 'none',
    };
  }
}
</script>
</body>
</html>
