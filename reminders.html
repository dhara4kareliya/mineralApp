<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<script>document.write('<script src="./asset-version.js?_='+Date.now()+'"><\/script>');</script>
<script>
mbScripts([
  './support.js',
  './biz1-sdk.js',
  './biz1-app.js',
  './page-boot.js',
  './live-sync.js',
  './i18n-translations.js',
  './common-header-footer.js'
]);
mbCss('./common.css');
</script>
</head>
<body data-role="service" data-active-tab="messages" data-header-title="reminders">
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; font-family: 'Heebo', sans-serif; -webkit-font-smoothing: antialiased; }
  button, input, textarea, select { font-family: 'Heebo', sans-serif; }
  .dc-scroll::-webkit-scrollbar { width: 0; height: 0; }
  .rm-sec-label {
    font-size: 13px;
    font-weight: 700;
    color: #9aa3b0;
    margin-bottom: 10px;
  }
  .rm-chip {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 10px 14px;
    border-radius: 99px;
    border: 1.5px solid #e4e8ee;
    background: #fff;
    color: #5a6473;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    line-height: 1.25;
  }
  .rm-chip.is-on {
    background: #f6eee4;
    border-color: #c9a882;
    color: #8a6540;
  }
  .rm-via {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    padding: 14px 12px;
    border-radius: 14px;
    border: 1.6px solid #e4e8ee;
    background: #fff;
    color: #5a6473;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
  }
  .rm-via.is-on {
    background: #eaf2fb;
    border-color: #6ea6d8;
    color: #1d60a2;
  }
  .rm-sched {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    border: 1.5px solid #e4e8ee;
    border-radius: 14px;
    background: #fff;
    cursor: pointer;
    min-width: 0;
  }
  .rm-sched input {
    border: none;
    outline: none;
    background: transparent;
    font-size: 16px;
    font-weight: 800;
    color: #1f2a3a;
    width: 100%;
    min-width: 0;
    padding: 0;
  }
  .rm-sched .rm-sched-meta {
    flex: 1;
    min-width: 0;
  }
  .rm-sched .rm-sched-label {
    font-size: 11px;
    font-weight: 700;
    color: #9aa3b0;
    margin-bottom: 2px;
  }
  .rm-sched .rm-sched-value {
    font-size: 16px;
    font-weight: 800;
    color: #1f2a3a;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #rm-sched-picker {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 120;
    display: none;
    background: #fff;
    border: 1px solid #e4e8ee;
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 12px 30px rgba(15, 24, 40, 0.2);
    box-sizing: border-box;
  }
  #rm-sched-picker.rm-open { display: block; }
  .rm-picker-title {
    font-size: 16px;
    font-weight: 800;
    color: #1f2a3a;
    margin-bottom: 14px;
  }
  .rm-picker-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-bottom: 10px;
  }
  .rm-picker-grid.rm-picker-time {
    grid-template-columns: 1fr 1fr;
  }
  .rm-picker-grid input {
    width: 100%;
    min-width: 0;
    padding: 10px 7px;
    border: 1.5px solid #e4e8ee;
    border-radius: 10px;
    background: #fff;
    color: #1f2a3a;
    font: 700 14px Heebo, sans-serif;
    text-align: center;
  }
  .rm-picker-actions {
    display: flex;
    gap: 8px;
    margin-top: 14px;
  }
  .rm-picker-actions button {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    font: 700 13px Heebo, sans-serif;
    cursor: pointer;
  }
  .rm-sheet {
    position: absolute;
    top: 48px;
    left: 0;
    right: 0;
    bottom: 0;
    background: #fff;
    border-radius: 26px 26px 0 0;
    box-shadow: 0 -10px 40px rgba(15,24,40,.12);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    z-index: 81;
  }
  .rm-sheet-body {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 0 18px 12px;
    min-height: 0;
  }
  .rm-sheet-actions {
    flex: none;
    padding: 12px 18px calc(18px + env(safe-area-inset-bottom, 0px));
    background: #fff;
    border-top: 1px solid #f0f2f5;
    position: relative;
    z-index: 2;
  }
</style>
</helmet>

<div style="min-height:100vh; background:#e6e8ec; display:flex; align-items:flex-start; justify-content:center; padding:26px 16px;">
<div style="width:392px; max-width:100%; background:#0f1828; border-radius:34px; padding:9px; box-shadow:0 24px 60px rgba(15,24,40,.34);">
<div class="screen-card" style="background:#eef0f3; border-radius:26px; overflow:hidden; position:relative; height:812px; display:flex; flex-direction:column;">

<!-- chat context peeking behind -->
<div style="flex:1; overflow:hidden; display:flex; flex-direction:column; opacity:.55; pointer-events:none;">
  <div style="background:#fff; padding:12px 16px; border-bottom:1px solid #eef0f3; flex:none;">
    <div style="display:flex; align-items:center; gap:12px;">
      <div style="width:44px; height:44px; border-radius:50%; background:#dbe7f8; color:#2f6aa6; font-weight:800; font-size:15px; flex:none; display:flex; align-items:center; justify-content:center;">{{ initials }}</div>
      <div style="flex:1; min-width:0;">
        <div style="font-size:16px; font-weight:800; color:#1f2a3a;">{{ name }}</div>
        <div style="font-size:12.5px; color:#7b8595; margin-top:2px;">{{ phone }}</div>
      </div>
    </div>
  </div>
  <div style="flex:1; background:#eef0f3;"></div>
</div>

<!-- dim + bottom sheet (above common footer) -->
<div style="position:absolute; inset:0; z-index:80;">
  <a href="{{ backUrl }}" style="position:absolute; inset:0; background:#0f1828; opacity:0.38; display:block;" aria-label="Close"></a>
  <div class="rm-sheet">
    <div style="width:42px; height:5px; border-radius:99px; background:#dadfe6; margin:11px auto 0; flex:none;"></div>

    <div style="display:flex; align-items:center; justify-content:space-between; padding:12px 18px 14px; flex:none;">
      <div style="font-size:20px; font-weight:800; color:#1f2a3a;">{{ title }}</div>
      <a href="{{ backUrl }}" style="width:34px; height:34px; border-radius:50%; border:none; background:#eef0f3; color:#7b8595; cursor:pointer; display:flex; align-items:center; justify-content:center; flex:none; text-decoration:none;">
        <svg fill="none" height="15" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" viewBox="0 0 24 24" width="15"><path d="M18 6 6 18M6 6l12 12"></path></svg>
      </a>
    </div>

    <div class="rm-sheet-body dc-scroll">
      <!-- templates -->
      <div class="rm-sec-label">{{ labelTemplate }}</div>
      <div style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:22px;">
        <sc-for as="tpl" hint-placeholder-count="3" list="{{ templates }}">
          <button type="button" class="rm-chip {{ tpl.onClass }}" onclick="{{ tpl.pick }}">{{ tpl.label }}</button>
        </sc-for>
      </div>

      <!-- send via -->
      <div class="rm-sec-label">{{ labelSendVia }}</div>
      <div style="display:flex; gap:10px; margin-bottom:22px;">
        <button type="button" class="rm-via {{ smsOnClass }}" onclick="{{ pickSms }}">
          <svg fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9" viewBox="0 0 24 24" width="18"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
          {{ labelSms }}
        </button>
        <button type="button" class="rm-via {{ waOnClass }}" onclick="{{ pickWhatsApp }}">
          <svg fill="#25b35e" height="18" viewBox="0 0 24 24" width="18"><path d="M20.5 3.5A11 11 0 0 0 3.2 17.7L2 22l4.4-1.15A11 11 0 1 0 20.5 3.5zm-8.5 17a9 9 0 0 1-4.6-1.3l-.3-.18-2.7.7.72-2.63-.2-.31A9 9 0 1 1 12 20.5zm4.9-6.7c-.27-.14-1.6-.79-1.85-.88-.25-.09-.43-.14-.61.14-.18.27-.7.88-.86 1.06-.16.18-.32.2-.59.07-.27-.14-1.14-.42-2.17-1.34-.8-.71-1.34-1.59-1.5-1.86-.16-.27-.02-.42.12-.55.12-.12.27-.32.41-.48.14-.16.18-.27.27-.45.09-.18.05-.34-.02-.48-.07-.14-.61-1.47-.84-2.01-.22-.53-.45-.46-.61-.47h-.52c-.18 0-.48.07-.73.34-.25.27-.96.94-.96 2.29s.98 2.66 1.12 2.84c.14.18 1.93 2.95 4.68 4.13.65.28 1.16.45 1.56.57.65.21 1.25.18 1.72.11.53-.08 1.6-.65 1.83-1.28.23-.63.23-1.17.16-1.28-.07-.11-.25-.18-.52-.32z"></path></svg>
          WhatsApp
        </button>
      </div>

      <!-- preview -->
      <div class="rm-sec-label">{{ labelPreview }}</div>
      <div style="display:flex; align-items:center; gap:6px; margin-bottom:8px;">
        <div style="font-size:12.5px; color:#9aa3b0; font-weight:600;">{{ previewHint }}</div>
        <svg fill="none" height="14" stroke="#b6bdc8" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9" viewBox="0 0 24 24" width="14"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      </div>
      <div style="background:#f3f5f8; border-radius:16px; padding:14px 15px; margin-bottom:14px;">
        <sc-if hint-placeholder-val="{{ false }}" value="{{ isFree }}">
          <textarea oninput="{{ onFreeMessage }}" placeholder="{{ freePlaceholder }}" style="width:100%; min-height:96px; border:none; outline:none; resize:none; background:transparent; font-size:14.5px; color:#1f2a3a; line-height:1.55; font-weight:600;" value="{{ freeMessage }}"></textarea>
        </sc-if>
        <sc-if hint-placeholder-val="{{ true }}" value="{{ notFree }}">
          <div style="font-size:15px; font-weight:800; color:#1f2a3a; margin-bottom:6px;">{{ previewHello }}</div>
          <div style="font-size:14px; color:#4a5462; line-height:1.55; font-weight:500;">{{ previewBody }}</div>
        </sc-if>
      </div>

      <!-- schedule -->
      <div class="rm-sec-label">{{ labelSchedule }}</div>
      <div style="display:flex; gap:10px; margin-bottom:14px;">
        <button type="button" class="rm-sched" id="rm-time-box" onclick="{{ openTimePicker }}">
          <svg fill="none" height="18" stroke="#9aa3b0" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9" viewBox="0 0 24 24" width="18" style="flex:none;"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
          <div class="rm-sched-meta">
            <div class="rm-sched-label">{{ labelTime }}</div>
            <div class="rm-sched-value">{{ timeDisplay }}</div>
          </div>
        </button>
        <button type="button" class="rm-sched" id="rm-date-box" onclick="{{ openDatePicker }}">
          <svg fill="none" height="18" stroke="#9aa3b0" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9" viewBox="0 0 24 24" width="18" style="flex:none;"><rect height="18" rx="2" width="18" x="3" y="4"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>
          <div class="rm-sched-meta">
            <div class="rm-sched-label">{{ labelDate }}</div>
            <div class="rm-sched-value">{{ dateDisplay }}</div>
          </div>
        </button>
      </div>

      <sc-if hint-placeholder-val="{{ false }}" value="{{ hasError }}">
        <div style="margin-bottom:12px; padding:11px 13px; border-radius:12px; background:#fbeeed; border:1px solid #f0c9c4; color:#c0392b; font-size:13px; font-weight:700;">{{ saveError }}</div>
      </sc-if>
      <sc-if hint-placeholder-val="{{ false }}" value="{{ saveOk }}">
        <div style="margin-bottom:12px; padding:11px 13px; border-radius:12px; background:#e6f4ec; border:1px solid #b7e0c5; color:#2e8a63; font-size:13px; font-weight:700;">{{ savedLabel }}</div>
      </sc-if>
    </div>

    <div class="rm-sheet-actions">
      <button type="button" onclick="{{ save }}" style="width:100%; display:flex; align-items:center; justify-content:center; gap:10px; padding:16px; border:none; border-radius:16px; background:#6b4f3a; color:#fff; font-size:16px; font-weight:800; cursor:{{ saveCursor }}; box-shadow:0 6px 16px rgba(107,79,58,.28); opacity:{{ saveOpacity }}; pointer-events:{{ savePointer }};">
        {{ saveLabel }}
        <svg fill="none" height="18" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="18"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.7 21a2 2 0 0 1-3.4 0"></path></svg>
      </button>
    </div>
  </div>
</div>

<!-- In-frame schedule picker (kept inside phone border) -->
<div id="rm-sched-picker" role="dialog" aria-modal="true">
  <div id="rm-picker-title" class="rm-picker-title">Date</div>
  <div id="rm-picker-date-grid" class="rm-picker-grid">
    <input id="rm-picker-day" type="number" min="1" max="31" aria-label="Day" placeholder="DD"/>
    <input id="rm-picker-month" type="number" min="1" max="12" aria-label="Month" placeholder="MM"/>
    <input id="rm-picker-year" type="number" min="2000" max="2100" aria-label="Year" placeholder="YYYY"/>
  </div>
  <div id="rm-picker-time-grid" class="rm-picker-grid rm-picker-time">
    <input id="rm-picker-hour" type="number" min="0" max="23" aria-label="Hour" placeholder="HH"/>
    <input id="rm-picker-minute" type="number" min="0" max="59" aria-label="Minute" placeholder="MM"/>
  </div>
  <div class="rm-picker-actions">
    <button type="button" id="rm-picker-cancel" style="border:1.5px solid #e4e8ee; background:#fff; color:#5a6473;">Cancel</button>
    <button type="button" id="rm-picker-apply" style="border:0; background:#6b4f3a; color:#fff;">Apply</button>
  </div>
</div>

</div>
</div>
</div>
</x-dc>

<script data-dc-script="" type="text/x-dc">
class Component extends DCLogic {
  state = {
    customerId: '',
    name: 'Customer',
    phone: '',
    template: 'followup',
    type: 'WhatsApp',
    freeMessage: '',
    dateValue: '',
    timeValue: '14:00',
    saving: false,
    saveError: '',
    saveOk: false,
    langTick: 0
  };

  componentDidMount() {
    this.initData();
    var self = this;
    window.addEventListener('mineralbar:language-changed', function () {
      self.setState({ langTick: Date.now() });
    });
    document.addEventListener('click', function (e) {
      if (e.target.closest('#rm-picker-cancel')) {
        self.closeSchedPicker();
        return;
      }
      if (e.target.closest('#rm-picker-apply')) {
        self.applySchedPicker();
        return;
      }
      var picker = document.getElementById('rm-sched-picker');
      if (!picker || !picker.classList.contains('rm-open')) return;
      if (e.target.closest('#rm-sched-picker, #rm-date-box, #rm-time-box')) return;
      self.closeSchedPicker();
    });
  }

  t(en, he) {
    var enMode = true;
    try {
      if (typeof window.getCurrentLanguage === 'function') enMode = window.getCurrentLanguage() === 'en';
      else if (typeof window.isUiEn === 'function') enMode = !!window.isUiEn();
    } catch (e) { /* ignore */ }
    return enMode ? en : (he || en);
  }

  isEn() {
    try {
      if (typeof window.getCurrentLanguage === 'function') return window.getCurrentLanguage() === 'en';
      if (typeof window.isUiEn === 'function') return !!window.isUiEn();
    } catch (e) { /* ignore */ }
    return true;
  }

  initialsFromName(name) {
    var p = String(name || '').trim().split(/\s+/).filter(Boolean);
    if (!p.length) return '?';
    if (p.length === 1) return p[0].slice(0, 2).toUpperCase();
    return ((p[0][0] || '') + (p[1][0] || '')).toUpperCase();
  }

  firstName(name) {
    var p = String(name || '').trim().split(/\s+/).filter(Boolean);
    return p[0] || this.t('there', 'שלום');
  }

  todayKey() {
    var d = new Date();
    var yyyy = d.getFullYear();
    var mm = String(d.getMonth() + 1).padStart(2, '0');
    var dd = String(d.getDate()).padStart(2, '0');
    return yyyy + '-' + mm + '-' + dd;
  }

  formatDateDisplay(v) {
    var p = String(v || '').split('-');
    if (p.length !== 3) return v || '—';
    return p[2] + ' / ' + p[1] + ' / ' + p[0];
  }

  formatTimeDisplay(v) {
    var parts = String(v || '').split(':');
    var h = parseInt(parts[0], 10);
    var m = parseInt(parts[1], 10);
    if (!isFinite(h) || !isFinite(m)) return '—';
    if (this.isEn()) {
      var ampm = h >= 12 ? 'pm' : 'am';
      var h12 = h % 12;
      if (!h12) h12 = 12;
      return String(h12).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ' ' + ampm;
    }
    return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
  }

  pad2(n) {
    return String(Math.max(0, Number(n) || 0)).padStart(2, '0');
  }

  closeSchedPicker() {
    var picker = document.getElementById('rm-sched-picker');
    if (picker) picker.classList.remove('rm-open');
    this._pickerMode = '';
  }

  positionSchedPicker(anchorId) {
    var picker = document.getElementById('rm-sched-picker');
    var anchor = document.getElementById(anchorId);
    var frame = document.querySelector('.screen-card');
    if (!picker || !anchor || !frame) return;
    var boxRect = anchor.getBoundingClientRect();
    var frameRect = frame.getBoundingClientRect();
    var width = Math.max(200, frameRect.width - 24);
    var left = frameRect.left + 12;
    picker.style.width = width + 'px';
    picker.style.left = left + 'px';
    // Measure after width is set
    var pickerHeight = picker.offsetHeight || 220;
    var top = boxRect.bottom + 8;
    if (top + pickerHeight > frameRect.bottom - 12) {
      top = boxRect.top - pickerHeight - 8;
    }
    top = Math.max(frameRect.top + 12, Math.min(top, frameRect.bottom - pickerHeight - 12));
    picker.style.top = top + 'px';
  }

  openSchedPicker(mode) {
    var picker = document.getElementById('rm-sched-picker');
    if (!picker) return;
    this._pickerMode = mode;
    var title = document.getElementById('rm-picker-title');
    var dateGrid = document.getElementById('rm-picker-date-grid');
    var timeGrid = document.getElementById('rm-picker-time-grid');
    var cancelBtn = document.getElementById('rm-picker-cancel');
    var applyBtn = document.getElementById('rm-picker-apply');
    if (title) title.textContent = mode === 'time' ? this.t('time', 'שעה') : this.t('date', 'תאריך');
    if (cancelBtn) cancelBtn.textContent = this.t('Cancel', 'ביטול');
    if (applyBtn) applyBtn.textContent = this.t('Apply', 'אישור');
    if (dateGrid) dateGrid.style.display = mode === 'date' ? 'grid' : 'none';
    if (timeGrid) timeGrid.style.display = mode === 'time' ? 'grid' : 'none';

    var dateParts = String(this.state.dateValue || this.todayKey()).split('-');
    var timeParts = String(this.state.timeValue || '14:00').split(':');
    var day = document.getElementById('rm-picker-day');
    var month = document.getElementById('rm-picker-month');
    var year = document.getElementById('rm-picker-year');
    var hour = document.getElementById('rm-picker-hour');
    var minute = document.getElementById('rm-picker-minute');
    if (day) day.value = String(parseInt(dateParts[2], 10) || 1);
    if (month) month.value = String(parseInt(dateParts[1], 10) || 1);
    if (year) year.value = String(parseInt(dateParts[0], 10) || new Date().getFullYear());
    if (hour) hour.value = String(parseInt(timeParts[0], 10) || 0);
    if (minute) minute.value = String(parseInt(timeParts[1], 10) || 0);

    picker.classList.add('rm-open');
    this.positionSchedPicker(mode === 'time' ? 'rm-time-box' : 'rm-date-box');
  }

  applySchedPicker() {
    var mode = this._pickerMode || 'date';
    if (mode === 'date') {
      var day = parseInt((document.getElementById('rm-picker-day') || {}).value, 10);
      var month = parseInt((document.getElementById('rm-picker-month') || {}).value, 10);
      var year = parseInt((document.getElementById('rm-picker-year') || {}).value, 10);
      if (!isFinite(day) || !isFinite(month) || !isFinite(year)) {
        this.closeSchedPicker();
        return;
      }
      day = Math.min(31, Math.max(1, day));
      month = Math.min(12, Math.max(1, month));
      year = Math.min(2100, Math.max(2000, year));
      var next = year + '-' + this.pad2(month) + '-' + this.pad2(day);
      var min = this.todayKey();
      if (next < min) next = min;
      this.closeSchedPicker();
      this.setState({ dateValue: next, saveError: '', saveOk: false });
      return;
    }
    var hour = parseInt((document.getElementById('rm-picker-hour') || {}).value, 10);
    var minute = parseInt((document.getElementById('rm-picker-minute') || {}).value, 10);
    if (!isFinite(hour) || !isFinite(minute)) {
      this.closeSchedPicker();
      return;
    }
    hour = Math.min(23, Math.max(0, hour));
    minute = Math.min(59, Math.max(0, minute));
    this.closeSchedPicker();
    this.setState({
      timeValue: this.pad2(hour) + ':' + this.pad2(minute),
      saveError: '',
      saveOk: false
    });
  }

  initData() {
    var q = new URLSearchParams(window.location.search);
    var name = q.get('name') || 'Customer';
    var phone = q.get('phone') || '';
    var customerId = q.get('customer_id') || q.get('cust_id') || q.get('id') || '';
    try {
      if (!customerId) customerId = sessionStorage.getItem('mb_customer_id') || localStorage.getItem('mb_customer_id') || '';
    } catch (e) { /* ignore */ }

    var now = new Date();
    now.setHours(now.getHours() + 1);
    var hh = String(now.getHours()).padStart(2, '0');
    var min = String(now.getMinutes()).padStart(2, '0');

    this.setState({
      name: name,
      phone: phone,
      customerId: String(customerId || ''),
      dateValue: this.todayKey(),
      timeValue: hh + ':' + min,
      template: 'followup',
      type: 'WhatsApp'
    });
  }

  templateBody(id) {
    if (id === 'quote') {
      return this.t(
        'Just checking in on the quote we sent — happy to answer any questions or adjust anything you need.',
        'רציתי לבדוק לגבי ההצעה ששלחנו — אשמח לענות על שאלות או להתאים לפי הצורך.'
      );
    }
    return this.t(
      "I wanted to see if there were any questions about the proposal we discussed. I'd be happy to help!",
      'רציתי לבדוק אם יש שאלות לגבי ההצעה שדיברנו עליה. אשמח לעזור!'
    );
  }

  previewMessage() {
    var s = this.state;
    if (s.template === 'free') {
      return String(s.freeMessage || '').trim();
    }
    var hello = this.t('Hello', 'שלום') + ' ' + this.firstName(s.name) + ' 👋';
    return hello + '\n' + this.templateBody(s.template);
  }

  sanitizeNotesForApi(text) {
    // contactus_reminder.notes uses MySQL utf8 (3-byte) — strip emoji / supplementary chars.
    return String(text || '')
      .replace(/[\u{10000}-\u{10FFFF}]/gu, '')
      .replace(/\uFE0F/g, '')
      .trim();
  }

  mapReminderBy(type) {
    var t = String(type || '').toLowerCase();
    if (t === 'whatsapp') return 'whatsapp';
    return 'sms';
  }

  toUtcDateTime(dateValue, timeValue) {
    var localValue = String(dateValue || '') + 'T' + String(timeValue || '00:00');
    var d = new Date(localValue);
    if (isNaN(d.getTime())) return '';
    if (window.Biz1SDK && typeof Biz1SDK.toUtcDateTime === 'function') {
      return Biz1SDK.toUtcDateTime(d);
    }
    function pad(n) { return n < 10 ? '0' + n : '' + n; }
    return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()) +
      ' ' + pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()) + ':' + pad(d.getUTCSeconds());
  }

  async saveReminder() {
    var s = this.state;
    if (s.saving) return;

    if (!s.customerId) {
      this.setState({ saveError: this.t('Missing customer_id', 'חסר מזהה לקוח'), saveOk: false });
      return;
    }
    if (!s.dateValue || !s.timeValue) {
      this.setState({ saveError: this.t('Date & time is required', 'יש לבחור תאריך ושעה'), saveOk: false });
      return;
    }
    var msg = this.previewMessage();
    if (s.template === 'free' && msg.length < 2) {
      this.setState({ saveError: this.t('Enter a message', 'יש להזין הודעה'), saveOk: false });
      return;
    }

    var dateTimeUtc = this.toUtcDateTime(s.dateValue, s.timeValue);
    if (!dateTimeUtc) {
      this.setState({ saveError: this.t('Invalid date & time', 'תאריך או שעה לא תקינים'), saveOk: false });
      return;
    }

    var reminderBy = this.mapReminderBy(s.type);
    var notesForApi = this.sanitizeNotesForApi(msg);
    var payload = {
      customer_id: Number(s.customerId) || s.customerId,
      date_time: dateTimeUtc,
      notes: notesForApi,
      reminder_by: reminderBy,
    };
    if (reminderBy === 'whatsapp') {
      payload.send_to_wp = 1;
    }

    this.setState({ saving: true, saveError: '', saveOk: false });

    try {
      if (!window.MineralBarApp || typeof MineralBarApp.getClient !== 'function') {
        throw new Error(this.t('SDK not ready', 'המערכת עדיין לא מוכנה'));
      }
      var client = MineralBarApp.getClient();
      var res = await client.request('Customer.Reminder.Add', payload);
      var ok = res && (Number(res.success) === 1 || res.success === true || res.reminder_id);
      if (!ok) {
        throw new Error((res && res.message) || this.t('Failed to save reminder', 'שמירת התזכורת נכשלה'));
      }

      this.setState({ saving: false, saveOk: true, saveError: '' });
      var q = new URLSearchParams(window.location.search);
      setTimeout(function () {
        window.location.href = 'chat-customer.html?' + q.toString();
      }, 700);
    } catch (e) {
      console.error('[Reminder] Customer.Reminder.Add failed', e);
      this.setState({
        saving: false,
        saveOk: false,
        saveError: (e && e.message) || this.t('Failed to save reminder', 'שמירת התזכורת נכשלה')
      });
    }
  }

  renderVals() {
    void this.state.langTick;
    var s = this.state;
    var q = new URLSearchParams(window.location.search);
    var backUrl = 'chat-customer.html?' + q.toString();
    var self = this;
    var templates = [
      { id: 'followup', label: this.t('Follow-up after a conversation', 'פולואפ לאחר שיחה') },
      { id: 'free', label: this.t('Free message', 'הודעה חופשית') },
      { id: 'quote', label: this.t('Quote tracking', 'מעקב הצעת מחיר') }
    ].map(function (tpl) {
      return {
        label: tpl.label,
        onClass: s.template === tpl.id ? 'is-on' : '',
        pick: function () { self.setState({ template: tpl.id, saveError: '', saveOk: false }); }
      };
    });

    return {
      title: this.t('Send a reminder', 'שליחת תזכורת'),
      name: s.name,
      phone: s.phone || '—',
      initials: this.initialsFromName(s.name),
      backUrl: backUrl,
      labelTemplate: this.t('Message template', 'תבנית הודעה'),
      labelSendVia: this.t('Send via', 'שליחה דרך'),
      labelSms: this.t('SMS', 'מסרון'),
      labelPreview: this.t('Preview', 'תצוגה מקדימה'),
      previewHint: this.t('What will the customer see?', 'מה הלקוח יראה?'),
      labelSchedule: this.t('Sending schedule', 'מועד שליחה'),
      labelTime: this.t('time', 'שעה'),
      labelDate: this.t('date', 'תאריך'),
      templates: templates,
      smsOnClass: s.type === 'SMS' ? 'is-on' : '',
      waOnClass: s.type === 'WhatsApp' ? 'is-on' : '',
      pickSms: function () { self.setState({ type: 'SMS', saveError: '', saveOk: false }); },
      pickWhatsApp: function () { self.setState({ type: 'WhatsApp', saveError: '', saveOk: false }); },
      isFree: s.template === 'free',
      notFree: s.template !== 'free',
      freeMessage: s.freeMessage || '',
      freePlaceholder: this.t('Type your message…', 'כתוב את ההודעה…'),
      onFreeMessage: function (e) {
        self.setState({ freeMessage: String((e && e.target && e.target.value) || ''), saveError: '', saveOk: false });
      },
      previewHello: this.t('Hello', 'שלום') + ' ' + this.firstName(s.name) + ' 👋',
      previewBody: this.templateBody(s.template),
      timeValue: s.timeValue || '14:00',
      dateValue: s.dateValue || this.todayKey(),
      timeDisplay: this.formatTimeDisplay(s.timeValue || '14:00'),
      dateDisplay: this.formatDateDisplay(s.dateValue || this.todayKey()),
      openTimePicker: function () { self.openSchedPicker('time'); },
      openDatePicker: function () { self.openSchedPicker('date'); },
      hasError: !!s.saveError,
      saveError: s.saveError || '',
      saveOk: !!s.saveOk,
      savedLabel: this.t('Reminder saved', 'התזכורת נשמרה'),
      saving: !!s.saving,
      saveLabel: s.saving
        ? this.t('Sending…', 'שולח…')
        : this.t('Send a reminder', 'שליחת תזכורת'),
      saveOpacity: s.saving ? '0.72' : '1',
      saveCursor: s.saving ? 'wait' : 'pointer',
      savePointer: s.saving ? 'none' : 'auto',
      save: function () { self.saveReminder(); }
    };
  }
}
</script>
<script>
  window.addEventListener('load', function () {
    if (typeof ensureCommonHeader === 'function') ensureCommonHeader();
    if (typeof ensureCommonFooter === 'function') ensureCommonFooter();
  });
</script>
</body>
</html>
