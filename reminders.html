<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<script src="./support.js"></script>
<script src="./biz1-sdk.js?v=socketfix11"></script>
<script src="./biz1-app.js?v=socketfix11"></script>
<script src="./page-boot.js?v=i18n-he2"></script>
<link rel="stylesheet" href="./common.css"/>
<script src="./i18n-translations.js?v=hefull1"></script>
<script src="./common-header-footer.js?v=i18n-he2"></script>
</head>
<body data-role="service" data-active-tab="messages" data-header-title="reminders">
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; direction: rtl; font-family: 'Heebo', sans-serif; -webkit-font-smoothing: antialiased; }
  button, input, textarea, select { font-family: 'Heebo', sans-serif; }
  .dc-scroll::-webkit-scrollbar { width: 0; height: 0; }
  .form-label {
    display: block;
    font-size: 13.5px;
    font-weight: 700;
    color: #4a5568;
    margin-bottom: 6px;
    text-align: left;
  }
  .premium-input {
    width: 100%;
    padding: 13px 16px;
    border: 1.6px solid #e2e8f0;
    border-radius: 12px;
    font-size: 15px;
    color: #1a202c;
    background: #fff;
    outline: none;
    transition: all 0.2s ease;
    text-align: left;
    margin-bottom: 18px;
  }
  .premium-input:focus {
    border-color: #1d60a2;
    box-shadow: 0 0 0 3px rgba(29, 96, 162, 0.12);
  }
</style>
</helmet>

<div style="min-height:100vh; background:#e6e8ec; display:flex; align-items:flex-start; justify-content:center; padding:26px 16px;">
<div style="width:392px; max-width:100%; background:#0f1828; border-radius:34px; padding:9px; box-shadow:0 24px 60px rgba(15,24,40,.34);">
<div class="screen-card" style="background:#eef0f3; border-radius:26px; overflow:hidden; position:relative; height:812px; display:flex; flex-direction:column;">

  <!-- customer strip (same context as before) -->
  <div style="flex:none; background:#fff; padding:12px 16px; border-bottom:1px solid #eef0f3;">
    <div style="display:flex; align-items:center; gap:12px;">
      <div style="width:44px; height:44px; border-radius:50%; background:#dbe7f8; color:#2f6aa6; font-weight:800; font-size:15px; flex:none; display:flex; align-items:center; justify-content:center;">{{ initials }}</div>
      <div style="flex:1; min-width:0; text-align:left;">
        <div style="font-size:16px; font-weight:800; color:#1f2a3a;">{{ name }}</div>
        <div style="font-size:12.5px; color:#7b8595; margin-top:2px;">{{ phone }}</div>
      </div>
      <a href="{{ backUrl }}" style="width:36px; height:36px; border-radius:50%; background:#f1f3f6; color:#5a6473; display:flex; align-items:center; justify-content:center; text-decoration:none; flex:none;">
        <svg fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" viewBox="0 0 24 24" width="16"><path d="M18 6 6 18M6 6l12 12"></path></svg>
      </a>
    </div>
  </div>

  <!-- form body -->
  <div class="dc-scroll" style="flex:1; overflow-y:auto; background:#fff; padding:18px 16px 12px;">
    <div style="font-size:12.5px; font-weight:800; color:#a0aec0; text-transform:uppercase; letter-spacing:0.4px; margin-bottom:14px;">Add reminder</div>

    <label class="form-label">Date &amp; time</label>
    <div style="position:relative;">
      <input class="premium-input" style="padding-right:45px;" type="datetime-local" value="{{ dateTime }}" oninput="{{ onDateTimeChange }}"/>
      <span style="position:absolute; right:16px; top:13px; color:#a0aec0; pointer-events:none;">
        <svg fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="18"><rect height="18" rx="2" width="18" x="3" y="4"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>
      </span>
    </div>

    <label class="form-label">Description</label>
    <textarea id="mb-reminder-desc" class="premium-input" style="height:110px; resize:none; margin-bottom:18px;" placeholder="Enter message body or note..." data-no-i18n-value="true" oninput="{{ onDescriptionChange }}"></textarea>

    <label class="form-label">Type</label>
    <div style="position:relative; margin-bottom:10px;">
      <select class="premium-input" style="appearance:none; -webkit-appearance:none; padding-right:40px; margin-bottom:0;" onchange="{{ onTypeChange }}">
        <option value="Popup" selected="{{ isPopup }}">Popup</option>
        <option value="SMS" selected="{{ isSMS }}">SMS</option>
        <option value="WhatsApp" selected="{{ isWhatsApp }}">WhatsApp</option>
        <option value="Email" selected="{{ isEmail }}">Email</option>
      </select>
      <span style="position:absolute; right:16px; top:15px; color:#a0aec0; pointer-events:none;">
        <svg fill="none" height="15" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewBox="0 0 24 24" width="15"><path d="m6 9 6 6 6-6"></path></svg>
      </span>
    </div>

    <sc-if value="{{ saveError }}">
      <div style="margin-top:12px; padding:11px 13px; border-radius:12px; background:#fbeeed; border:1px solid #f0c9c4; color:#c0392b; font-size:13px; font-weight:700;">{{ saveError }}</div>
    </sc-if>
    <sc-if value="{{ saveOk }}">
      <div style="margin-top:12px; padding:11px 13px; border-radius:12px; background:#e6f4ec; border:1px solid #b7e0c5; color:#2e8a63; font-size:13px; font-weight:700;">Reminder saved</div>
    </sc-if>
  </div>

  <!-- footer actions -->
  <div style="flex:none; background:#fff; border-top:1px solid #eef0f3; padding:14px 16px 18px; display:flex; gap:10px;">
    <a href="{{ backUrl }}" style="flex:1; display:flex; align-items:center; justify-content:center; padding:14px; border:1.6px solid #cbd5e0; border-radius:12px; background:#fff; color:#2d3748; font-size:15px; font-weight:700; text-decoration:none;">Cancel</a>
    <button onclick="{{ save }}" disabled="{{ saving }}" style="flex:1.5; display:flex; align-items:center; justify-content:center; padding:14px; border:none; border-radius:12px; background:#1d60a2; color:#fff; font-size:15px; font-weight:800; cursor:pointer; box-shadow:0 4px 12px rgba(29,96,162,0.24); opacity:{{ saveOpacity }};">{{ saveLabel }}</button>
  </div>

</div>
</div>
</div>
</x-dc>

<script data-dc-script="" type="text/x-dc">
class Component extends DCLogic {
  state = {
    customerId: '',
    name: 'Customer',
    phone: '',
    dateTime: '',
    description: '',
    type: 'Popup',
    saving: false,
    saveError: '',
    saveOk: false
  };

  componentDidMount() {
    this.initData();
  }

  initialsFromName(name) {
    var p = String(name || '').trim().split(/\s+/).filter(Boolean);
    if (!p.length) return '?';
    if (p.length === 1) return p[0].slice(0, 2).toUpperCase();
    return ((p[0][0] || '') + (p[1][0] || '')).toUpperCase();
  }

  initData() {
    var q = new URLSearchParams(window.location.search);
    var name = q.get('name') || 'Customer';
    var phone = q.get('phone') || '';
    var customerId = q.get('customer_id') || q.get('cust_id') || q.get('id') || '';
    try {
      if (!customerId) customerId = sessionStorage.getItem('mb_customer_id') || localStorage.getItem('mb_customer_id') || '';
    } catch (e) { /* ignore */ }

    var now = new Date();
    now.setHours(now.getHours() + 1);
    var yyyy = now.getFullYear();
    var mm = String(now.getMonth() + 1).padStart(2, '0');
    var dd = String(now.getDate()).padStart(2, '0');
    var hh = String(now.getHours()).padStart(2, '0');
    var min = String(now.getMinutes()).padStart(2, '0');
    var defaultDateTime = yyyy + '-' + mm + '-' + dd + 'T' + hh + ':' + min;

    this.setState({
      name: name,
      phone: phone,
      customerId: String(customerId || ''),
      dateTime: defaultDateTime
    });
  }

  mapReminderBy(type) {
    var t = String(type || '').toLowerCase();
    if (t === 'sms') return 'sms';
    if (t === 'whatsapp') return 'whatsapp';
    if (t === 'email') return 'email';
    return 'popup';
  }

  toUtcDateTime(localValue) {
    if (!localValue) return '';
    var d = new Date(localValue);
    if (isNaN(d.getTime())) return '';
    if (window.Biz1SDK && typeof Biz1SDK.toUtcDateTime === 'function') {
      return Biz1SDK.toUtcDateTime(d);
    }
    function pad(n) { return n < 10 ? '0' + n : '' + n; }
    return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()) +
      ' ' + pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()) + ':' + pad(d.getUTCSeconds());
  }

  async saveReminder() {
    var s = this.state;
    if (s.saving) return;

    if (!s.customerId) {
      this.setState({ saveError: 'Missing customer_id', saveOk: false });
      return;
    }
    if (!s.dateTime) {
      this.setState({ saveError: 'Date & time is required', saveOk: false });
      return;
    }

    var dateTimeUtc = this.toUtcDateTime(s.dateTime);
    if (!dateTimeUtc) {
      this.setState({ saveError: 'Invalid date & time', saveOk: false });
      return;
    }

    var reminderBy = this.mapReminderBy(s.type);
    var payload = {
      customer_id: Number(s.customerId) || s.customerId,
      cust_id: Number(s.customerId) || s.customerId,
      date_time: dateTimeUtc,
      notes: s.description || '',
      note: s.description || '',
      reminder_by: reminderBy,
      reminder_type: reminderBy
    };
    if (reminderBy === 'whatsapp') {
      payload.send_to_wp = 1;
      payload.send_to_whatsapp = 1;
    }

    this.setState({ saving: true, saveError: '', saveOk: false });

    try {
      if (!window.MineralBarApp || typeof MineralBarApp.getClient !== 'function') {
        throw new Error('SDK not ready');
      }
      var client = MineralBarApp.getClient();
      var res = await client.request('Customer.Reminder.Add', payload);
      var ok = res && (Number(res.success) === 1 || res.success === true || res.reminder_id);
      if (!ok) {
        throw new Error((res && res.message) || 'Failed to save reminder');
      }

      console.log('[Reminder] saved', {
        reminder_id: res.reminder_id,
        socket_event: res.socket_event || 'customer.reminder.created',
        res: res
      });

      this.setState({ saving: false, saveOk: true, saveError: '' });
      var q = new URLSearchParams(window.location.search);
      setTimeout(function () {
        window.location.href = 'chat-customer.html?' + q.toString();
      }, 700);
    } catch (e) {
      console.error('[Reminder] Customer.Reminder.Add failed', e);
      this.setState({
        saving: false,
        saveOk: false,
        saveError: (e && e.message) || 'Failed to save reminder'
      });
    }
  }

  renderVals() {
    var s = this.state;
    var q = new URLSearchParams(window.location.search);
    var backUrl = 'chat-customer.html?' + q.toString();

    return {
      name: s.name,
      phone: s.phone,
      initials: this.initialsFromName(s.name),
      dateTime: s.dateTime,
      description: String(s.description || ''),
      isPopup: s.type === 'Popup',
      isSMS: s.type === 'SMS',
      isWhatsApp: s.type === 'WhatsApp',
      isEmail: s.type === 'Email',
      backUrl: backUrl,
      saving: s.saving,
      saveError: s.saveError,
      saveOk: s.saveOk,
      saveLabel: s.saving ? 'Saving…' : 'Save reminder',
      saveOpacity: s.saving ? '0.7' : '1',
      onDateTimeChange: (e) => this.setState({ dateTime: e.target.value, saveError: '', saveOk: false }),
      onDescriptionChange: (e) => this.setState({ description: String((e && e.target && e.target.value) || '') }),
      onTypeChange: (e) => this.setState({ type: e.target.value }),
      save: () => this.saveReminder()
    };
  }
}
</script>
<script>
  window.addEventListener('load', function () {
    if (typeof ensureCommonHeader === 'function') ensureCommonHeader();
    if (typeof ensureCommonFooter === 'function') ensureCommonFooter();
  });
</script>
</body>
</html>
