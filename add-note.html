<!DOCTYPE html>

<html>
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<script src="./support.js"></script>
<script src="https://mineral.bull36.com/app/sdk/biz1-sdk.js"></script>
<script src="./biz1-app.js"></script>
<script src="./page-boot.js"></script>
<script src="./sales-static-live.js?v=sales-live-1"></script>
<link rel="stylesheet" href="./common.css"/>
<script src="./i18n-translations.js?v=hefull1"></script>
<script src="./common-header-footer.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; direction: rtl; font-family: 'Heebo', sans-serif; -webkit-font-smoothing: antialiased; background:#e6e8ec; }
  button, input, textarea { font-family: 'Heebo', sans-serif; }
  .dc-scroll::-webkit-scrollbar { width: 0; height: 0; }
</style>
</helmet>
<div style="min-height:100vh; background:#e6e8ec; display:flex; flex-direction:column; align-items:center; padding:20px 14px 0;">
<div style="width:392px; max-width:100%; position:relative; height:96vh; min-height:760px; border-radius:30px; overflow:hidden; background:#f2f3f5;">
<!-- ===== underlying lead card (peeking behind the sheet) ===== -->
<div style="position:absolute; top:0; left:0; right:0; padding:20px 18px;">
<div style="background:#fff; border:1px solid #edeff2; border-radius:16px; padding:16px 18px; box-shadow:0 1px 4px rgba(15,24,40,.04);">
<div style="font-size:17px; font-weight:700; color:#aab2bd; text-align:left;">Moshe Cohen</div>
<div style="font-size:14px; font-weight:600; color:#bcc3cd; text-align:left; margin-top:3px;">Near New · Tel Aviv</div>
</div>
</div>
<!-- ===== dim layer ===== -->
<div style="position:absolute; inset:0; background:#0f1828; opacity:0.04;"></div>
 ===== bottom sheet: Add a note ===== 
<div class="dc-scroll" style="position:absolute; top:64px; left:0; right:0; bottom:0; background:#fff; border-radius:26px 26px 0 0; box-shadow:0 -10px 40px rgba(15,24,40,.10); overflow-y:auto; display:flex; flex-direction:column;">
<div style="width:44px; height:5px; border-radius:99px; background:#dadfe6; margin:11px auto 4px; flex:none;"></div>
<!-- header -->
<div style="display:flex; align-items:center; justify-content:space-between; padding:10px 20px 16px; border-bottom:1px solid #f0f2f5; flex:none;">
<a href="chat-customer.html" style="width:38px; height:38px; border-radius:50%; border:none; background:#eef0f3; color:#7b8595; cursor:pointer; display:flex; align-items:center; justify-content:center; flex:none; text-decoration:none;">
<svg fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" viewbox="0 0 24 24" width="16"><path d="M18 6 6 18M6 6l12 12"></path></svg>
</a>
<div style="font-size:22px; font-weight:800; color:#1f2a3a;">Add a comment</div>
</div>
<div style="padding:20px 20px 0; flex:1;">
 ===== Comment type ===== 
<div style="font-size:15px; font-weight:700; color:#8a93a3; text-align:left; margin-bottom:12px;">Comment type</div>
<div style="display:flex; flex-wrap:wrap; gap:10px; justify-content:flex-start; margin-bottom:26px;">
<button onclick="{{ selectCall }}" style="display:flex; align-items:center; gap:8px; padding:11px 18px; border-radius:99px; border:1.6px solid {{ callBorder }}; background:{{ callBg }}; color:{{ callColor }}; font-size:14.5px; font-weight:700; cursor:pointer; white-space:nowrap;">
<svg fill="none" height="17" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="17"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.1-8.6A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"></path></svg>
            call
          </button>
<button onclick="{{ selectWa }}" style="display:flex; align-items:center; gap:8px; padding:11px 18px; border-radius:99px; border:1.6px solid {{ waBorder }}; background:{{ waBg }}; color:{{ waColor }}; font-size:14.5px; font-weight:700; cursor:pointer; white-space:nowrap;">
<svg fill="none" height="17" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="17"><path d="M21 11.5a8.5 8.5 0 0 1-12.5 7.5L3 21l2-5.5A8.5 8.5 0 1 1 21 11.5z"></path></svg>
            WhatsApp
          </button>
<button onclick="{{ selectGeneral }}" style="display:flex; align-items:center; gap:8px; padding:11px 18px; border-radius:99px; border:1.6px solid {{ genBorder }}; background:{{ genBg }}; color:{{ genColor }}; font-size:14.5px; font-weight:700; cursor:pointer; white-space:nowrap;">
<svg fill="none" height="17" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="17"><path d="M6 2.5h8L19 7v14.5H6z"></path><path d="M14 2.5V7h5"></path><path d="M9 13h6M9 16.5h4"></path></svg>
            general
          </button>
</div>
 ===== Comment content ===== 
<div style="font-size:15px; font-weight:700; color:#8a93a3; text-align:left; margin-bottom:12px;">The content of the note <span style="color:#d06262;">*</span></div>
<textarea placeholder="Write the comment here..." style="width:100%; height:130px; resize:none; border:1.6px solid #e4e8ee; border-radius:16px; padding:15px 17px; font-size:16px; font-weight:600; color:#1f2a3a; line-height:1.6; text-align:left; outline:none; margin-bottom:28px;">The customer called and said he was interested. Requested a quote with a discount.</textarea>
 ===== Details ===== 
<div style="font-size:15px; font-weight:700; color:#8a93a3; text-align:left; margin-bottom:12px;">details</div>
<div style="display:flex; align-items:center; justify-content:flex-start; gap:7px; color:#8a93a3; margin-bottom:9px;">
<svg fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="16"><rect height="17" rx="2.5" width="18" x="3" y="4.5"></rect><path d="M3 9h18M8 2.5v4M16 2.5v4"></path></svg>
<span style="font-size:14.5px; font-weight:700;">Date and time</span>
</div>
<div style="display:flex; gap:13px; margin-bottom:22px;">
<div style="flex:1; border:1.6px solid #e4e8ee; border-radius:13px; padding:14px 16px; font-size:15.5px; font-weight:700; color:#1f2a3a; text-align:center;">Today, 10:34</div>
<div style="flex:1; border:1.6px solid #e4e8ee; border-radius:13px; padding:14px 16px; font-size:15.5px; font-weight:700; color:#1f2a3a; text-align:center;">visible to all</div>
</div>
</div>
<!-- ===== save button ===== -->
<div style="padding:6px 20px 24px; flex:none;">
<button onclick="{{ save }}" style="width:100%; display:flex; align-items:center; justify-content:center; gap:10px; padding:17px; border:none; border-radius:15px; background:#5847a8; color:#fff; font-size:17px; font-weight:800; cursor:pointer;">
<svg fill="none" height="20" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" viewbox="0 0 24 24" width="20"><path d="M20 6 9 17l-5-5"></path></svg>
          Save a note
        </button>
</div>
</div>
</div>
</div>
</x-dc>
<script data-dc-script="" type="text/x-dc">
class Component extends DCLogic {
  state = { type: 'call' };

  renderVals() {
    const t = this.state.type;
    const on = (k) => t === k;
    const palette = (k) => ({
      bg: on(k) ? '#ece8f7' : '#fff',
      border: on(k) ? '#c5b9e8' : '#e4e8ee',
      color: on(k) ? '#5847a8' : '#5a6473',
    });
    const call = palette('call'), wa = palette('whatsapp'), gen = palette('general');
    return {
      callBg: call.bg, callBorder: call.border, callColor: call.color,
      waBg: wa.bg, waBorder: wa.border, waColor: wa.color,
      genBg: gen.bg, genBorder: gen.border, genColor: gen.color,
      selectCall: () => this.setState({ type: 'call' }),
      selectWa: () => this.setState({ type: 'whatsapp' }),
      selectGeneral: () => this.setState({ type: 'general' }),
      save: () => { window.location.href = "chat-customer.html"; },
    };
  }
}
</script>
</body>
</html>
