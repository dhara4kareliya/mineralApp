<!DOCTYPE html>

<html>
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<script>document.write('<script src="./asset-version.js?_='+Date.now()+'"><\/script>');</script>
<script>
mbScripts([
  './support.js',
  './biz1-sdk.js',
  './biz1-app.js',
  './page-boot.js',
  './live-sync.js',
  './add-note-live.js',
  './i18n-translations.js',
  './common-header-footer.js'
]);
mbCss('./common.css');
</script>
</head>
<body data-role="sales" data-active-tab="leads">
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; font-family: 'Heebo', sans-serif; -webkit-font-smoothing: antialiased; }
  button, input, textarea { font-family: 'Heebo', sans-serif; }
  .dc-scroll::-webkit-scrollbar { width: 0; height: 0; }
  .note-chip { display:flex; align-items:center; gap:8px; padding:11px 18px; border-radius:99px; border:1.6px solid #e4e8ee; background:#fff; color:#5a6473; font-size:14.5px; font-weight:700; cursor:pointer; white-space:nowrap; }
  .note-chip:active { transform: scale(0.98); }
  #mb-note-content:focus { border-color:#c5b9e8; box-shadow:0 0 0 3px rgba(88,71,168,.12); }
  #mb-note-datetime { position:absolute; opacity:0; pointer-events:none; width:0; height:0; }
</style>
</helmet>

<!-- outer phone shell (same as lead-card.html) -->
<div style="min-height:100vh; background:#e6e8ec; display:flex; align-items:flex-start; justify-content:center; padding:26px 16px;">
<div style="width:392px; max-width:100%; background:#0f1828; border-radius:34px; padding:9px; box-shadow:0 24px 60px rgba(15,24,40,.34);">
<div data-screen-label="Add Note" style="background:#eef0f3; border-radius:26px; overflow:hidden; position:relative; height:812px; display:flex; flex-direction:column;">

<!-- lead card peeking behind the sheet -->
<div style="flex:1; overflow:hidden; display:flex; flex-direction:column;">
<div style="background:#fff; padding:9px 16px 14px; flex:none; box-shadow:0 1px 0 #edeff2;">
<div style="display:flex; justify-content:center; padding:3px 0 9px;">
<div style="width:42px; height:5px; border-radius:99px; background:#dadfe6;"></div>
</div>
<div style="display:flex; align-items:center; justify-content:space-between;">
<div style="width:38px; height:38px; flex:none;"></div>
<div style="font-size:18px; font-weight:800; color:#1f2a3a;">Lead Card</div>
<div style="width:38px; height:38px; flex:none;"></div>
</div>
</div>
<div class="dc-scroll" style="flex:1; overflow-y:auto; padding:14px 16px 20px; direction:rtl;">
<div style="display:flex; align-items:center; gap:12px; margin-bottom:14px;">
<div style="flex:1; min-width:0; text-align:right;">
<div id="mb-note-peek-name" style="font-size:20px; font-weight:800; color:#1f2a3a;">…</div>
<div id="mb-note-peek-sub" style="font-size:13px; font-weight:600; color:#9aa3b0; margin-top:4px;"></div>
</div>
<div style="width:54px; height:54px; border-radius:50%; background:#dbe7f8; color:#2f6aa6; font-weight:800; font-size:17px; display:flex; align-items:center; justify-content:center; flex:none; text-transform:uppercase;" id="mb-note-peek-avatar">?</div>
</div>
<div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-top:8px;">
<div style="display:flex; flex-direction:column; align-items:center; gap:8px; padding:14px 6px; background:#fff; border:1px solid #e8eaee; border-radius:14px; box-shadow:0 1px 2px rgba(0,0,0,.04); opacity:.55;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="#2e8a63"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.2.4 2.4.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.3 1z"/></svg>
<span style="font-size:12px; font-weight:700; color:#1f2a3a;">Dial</span>
</div>
<div style="display:flex; flex-direction:column; align-items:center; gap:8px; padding:14px 6px; background:#fff; border:1px solid #e8eaee; border-radius:14px; box-shadow:0 1px 2px rgba(0,0,0,.04); opacity:.55;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="#25b35e"><path d="M12 2a10 10 0 0 0-8.6 15l-1.3 4.8 4.9-1.3A10 10 0 1 0 12 2z"/></svg>
<span style="font-size:12px; font-weight:700; color:#1f2a3a;">WhatsApp</span>
</div>
<div style="display:flex; flex-direction:column; align-items:center; gap:8px; padding:14px 6px; background:#fff; border:1px solid #e8eaee; border-radius:14px; box-shadow:0 1px 2px rgba(0,0,0,.04); opacity:.55;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1d60a2" stroke-width="1.9"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg>
<span style="font-size:12px; font-weight:700; color:#1f2a3a;">Update status</span>
</div>
</div>
</div>
</div>

<!-- dim + bottom sheet -->
<div style="position:absolute; inset:0; z-index:50; pointer-events:none;">
<div style="position:absolute; inset:0; background:#1f2a3a; opacity:0.32;"></div>
<div class="dc-scroll" style="position:absolute; top:64px; left:0; right:0; bottom:0; background:#fff; border-radius:26px 26px 0 0; box-shadow:0 -10px 40px rgba(15,24,40,.10); overflow-y:auto; display:flex; flex-direction:column; direction:ltr; pointer-events:auto;">
<div style="width:44px; height:5px; border-radius:99px; background:#dadfe6; margin:11px auto 4px; flex:none;"></div>
<div style="display:flex; align-items:center; justify-content:space-between; padding:10px 20px 16px; border-bottom:1px solid #f0f2f5; flex:none;">
<button type="button" id="mb-note-close" aria-label="Close" style="width:38px; height:38px; border-radius:50%; border:none; background:#eef0f3; color:#7b8595; cursor:pointer; display:flex; align-items:center; justify-content:center; flex:none;">
<svg fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" viewbox="0 0 24 24" width="16"><path d="M18 6 6 18M6 6l12 12"></path></svg>
</button>
<div id="mb-note-title" style="font-size:22px; font-weight:800; color:#1f2a3a;">Add a comment</div>
<div style="width:38px; flex:none;"></div>
</div>
<div style="padding:20px 20px 0; flex:1;">
<div id="mb-note-type-label" style="font-size:15px; font-weight:700; color:#8a93a3; text-align:left; margin-bottom:12px;">Comment type</div>
<div style="display:flex; flex-wrap:wrap; gap:10px; justify-content:flex-start; margin-bottom:26px;">
<button type="button" class="note-chip" data-note-type="call">
<svg fill="none" height="17" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="17"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.1-8.6A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"></path></svg>
call
</button>
<button type="button" class="note-chip" data-note-type="whatsapp">
<svg fill="none" height="17" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="17"><path d="M21 11.5a8.5 8.5 0 0 1-12.5 7.5L3 21l2-5.5A8.5 8.5 0 1 1 21 11.5z"></path></svg>
WhatsApp
</button>
<button type="button" class="note-chip" data-note-type="general">
<svg fill="none" height="17" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="17"><path d="M6 2.5h8L19 7v14.5H6z"></path><path d="M14 2.5V7h5"></path><path d="M9 13h6M9 16.5h4"></path></svg>
general
</button>
</div>
<div id="mb-note-content-label" style="font-size:15px; font-weight:700; color:#8a93a3; text-align:left; margin-bottom:12px;">The content of the note <span style="color:#d06262;">*</span></div>
<textarea id="mb-note-content" placeholder="Write the comment here..." style="width:100%; height:130px; resize:none; border:1.6px solid #e4e8ee; border-radius:16px; padding:15px 17px; font-size:16px; font-weight:600; color:#1f2a3a; line-height:1.6; text-align:left; outline:none; margin-bottom:28px;"></textarea>
<div id="mb-note-details-label" style="font-size:15px; font-weight:700; color:#8a93a3; text-align:left; margin-bottom:12px;">details</div>
<div style="display:flex; align-items:center; justify-content:flex-start; gap:7px; color:#8a93a3; margin-bottom:9px;">
<svg fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="16"><rect height="17" rx="2.5" width="18" x="3" y="4.5"></rect><path d="M3 9h18M8 2.5v4M16 2.5v4"></path></svg>
<span id="mb-note-datetime-title" style="font-size:14.5px; font-weight:700;">Date and time</span>
</div>
<div style="display:flex; gap:13px; margin-bottom:22px;">
<button type="button" id="mb-note-date-box" style="flex:1; border:1.6px solid #e4e8ee; border-radius:13px; padding:14px 16px; font-size:15.5px; font-weight:700; color:#1f2a3a; text-align:center; background:#fff; cursor:pointer;">
<span id="mb-note-date-label">Today, 10:34</span>
</button>
<button type="button" id="mb-note-visibility" style="flex:1; border:1.6px solid #e4e8ee; border-radius:13px; padding:14px 16px; font-size:15.5px; font-weight:700; color:#1f2a3a; text-align:center; background:#fff; cursor:pointer;">visible to all</button>
<input id="mb-note-datetime" type="datetime-local"/>
</div>
</div>
<div style="padding:6px 20px 24px; flex:none;">
<button type="button" id="mb-note-save" style="width:100%; display:flex; align-items:center; justify-content:center; gap:10px; padding:17px; border:none; border-radius:15px; background:#5847a8; color:#fff; font-size:17px; font-weight:800; cursor:pointer;">
<svg fill="none" height="20" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" viewbox="0 0 24 24" width="20"><path d="M20 6 9 17l-5-5"></path></svg>
<span data-save-label="">Save a note</span>
</button>
</div>
</div>
</div>

<div id="mb-note-toast" style="display:none; position:absolute; left:50%; bottom:100px; transform:translateX(-50%); width:calc(100% - 48px); max-width:300px; padding:12px 14px; border-radius:12px; background:#16223a; color:#fff; font-size:13px; font-weight:700; text-align:center; z-index:99999; box-shadow:0 8px 24px rgba(15,24,40,.28); pointer-events:none;"></div>
</div>
</div>
</div>
</x-dc>
</body>
</html>
