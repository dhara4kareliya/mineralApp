<!DOCTYPE html>

<html>

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1" name="viewport" />
  <script src="./support.js"></script>
  <script src="./biz1-sdk.js?v=socketfix9"></script>
  <script src="./biz1-app.js?v=socketfix9"></script>
  <script src="./page-boot.js?v=socketfix9"></script>
  <script src="./list-live.js?v=socketfix9"></script>
  <link rel="stylesheet" href="./common.css" />
  <script src="./i18n-translations.js?v=hefull1"></script>
  <script src="./common-header-footer.js"></script>
</head>

<body data-role="sales" data-active-tab="leads">
  <x-dc>
    <helmet>
      <link href="https://fonts.googleapis.com" rel="preconnect" />
      <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
      <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&amp;display=swap"
        rel="stylesheet" />
      <style>
        * {
          box-sizing: border-box;
        }

        html,
        body {
          margin: 0;
          direction: rtl;
          font-family: 'Heebo', sans-serif;
          -webkit-font-smoothing: antialiased;
        }

        button,
        input {
          font-family: 'Heebo', sans-serif;
        }

        .dc-scroll::-webkit-scrollbar {
          width: 0;
          height: 0;
        }

        .ds-input::placeholder {
          color: #aeb6c2;
        }
      </style>
    </helmet>
    <div
      style="min-height:100vh; background:#e6e8ec; display:flex; align-items:flex-start; justify-content:center; padding:26px 16px;">
      <div
        style="width:392px; max-width:100%; background:#0f1828; border-radius:34px; padding:9px; box-shadow:0 24px 60px rgba(15,24,40,.34);">
          <div class="screen-card" style="background:#eef0f3; border-radius:26px; overflow:hidden; position:relative; height:812px; display:flex; flex-direction:column;">
          <!-- header: title + filter button + new lead -->
          <div
            style="display:flex; align-items:center; justify-content:space-between; gap:8px; padding:6px 16px 12px; flex:none; background:#fff;">
            <div style="font-size:22px; font-weight:800; color:#16223a;">לידים</div>
            <div style="display:flex; align-items:center; gap:8px;">
              <!-- <button onclick="{{ openFilters }}"
                style="display:inline-flex; align-items:center; gap:6px; padding:9px 13px; border-radius:99px; border:1.5px solid #dde2ea; background:#fff; cursor:pointer; flex:none;">
                <svg fill="none" height="16" stroke="#46505f" stroke-linecap="round" stroke-linejoin="round"
                  stroke-width="2" viewbox="0 0 24 24" width="16">
                  <path d="M3 5h18M6 12h12M10 19h4"></path>
                </svg>
                <span style="font-size:13px; font-weight:700; color:#46505f; white-space:nowrap;">סינון ומיון</span>
                <sc-if hint-placeholder-val="{{ false }}" value="{{ hasActiveFilters }}"><span
                    style="width:7px; height:7px; border-radius:50%; background:#c0392b;"></span></sc-if>
              </button> -->
              <a href="sales-add-lead.html"
                style="display:inline-flex; align-items:center; gap:6px; padding:9px 14px; border-radius:99px; background:#1d60a2; color:#fff; text-decoration:none; flex:none; box-shadow:0 5px 13px rgba(29,96,162,.26);">
                <svg fill="none" height="16" stroke="#fff" stroke-linecap="round" stroke-linejoin="round"
                  stroke-width="2.4" viewbox="0 0 24 24" width="16">
                  <path d="M5 12h14M12 5v14"></path>
                </svg>
                <span style="font-size:13.5px; font-weight:800; white-space:nowrap;">ליד חדש</span>
              </a>
            </div>
          </div>
          <!-- search + chip row -->
          <div style="flex:none; background:#fff; padding:0 16px 13px; border-bottom:1px solid #eef0f3;">
            <div
              style="display:flex; align-items:center; gap:9px; padding:12px 14px; border:1.5px solid #dde2ea; border-radius:13px; background:#fff;">
              <svg fill="none" height="18" stroke="#9aa3b0" stroke-linecap="round" stroke-linejoin="round"
                stroke-width="2" viewbox="0 0 24 24" width="18">
                <circle cx="11" cy="11" r="7"></circle>
                <path d="m20 20-3.2-3.2"></path>
              </svg>
              <input class="ds-input mb-search" placeholder="חיפוש לפי שם, טלפון, עיר..."
                style="flex:1; border:none; outline:none; font-size:14.5px; color:#1f2a3a; background:transparent; text-align:start;" />
            </div>
            <div id="mb-customer-filter-chips" class="dc-scroll" data-active-folder="1"
              style="display:flex; gap:8px; overflow-x:auto; margin-top:11px; padding-bottom:4px; scrollbar-width:none; -webkit-overflow-scrolling:touch;">
            </div>
          </div>
          <!-- ===== scrollable list ===== -->
          <div class="dc-scroll" style="flex:1; overflow-y:auto; padding:16px;">
            <div id="mb-total-label">טוען…</div>
            <div data-folder="1" data-kind="leads" id="mb-live-list"></div>
          </div>

          <!-- ============ FILTER SHEET ============ -->
          <sc-if hint-placeholder-val="{{ false }}" value="{{ filtersOpen }}">
            <div style="position:absolute; inset:0; z-index:20;">
              <div onclick="{{ closeFilters }}" style="position:absolute; inset:0; background:#0f1828; opacity:0.4;">
              </div>
              <div class="dc-scroll"
                style="position:absolute; bottom:0; left:0; right:0; background:#fff; border-radius:24px 24px 0 0; padding:18px 18px 22px; max-height:92%; overflow-y:auto;">
                <div style="width:42px; height:5px; border-radius:99px; background:#dadfe6; margin:0 auto 14px;"></div>
                <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:15px;">
                  <div style="font-size:19px; font-weight:800; color:#1f2a3a;">סינון ומיון</div>
                  <button onclick="{{ clearFilters }}"
                    style="border:none; background:none; color:#c0392b; font-size:13.5px; font-weight:700; cursor:pointer;">נקה
                    הכל</button>
                </div>
                <!-- active chips -->
                <sc-if hint-placeholder-val="{{ false }}" value="{{ hasChips }}">
                  <div style="display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px;">
                    <sc-for as="c" hint-placeholder-count="3" list="{{ chips }}">
                      <button onclick="{{ c.clear }}"
                        style="display:inline-flex; align-items:center; gap:6px; padding:6px 11px; border-radius:99px; cursor:pointer; font-size:12.5px; font-weight:700; background:{{ c.bg }}; color:{{ c.color }}; border:1px solid {{ c.border }};">
                        <svg fill="none" height="12" stroke="currentColor" stroke-linecap="round"
                          stroke-linejoin="round" stroke-width="2.4" viewbox="0 0 24 24" width="12">
                          <path d="M18 6 6 18M6 6l12 12"></path>
                        </svg>
                        {{ c.label }}
                      </button>
                    </sc-for>
                  </div>
                </sc-if>
                <!-- segmented type -->
                <div style="font-size:13.5px; color:#7b8595; font-weight:700; margin-bottom:9px;">סוג</div>
                <div
                  style="display:flex; background:#eef0f3; border:1.5px solid #e4e8ee; border-radius:13px; padding:3px; gap:3px; margin-bottom:18px;">
                  <sc-for as="s" hint-placeholder-count="3" list="{{ sougSegs }}">
                    <button onclick="{{ s.pick }}"
                      style="flex:1; display:flex; align-items:center; justify-content:center; gap:6px; padding:10px 4px; border:none; border-radius:10px; cursor:pointer; font-size:13.5px; font-weight:700; background:{{ s.bg }}; color:{{ s.color }}; box-shadow:{{ s.shadow }};">
                      <span style="display:flex; color:{{ s.color }};">
                        <sc-if hint-placeholder-val="{{ true }}" value="{{ s.iFilter }}"><svg fill="none" height="16"
                            stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            viewbox="0 0 24 24" width="16">
                            <path d="M3 5h18M6 12h12M10 19h4"></path>
                          </svg></sc-if>
                        <sc-if hint-placeholder-val="{{ false }}" value="{{ s.iLead }}"><svg fill="none" height="16"
                            stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            viewbox="0 0 24 24" width="16">
                            <circle cx="9" cy="8" r="3.2"></circle>
                            <path d="M3 20c0-3.4 2.7-5.5 6-5.5 1 0 1.9.2 2.7.5"></path>
                            <path d="M17 8v6M14 11h6"></path>
                          </svg></sc-if>
                        <sc-if hint-placeholder-val="{{ false }}" value="{{ s.iShield }}"><svg fill="none" height="16"
                            stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            viewbox="0 0 24 24" width="16">
                            <path d="M12 3l7 3v5c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"></path>
                          </svg></sc-if>
                      </span>
                      {{ s.label }}
                    </button>
                  </sc-for>
                </div>
                <div style="height:1px; background:#f0f2f5; margin:0 0 16px;"></div>
                <!-- Status (leads mode) -->
                <sc-if hint-placeholder-val="{{ true }}" value="{{ showStatus }}">
                  <div style="margin-bottom:17px;">
                    <div style="font-size:13.5px; color:#7b8595; font-weight:700; margin-bottom:10px;">סטטוס</div>
                    <div style="display:flex; flex-wrap:wrap; gap:8px;">
                      <sc-for as="o" hint-placeholder-count="6" list="{{ statusOpts }}">
                        <button onclick="{{ o.pick }}"
                          style="display:inline-flex; align-items:center; gap:5px; padding:9px 14px; border-radius:99px; cursor:pointer; font-size:13px; font-weight:{{ o.weight }}; background:{{ o.bg }}; color:{{ o.color }}; border:1.4px solid {{ o.border }};">
                          <sc-if hint-placeholder-val="{{ false }}" value="{{ o.check }}"><svg fill="none" height="13"
                              stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.6"
                              viewbox="0 0 24 24" width="13">
                              <path d="M20 6 9 17l-5-5"></path>
                            </svg></sc-if>
                          {{ o.label }}
                        </button>
                      </sc-for>
                    </div>
                  </div>
                </sc-if>
                <!-- type of renewal (renew mode) -->
                <sc-if hint-placeholder-val="{{ false }}" value="{{ showRenew }}">
                  <div style="margin-bottom:17px;">
                    <div style="display:flex; align-items:center; gap:8px; margin-bottom:10px;">
                      <span style="font-size:13.5px; color:#7b8595; font-weight:700;">סוג חידוש</span>
                      <span
                        style="background:#eef0fb; color:#50439d; font-size:11px; font-weight:700; padding:2px 9px; border-radius:99px;">רלוונטי
                        לחידושים בלבד</span>
                    </div>
                    <div style="display:flex; flex-wrap:wrap; gap:8px;">
                      <sc-for as="o" hint-placeholder-count="4" list="{{ renewOpts }}">
                        <button onclick="{{ o.pick }}"
                          style="display:inline-flex; align-items:center; gap:6px; padding:9px 14px; border-radius:99px; cursor:pointer; font-size:13px; font-weight:{{ o.weight }}; background:{{ o.bg }}; color:{{ o.color }}; border:1.4px solid {{ o.border }};">
                          <span style="display:flex;">
                            <sc-if hint-placeholder-val="{{ true }}" value="{{ o.iShield }}"><svg fill="none"
                                height="13" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                stroke-width="2" viewbox="0 0 24 24" width="13">
                                <path d="M12 3l7 3v5c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"></path>
                              </svg></sc-if>
                            <sc-if hint-placeholder-val="{{ false }}" value="{{ o.iDrop }}"><svg fill="none" height="13"
                                stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                viewbox="0 0 24 24" width="13">
                                <path d="M12 3s6 5.5 6 10a6 6 0 0 1-12 0c0-4.5 6-10 6-10z"></path>
                              </svg></sc-if>
                            <sc-if hint-placeholder-val="{{ false }}" value="{{ o.iFunnel }}"><svg fill="none"
                                height="13" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                stroke-width="2" viewbox="0 0 24 24" width="13">
                                <path d="M3 5h18l-7 8v6l-4 2v-8z"></path>
                              </svg></sc-if>
                          </span>
                          {{ o.label }}
                        </button>
                      </sc-for>
                    </div>
                  </div>
                </sc-if>
                <div style="height:1px; background:#f0f2f5; margin:0 0 16px;"></div>
                <!-- owner -->
                <div style="margin-bottom:17px;">
                  <div style="font-size:13.5px; color:#7b8595; font-weight:700; margin-bottom:10px;">בעלים</div>
                  <div style="display:flex; flex-wrap:wrap; gap:8px;">
                    <sc-for as="o" hint-placeholder-count="5" list="{{ ownerOpts }}">
                      <button onclick="{{ o.pick }}"
                        style="display:inline-flex; align-items:center; padding:9px 14px; border-radius:99px; cursor:pointer; font-size:13px; font-weight:{{ o.weight }}; background:{{ o.bg }}; color:{{ o.color }}; border:1.4px solid {{ o.border }};">{{
                        o.label }}</button>
                    </sc-for>
                  </div>
                </div>
                <!-- source (leads mode) -->
                <sc-if hint-placeholder-val="{{ true }}" value="{{ showStatus }}">
                  <div style="height:1px; background:#f0f2f5; margin:0 0 16px;"></div>
                  <div style="margin-bottom:17px;">
                    <div style="font-size:13.5px; color:#7b8595; font-weight:700; margin-bottom:10px;">מקור</div>
                    <div style="display:flex; flex-wrap:wrap; gap:8px;">
                      <sc-for as="o" hint-placeholder-count="6" list="{{ sourceOpts }}">
                        <button onclick="{{ o.pick }}"
                          style="display:inline-flex; align-items:center; padding:9px 14px; border-radius:99px; cursor:pointer; font-size:13px; font-weight:{{ o.weight }}; background:{{ o.bg }}; color:{{ o.color }}; border:1.4px solid {{ o.border }};">{{
                          o.label }}</button>
                      </sc-for>
                    </div>
                  </div>
                </sc-if>
                <div style="height:1px; background:#f0f2f5; margin:0 0 16px;"></div>
                <!-- date -->
                <div style="margin-bottom:17px;">
                  <div style="display:flex; align-items:center; gap:8px; margin-bottom:10px;">
                    <span style="font-size:13.5px; color:#7b8595; font-weight:700;">{{ dateTitle }}</span>
                    <sc-if hint-placeholder-val="{{ false }}" value="{{ hasDateBadge }}"><span
                        style="background:#eef0fb; color:#50439d; font-size:11px; font-weight:700; padding:2px 9px; border-radius:99px;">{{
                        dateBadge }}</span></sc-if>
                  </div>
                  <div style="display:flex; gap:10px; margin-bottom:10px;">
                    <div
                      style="flex:1; display:flex; align-items:center; gap:7px; padding:12px 13px; border:1.5px solid #dde2ea; border-radius:11px;">
                      <svg fill="none" height="15" stroke="#9aa3b0" stroke-linecap="round" stroke-linejoin="round"
                        stroke-width="1.9" viewbox="0 0 24 24" width="15">
                        <rect height="16" rx="2.5" width="18" x="3" y="5"></rect>
                        <path d="M3 9h18M8 3v4M16 3v4"></path>
                      </svg>
                      <span style="font-size:13.5px; color:{{ dateFromColor }}; font-weight:600;">{{ dateFromText
                        }}</span>
                    </div>
                    <div
                      style="flex:1; display:flex; align-items:center; gap:7px; padding:12px 13px; border:1.5px solid #dde2ea; border-radius:11px;">
                      <svg fill="none" height="15" stroke="#9aa3b0" stroke-linecap="round" stroke-linejoin="round"
                        stroke-width="1.9" viewbox="0 0 24 24" width="15">
                        <rect height="16" rx="2.5" width="18" x="3" y="5"></rect>
                        <path d="M3 9h18M8 3v4M16 3v4"></path>
                      </svg>
                      <span style="font-size:13.5px; color:#aeb6c2; font-weight:600;">עד תאריך</span>
                    </div>
                  </div>
                  <div style="display:flex; flex-wrap:wrap; gap:8px;">
                    <sc-for as="o" hint-placeholder-count="5" list="{{ dateChips }}">
                      <button onclick="{{ o.pick }}"
                        style="display:inline-flex; align-items:center; padding:8px 14px; border-radius:99px; cursor:pointer; font-size:12.5px; font-weight:{{ o.weight }}; background:{{ o.bg }}; color:{{ o.color }}; border:1.4px solid {{ o.border }};">{{
                        o.label }}</button>
                    </sc-for>
                  </div>
                </div>
                <div style="height:1px; background:#f0f2f5; margin:0 0 16px;"></div>
                <!-- sort -->
                <div style="font-size:13.5px; color:#7b8595; font-weight:700; margin-bottom:10px;">מיון לפי</div>
                <sc-for as="r" hint-placeholder-count="2" list="{{ sortRows }}">
                  <div onclick="{{ r.pick }}"
                    style="display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:13px; margin-bottom:9px; cursor:pointer; background:{{ r.bg }}; border:1.5px solid {{ r.border }};">
                    <span
                      style="width:20px; height:20px; border-radius:50%; border:2px solid {{ r.ring }}; display:flex; align-items:center; justify-content:center; flex:none;">
                      <sc-if hint-placeholder-val="{{ true }}" value="{{ r.active }}"><span
                          style="width:9px; height:9px; border-radius:50%; background:#1d60a2;"></span></sc-if>
                    </span>
                    <span style="font-size:14px; font-weight:700; color:{{ r.labelColor }};">{{ r.label }}</span>
                    <div style="display:flex; gap:6px; margin-right:auto;">
                      <sc-for as="d" hint-placeholder-count="2" list="{{ r.dirs }}">
                        <button onclick="{{ d.pick }}"
                          style="display:inline-flex; align-items:center; gap:3px; padding:6px 11px; border:none; border-radius:8px; cursor:pointer; font-size:12px; font-weight:700; background:{{ d.bg }}; color:{{ d.color }};">
                          {{ d.label }}
                          <sc-if hint-placeholder-val="{{ true }}" value="{{ d.up }}"><svg fill="none" height="11"
                              stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.6"
                              viewbox="0 0 24 24" width="11">
                              <path d="m6 14 6-6 6 6"></path>
                            </svg></sc-if>
                          <sc-if hint-placeholder-val="{{ false }}" value="{{ d.down }}"><svg fill="none" height="11"
                              stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.6"
                              viewbox="0 0 24 24" width="11">
                              <path d="m6 10 6 6 6-6"></path>
                            </svg></sc-if>
                        </button>
                      </sc-for>
                    </div>
                  </div>
                </sc-for>
                <button onclick="{{ closeFilters }}"
                  style="width:100%; margin-top:8px; padding:15px; border:none; border-radius:14px; background:{{ btnBg }}; color:#fff; font-size:15.5px; font-weight:800; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:9px;">
                  <svg fill="none" height="17" stroke="#fff" stroke-linecap="round" stroke-linejoin="round"
                    stroke-width="2.6" viewbox="0 0 24 24" width="17">
                    <path d="M20 6 9 17l-5-5"></path>
                  </svg>
                  הצג {{ resultCount }} {{ resultLabel }}
                </button>
              </div>
            </div>
          </sc-if>
        </div>
      </div>
    </div>
  </x-dc>

  <!-- Force re-execution after DOM load -->
  <script>
    window.addEventListener('load', function() {
      if (typeof ensureCommonHeader === 'function') ensureCommonHeader();
      if (typeof ensureCommonFooter === 'function') ensureCommonFooter();
    });
  </script>

  <script data-dc-script="" data-props='{"$preview": {"width": 424, "height": 880}}' type="text/x-dc">
class Component extends DCLogic {
  state = {
    filtersOpen: false,
    mainChip: 'all',
    soug: 'all',
    status: 'all',
    owner: 'all',
    source: 'all',
    renew: { insurance: true, filter: true, softener: false, warranty: false, system: false },
    dateQuick: 'none',
    sortLeads: 'created',
    sortRenew: 'expiry',
    dir: { created: 'new', statusTime: 'long', expiry: 'urgent' },
  };

  TONES = {
    blue:   { bg: '#eaf2fb', color: '#1d60a2', border: '#aecbe9' },
    red:    { bg: '#fbeeed', color: '#c0392b', border: '#ecb8b1' },
    amber:  { bg: '#fdf1dd', color: '#bd8324', border: '#ecd3a0' },
    green:  { bg: '#e6f4ec', color: '#2e8a63', border: '#aed8c2' },
    purple: { bg: '#eef0fb', color: '#50439d', border: '#c3bfe6' },
    gray:   { bg: '#eef0f3', color: '#5a6473', border: '#d6dbe2' },
  };

  STATUSES = [
    { id: 'all', label: 'הכל' },
    { id: 'new', label: 'ליד חדש' },
    { id: 'followup', label: 'פולואפ' },
    { id: 'noanswer', label: 'אין מענה' },
    { id: 'offer', label: 'נשלחה הצעה' },
    { id: 'closed', label: 'נסגר' },
    { id: 'irrelevant', label: 'לא רלוונטי' },
  ];

  OWNERS = [
    { id: 'all', label: 'הכל' },
    { id: 'yossi', label: 'יוסי כהן' },
    { id: 'elkana', label: 'אלקנה' },
    { id: 'ariel', label: 'אריאל' },
    { id: 'zion', label: 'ציון' },
  ];

  SOURCES = [
    { id: 'all', label: 'הכל' },
    { id: 'fb', label: 'פייסבוק' },
    { id: 'ig', label: 'אינסטגרם' },
    { id: 'site', label: 'אתר' },
    { id: 'ref', label: 'הפניה' },
    { id: 'incoming', label: 'שיחה נכנסת' },
    { id: 'other', label: 'אחר' },
  ];

  RENEWS = [
    { id: 'insurance', label: 'ביטוח פג', tone: 'purple', icon: 'shield' },
    { id: 'filter', label: 'סנן לחידוש', tone: 'amber', icon: 'drop' },
    { id: 'softener', label: 'מרכך לחידוש', tone: 'blue', icon: 'drop' },
    { id: 'warranty', label: 'אחריות פגה', tone: 'red', icon: 'shield' },
    { id: 'system', label: 'מערכת סינון', tone: 'green', icon: 'funnel' },
  ];

  MAIN_CHIPS = [
    { id: 'all', label: 'הכל' },
    { id: 'new', label: 'ליד חדש' },
    { id: 'followup', label: 'פולואפ' },
    { id: 'sent', label: 'נשלחה הצעה' },
    { id: 'closed', label: 'נסגר' },
    { id: 'noanswer', label: 'אין מענה' },
  ];

  openFilters() { this.setState({ filtersOpen: true }); }
  closeFilters() { this.setState({ filtersOpen: false }); }

  clearFilters() {
    this.setState({
      soug: 'all', status: 'all', owner: 'all', source: 'all',
      renew: { insurance: false, filter: false, softener: false, warranty: false, system: false },
      dateQuick: 'none',
    });
  }

  selPill(selected) {
    if (selected) return { bg: this.TONES.blue.bg, color: this.TONES.blue.color, border: this.TONES.blue.border, weight: '700' };
    return { bg: '#fff', color: '#5a6473', border: '#e4e8ee', weight: '600' };
  }

  isRenew() { return this.state.soug === 'renew'; }

  resultCount() {
    const s = this.state;
    if (this.isRenew()) {
      const n = Object.values(s.renew).filter(Boolean).length;
      return n === 0 ? 14 : (n === 2 ? 8 : n * 5);
    }
    let n = 47;
    if (s.status !== 'all') n = 22;
    if (s.source !== 'all') n = 14;
    if (s.owner !== 'all') n = Math.min(n, 14);
    return n;
  }

  renderVals() {
    const s = this.state;
    const renew = this.isRenew();
    const accent = renew ? '#50439d' : '#1d60a2';

    // main chips
    const mainChips = this.MAIN_CHIPS.map(c => {
      const on = s.mainChip === c.id;
      return {
        id: c.id,
        active: on ? '1' : '',
        label: c.label,
        pick: () => this.setState({ mainChip: c.id }),
        bg: on ? '#dceaf8' : '#fff',
        color: on ? '#1d60a2' : '#5a6473',
        border: on ? '#bcd6f0' : '#e4e8ee',
        weight: on ? '700' : '600',
      };
    });

    // soug segments
    const sougDefs = [
      { id: 'all', label: 'הכל', icon: 'iFilter' },
      { id: 'leads', label: 'לידים', icon: 'iLead' },
      { id: 'renew', label: 'חידושים', icon: 'iShield' },
    ];
    const sougSegs = sougDefs.map(d => {
      const on = s.soug === d.id;
      return {
        label: d.label,
        pick: () => this.setState({ soug: d.id }),
        bg: on ? accent : 'transparent',
        color: on ? '#fff' : '#5a6473',
        shadow: on ? '0 2px 6px rgba(29,96,162,.28)' : 'none',
        iFilter: d.icon === 'iFilter', iLead: d.icon === 'iLead', iShield: d.icon === 'iShield',
      };
    });

    // status pills
    const statusOpts = this.STATUSES.map(o => {
      const on = s.status === o.id;
      const st = this.selPill(on);
      return { label: o.label, pick: () => this.setState({ status: o.id }),
        bg: st.bg, color: st.color, border: st.border, weight: st.weight, check: on && o.id !== 'all' };
    });

    // renew pills
    const renewOpts = this.RENEWS.map(o => {
      const on = !!s.renew[o.id];
      const t = this.TONES[o.tone];
      return {
        label: o.label,
        pick: () => this.setState(p => ({ renew: { ...p.renew, [o.id]: !p.renew[o.id] } })),
        bg: on ? t.bg : '#fff', color: on ? t.color : '#5a6473', border: on ? t.border : '#e4e8ee',
        weight: on ? '700' : '600', iShield: o.icon === 'shield', iDrop: o.icon === 'drop', iFunnel: o.icon === 'funnel',
      };
    });

    // owner pills
    const ownerOpts = this.OWNERS.map(o => {
      const on = s.owner === o.id;
      const st = this.selPill(on);
      return { label: o.label, pick: () => this.setState({ owner: o.id }),
        bg: st.bg, color: st.color, border: st.border, weight: st.weight };
    });

    // source pills
    const sourceOpts = this.SOURCES.map(o => {
      const on = s.source === o.id;
      const st = this.selPill(on);
      return { label: o.label, pick: () => this.setState({ source: o.id }),
        bg: st.bg, color: st.color, border: st.border, weight: st.weight };
    });

    // date
    const dateDefs = renew
      ? [ { id: 'expired', label: 'פג כבר' }, { id: 'week', label: 'השבוע' }, { id: 'month', label: 'החודש' }, { id: 'd30', label: '30 יום' }, { id: 'custom', label: 'מותאם' } ]
      : [ { id: 'today', label: 'היום' }, { id: 'week', label: 'השבוע' }, { id: 'month', label: 'החודש' }, { id: 'd30', label: '30 יום' }, { id: 'custom', label: 'מותאם' } ];
    const dateChips = dateDefs.map(o => {
      const on = s.dateQuick === o.id;
      const st = this.selPill(on);
      return { label: o.label, pick: () => this.setState({ dateQuick: on ? 'none' : o.id }),
        bg: st.bg, color: st.color, border: st.border, weight: st.weight };
    });
    const dateFromSet = !renew && s.dateQuick === 'week';
    const dateFromText = dateFromSet ? '01/06/25' : 'מתאריך';
    const dateFromColor = dateFromSet ? '#1f2a3a' : '#aeb6c2';

    // sort
    const sortDefs = renew
      ? [ { id: 'expiry', label: 'תאריך פקיעה', dirs: [ { id: 'urgent', label: 'דחוף', up: true }, { id: 'far', label: 'רחוק', up: false } ] },
          { id: 'created', label: 'תאריך יצירה', dirs: [ { id: 'new', label: 'חדש', up: false }, { id: 'old', label: 'ישן', up: true } ] } ]
      : [ { id: 'created', label: 'תאריך יצירה', dirs: [ { id: 'new', label: 'חדש', up: false }, { id: 'old', label: 'ישן', up: true } ] },
          { id: 'statusTime', label: 'זמן בסטטוס', dirs: [ { id: 'long', label: 'ארוך', up: false }, { id: 'short', label: 'קצר', up: true } ] } ];
    const curSort = renew ? s.sortRenew : s.sortLeads;
    const sortKey = renew ? 'sortRenew' : 'sortLeads';
    const sortRows = sortDefs.map(r => {
      const active = curSort === r.id;
      return {
        label: r.label, active,
        pick: () => this.setState({ [sortKey]: r.id }),
        bg: active ? '#eaf2fb' : '#fff', border: active ? '#aecbe9' : '#e4e8ee',
        ring: active ? '#1d60a2' : '#cbd2dc', labelColor: active ? '#194f84' : '#46505f',
        dirs: r.dirs.map(d => {
          const on = active && s.dir[r.id] === d.id;
          return { label: d.label, up: d.up, down: !d.up,
            pick: () => this.setState(p => ({ dir: { ...p.dir, [r.id]: d.id } })),
            bg: on ? '#1d60a2' : '#eef0f3', color: on ? '#fff' : '#7b8595' };
        }),
      };
    });

    // chips
    const chips = [];
    if (s.soug !== 'all') {
      const t = renew ? this.TONES.purple : this.TONES.blue;
      chips.push({ label: renew ? 'חידושים' : 'לידים', bg: t.bg, color: t.color, border: t.border,
        clear: () => this.setState({ soug: 'all' }) });
    }
    if (s.status !== 'all') {
      const o = this.STATUSES.find(x => x.id === s.status);
      chips.push({ label: o.label, bg: this.TONES.blue.bg, color: this.TONES.blue.color, border: this.TONES.blue.border,
        clear: () => this.setState({ status: 'all' }) });
    }
    if (s.owner !== 'all') {
      const o = this.OWNERS.find(x => x.id === s.owner);
      chips.push({ label: o.label, bg: this.TONES.blue.bg, color: this.TONES.blue.color, border: this.TONES.blue.border,
        clear: () => this.setState({ owner: 'all' }) });
    }
    if (s.source !== 'all') {
      const o = this.SOURCES.find(x => x.id === s.source);
      chips.push({ label: o.label, bg: this.TONES.blue.bg, color: this.TONES.blue.color, border: this.TONES.blue.border,
        clear: () => this.setState({ source: 'all' }) });
    }
    if (renew) {
      this.RENEWS.forEach(o => {
        if (s.renew[o.id]) {
          const t = this.TONES[o.tone];
          chips.push({ label: o.label, bg: t.bg, color: t.color, border: t.border,
            clear: () => this.setState(p => ({ renew: { ...p.renew, [o.id]: false } })) });
        }
      });
    }

    const hasActiveFilters = s.soug !== 'all' || s.status !== 'all' || s.owner !== 'all' || s.source !== 'all'
      || (renew && Object.values(s.renew).some(Boolean)) || s.dateQuick !== 'none';

    return {
      filtersOpen: s.filtersOpen,
      openFilters: () => this.openFilters(),
      closeFilters: () => this.closeFilters(),
      clearFilters: () => this.clearFilters(),
      hasActiveFilters,
      mainChips,
      sougSegs,
      showStatus: !renew,
      showRenew: renew,
      statusOpts, renewOpts, ownerOpts, sourceOpts,
      dateTitle: renew ? 'תאריך פקיעה' : 'תאריך יצירה',
      hasDateBadge: renew, dateBadge: 'במקום תאריך יצירה',
      dateChips, dateFromText, dateFromColor,
      sortRows,
      chips, hasChips: chips.length > 0,
      resultCount: this.resultCount(),
      resultLabel: renew ? 'חידושים' : 'תוצאות',
      btnBg: accent,
    };
  }
}
</script>
</body>
