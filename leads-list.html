<!DOCTYPE html>

<html>

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1" name="viewport" />
    <script>document.write('<script src="./asset-version.js?_='+Date.now()+'"><\/script>');</script>
  <script>

<body data-role="sales" data-active-tab="leads">
  <x-dc>
    <helmet>
      <link href="https://fonts.googleapis.com" rel="preconnect" />
      <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
      <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&amp;display=swap"
        rel="stylesheet" />
      <style>
        * {
          box-sizing: border-box;
        }

        html,
        body {
          margin: 0;
          direction: rtl;
          font-family: 'Heebo', sans-serif;
          -webkit-font-smoothing: antialiased;
        }

        button,
        input {
          font-family: 'Heebo', sans-serif;
        }

        .dc-scroll::-webkit-scrollbar {
          width: 0;
          height: 0;
        }

        .ds-input::placeholder {
          color: #aeb6c2;
        }

        .mb-lead-filter-overlay {
          position: absolute;
          inset: 0;
          z-index: 80;
        }

        .mb-lead-filter-sheet {
          position: absolute;
          bottom: 0;
          left: 0;
          right: 0;
          background: #fff;
          border-radius: 24px 24px 0 0;
          max-height: min(92%, calc(100% - 48px));
          display: flex;
          flex-direction: column;
          overflow: hidden;
          box-shadow: 0 -8px 28px rgba(15, 24, 40, .18);
          will-change: transform;
          z-index: 81;
        }

        .mb-lead-filter-sheet-body {
          flex: 1 1 auto;
          min-height: 0;
          overflow-y: auto;
          -webkit-overflow-scrolling: touch;
          overscroll-behavior: contain;
          touch-action: pan-y;
          padding: 0 18px 12px;
        }

        .mb-lead-filter-sheet-foot {
          flex: 0 0 auto;
          padding: 12px 18px calc(18px + env(safe-area-inset-bottom, 0px));
          border-top: 1px solid #eef0f3;
          background: #fff;
          position: relative;
          z-index: 2;
          box-shadow: 0 -6px 16px rgba(15, 24, 40, .06);
        }

        .mb-lead-sheet-handle {
          width: 42px;
          height: 5px;
          border-radius: 99px;
          background: #dadfe6;
          margin: 0 auto 14px;
          cursor: grab;
          touch-action: none;
        }

        .mb-lead-sheet-handle:active {
          cursor: grabbing;
        }

        #mb-customer-filter-chips {
          cursor: grab;
          min-width: 0;
          max-width: 100%;
        }

        #mb-customer-filter-chips:active {
          cursor: grabbing;
        }
      </style>
    </helmet>
    <div
      style="min-height:100vh; background:#e6e8ec; display:flex; align-items:flex-start; justify-content:center; padding:26px 16px;">
      <div
        style="width:392px; max-width:100%; background:#0f1828; border-radius:34px; padding:9px; box-shadow:0 24px 60px rgba(15,24,40,.34);">
          <div class="screen-card" style="background:#eef0f3; border-radius:26px; overflow:hidden; position:relative; height:812px; display:flex; flex-direction:column;">
          <!-- header: title + count | filter icon (left) + new lead -->
          <div
            style="display:flex; align-items:flex-start; justify-content:space-between; gap:10px; padding:8px 16px 12px; flex:none; background:#fff;">
            <div style="display:flex; align-items:flex-start; gap:8px; flex:1; min-width:0;">
              <div style="flex:1; min-width:0;">
                <div style="font-size:22px; font-weight:800; color:#16223a; line-height:1.15;">{{ pageTitle }}</div>
                <div id="mb-total-label" style="font-size:12px; font-weight:700; color:#9aa3b0; margin-top:3px; line-height:1.3;">…</div>
              </div>
              <button type="button" onclick="{{ openFilters }}" aria-label="{{ filterBtnLabel }}" title="{{ filterBtnLabel }}"
                style="position:relative; width:36px; height:36px; margin-top:2px; border-radius:50%; border:1.5px solid #dde2ea; background:#fff; cursor:pointer; flex:none; display:inline-flex; align-items:center; justify-content:center; padding:0;">
                <svg fill="none" height="16" stroke="#46505f" stroke-linecap="round" stroke-linejoin="round"
                  stroke-width="2" viewbox="0 0 24 24" width="16" aria-hidden="true">
                  <path d="M3 5h18M6 12h12M10 19h4"></path>
                </svg>
                <sc-if hint-placeholder-val="{{ false }}" value="{{ hasActiveFilters }}"><span
                    style="position:absolute; top:6px; inset-inline-end:6px; width:7px; height:7px; border-radius:50%; background:#c0392b;"></span></sc-if>
              </button>
            </div>
            <a href="sales-add-lead.html?back=leads-list.html"
              style="display:inline-flex; align-items:center; gap:5px; padding:8px 12px; border-radius:99px; background:#1d60a2; color:#fff; text-decoration:none; flex:none; box-shadow:0 5px 13px rgba(29,96,162,.26);">
              <svg fill="none" height="15" stroke="#fff" stroke-linecap="round" stroke-linejoin="round"
                stroke-width="2.4" viewbox="0 0 24 24" width="15" style="flex:none;">
                <path d="M5 12h14M12 5v14"></path>
              </svg>
              <span style="font-size:13px; font-weight:800; white-space:nowrap;">{{ newLeadLabel }}</span>
            </a>
          </div>
          <!-- search + chip row -->
          <div style="flex:none; background:#fff; padding:0 16px 13px; border-bottom:1px solid #eef0f3;">
            <div
              style="display:flex; align-items:center; gap:9px; padding:12px 14px; border:1.5px solid #dde2ea; border-radius:13px; background:#fff;">
              <svg fill="none" height="18" stroke="#9aa3b0" stroke-linecap="round" stroke-linejoin="round"
                stroke-width="2" viewbox="0 0 24 24" width="18">
                <circle cx="11" cy="11" r="7"></circle>
                <path d="m20 20-3.2-3.2"></path>
              </svg>
              <input class="ds-input mb-search" placeholder="{{ searchPlaceholder }}"
                style="flex:1; border:none; outline:none; font-size:14.5px; color:#1f2a3a; background:transparent; text-align:start;" />
            </div>
            <div id="mb-customer-filter-chips" class="dc-scroll" data-active-folder="1"
              style="display:flex; gap:8px; overflow-x:auto; margin-top:11px; padding-bottom:4px; scrollbar-width:none; -webkit-overflow-scrolling:touch;">
            </div>
          </div>
          <!-- ===== scrollable list ===== -->
          <div class="dc-scroll" style="flex:1; overflow-y:auto; padding:12px 16px 16px;">
            <div data-folder="1" data-kind="leads" id="mb-live-list"></div>
          </div>

          <!-- ============ FILTER SHEET ============ -->
          <sc-if hint-placeholder-val="{{ false }}" value="{{ filtersOpen }}">
            <div class="mb-lead-filter-overlay">
              <div onclick="{{ closeFilters }}" style="position:absolute; inset:0; background:#0f1828; opacity:0.4;">
              </div>
              <div id="mb-lead-filter-sheet" class="mb-lead-filter-sheet">
                <div style="flex:none; padding:14px 18px 0;">
                  <div id="mb-lead-filter-sheet-handle" class="mb-lead-sheet-handle"></div>
                  <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:15px;">
                    <div style="font-size:19px; font-weight:800; color:#1f2a3a;">{{ filterTitle }}</div>
                    <button onclick="{{ clearFilters }}"
                      style="border:none; background:none; color:#c0392b; font-size:13.5px; font-weight:700; cursor:pointer;">{{ clearAllLabel }}</button>
                  </div>
                </div>
                <div class="mb-lead-filter-sheet-body dc-scroll">
                <!-- active chips -->
                <sc-if hint-placeholder-val="{{ false }}" value="{{ hasChips }}">
                  <div style="display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px;">
                    <sc-for as="c" hint-placeholder-count="3" list="{{ chips }}">
                      <button onclick="{{ c.clear }}"

                          <path d="M18 6 6 18M6 6l12 12"></path>

                        {{ c.label }}
                      </button>
                    </sc-for>
                  </div>
                </sc-if>
                <!-- Status -->
                <div style="margin-bottom:17px;">
                  <div style="font-size:13.5px; color:#7b8595; font-weight:700; margin-bottom:10px;">{{ statusLabel }}</div>
                  <div style="display:flex; flex-wrap:wrap; gap:8px;">
                    <sc-for as="o" hint-placeholder-count="6" list="{{ statusOpts }}">
                      <button onclick="{{ o.pick }}"

                            viewbox="0 0 24 24" width="13">
                            <path d="M20 6 9 17l-5-5"></path>
                          </svg></sc-if>
                        {{ o.label }}
                      </button>
                    </sc-for>
                  </div>
                </div>
                <!-- source -->
                <div style="height:1px; background:#f0f2f5; margin:0 0 16px;"></div>
                <div style="margin-bottom:17px;">
                  <div style="font-size:13.5px; color:#7b8595; font-weight:700; margin-bottom:10px;">{{ sourceLabel }}</div>
                  <div style="display:flex; flex-wrap:wrap; gap:8px;">
                    <sc-for as="o" hint-placeholder-count="6" list="{{ sourceOpts }}">
                      <button onclick="{{ o.pick }}"

                        o.label }}</button>
                    </sc-for>
                  </div>
                </div>
                <div style="height:1px; background:#f0f2f5; margin:0 0 16px;"></div>
                <!-- date -->
                <div style="margin-bottom:17px;">
                  <div style="display:flex; align-items:center; gap:8px; margin-bottom:10px;">
                    <span style="font-size:13.5px; color:#7b8595; font-weight:700;">{{ dateTitle }}</span>
                  </div>

                    <div
                      style="flex:1; display:flex; align-items:center; gap:7px; padding:12px 13px; border:1.5px solid #dde2ea; border-radius:11px;">
                      <svg fill="none" height="15" stroke="#9aa3b0" stroke-linecap="round" stroke-linejoin="round"
                        stroke-width="1.9" viewbox="0 0 24 24" width="15">
                        <rect height="16" rx="2.5" width="18" x="3" y="5"></rect>
                        <path d="M3 9h18M8 3v4M16 3v4"></path>
                      </svg>
                      <span style="font-size:13.5px; color:{{ dateFromColor }}; font-weight:600;">{{ dateFromText
                        }}</span>
                    </div>
                    <div
                      style="flex:1; display:flex; align-items:center; gap:7px; padding:12px 13px; border:1.5px solid #dde2ea; border-radius:11px;">
                      <svg fill="none" height="15" stroke="#9aa3b0" stroke-linecap="round" stroke-linejoin="round"
                        stroke-width="1.9" viewbox="0 0 24 24" width="15">
                        <rect height="16" rx="2.5" width="18" x="3" y="5"></rect>
                        <path d="M3 9h18M8 3v4M16 3v4"></path>
                      </svg>
                      <span style="font-size:13.5px; color:#aeb6c2; font-weight:600;">{{ dateToLabel }}</span>
                    </div>
                  </div>
                  <div style="display:flex; flex-wrap:wrap; gap:8px;">
                    <sc-for as="o" hint-placeholder-count="5" list="{{ dateChips }}">
                      <button onclick="{{ o.pick }}"
                        style="display:inline-flex; align-items:center; padding:8px 14px; border-radius:99px; cursor:pointer; font-size:12.5px; font-weight:{{ o.weight }}; background:{{ o.bg }}; color:{{ o.color }}; border:1.4px solid {{ o.border }};">{{
                        o.label }}</button>
                    </sc-for>
                  </div>
                </div>
                <div style="height:1px; background:#f0f2f5; margin:0 0 16px;"></div>
                <!-- sort -->
                <div style="font-size:13.5px; color:#7b8595; font-weight:700; margin-bottom:10px;">{{ sortByLabel }}</div>
                <sc-for as="r" hint-placeholder-count="2" list="{{ sortRows }}">
                  <div onclick="{{ r.pick }}"
                    style="display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:13px; margin-bottom:9px; cursor:pointer; background:{{ r.bg }}; border:1.5px solid {{ r.border }};">
                    <span
                      style="width:20px; height:20px; border-radius:50%; border:2px solid {{ r.ring }}; display:flex; align-items:center; justify-content:center; flex:none;">
                      <sc-if hint-placeholder-val="{{ true }}" value="{{ r.active }}"><span

                    <span style="font-size:14px; font-weight:700; color:{{ r.labelColor }};">{{ r.label }}</span>

  <!-- Force re-execution after DOM load -->
  <script>

      if (typeof ensureCommonHeader === 'function') ensureCommonHeader();
      if (typeof ensureCommonFooter === 'function') ensureCommonFooter();
    });
  </script>

  <script data-dc-script="" data-props='{"$preview": {"width": 424, "height": 880}}' type="text/x-dc">
class Component extends DCLogic {
  state = {
    filtersOpen: false,
    mainChip: 'all',
    status: 'all',
    source: 'all',
    dateQuick: 'none',
    sortLeads: 'created',
    dir: { created: 'new', statusTime: 'long' },
    langTick: 0,
  };

  TONES = {
    blue:   { bg: '#eaf2fb', color: '#1d60a2', border: '#aecbe9' },
    red:    { bg: '#fbeeed', color: '#c0392b', border: '#ecb8b1' },
    amber:  { bg: '#fdf1dd', color: '#bd8324', border: '#ecd3a0' },
    green:  { bg: '#e6f4ec', color: '#2e8a63', border: '#aed8c2' },
    purple: { bg: '#eef0fb', color: '#50439d', border: '#c3bfe6' },
    gray:   { bg: '#eef0f3', color: '#5a6473', border: '#d6dbe2' },
  };

  isEn() {
    return typeof getCurrentLanguage === 'function' && getCurrentLanguage() === 'en';
  }

  t(en, he) {
    if (typeof window.mbT === 'function') return window.mbT(en, he);
    return this.isEn() ? en : he;
  }

  statusDefs() {
    return [
      { id: 'all', en: 'All', he: 'הכל' },
      { id: 'new', en: 'New lead', he: 'ליד חדש' },
      { id: 'followup', en: 'Follow up', he: 'פולואפ' },
      { id: 'noanswer', en: 'No answer', he: 'אין מענה' },
      { id: 'offer', en: 'Offer sent', he: 'נשלחה הצעה' },
      { id: 'closed', en: 'Closed', he: 'נסגר' },
      { id: 'irrelevant', en: 'Not relevant', he: 'לא רלוונטי' },
    ];
  }

  sourceDefs() {
    return [
      { id: 'all', en: 'All', he: 'הכל' },
      { id: 'fb', en: 'Facebook', he: 'פייסבוק' },
      { id: 'ig', en: 'Instagram', he: 'אינסטגרם' },
      { id: 'site', en: 'Website', he: 'אתר' },
      { id: 'ref', en: 'Referral', he: 'הפניה' },
      { id: 'incoming', en: 'Incoming call', he: 'שיחה נכנסת' },
      { id: 'other', en: 'Other', he: 'אחר' },
    ];
  }

  openFilters() {
    this.setState({ filtersOpen: true });
    var foot = document.getElementById('common-app-footer');
    if (foot) foot.style.visibility = 'hidden';
    var self = this;
    setTimeout(function () { self.setupSheetDrag(); }, 30);
  }
  closeFilters() {
    var sheet = document.getElementById('mb-lead-filter-sheet');
    if (sheet) {
      sheet.style.transition = '';
      sheet.style.transform = '';
    }
    var foot = document.getElementById('common-app-footer');
    if (foot) foot.style.visibility = '';
    this.setState({ filtersOpen: false });
  }

  applyFilters() {
    var status = this.state.status;
    if (status === 'offer') status = 'sent';
    var mainChip = this.state.mainChip;
    if (status !== 'all') mainChip = status;
    if (window.ListLive && typeof window.ListLive.setLeadAdvancedFilters === 'function') {
      window.ListLive.setLeadAdvancedFilters({
        status: status,
        source: this.state.source,
        dateQuick: this.state.dateQuick,
        sortLeads: this.state.sortLeads,
        dir: Object.assign({}, this.state.dir),
        mainChip: mainChip
      });
    }
    this.setState({ filtersOpen: false, status: status, mainChip: mainChip });
    var foot = document.getElementById('common-app-footer');
    if (foot) foot.style.visibility = '';
  }

  componentDidMount() {
    var self = this;
    this._onLeadFilterSync = function (ev) {
      var d = (ev && ev.detail) || {};
      self.setState({
        mainChip: d.mainChip != null ? d.mainChip : self.state.mainChip,
        status: d.status != null ? d.status : self.state.status,
        source: d.source != null ? d.source : self.state.source
      });
    };
    window.addEventListener('mineralbar:lead-filters', this._onLeadFilterSync);
    this._onLeadChipsReady = function () { self.setupFilterDragScroll(); };
    window.addEventListener('mineralbar:lead-chips-ready', this._onLeadChipsReady);
    this._onLang = function () { self.setState({ langTick: Date.now() }); };
    window.addEventListener('mineralbar:language-changed', this._onLang);
    this.setupFilterDragScroll();
    setTimeout(function () { self.setupFilterDragScroll(); }, 400);
  }

  setupFilterDragScroll() {
    var el = document.getElementById('mb-customer-filter-chips');
    if (!el || el.getAttribute('data-drag-bound') === '1') return;
    el.setAttribute('data-drag-bound', '1');

    var isDown = false;
    var didDrag = false;
    var startX = 0;
    var scrollLeft = 0;

    function getX(e) {
      return e.touches && e.touches.length ? e.touches[0].pageX : e.pageX;
    }

    function onStart(e) {
      if (e.target && e.target.closest && e.target.closest('.mb-lead-chip')) {
        /* allow chip clicks unless we actually drag */
      }
      isDown = true;
      didDrag = false;
      startX = getX(e);
      scrollLeft = el.scrollLeft;
    }

    function onMove(e) {
      if (!isDown) return;
      var x = getX(e);
      var walk = (x - startX) * 1.6;
      if (Math.abs(walk) > 4) didDrag = true;
      el.scrollLeft = scrollLeft - walk;
      if (didDrag && e.cancelable) e.preventDefault();
    }

    function onEnd() {
      isDown = false;
    }

    el.addEventListener('mousedown', onStart);
    el.addEventListener('mousemove', onMove);
    el.addEventListener('mouseup', onEnd);
    el.addEventListener('mouseleave', onEnd);
    el.addEventListener('touchstart', onStart, { passive: true });
    el.addEventListener('touchmove', onMove, { passive: false });
    el.addEventListener('touchend', onEnd);
    el.addEventListener('touchcancel', onEnd);
    el.addEventListener('wheel', function (e) {
      if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
        el.scrollLeft += e.deltaY;
        e.preventDefault();
      }
    }, { passive: false });

    el.addEventListener('click', function (e) {
      if (didDrag) {
        e.preventDefault();
        e.stopPropagation();
        didDrag = false;
      }
    }, true);
  }

  setupSheetDrag() {
    var sheet = document.getElementById('mb-lead-filter-sheet');
    var handle = document.getElementById('mb-lead-filter-sheet-handle');
    if (!sheet || !handle || handle.getAttribute('data-sheet-drag-bound') === '1') return;
    handle.setAttribute('data-sheet-drag-bound', '1');

    var self = this;
    var dragging = false;
    var startY = 0;
    var offsetY = 0;

    function getY(e) {
      return e.touches && e.touches.length ? e.touches[0].clientY : e.clientY;
    }

    function onStart(e) {
      dragging = true;
      startY = getY(e);
      offsetY = 0;
      sheet.style.transition = 'none';
    }

    function onMove(e) {
      if (!dragging) return;
      var dy = getY(e) - startY;
      if (dy < 0) dy = 0;
      offsetY = dy;
      sheet.style.transform = 'translateY(' + dy + 'px)';
      if (e.cancelable) e.preventDefault();
    }

    function onEnd() {
      if (!dragging) return;
      dragging = false;
      sheet.style.transition = 'transform 0.22s ease';
      if (offsetY > 90) {
        sheet.style.transform = 'translateY(100%)';
        setTimeout(function () { self.closeFilters(); }, 200);
      } else {
        sheet.style.transform = '';
      }
    }

    handle.addEventListener('mousedown', onStart);
    handle.addEventListener('mousemove', onMove);
    handle.addEventListener('mouseup', onEnd);
    handle.addEventListener('mouseleave', onEnd);
    handle.addEventListener('touchstart', onStart, { passive: true });
    handle.addEventListener('touchmove', onMove, { passive: false });
    handle.addEventListener('touchend', onEnd);
    handle.addEventListener('touchcancel', onEnd);

    sheet.addEventListener('touchstart', function (e) {
      if (e.target === handle || (handle.contains && handle.contains(e.target))) return;
      var body = sheet.querySelector('.mb-lead-filter-sheet-body');
      if (body && body.scrollTop <= 0) {
        startY = getY(e);
        dragging = true;
        offsetY = 0;
        sheet.style.transition = 'none';
      }
    }, { passive: true });

    sheet.addEventListener('touchmove', function (e) {
      if (!dragging) return;
      var body = sheet.querySelector('.mb-lead-filter-sheet-body');
      if (body && body.scrollTop > 0) {
        dragging = false;
        sheet.style.transform = '';
        return;
      }
      var dy = getY(e) - startY;
      if (dy > 8) {
        if (dy < 0) dy = 0;
        offsetY = dy;
        sheet.style.transform = 'translateY(' + dy + 'px)';
        if (e.cancelable) e.preventDefault();
      } else if (dy < -4) {
        dragging = false;
        sheet.style.transform = '';
      }
    }, { passive: false });

    sheet.addEventListener('touchend', onEnd);
  }

  componentWillUnmount() {
    if (this._onLeadFilterSync) {
      window.removeEventListener('mineralbar:lead-filters', this._onLeadFilterSync);
    }
    if (this._onLeadChipsReady) {
      window.removeEventListener('mineralbar:lead-chips-ready', this._onLeadChipsReady);
    }
    if (this._onLang) {
      window.removeEventListener('mineralbar:language-changed', this._onLang);
    }
  }

  clearFilters() {
    this.setState({
      mainChip: 'all',
      status: 'all',
      source: 'all',
      dateQuick: 'none',
      sortLeads: 'created',
      dir: { created: 'new', statusTime: 'long' },
    });
    if (window.ListLive && typeof window.ListLive.setLeadAdvancedFilters === 'function') {
      window.ListLive.setLeadAdvancedFilters({
        mainChip: 'all',
        status: 'all',
        source: 'all',
        dateQuick: 'none',
        sortLeads: 'created',
        dir: { created: 'new', statusTime: 'long' },
      });
    }
  }

  selPill(selected) {
    if (selected) return { bg: this.TONES.blue.bg, color: this.TONES.blue.color, border: this.TONES.blue.border, weight: '700' };
    return { bg: '#fff', color: '#5a6473', border: '#e4e8ee', weight: '600' };
  }

  resultCount() {
    var s = this.state;
    if (window.ListLive && typeof window.ListLive.previewLeadFilterCount === 'function') {
      var status = s.status === 'offer' ? 'sent' : s.status;
      var mainChip = s.mainChip;
      if (status !== 'all') mainChip = status;
      var liveCount = window.ListLive.previewLeadFilterCount({
        status: status,
        source: s.source,
        dateQuick: s.dateQuick,
        sortLeads: s.sortLeads,
        dir: Object.assign({}, s.dir),
        mainChip: mainChip
      });
      if (liveCount >= 0) return liveCount;
    }
    var fallback = 47;
    if (s.status !== 'all') fallback = 22;
    if (s.source !== 'all') fallback = 14;
    return fallback;
  }

  renderVals() {
    const s = this.state;
    void s.langTick;
    const accent = '#1d60a2';
    const t = (en, he) => this.t(en, he);

    const statusOpts = this.statusDefs().map(o => {
      const on = s.status === o.id;
      const st = this.selPill(on);
      return {
        label: t(o.en, o.he),
        pick: () => this.setState({ status: o.id }),
        bg: st.bg, color: st.color, border: st.border, weight: st.weight,
        check: on && o.id !== 'all'
      };
    });

    const sourceOpts = this.sourceDefs().map(o => {
      const on = s.source === o.id;
      const st = this.selPill(on);
      return {
        label: t(o.en, o.he),
        pick: () => this.setState({ source: o.id }),
        bg: st.bg, color: st.color, border: st.border, weight: st.weight
      };
    });

    const dateDefs = [
      { id: 'today', en: 'Today', he: 'היום' },
      { id: 'week', en: 'This week', he: 'השבוע' },
      { id: 'month', en: 'This month', he: 'החודש' },
      { id: 'd30', en: '30 days', he: '30 יום' },
      { id: 'custom', en: 'Custom', he: 'מותאם' },
    ];
    const dateChips = dateDefs.map(o => {
      const on = s.dateQuick === o.id;
      const st = this.selPill(on);
      return {
        label: t(o.en, o.he),
        pick: () => this.setState({ dateQuick: on ? 'none' : o.id }),
        bg: st.bg, color: st.color, border: st.border, weight: st.weight
      };
    });
    const dateFromSet = s.dateQuick === 'week';
    const dateFromText = dateFromSet ? '01/06/25' : t('From date', 'מתאריך');
    const dateFromColor = dateFromSet ? '#1f2a3a' : '#aeb6c2';

    const sortDefs = [
      {
        id: 'created',
        en: 'Creation date', he: 'תאריך יצירה',
        dirs: [
          { id: 'new', en: 'New', he: 'חדש', up: false },
          { id: 'old', en: 'Old', he: 'ישן', up: true },
        ]
      },
      {
        id: 'statusTime',
        en: 'Time in status', he: 'זמן בסטטוס',
        dirs: [
          { id: 'long', en: 'Long', he: 'ארוך', up: false },
          { id: 'short', en: 'Short', he: 'קצר', up: true },
        ]
      },
    ];
    const curSort = s.sortLeads;
    const sortRows = sortDefs.map(r => {
      const active = curSort === r.id;
      return {
        label: t(r.en, r.he),
        active,
        pick: () => this.setState({ sortLeads: r.id }),
        bg: active ? '#eaf2fb' : '#fff',
        border: active ? '#aecbe9' : '#e4e8ee',
        ring: active ? '#1d60a2' : '#cbd2dc',
        labelColor: active ? '#194f84' : '#46505f',
        dirs: r.dirs.map(d => {
          const on = active && s.dir[r.id] === d.id;
          return {
            label: t(d.en, d.he),
            up: d.up,
            down: !d.up,
            pick: () => this.setState(p => ({ dir: Object.assign({}, p.dir, { [r.id]: d.id }) })),
            bg: on ? '#1d60a2' : '#eef0f3',
            color: on ? '#fff' : '#7b8595'
          };
        }),
      };
    });

    const chips = [];
    if (s.status !== 'all') {
      const o = this.statusDefs().find(x => x.id === s.status);
      if (o) {
        chips.push({
          label: t(o.en, o.he),
          bg: this.TONES.blue.bg, color: this.TONES.blue.color, border: this.TONES.blue.border,
          clear: () => this.setState({ status: 'all' })
        });
      }
    }
    if (s.source !== 'all') {
      const o = this.sourceDefs().find(x => x.id === s.source);
      if (o) {
        chips.push({
          label: t(o.en, o.he),
          bg: this.TONES.blue.bg, color: this.TONES.blue.color, border: this.TONES.blue.border,
          clear: () => this.setState({ source: 'all' })
        });
      }
    }
    if (s.dateQuick !== 'none') {
      const o = dateDefs.find(x => x.id === s.dateQuick);
      if (o) {
        chips.push({
          label: t(o.en, o.he),
          bg: this.TONES.blue.bg, color: this.TONES.blue.color, border: this.TONES.blue.border,
          clear: () => this.setState({ dateQuick: 'none' })
        });
      }
    }

    const hasActiveFilters = s.status !== 'all' || s.source !== 'all' || s.dateQuick !== 'none';

    return {
      pageTitle: t('Leads', 'לידים'),
      filterBtnLabel: t('Filtering and sorting', 'סינון ומיון'),
      newLeadLabel: t('New lead', 'ליד חדש'),
      searchPlaceholder: t('Search by name, phone, city...', 'חיפוש לפי שם, טלפון, עיר...'),
      filterTitle: t('Filtering and sorting', 'סינון ומיון'),
      clearAllLabel: t('Clear all', 'נקה הכל'),
      statusLabel: t('Status', 'סטטוס'),
      sourceLabel: t('Source', 'מקור'),
      dateTitle: t('Creation date', 'תאריך יצירה'),
      dateToLabel: t('To date', 'עד תאריך'),
      sortByLabel: t('Sort by', 'מיון לפי'),
      showResultsPrefix: t('Show', 'הצג'),
      filtersOpen: s.filtersOpen,
      openFilters: () => this.openFilters(),
      closeFilters: () => this.closeFilters(),
      applyFilters: () => this.applyFilters(),
      clearFilters: () => this.clearFilters(),
      hasActiveFilters,
      statusOpts,
      sourceOpts,
      dateChips,
      dateFromText,
      dateFromColor,
      sortRows,
      chips,
      hasChips: chips.length > 0,
      resultCount: this.resultCount(),
      resultLabel: t('results', 'תוצאות'),
      btnBg: accent,
    };
  }
}
</script>
</body>

</html>
