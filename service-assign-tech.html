<!DOCTYPE html>

<html>
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<script src="./support.js"></script>
<script src="./biz1-sdk.js?v=socketfix11"></script>
<script src="./biz1-app.js?v=socketfix11"></script>
<script src="./page-boot.js?v=socketfix11"></script>
<link rel="stylesheet" href="./common.css"/>
<script src="./i18n-translations.js?v=hefull1"></script>
<script src="./common-header-footer.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; direction: rtl; font-family: 'Heebo', sans-serif; -webkit-font-smoothing: antialiased; }
  button { font-family: 'Heebo', sans-serif; }
  .dc-scroll::-webkit-scrollbar { width: 0; }
  .dc-hbar::-webkit-scrollbar { height: 0; }
</style>
</helmet>
<div style="min-height:100vh; background:#e6e8ec; display:flex; align-items:flex-start; justify-content:center; padding:26px 16px;">
<div style="width:392px; max-width:100%; background:#0f1828; border-radius:34px; padding:9px; box-shadow:0 24px 60px rgba(15,24,40,.34);">
<div style="background:#eef0f3; border-radius:26px; overflow:hidden; position:relative; height:812px; display:flex; flex-direction:column;">
<!-- navy header -->
<div style="background:#16223a; padding:15px 18px; flex:none; display:flex; align-items:center; justify-content:space-between;">
<button onclick="window.history.back()" style="width:34px; height:34px; border-radius:50%; border:none; background:rgba(255,255,255,.12); color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center;">
<svg fill="none" height="17" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="17"><path d="m15 18-6-6 6-6"></path></svg>
</button>
<div style="text-align:center;">
<div style="font-size:17.5px; font-weight:800; color:#fff;">Associate a call to a technician</div>
<div style="font-size:11.5px; color:#9fb0c8; margin-top:1px;">{{ ticketHeader }}</div>
</div>
<div style="width:34px;"></div>
</div>
<div class="dc-scroll" style="flex:1; overflow-y:auto; padding:16px 16px 20px;">
<!-- call summary -->
<div style="background:#fff; border-radius:14px; padding:13px 14px; box-shadow:0 1px 3px rgba(0,0,0,.05); margin-bottom:18px; display:flex; align-items:center; gap:11px;">
<div style="width:40px; height:40px; border-radius:11px; background:#eaf2fb; color:#1d60a2; display:flex; align-items:center; justify-content:center; flex:none;">
<svg fill="none" height="21" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewbox="0 0 24 24" width="21"><path d="M14.5 6a3.5 3.5 0 0 0-4.6 4.3L3 17.2 6.8 21l6.9-6.9A3.5 3.5 0 0 0 18 9.5l-2.4 2.4-1.5-1.5L16.5 8z"></path></svg>
</div>
<div style="flex:1;">
<div style="font-size:14.5px; font-weight:800; color:#1f2a3a;">{{ ticketSubject }}</div>
<div style="font-size:12px; color:#9aa3b0; margin-top:2px;">{{ ticketAddress }}</div>
</div>
<span style="display:inline-flex; align-items:center; gap:4px; background:{{ prioBg }}; color:{{ prioColor }}; font-size:11px; font-weight:700; padding:4px 9px; border-radius:99px; flex:none;">
<span style="width:6px; height:6px; border-radius:50%; background:{{ prioColor }};"></span>{{ prioLabel }}
          </span>
</div>
<!-- 1. select technician -->
<div style="font-size:13px; color:#7b8595; font-weight:700; margin:2px 2px 11px;">Choosing a technician <span style="color:#c0392b;">*</span></div>
<div style="display:flex; flex-direction:column; gap:10px; margin-bottom:18px;">
<sc-for as="t" hint-placeholder-count="3" list="{{ techs }}">
<button onclick="{{ t.pick }}" style="display:flex; align-items:center; gap:12px; padding:13px; border-radius:14px; cursor:pointer; text-align:left; background:{{ t.bg }}; border:1.6px solid {{ t.border }};">
<div style="width:44px; height:44px; border-radius:50%; background:{{ t.avBg }}; color:{{ t.avColor }}; font-weight:800; font-size:14px; display:flex; align-items:center; justify-content:center; flex:none;">{{ t.initials }}</div>
<div style="flex:1;">
<div style="font-size:15px; font-weight:800; color:#1f2a3a;">{{ t.name }}</div>
</div>
<div style="width:22px; height:22px; border-radius:50%; border:2px solid {{ t.radioBorder }}; background:{{ t.radioBg }}; flex:none; display:flex; align-items:center; justify-content:center;">
<sc-if hint-placeholder-val="{{ false }}" value="{{ t.on }}"><svg fill="none" height="12" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" viewbox="0 0 24 24" width="12"><path d="M20 6 9 17l-5-5"></path></svg></sc-if>
</div>
</button>
</sc-for>
</div>
</div>
<!-- submit -->
<div style="flex:none; background:#fff; border-top:1px solid #eceef1; padding:13px 16px 20px;">
<button onclick="{{ submit }}" style="width:100%; padding:15px; border:none; border-radius:14px; background:{{ submitBg }}; color:{{ submitColor }}; font-size:16px; font-weight:800; cursor:{{ submitCursor }}; display:flex; align-items:center; justify-content:center; gap:9px; box-shadow:{{ submitShadow }};">
<sc-if hint-placeholder-val="{{ false }}" value="{{ canSubmit }}"><svg fill="none" height="17" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewbox="0 0 24 24" width="17"><path d="M20 6 9 17l-5-5"></path></svg></sc-if>
          {{ submitLabel }}
        </button>
</div>
</div>
</div>
</div>
</x-dc>
<script data-dc-script="" data-props='{"$preview": {"width": 424, "height": 880}}' type="text/x-dc">
class Component extends DCLogic {
  state = { ticket: null, techsData: [], tech: null, submitting: false };

  PRIO = {
    high:   { label: 'דחופה', enLabel: 'urgent', color: '#c0392b', bg: '#fbeeed' },
    normal: { label: 'רגילה', enLabel: 'normal', color: '#1d60a2', bg: '#eaf2fb' },
    low:    { label: 'נמוכה', enLabel: 'low', color: '#5a6473', bg: '#f4f5f7' },
  };

  componentDidMount() {
    this.loadData();
    window.addEventListener('mineralbar:ready', () => this.loadData());
    if (window.MineralBarApp && MineralBarApp.bindLiveReload) {
      MineralBarApp.bindLiveReload(() => this.loadData(), { keys: /ticket|mission|customer|member|socket\.nudge/i, delay: 350 });
    }
    window.addEventListener('mineralbar:page-refresh', (ev) => this.onRealtimeRefresh(ev));
    window.addEventListener('mineralbar:realtime', (ev) => this.onRealtimeRefresh(ev));
    window.addEventListener('mineralbar:missions', (ev) => this.onRealtimeRefresh(ev));
    window.addEventListener('pageshow', () => this.loadData());
  }

  onRealtimeRefresh(ev) {
    var detail = (ev && ev.detail) || {};
    var key = String(detail.key || '').toLowerCase();
    var group = String(detail.group || '').toLowerCase();
    var relevant =
      !key ||
      /ticket|mission|task|customer|assign|member/.test(key) ||
      group === 'missions' ||
      group === 'leads' ||
      group === 'other' ||
      group === 'unknown';
    if (!relevant) return;
    clearTimeout(this._rtAssignTimer);
    this._rtAssignTimer = setTimeout(() => this.loadData(), 350);
  }

  async loadData() {
    try {
      const p = new URLSearchParams(window.location.search);
      const ticketId = p.get('ticket_id') || p.get('id');
      if (!ticketId) {
        console.warn('[service-assign-tech] No ticket_id in URL');
        return;
      }
      
      const client = window.MineralBarApp && window.MineralBarApp.getClient ? window.MineralBarApp.getClient() : null;
      if (!client || !client.getToken()) {
        console.warn('[service-assign-tech] Not authenticated, waiting for mineralbar:ready');
        return;
      }

      const isEn = typeof window !== 'undefined' && typeof window.getCurrentLanguage === 'function' && window.getCurrentLanguage() === 'en';

      const rawRes = await client.request('Ticket.Get', { ticket_id: ticketId, id: ticketId });
      
      const ticketObj = rawRes && (rawRes.output || rawRes.data || rawRes);
      if (ticketObj) {
        this.setState({ ticket: ticketObj });
      } else {
        console.warn('[service-assign-tech] No ticket data found in response');
      }

      if (window.MineralBarApp.getTeamMembers) {
        const team = window.MineralBarApp.getTeamMembers();
        const colors = [
          { avBg: '#dbe7f8', avColor: '#2f6aa6' },
          { avBg: '#e9f5ee', avColor: '#2e8a63' },
          { avBg: '#eef0fb', avColor: '#50439d' },
          { avBg: '#fdf6e8', avColor: '#bd8324' }
        ];
        
        const techsData = team.map((m, idx) => {
          const name = String(m.name || '').trim();
          const parts = name.split(' ').filter(Boolean);
          const initials = parts.map(p => p[0]).join('').substring(0, 2);
          const c = colors[idx % colors.length];
          return {
            id: m.id || m.user_id, name, initials, avBg: c.avBg, avColor: c.avColor
          };
        }).filter(m => m.id && m.name);
        
        // Auto-select if ticket has an assignee
        let preTech = null;
        if (ticketObj && ticketObj.assign_member_id) {
          const assigned = Array.isArray(ticketObj.assign_member_id)
            ? ticketObj.assign_member_id[0]
            : String(ticketObj.assign_member_id).split(',')[0];
          if (assigned !== '') preTech = Number(assigned);
        }
        
        this.setState({ techsData, tech: preTech });
      }

    } catch (e) {
      console.error('[service-assign-tech] Failed to load data:', e);
    }
  }

  pickTech(id) { this.setState({ tech: id }); }

  async submitAssignment() {
    if (this.state.submitting || this.state.tech === null) return;
    const ticket = this.state.ticket || {};
    const ticketId = ticket.ticket_id || ticket.id;
    if (!ticketId) return;

    try {
      const client = window.MineralBarApp && window.MineralBarApp.getClient
        ? window.MineralBarApp.getClient()
        : null;
      if (!client || !client.getToken || !client.getToken()) {
        throw new Error('Please log in before assigning a technician.');
      }

      this.setState({ submitting: true });
      const result = await client.request('Ticket.Edit', {
        ticket_id: String(ticketId),
        assign_member_id: String(this.state.tech),
        status: 3 // Assigned (1=Opened, 2=Closed, 3=Assigned)
      });
      if (!result || !(Number(result.success) === 1 || result.success === true || result.ticket_id || result.output)) {
        throw new Error((result && (result.message || result.error)) || 'Technician assignment failed.');
      }
      window.location.href = 'service-all-calls.html?refresh=' + Date.now();
    } catch (e) {
      console.error('[service-assign-tech] Ticket.Edit failed', e);
      this.setState({ submitting: false });
      alert((e && e.message) || 'Technician assignment failed.');
    }
  }

  renderVals() {
    const st = this.state;
    const t = st.ticket;
    if (!t) return;
    
    const isEn = typeof window !== 'undefined' && typeof window.getCurrentLanguage === 'function' && window.getCurrentLanguage() === 'en';

    const name = t.joined_customer_name || t.customer_name || (isEn ? 'Customer' : 'לקוח');
    let prioKey = 'normal';
    if (t.rating === '5' || t.rating === '4') prioKey = 'high';
    else if (t.rating === '1') prioKey = 'low';
    const prio = this.PRIO[prioKey] || this.PRIO.normal;

    const techs = st.techsData.map(tc => {
      const on = tc.id == st.tech; // loose equal since id might be string or number
      return {
        name: tc.name, initials: tc.initials,
        avBg: tc.avBg, avColor: tc.avColor, on,
        pick: () => this.pickTech(tc.id),
        bg: on ? '#eaf2fb' : '#fff', border: on ? '#1d60a2' : '#e4e8ee',
        radioBorder: on ? '#1d60a2' : '#cbd3de', radioBg: on ? '#1d60a2' : '#fff',
      };
    });

    const canSubmit = st.tech !== null && !st.submitting;

    return {
      ticketHeader: `#SRV-${t.ticket_id} · ${name}`,
      ticketSubject: t.subject || (isEn ? 'Technical service' : 'שירות טכני'),
      ticketAddress: t.address || (isEn ? 'No address' : 'ללא כתובת'),
      prioLabel: isEn ? prio.enLabel : prio.label,
      prioColor: prio.color,
      prioBg: prio.bg,
      techs,
      canSubmit,
      submitLabel: st.submitting
        ? (isEn ? 'Selecting...' : 'בוחר...')
        : (isEn ? 'Select Technician' : 'בחר טכנאי'),
      submitBg: canSubmit ? '#1d60a2' : '#e9ecf0',
      submitColor: canSubmit ? '#fff' : '#9aa3b0',
      submitCursor: canSubmit ? 'pointer' : 'not-allowed',
      submit: () => this.submitAssignment(),
      submitShadow: canSubmit ? '0 6px 16px rgba(29,96,162,.28)' : 'none',
    };
  }
}
</script>
</body>
</html>
