<script data-dc-script="" data-props='{"$preview": {"width": 424, "height": 880}}' type="text/x-dc">
class Component extends DCLogic {
  state = {
    loading: true,
    notFound: false,
    notFoundMsg: 'not found',
    customerId: '',
    customerName: '',
    customer: null,
    langTick: 0
  };

  isEn() {
    return typeof getCurrentLanguage === 'function' && getCurrentLanguage() === 'en';
  }

  t(en, he) {
    return this.isEn() ? en : he;
  }

  componentDidMount() {
    this.loadCustomer();
    window.addEventListener('mineralbar:ready', () => this.loadCustomer());
    window.addEventListener('mineralbar:page-refresh', () => this.loadCustomer());
    var self = this;
    document.addEventListener('click', function (e) {
      if (e.target && e.target.closest && e.target.closest('.lang-translator-btn, #btn-lang-toggle')) {
        setTimeout(function () { self.setState({ langTick: Date.now() }); }, 80);
      }
    });
  }

  getCustomerId() {
    try {
      var p = new URLSearchParams(window.location.search || '');
      var id = p.get('customer_id') || p.get('cust_id') || p.get('id') || '';
      if (!id && window.location.hash) {
        var h = new URLSearchParams(String(window.location.hash || '').replace(/^#/, ''));
        id = h.get('customer_id') || h.get('cust_id') || h.get('id') || '';
      }
      if (!id) id = sessionStorage.getItem('mb_customer_id') || localStorage.getItem('mb_customer_id') || '';
      if (id === '0' || id === 'null' || id === 'undefined') id = '';
      return String(id || '').trim();
    } catch (e) {
      return '';
    }
  }

  rememberCustomerId(id) {
    if (!id) return;
    try {
      sessionStorage.setItem('mb_customer_id', String(id));
      localStorage.setItem('mb_customer_id', String(id));
    } catch (e) { /* ignore */ }
  }

  async loadCustomer() {
    var cid = this.getCustomerId();
    if (!cid) {
      this.setState({
        loading: false,
        notFound: true,
        notFoundMsg: 'not found',
        customerId: '',
        customerName: '',
        customer: null
      });
      return;
    }

    if (!window.MineralBarApp || typeof MineralBarApp.isAuthenticated !== 'function' || !MineralBarApp.isAuthenticated()) {
      this.setState({ loading: true, notFound: false, customerId: cid });
      return;
    }

    this.setState({ loading: true, notFound: false, customerId: cid });
    try {
      var res = await MineralBarApp.getCustomer(cid);
      var c = res && res.customer;
      if (c && c.data && typeof c.data === 'object') c = c.data;
      var name = (c && (c.name || c.client_name || c.company)) || '';
      if (!c || !name) {
        this.setState({
          loading: false,
          notFound: true,
          notFoundMsg: 'not found',
          customerId: cid,
          customerName: '',
          customer: null
        });
        return;
      }
      this.rememberCustomerId(c.customer_id || c.id || cid);
      this.setState({
        loading: false,
        notFound: false,
        customerId: String(c.customer_id || c.id || cid),
        customerName: name,
        customer: c
      });
    } catch (e) {
      var msg = (e && e.message) ? String(e.message).replace(/<[^>]+>/g, ' ').trim() : '';
      this.setState({
        loading: false,
        notFound: true,
        notFoundMsg: /not found|לא נמצא|Customer not found/i.test(msg) ? 'not found' : (msg || 'not found'),
        customerId: cid,
        customerName: '',
        customer: null
      });
    }
  }

  goBack() {
    try {
      if (window.history.length > 1) {
        window.history.back();
        return;
      }
    } catch (e) { /* fallback below */ }
    var home = 'tech-dashboard.html';
    try {
      if (window.MineralBarApp && typeof MineralBarApp.homeForRole === 'function') {
        home = MineralBarApp.homeForRole(MineralBarApp.getRole()) || home;
      }
    } catch (e2) { /* keep home */ }
    window.location.href = home;
  }

  openForm(type) {
    if (this.state.notFound || !this.state.customerId) return;
    var q = new URLSearchParams();
    q.set('customer_id', this.state.customerId);
    if (type) q.set('type', type);
    window.location.href = 'document-issue-form.html?' + q.toString();
  }

  renderVals() {
    var s = this.state;
    void s.langTick;
    var hasCustomer = !s.loading && !s.notFound && !!s.customerId;
    var subtitle = s.loading
      ? this.t('Loading…', 'טוען…')
      : (s.notFound ? this.t('not found', 'לא נמצא') : ((s.customerName || this.t('Customer', 'לקוח')) + ' · ' + this.t('Select a document type', 'בחרו סוג מסמך')));

    return {
      loading: !!s.loading,
      notFound: !!s.notFound,
      notFoundMsg: s.notFoundMsg || this.t('not found', 'לא נמצא'),
      pageTitle: this.t('Issuance of a document', 'הנפקת מסמך'),
      loadingMsg: this.t('Loading customer…', 'טוען לקוח…'),
      sectionBilling: this.t('Billing documents', 'מסמכי חיוב'),
      sectionCredit: this.t('Credit and shipping', 'זיכוי ומשלוח'),
      sectionOther: this.t('Other documents', 'מסמכים אחרים'),
      hasCustomer: hasCustomer,
      subtitle: subtitle,
      nameTax: this.t('Tax Invoice', 'חשבונית מס'),
      descTax: this.t('Official billing with VAT', 'חיוב רשמי כולל מע״מ'),
      nameTaxReceipt: this.t('Receipt tax invoice', 'חשבונית מס קבלה'),
      descTaxReceipt: this.t('Billing + payment confirmation', 'חיוב + אישור תשלום'),
      nameDeal: this.t('Transaction Invoice', 'חשבונית עסקה'),
      descDeal: this.t('Payment requirement without VAT', 'דרישת תשלום ללא מע״מ'),
      nameReceipt: this.t('Receipt', 'קבלה'),
      descReceipt: this.t('Confirmation of receipt of payment', 'אישור קבלת תשלום'),
      nameCredit: this.t('Credit Invoice', 'חשבונית זיכוי'),
      descCredit: this.t('Cancellation / chargeback', 'ביטול / זיכוי'),
      nameDelivery: this.t('Shipping certificate', 'תעודת משלוח'),
      descDelivery: this.t('Delivery of products to the customer', 'מסירת מוצרים ללקוח'),
      nameProforma: this.t('Proforma Invoice', 'חשבונית פרופורמה'),
      descProforma: this.t('Preliminary invoice / quote document', 'חשבונית מקדמית / הצעת מחיר'),
      nameGrir: this.t('GR/IR', 'קבלת סחורה / חשבונית'),
      descGrir: this.t('Goods receipt / invoice receipt', 'קבלת סחורה / קבלת חשבונית'),
      nameDonation: this.t('Donation receipt', 'קבלת תרומה'),
      descDonation: this.t('Receipt for a donation', 'קבלה עבור תרומה'),
      onClose: () => this.goBack(),
      pickInvoice: () => this.openForm('tax'),
      pickTaxReceipt: () => this.openForm('taxreceipt'),
      pickDeal: () => this.openForm('deal'),
      pickReceipt: () => this.openForm('receipt'),
      pickCredit: () => this.openForm('credit'),
      pickDelivery: () => this.openForm('delivery'),
      pickProforma: () => this.openForm('proforma'),
      pickGrir: () => this.openForm('grir'),
      pickDonation: () => this.openForm('donation')
    };
  }
}
</script>
